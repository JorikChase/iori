<body>
  <div id="info">
    <span>Tesseract (4‑cube)</span><br>
    Vertices: <span>16</span> (10000₂)<br>
    Edges: <span>32</span> (100000₂)<br>
    Cells (cubes): <span>8</span> (1000₂)<br>
    All numbers are powers of two — binary pure.
  </div>

  <!-- Import Three.js core and add-ons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ----- Scene setup -----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4, 3, 5);
    camera.lookAt(0, 0, 0);

    // WebGL renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // CSS2 renderer for vertex labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none'; // allow clicking through to OrbitControls
    document.body.appendChild(labelRenderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;

    // ----- 4D to 3D projection -----
    // We define the 16 vertices of a tesseract with coordinates (±1, ±1, ±1, ±1)
    const vertices4D = [];
    for (let i = 0; i < 16; i++) {
      const x = (i & 1) ? 1 : -1;
      const y = (i & 2) ? 1 : -1;
      const z = (i & 4) ? 1 : -1;
      const w = (i & 8) ? 1 : -1;
      vertices4D.push([x, y, z, w]);
    }

    // Edges: connect vertices that differ in exactly one coordinate
    const edges = [];
    for (let i = 0; i < 16; i++) {
      for (let j = i+1; j < 16; j++) {
        let diff = 0;
        for (let k = 0; k < 4; k++) {
          if (vertices4D[i][k] !== vertices4D[j][k]) diff++;
        }
        if (diff === 1) edges.push([i, j]);
      }
    }

    // We'll apply a 4D rotation in the XW and YZ planes (double rotation) before projecting.
    // This makes the tesseract rotate in a visually pleasing way without self‑intersection artifacts.
    let angle = 0;
    
    // Project a 4D point (x,y,z,w) to 3D using perspective projection:
    // distance from 4D camera to point along w-axis. We place the "4D camera" at w = -2.5,
    // so that the tesseract (w from -1 to 1) is in front.
    const camera4D = -2.5;
    function project4Dto3D(point4D) {
      const [x, y, z, w] = point4D;
      const scale = 1 / (camera4D - w);
      return new THREE.Vector3(x * scale, y * scale, z * scale);
    }

    // Rotate a 4D vector in the XW plane and YZ plane (two independent rotations)
    function rotate4D(point, angle1, angle2) {
      let [x, y, z, w] = point;
      
      // Rotation in XW plane
      const cos1 = Math.cos(angle1);
      const sin1 = Math.sin(angle1);
      const x1 = x * cos1 - w * sin1;
      const w1 = x * sin1 + w * cos1;
      
      // Rotation in YZ plane
      const cos2 = Math.cos(angle2);
      const sin2 = Math.sin(angle2);
      const y1 = y * cos2 - z * sin2;
      const z1 = y * sin2 + z * cos2;
      
      return [x1, y1, z1, w1];
    }

    // ----- Create 3D objects for edges and vertices -----
    const edgeLinesMaterial = new THREE.LineBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.7 });
    let edgeLines = new THREE.Group();
    scene.add(edgeLines);

    const vertexGroup = new THREE.Group();
    scene.add(vertexGroup);

    // Create small spheres for vertices (will be updated each frame)
    const vertexMeshes = [];
    const vertexLabels = [];
    const sphereGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff8844, emissive: new THREE.Color(0x331100) });
    for (let i = 0; i < 16; i++) {
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.visible = true;
      vertexGroup.add(sphere);
      vertexMeshes.push(sphere);
      
      // Add a label with the binary index (optional, to see the 4-bit pattern)
      const div = document.createElement('div');
      div.textContent = i.toString(2).padStart(4, '0');
      div.style.color = '#ffaa00';
      div.style.fontSize = '10px';
      div.style.fontWeight = 'bold';
      div.style.textShadow = '1px 1px 2px black';
      const label = new CSS2DObject(div);
      label.visible = true;
      vertexGroup.add(label);
      vertexLabels.push(label);
    }

    // Add lights so spheres look nice
    const ambientLight = new THREE.AmbientLight(0x404080);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    // ----- Update function: apply 4D rotation, project, and update geometry -----
    function updateGeometry(time) {
      // Different rotation speeds for two planes
      const angle1 = time * 0.3;
      const angle2 = time * 0.5;
      
      // Project all vertices
      const projected = vertices4D.map(v => {
        const rotated = rotate4D(v, angle1, angle2);
        return project4Dto3D(rotated);
      });
      
      // Update edges: rebuild lines each frame for simplicity
      // (For better performance, we could update buffer geometry, but this is fine for 32 edges.)
      while(edgeLines.children.length > 0) {
        edgeLines.remove(edgeLines.children[0]);
      }
      
      edges.forEach(([i, j]) => {
        const points = [projected[i], projected[j]];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, edgeLinesMaterial);
        edgeLines.add(line);
      });
      
      // Update vertex spheres and labels
      for (let i = 0; i < 16; i++) {
        vertexMeshes[i].position.copy(projected[i]);
        vertexLabels[i].position.copy(projected[i].clone().add(
          new THREE.Vector3(0.15, 0.15, 0.15)
        ));
      }
      
      // Rotate the whole group a bit for extra dynamism (or let user control via orbit)
      // vertexGroup.rotation.y += 0.002;
    }

    // ----- Animation loop -----
    function animate() {
      requestAnimationFrame(animate);
      
      const time = performance.now() * 0.001; // seconds
      updateGeometry(time);
      
      controls.update();
      
      // Render
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
