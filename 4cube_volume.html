<body>
  <div id="ui">
    <label>Slice position (4th axis): <span id="sliceValueDisplay">0.00</span></label>
    <input type="range" id="sliceSlider" min="-1.8" max="1.8" step="0.01" value="0.0">
    <div id="info">
      <span id="solidDescription">Octahedron (8 faces)</span><br>
      Tesseract cells: <span>8</span> | Vertices: <span>16</span><br>
      All numbers powers of two.
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

    // ---- Scene ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);
    scene.fog = new THREE.Fog(0x0a0a1a, 3, 10);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(4, 3, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;

    // ---- 4D Tesseract ----
    const vertices4D = [];
    for (let i = 0; i < 16; i++) {
      const x = (i & 1) ? 1 : -1;
      const y = (i & 2) ? 1 : -1;
      const z = (i & 4) ? 1 : -1;
      const w = (i & 8) ? 1 : -1;
      vertices4D.push([x, y, z, w]);
    }

    const edges = [];
    for (let i = 0; i < 16; i++) {
      for (let j = i+1; j < 16; j++) {
        let diff = 0;
        for (let k = 0; k < 4; k++) {
          if (vertices4D[i][k] !== vertices4D[j][k]) diff++;
        }
        if (diff === 1) edges.push([i, j]);
      }
    }

    function rotate4D(point, angleXW, angleYZ) {
      let [x, y, z, w] = point;
      const c1 = Math.cos(angleXW), s1 = Math.sin(angleXW);
      const c2 = Math.cos(angleYZ), s2 = Math.sin(angleYZ);
      const x1 = x * c1 - w * s1;
      const w1 = x * s1 + w * c1;
      const y1 = y * c2 - z * s2;
      const z1 = y * s2 + z * c2;
      return [x1, y1, z1, w1];
    }

    const cam4D = -3.0;
    function project(p) {
      const [x, y, z, w] = p;
      const scale = 1 / (cam4D - w);
      return new THREE.Vector3(x * scale, y * scale, z * scale);
    }

    // ---- Wireframe ----
    const wireframeGroup = new THREE.Group();
    scene.add(wireframeGroup);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x3388cc, transparent: true, opacity: 0.5 });

    // ---- Slice solid ----
    let sliceMesh;
    const sliceMat = new THREE.MeshStandardMaterial({
      color: 0x66aaff,
      roughness: 0.3,
      metalness: 0.1,
      transparent: true,
      opacity: 0.7,
      side: THREE.DoubleSide,
      emissive: new THREE.Color(0x001122),
    });

    // Lights
    scene.add(new THREE.AmbientLight(0x303050));
    const keyLight = new THREE.DirectionalLight(0xffeedd, 1.0);
    keyLight.position.set(2, 5, 3);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x4466aa, 0.6);
    fillLight.position.set(-2, 1, -1);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
    rimLight.position.set(0, -1, 0);
    scene.add(rimLight);

    // UI
    const slider = document.getElementById('sliceSlider');
    const sliceValueDisplay = document.getElementById('sliceValueDisplay');
    const solidDescription = document.getElementById('solidDescription');

    function updateSlice(rotated) {
      const wSlice = parseFloat(slider.value);
      sliceValueDisplay.textContent = wSlice.toFixed(2);

      // Intersection points
      const intersectionPoints = [];
      const eps = 1e-6;
      for (const [i, j] of edges) {
        const w1 = rotated[i][3];
        const w2 = rotated[j][3];
        if ((w1 - wSlice) * (w2 - wSlice) < -eps) {
          const t = (wSlice - w1) / (w2 - w1);
          const x = rotated[i][0] + t * (rotated[j][0] - rotated[i][0]);
          const y = rotated[i][1] + t * (rotated[j][1] - rotated[i][1]);
          const z = rotated[i][2] + t * (rotated[j][2] - rotated[i][2]);
          intersectionPoints.push(new THREE.Vector3(x, y, z));
        }
      }

      // Remove previous slice
      if (sliceMesh) {
        scene.remove(sliceMesh);
        sliceMesh.geometry.dispose();
        sliceMesh = null;
      }

      if (intersectionPoints.length >= 4) {
        try {
          const convexGeom = new ConvexGeometry(intersectionPoints);
          // Explicitly compute vertex normals for smooth, correct shading
          convexGeom.computeVertexNormals();
          sliceMesh = new THREE.Mesh(convexGeom, sliceMat);
          scene.add(sliceMesh);

          // Identify shape
          const nFaces = convexGeom.index ? convexGeom.index.count / 3 : 0;
          if (Math.abs(wSlice) < 0.01) {
            solidDescription.textContent = 'Octahedron (8 faces) – midpoint slice';
          } else if (Math.abs(wSlice) > 1.6) {
            solidDescription.textContent = 'Small cube (approaching vertex)';
          } else if (nFaces === 6) {
            solidDescription.textContent = 'Cube (6 faces) – but still part of tesseract';
          } else {
            solidDescription.textContent = `Convex polyhedron (${Math.round(nFaces)} faces)`;
          }
        } catch (e) {
          solidDescription.textContent = 'Slice degenerated – adjust slightly';
        }
      } else {
        solidDescription.textContent = 'No intersection (slice outside)';
      }
    }

    // ---- Animation ----
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now() * 0.001;
      const angleXW = time * 0.25;
      const angleYZ = time * 0.4;

      const rotated = vertices4D.map(v => rotate4D(v, angleXW, angleYZ));

      // Update wireframe
      while(wireframeGroup.children.length) wireframeGroup.remove(wireframeGroup.children[0]);
      const projected = rotated.map(v => project(v));
      edges.forEach(([i, j]) => {
        const geom = new THREE.BufferGeometry().setFromPoints([projected[i], projected[j]]);
        wireframeGroup.add(new THREE.Line(geom, edgeMat));
      });

      // Update slice solid
      updateSlice(rotated);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
