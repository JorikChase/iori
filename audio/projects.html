<style>
*{box-sizing:border-box}
:root{--ground:#000;--ink:#fff;--dim:#8d8d96;--line:#2a2a30;--red:#ff3b30;--green:#34c759;color-scheme:dark}

body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}

.top{display:flex;gap:10px;margin:0 0 18px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:22px;padding:10px 16px;min-height:44px}

.act.arm{color:var(--red)}

.act.busy{opacity:.4}
input.nm{font:inherit;font-size:18px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--ink);padding:2px 0;width:100%;outline:none;border-radius:0}

<button id="close" type="button" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
<main>
<h1>Projects</h1>
<div class="top">
  <button class="pill" id="new" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New project</button>
  <button class="pill" id="import" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2M7 11l5 5 5-5M12 4v12"/></svg>Open a save file</button>
</div>
<ul id="list"></ul>
<p id="msg" role="status" aria-live="polite"></p>
</main>
<script src="shared.js"></script>
<script src="project.js"></script>
<script>
/* Projects: open, start, rename, delete, and the save file out and in (docs/FORMAT.md). The editor works in whichever
   project is current. A take is never deleted here: the library is shared by every project. */
(function(){
var L=document.getElementById('list'),M=document.getElementById('msg'),cur=Project.current(),exp={},arm=null;
var I={edit:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4M13.5 6.5l4 4"/></svg>',
 share:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>',
 trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>'};
function say(t,err){M.textContent=t||'';M.className=err?'err':'';}
function when(t){var d=new Date(t),now=new Date(),p=function(v){return(v<10?'0':'')+v},hm=p(d.getHours())+':'+p(d.getMinutes());
 if(d.toDateString()===now.toDateString())return 'Edited today, '+hm;var y=new Date(now-864e5);if(d.toDateString()===y.toDateString())return 'Edited yesterday, '+hm;
 return 'Edited '+d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()===now.getFullYear()?undefined:'numeric'});}
function up(){try{return window.parent!==window?window.parent:null;}catch(_){return null;}}
function close(){var p=up();try{if(p&&p.ATS&&p.ATS.projectsClose)return p.ATS.projectsClose();}catch(_){}location.href='./';}
function draw(){return Project.list().then(function(l){
 L.innerHTML='';if(!l.length)L.innerHTML='<p class="empty">No projects yet.</p>';
 l.forEach(function(p){var li=document.createElement('li');if(p.id===cur)li.className='cur';li.dataset.id=p.id;
  var e=exp[p.id],ec=e?(e.st==='ready'?'ready':'busy'):'';
  li.innerHTML='<button class="open" type="button"><span class="dot"></span><span style="min-width:0"><span class="nm"></span><span class="when"></span></span></button>'+
   '<button class="act ren" type="button" aria-label="Rename">'+I.edit+'</button><button class="act exp '+ec+'" type="button" aria-label="'+(ec==='ready'?'Share the save file':'Make a save file')+'">'+I.share+'</button><button class="act del'+(arm===p.id?' arm':'')+'" type="button" aria-label="'+(arm===p.id?'Tap again to delete':'Delete')+'">'+I.trash+'</button>';
  li.querySelector('.nm').textContent=p.name||'Untitled';li.querySelector('.when').textContent=when(p.modified);L.appendChild(li);});});}
function openP(id){return Project.load(id).then(function(d){if(!d)throw new Error('That project can\'t be opened.');Project.current(d.id);cur=d.id;if(d.time&&d.time.tempo)AT.setTempo(d.time.tempo,'project');close();});}
function rename(li){var id=li.dataset.id,nm=li.querySelector('.nm'),inp=document.createElement('input');inp.className='nm';inp.value=nm.textContent==='Untitled'?'':nm.textContent;inp.maxLength=80;inp.setAttribute('aria-label','Project name');
 nm.replaceWith(inp);inp.focus();inp.select();var done=false;
 function fin(keep){if(done)return;done=true;var v=inp.value.trim();if(!keep||v===nm.textContent){draw();return;}
  Project.load(id).then(function(d){d.name=v;return Project.save(d);}).then(draw,function(e){say(e.message,true);draw();});}
 inp.addEventListener('keydown',function(e){if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false);});inp.addEventListener('blur',function(){fin(true);});}
/* the share sheet must open inside a tap: the first tap builds the file, the button turns green, the second tap shares */
function exportP(id){var e=exp[id];
 if(e&&e.st==='ready'){var f=new File([e.blob],e.name,{type:'application/zip'});delete exp[id];draw();
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(x){if(x&&x.name!=='AbortError')say('That didn\'t share. '+x.message,true);});return;}}catch(_){}
  var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=e.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);say('Saved '+e.name);return;}
 if(e)return;exp[id]={st:'busy'};say('Making the save file…');draw();
 Project.load(id).then(Project.exportFile).then(function(r){exp[id]={st:'ready',blob:r.blob,name:r.name};say('Ready. Tap the green button to share '+r.name+'.');draw();
  setTimeout(function(){if(exp[id]&&exp[id].st==='ready'){delete exp[id];draw();}},60000);},function(x){delete exp[id];say(x.message,true);draw();});}
function del(li){var id=li.dataset.id;if(arm!==id){arm=id;draw();setTimeout(function(){if(arm===id){arm=null;draw();}},3000);return;}
 arm=null;Project.remove(id).then(function(){if(cur===id){cur=null;try{localStorage.removeItem('audio.project');}catch(_){}}say('Project deleted. Its recordings stay in the library.');return draw();},function(x){say(x.message,true);});}
L.addEventListener('click',function(e){var li=e.target.closest('li');if(!li)return;
 if(e.target.closest('.open')&&!li.querySelector('input'))openP(li.dataset.id).catch(function(x){say(x.message,true);});
 else if(e.target.closest('.ren'))rename(li);else if(e.target.closest('.exp'))exportP(li.dataset.id);else if(e.target.closest('.del'))del(li);});
document.getElementById('new').addEventListener('click',function(){Project.list().then(function(l){return Project.create('Untitled '+(l.length+1));}).then(function(d){cur=d.id;return draw();}).then(function(){var li=L.querySelector('li[data-id="'+cur+'"]');if(li)rename(li);},function(x){say(x.message,true);});});
/* no accept filter: iPadOS greys out files under a type filter (see shared.js) */
document.getElementById('import').addEventListener('click',function(){var fi=document.createElement('input');fi.type='file';fi.style.display='none';
 fi.addEventListener('change',function(){var f=fi.files&&fi.files[0];fi.remove();if(!f)return;say('Opening '+f.name+'…');
  Project.importFile(f).then(function(d){cur=d.id;Project.current(d.id);say('Opened '+(d.name||'the project')+'.');return draw();},function(x){say(x.message,true);});});
 document.body.appendChild(fi);fi.click();});
document.getElementById('close').addEventListener('click',close);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.querySelector('input.nm'))close();});
/* the first visit makes the first project from what the app already held */
Project.open().then(function(d){cur=d.id;return draw();},function(x){say(x.message,true);return draw();});
})();
</script>
