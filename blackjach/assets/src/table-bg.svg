<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Casino felt texture: a seamless diamond-weave (pin-dot baize) pattern,
       vector-only so it tiles perfectly at any output size, no photo, no
       AI generation, just the base felt tone (matches the color-felt token
       in css/styles.css) with a subtle woven diamond lattice and a faint
       diagonal sheen, like real card-table felt seen up close. Reskin by
       hand-editing the colors below to match a new felt token, then
       re-export to PNG. -->
  <defs>
    <pattern id="weave" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="#12241c"/>
      <!-- one diamond per cell, touching all four edge midpoints, so
           adjacent cells interlock into a continuous lattice -->
      <path d="M12.5 0 L25 12.5 L12.5 25 L0 12.5 Z" fill="#152a20"/>
      <path d="M12.5 0 L25 12.5 L12.5 25 L0 12.5 Z" fill="none" stroke="#0e1a14" stroke-width="0.5" opacity="0.45"/>
      <!-- small central pin-dot, the classic baize "pin weave" highlight -->
      <circle cx="12.5" cy="12.5" r="1.3" fill="#1c3527" opacity="0.4"/>
    </pattern>
    <!-- broad, very low-contrast diagonal sheen bands — wide enough that
         they read as fabric nap catching light, not as a repeating tile,
         and gentle enough to stay calm behind UI -->
    <pattern id="sheen" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="160" height="160" fill="none"/>
      <rect x="0" y="0" width="80" height="160" fill="#ffffff" opacity="0.012"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#weave)"/>
  <rect width="400" height="400" fill="url(#sheen)"/>
</svg>
