<!doctype html>
<html lang="en">
    <head>
        <title>3DIE.FR | Iridescent Bubbles</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #050505;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: white;
                touch-action: none;
            }
            canvas {
                display: block;
            }
            .navigation {
                position: fixed;
                top: 20px;
                width: 100%;
                display: flex;
                justify-content: center;
                gap: 2rem;
                z-index: 100;
                pointer-events: none;
            }
            .navigation a {
                pointer-events: auto;
                color: rgba(255,255,255,0.7);
                text-decoration: none;
                text-transform: lowercase;
                letter-spacing: 2px;
                font-size: 14px;
                transition: color 0.3s;
            }
            .navigation a:hover {
                color: #fff;
            }
            .UI {
                position: fixed;
                bottom: 20px;
                left: 20px;
                z-index: 100;
            }
            .UISubheading a {
                color: rgba(255,255,255,0.4);
                font-size: 12px;
                text-decoration: none;
            }
            #overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.3) 100%);
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="overlay"></div>
        <div class="navigation">
            <a href="#">portfolio</a>
            <a href="#">shop</a>
            <a href="#">3die</a>
        </div>
        <div class="UI">
            <span class="UISubheading"><a href="#">The Age of Data — Iridescent Film v2.5</a></span>
        </div>

        <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://threejs.org/build/three.module.js",
                    "three/addons/": "https://threejs.org/examples/jsm/"
                }
            }
        </script>

        <script type="module">
            import * as THREE from "three";
            import { MarchingCubes } from "three/addons/objects/MarchingCubes.js";
            import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

            let camera, scene, renderer, effect, bubbleMaterial;
            let mouseX = 0, mouseY = 0;
            let targetX = 0, targetY = 0;
            const numMetaballs = 8;

            const bubbleParams = {
                thickness: 480.0, // Base film thickness in nm
                ior: 1.33,        // Soap film index of refraction
                noiseScale: 2.2,
                noiseSpeed: 0.2
            };

            init();

            function init() {
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.3;
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                document.body.appendChild(renderer.domElement);

                camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
                camera.position.z = 80;
                scene = new THREE.Scene();

                // Procedural Fallback Texture (used until HDR loads)
                const placeholderData = new Uint8Array([40, 40, 50, 255]);
                const placeholderTexture = new THREE.DataTexture(placeholderData, 1, 1, THREE.RGBAFormat);
                placeholderTexture.needsUpdate = true;

                // High Fidelity Iridescent Shader
                bubbleMaterial = new THREE.ShaderMaterial({
                    transparent: true,
                    side: THREE.DoubleSide,
                    uniforms: {
                        uTime: { value: 0 },
                        uEnvMap: { value: placeholderTexture },
                        uThickness: { value: bubbleParams.thickness },
                        uIOR: { value: bubbleParams.ior },
                        uNoiseScale: { value: bubbleParams.noiseScale },
                        uHasEnv: { value: 0.0 }
                    },
                    vertexShader: `
                        varying vec3 vWorldNormal;
                        varying vec3 vViewDir;
                        varying vec3 vWorldPos;

                        void main() {
                            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                            vWorldPos = worldPosition.xyz;
                            vWorldNormal = normalize(mat3(modelMatrix) * normal);
                            vViewDir = normalize(cameraPosition - worldPosition.xyz);
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vWorldNormal;
                        varying vec3 vViewDir;
                        varying vec3 vWorldPos;
                        uniform float uTime;
                        uniform float uThickness;
                        uniform float uIOR;
                        uniform float uNoiseScale;
                        uniform float uHasEnv;
                        uniform sampler2D uEnvMap;

                        #define PI 3.14159265359

                        // Perlin/Simplex Noise Implementation for Marangoni Flow
                        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

                        float snoise(vec3 v) {
                            const vec2 C = vec2(1.0/6.0, 1.0/3.0) ;
                            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                            vec3 i  = floor(v + dot(v, C.yyy) );
                            vec3 x0 = v - i + dot(i, C.xxx) ;
                            vec3 g = step(x0.yzx, x0.xyz);
                            vec3 l = 1.0 - g;
                            vec3 i1 = min( g.xyz, l.zxy );
                            vec3 i2 = max( g.xyz, l.zxy );
                            vec3 x1 = x0 - i1 + C.xxx;
                            vec3 x2 = x0 - i2 + C.yyy;
                            vec3 x3 = x0 - D.yyy;
                            i = mod289(i);
                            vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                            float n_ = 0.142857142857;
                            vec3  ns = n_ * D.wyz - D.xzx;
                            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                            vec4 x_ = floor(j * ns.z);
                            vec4 y_ = floor(j - 7.0 * x_ );
                            vec4 x = x_ *ns.x + ns.y;
                            vec4 y = y_ *ns.x + ns.y;
                            vec4 h = 1.0 - abs(x) - abs(y);
                            vec4 b0 = vec4( x.xy, y.xy );
                            vec4 b1 = vec4( x.zw, y.zw );
                            vec4 s0 = floor(b0)*2.0 + 1.0;
                            vec4 s1 = floor(b1)*2.0 + 1.0;
                            vec4 sh = -step(h, vec4(0.0));
                            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                            vec3 p0 = vec3(a0.xy,h.x);
                            vec3 p1 = vec3(a0.zw,h.y);
                            vec3 p2 = vec3(a1.xy,h.z);
                            vec3 p3 = vec3(a1.zw,h.w);
                            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                            m = m * m;
                            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
                        }

                        // Physical Thin Film Interference Approximation
                        vec3 getIridescence(float cosTheta, float thickness) {
                            vec3 lambda = vec3(650.0, 530.0, 440.0); // Wavelengths for RGB
                            float delta = 2.0 * uIOR * thickness * cosTheta;
                            vec3 phase = 2.0 * PI * delta / lambda;
                            return 0.5 + 0.5 * cos(phase);
                        }

                        void main() {
                            vec3 N = normalize(vWorldNormal);
                            vec3 V = normalize(vViewDir);

                            // Surface thickness variation
                            float noise = snoise(N * uNoiseScale + uTime * 0.15);
                            float d = uThickness + noise * 160.0;

                            float cosTheta = abs(dot(N, V));
                            vec3 irid = getIridescence(cosTheta, d);

                            // Reflection mapping
                            vec3 R = reflect(-V, N);
                            vec2 envUv = vec2(atan(R.z, R.x) / (2.0 * PI) + 0.5, acos(R.y) / PI);
                            vec3 env = texture2D(uEnvMap, envUv).rgb;

                            // Fallback if env isn't loaded
                            if (uHasEnv < 0.5) env = vec3(0.5);

                            // Fresnel for bubble transparency edge-loading
                            float fresnel = pow(1.0 - cosTheta, 3.0);

                            // Composition: interference * environment reflection + specular sheen
                            vec3 finalColor = irid * (env + 0.1) * 1.4;
                            finalColor += pow(cosTheta, 30.0) * 0.5; // High gloss specular

                            float alpha = clamp(fresnel * 1.8 + 0.1, 0.0, 1.0);
                            gl_FragColor = vec4(finalColor, alpha);
                        }
                    `
                });

                // HDRI Loading using original procedure
                new RGBELoader()
                    .setPath("/assets/")
                    .load("3dieMainBckg.hdr", function (texture) {
                        texture.mapping = THREE.EquirectangularReflectionMapping;
                        scene.background = texture;
                        scene.environment = texture;

                        bubbleMaterial.uniforms.uEnvMap.value = texture;
                        bubbleMaterial.uniforms.uHasEnv.value = 1.0;
                    }, undefined, (err) => {
                        console.warn("Asset /assets/3dieMainBckg.hdr not found in this environment. Falling back to internal glow.");
                    });

                effect = new MarchingCubes(48, bubbleMaterial, true, true);
                effect.scale.set(30, 30, 30);
                scene.add(effect);

                window.addEventListener('resize', onWindowResize);
                document.addEventListener('mousemove', (e) => {
                    targetX = (e.clientX - window.innerWidth / 2) * 0.05;
                    targetY = (e.clientY - window.innerHeight / 2) * 0.05;
                });

                animate();
            }

            function updateMetaballs(time) {
                effect.reset();
                for (let i = 0; i < numMetaballs; i++) {
                    const t = time * 0.45;
                    const ox = Math.sin(t + i * 1.1) * 0.28;
                    const oy = Math.cos(t + i * 0.7) * 0.28;
                    const oz = Math.sin(t + i * 1.9) * 0.28;
                    effect.addBall(0.5 + ox, 0.5 + oy, 0.5 + oz, 0.22, 12);
                }
                effect.update();
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function animate() {
                requestAnimationFrame(animate);
                const time = performance.now() / 1000;

                mouseX += (targetX - mouseX) * 0.05;
                mouseY += (targetY - mouseY) * 0.05;
                camera.position.x = mouseX;
                camera.position.y = -mouseY;
                camera.lookAt(0, 0, 0);

                bubbleMaterial.uniforms.uTime.value = time;

                updateMetaballs(time);
                renderer.render(scene, camera);
            }
        </script>
    </body>
</html>
