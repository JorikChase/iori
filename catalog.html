<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#000; --fg:#fff; --dim:#555; --fast:140ms; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Courier New", ui-monospace, monospace;
    overflow-x: hidden;
  }
  ::selection { background: var(--fg); color: var(--bg); }

  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: baseline; gap: 1.2rem;
    padding: 1rem 1.2rem; background: var(--bg);
    border-bottom: 2px solid var(--fg);
  }
  .logo { font-size: 1.1rem; letter-spacing: .3em; font-weight: bold; }
  .logo span { animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  header nav { display: flex; gap: 1rem; margin-left: auto; font-size: .8rem; }
  header a { color: var(--dim); text-decoration: none; text-transform: uppercase; letter-spacing: .15em; }
  header a:hover { color: var(--fg); }

  /* artists strip */
  .section-title {
    padding: 2.2rem 1.2rem .8rem; font-size: .75rem;
    letter-spacing: .35em; color: var(--dim); text-transform: uppercase;
  }
  #artists {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    border-top: 1px solid var(--dim);
  }
  .artist-card {
    position: relative; display: block; padding: 2rem 1.4rem 1.6rem;
    border-right: 1px solid var(--dim); border-bottom: 1px solid var(--dim);
    text-decoration: none; color: var(--fg); overflow: hidden;
    min-height: 150px;
  }
  .artist-card .name { font-size: 1.5rem; letter-spacing: .1em; text-transform: uppercase; }
  .artist-card .role { margin-top: .6rem; color: var(--dim); font-size: .75rem; letter-spacing: .2em; }
  .artist-card::after {
    content: ""; position: absolute; inset: 0; background: var(--fg);
    transform: translateY(101%); transition: transform var(--fast) cubic-bezier(.2,.9,.2,1);
  }
  .artist-card:hover::after { transform: translateY(0); }
  .artist-card > * { position: relative; z-index: 2; transition: color var(--fast); }
  .artist-card:hover > * { color: var(--bg); }
  .artist-card .arrow {
    position: absolute; top: 1rem; right: 1.2rem; z-index: 2;
    transition: transform var(--fast) cubic-bezier(.3,1.4,.4,1);
  }
  .artist-card:hover .arrow { transform: translate(4px,-4px); }

  /* filter chips */
  #chips {
    display: flex; gap: .5rem; flex-wrap: wrap;
    padding: 0 1.2rem 1rem;
  }
  .chip {
    font: inherit; font-size: .75rem; letter-spacing: .15em; text-transform: uppercase;
    background: transparent; color: var(--dim); border: 1px solid var(--dim);
    padding: .35em .9em; cursor: pointer;
    transition: all var(--fast) ease;
  }
  .chip:hover { border-color: var(--fg); color: var(--fg); }
  .chip.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* experiments list */
  #experiments { border-top: 1px solid var(--dim); }
  .cat-row { border-bottom: 1px solid var(--dim); }
  .cat-head {
    display: flex; align-items: baseline; gap: 1rem;
    padding: 1rem 1.2rem; cursor: pointer; user-select: none;
  }
  .cat-head .cat-name { text-transform: uppercase; letter-spacing: .25em; font-size: .9rem; }
  .cat-head .cat-count { color: var(--dim); font-size: .75rem; }
  .cat-head .cat-toggle { margin-left: auto; color: var(--dim); transition: transform var(--fast); }
  .cat-row.open .cat-toggle { transform: rotate(90deg); }
  .cat-items {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 220ms cubic-bezier(.3,1,.3,1);
  }
  .cat-row.open .cat-items { grid-template-rows: 1fr; }
  .cat-items-inner { overflow: hidden; }
  .exp-link {
    display: flex; align-items: baseline; gap: 1rem;
    padding: .65rem 1.2rem .65rem 2.4rem;
    text-decoration: none; color: var(--fg);
    border-top: 1px solid #1a1a1a;
    transition: background var(--fast), color var(--fast), padding-left var(--fast);
  }
  .exp-link:hover { background: var(--fg); color: var(--bg); padding-left: 2.8rem; }
  .exp-link .t { font-size: .9rem; }
  .exp-link .d { color: var(--dim); font-size: .72rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp-link:hover .d { color: #333; }

  /* page-leave wipe */
  #wipe {
    position: fixed; inset: 0; background: var(--fg); z-index: 100;
    transform: translateY(101%); pointer-events: none;
    transition: transform 180ms cubic-bezier(.6,0,.3,1);
  }
  #wipe.on { transform: translateY(0); }
  body.leaving { animation: fadeout 200ms 60ms forwards; }
  @keyframes fadeout { to { opacity: 0; } }

  footer { padding: 3rem 1.2rem; color: var(--dim); font-size: .75rem; letter-spacing: .15em; }
  footer a { color: var(--fg); }

  #loading { padding: 4rem 1.2rem; color: var(--dim); letter-spacing: .3em; }

  @media (max-width: 640px) {
    .exp-link { padding-left: 1.2rem; }
    .exp-link .d { display: none; }
    header { flex-wrap: wrap; }
  }
</style>

<body>
<div id="wipe"></div>

<header>
  <div class="logo">IORI<span>_</span>CATALOG</div>
  <nav>
    <a href="/web.html">node web</a>
    <a href="/web3d.html">3d web</a>
    <a href="https://3die.fr/">3die</a>
  </nav>
</header>

<div class="section-title">artists — start here</div>
<div id="artists"></div>

<div class="section-title">experiments — everything else</div>
<div id="chips"></div>
<div id="experiments"></div>
<div id="loading">LOADING REGISTRY…</div>

<footer>
  iori.me — the catalogue. new pages appear here automatically.<br>
  label: <a href="https://3die.fr/">3die.fr</a>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Artist presentation order + blurbs (pages themselves live in the registry)
const ARTIST_META = {
  "iori":           { role: "procedural / shaders / 3d", url: "/umprum.html" },
  "jáchym":         { role: "artist",                    url: "https://3die.fr/jachym.html" },
  "crow_archduke":  { role: "artist (jáchym)",           url: "https://3die.fr/crow_archduke.html" },
  "moises":         { role: "photography",               url: "https://3die.fr/moises.html" },
};

const CATEGORY_ORDER = ["fluids","flames","voxels","dispheres","fractals","organisms",
                        "gravity","dimensions","materials","game","hub","essay","site","client"];

let pages = [];
let activeCat = null;

async function boot() {
  try {
    const res = await fetch("/pages.json", { cache: "no-store" });
    const data = await res.json();
    // experiments + games only; hubs/artists/site pages live in the header/strip
    pages = data.pages.filter(p => p.type === "experiment" || p.type === "game");
  } catch (e) {
    $("#loading").textContent = "registry unavailable.";
    return;
  }
  renderArtists();
  renderChips();
  renderExperiments();
  $("#loading").remove();
  document.body.style.animation = "none";
}

function renderArtists() {
  const wrap = $("#artists");
  wrap.innerHTML = "";
  for (const [name, meta] of Object.entries(ARTIST_META)) {
    const a = document.createElement("a");
    a.className = "artist-card";
    a.href = meta.url;
    a.innerHTML =
      `<span class="arrow">↗</span>` +
      `<div class="name">${esc(name)}</div>` +
      `<div class="role">${esc(meta.role)}</div>`;
    hookWipe(a);
    wrap.appendChild(a);
  }
}

function renderChips() {
  const cats = [...new Set(pages.map(p => p.category))].sort(
    (a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b));
  const wrap = $("#chips");
  wrap.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip active";
  all.textContent = "all";
  all.addEventListener("click", () => setFilter(null, all));
  wrap.appendChild(all);
  for (const c of cats) {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = c;
    chip.addEventListener("click", () => setFilter(c, chip));
    wrap.appendChild(chip);
  }
}

function setFilter(cat, btn) {
  activeCat = cat;
  $$(".chip").forEach(b => b.classList.toggle("active", b === btn));
  renderExperiments();
}

function $$ (s) { return [...document.querySelectorAll(s)]; }

function renderExperiments() {
  const wrap = $("#experiments");
  wrap.innerHTML = "";
  const cats = [...new Set(pages.map(p => p.category))].sort(
    (a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b));
  for (const cat of cats) {
    if (activeCat && cat !== activeCat) continue;
    const items = pages.filter(p => p.category === cat)
                       .sort((a, b) => a.title.localeCompare(b.title));
    if (!items.length) continue;
    const row = document.createElement("div");
    row.className = "cat-row";
    const itemsHtml = items.map(p =>
      `<a class="exp-link" href="${esc(p.url)}" data-wipe>` +
      `<span class="t">${esc(p.title)}</span>` +
      `<span class="d">${esc(p.description)}</span></a>`).join("");
    row.innerHTML =
      `<div class="cat-head">` +
      `<span class="cat-name">${esc(cat)}</span>` +
      `<span class="cat-count">${items.length}</span>` +
      `<span class="cat-toggle">▸</span></div>` +
      `<div class="cat-items"><div class="cat-items-inner">${itemsHtml}</div></div>`;
    row.querySelector(".cat-head").addEventListener("click", () => {
      row.classList.toggle("open");
    });
    row.querySelectorAll("a[data-wipe]").forEach(hookWipe);
    wrap.appendChild(row);
  }
  // open the first row by default for instant orientation
  wrap.querySelector(".cat-row")?.classList.add("open");
}

// Satisfying leave: quick white wipe, then navigate.
function hookWipe(a) {
  a.addEventListener("click", (e) => {
    if (a.target === "_blank" || a.href.startsWith("https://3die.fr") && location.hostname !== "3die.fr") return; // let cross-domain go normally
    e.preventDefault();
    $("#wipe").classList.add("on");
    document.body.classList.add("leaving");
    setTimeout(() => { location.href = a.href; }, 240);
  });
}

boot();
</script>
</body>
</html>
