    <style>
      :root {
            --bg: #050505;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.3);
            --accent: #64d1a5;
            --text-main: #e0e0e0;
            --text-dim: #666;
            --font: 'Space Grotesk', sans-serif; /* Updated Font */
            --glass: blur(10px);
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02) 0%, transparent 50%),
                linear-gradient(0deg, rgba(0,0,0,0.2) 50%, transparent 50%);
            background-size: 100% 100%, 4px 4px;
            color: var(--text-main);
            font-family: var(--font);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Actions Bar --- */
        .actions {
            padding: 20px;
            width: fit-content;
            display: flex;
            justify-content: flex-end;
            backdrop-filter: var(--glass);
            z-index: 10;
        }

        button.btn-reset {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 16px;
            font-family: var(--font);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.btn-reset:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* --- Grid Area --- */
        #grid {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-auto-rows: 1fr; /* Make rows uniform height */
            gap: 20px;
            align-content: start;
        }

        #grid::-webkit-scrollbar {
            width: 4px;
        }
        #grid::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        /* --- Cards --- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.1s, border-color 0.2s;
            animation: slideUp 0.3s ease-out;
            display: flex;
            flex-direction: column;
            height: 100%; /* Ensure card fills the grid cell */
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .card:active {
            transform: scale(0.99);
        }

        /* Content Types */
        /* We add flex-grow: 1 to content wrappers to push the footer (.meta) down */

        .preview-box {
            width: 100%;
            min-height: 150px;
            flex-grow: 1; /* Pushes meta down */
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .preview-text {
            padding: 20px;
            font-size: 13px; /* Slightly larger for new font */
            line-height: 1.4;
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-all;
            flex-grow: 1; /* Pushes meta down */
            overflow: hidden;
            mask-image: linear-gradient(180deg, #000 85%, transparent);
        }

        .preview-file {
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-grow: 1; /* Pushes meta down */
        }

        .file-icon {
            font-size: 32px;
            opacity: 0.6;
        }

        /* Metadata Footer */
        .meta {
            padding: 12px 15px;
            border-top: 1px solid var(--border);
            font-size: 10px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: auto; /* Fallback to ensure it sits at bottom */
        }

        .delete-btn {
            opacity: 0;
            color: #ff3333;
            cursor: pointer;
            font-weight: 700;
            padding: 0 5px; /* Increase hit area */
            z-index: 5; /* Ensure it's above other elements */
        }

        .card:hover .delete-btn {
            opacity: 1;
        }

        /* --- Drag Overlay --- */
        #drop-zone {
            position: fixed;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px dashed var(--accent);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #drop-zone.active {
            display: flex;
        }

        .drop-msg {
            color: var(--accent);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* --- Toast --- */
        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 24px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            font-weight: 500;
        }

        #toast.visible {
            transform: translateY(0);
            opacity: 1;
        }

        /* --- Empty State --- */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0.4;
            pointer-events: none;
        }
        .empty-state p {
            font-size: 14px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .empty-state kbd {
            border: 1px solid var(--text-dim);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
  <body>
    <div class="actions">
      <button class="btn-reset" id="clearBtn">Purge Memory</button>
    </div>
    <div id="grid">
      <div class="empty-state" id="emptyState">
        <p>Paste
          <kbd>CTRL+V</kbd>
          or Drop Files</p>
      </div>
    </div>
    <div id="drop-zone">
      <span class="drop-msg">Acquire Data</span>
    </div>
    <div id="toast">Copied to System</div>
    <script>
      // --- CONSTANTS & STATE ---
        const DB_NAME = 'ClippyDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'clips';
        let db;

        // --- INDEXEDDB SETUP ---
        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = (e) => reject('DB Error');

                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };

                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
            });
        };

        const saveClip = async (type, content, metadata = {}) => {
            const tx = db.transaction([STORE_NAME], 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const clip = {
                id: Date.now(),
                type: type, // 'text', 'image', 'file'
                content: content,
                timestamp: new Date().toLocaleTimeString(),
                ...metadata
            };
            store.add(clip);
            return clip;
        };

        const getAllClips = async () => {
            return new Promise((resolve) => {
                const tx = db.transaction([STORE_NAME], 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result.reverse()); // Newest first
            });
        };

        const deleteClip = async (id) => {
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).delete(id);
        };

        const clearAllClips = async () => {
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).clear();
        };

        // --- DOM ELEMENTS ---
        const grid = document.getElementById('grid');
        const emptyState = document.getElementById('emptyState');
        const dropZone = document.getElementById('drop-zone');
        const toast = document.getElementById('toast');
        const clearBtn = document.getElementById('clearBtn');

        // --- HELPER FUNCTIONS ---
        const showToast = (msg) => {
            toast.textContent = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2000);
        };

        const updateEmptyState = () => {
            if (grid.children.length <= 1) { // 1 because emptyState is a child
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        };

        const formatBytes = (bytes, decimals = 2) => {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        };

        const convertToPng = (blob) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(blob);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob((pngBlob) => {
                        URL.revokeObjectURL(url);
                        resolve(pngBlob);
                    }, 'image/png');
                };
                img.onerror = (e) => {
                    URL.revokeObjectURL(url);
                    reject(e);
                };
                img.src = url;
            });
        };

        const createCard = (clip) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = clip.id;

            let contentHTML = '';

            // 1. TEXT
            if (clip.type === 'text') {
                contentHTML = `<div class="preview-text">${clip.content.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
            }
            // 2. IMAGE
            else if (clip.type === 'image') {
                // Blob to URL
                const url = URL.createObjectURL(clip.content);
                contentHTML = `<div class="preview-box"><img src="${url}" class="preview-img" alt="clip"></div>`;
            }
            // 3. FILE
            else if (clip.type === 'file') {
                contentHTML = `
                    <div class="preview-file">
                        <div class="file-icon">▤</div>
                        <div style="font-size:12px; font-weight:500;">${clip.name}</div>
                        <div style="font-size:10px; color:var(--text-dim);">${formatBytes(clip.size)}</div>
                    </div>
                `;
            }

            card.innerHTML = `
                ${contentHTML}
                <div class="meta">
                    <span>${clip.type} // ${clip.timestamp}</span>
                    <span class="delete-btn">DEL</span>
                </div>
            `;

            // Interaction: Copy or Download
            card.addEventListener('click', async (e) => {
                if (e.target.classList.contains('delete-btn')) {
                    e.stopPropagation();
                    await deleteClip(clip.id);
                    card.remove();
                    updateEmptyState();
                    return;
                }

                if (clip.type === 'text') {
                    await navigator.clipboard.writeText(clip.content);
                    showToast('Text Copied');
                }
                else if (clip.type === 'image') {
                    try {
                        // Attempt to write original blob.
                        const isSupportedType = ['image/png', 'image/jpeg'].includes(clip.content.type);

                        if (isSupportedType) {
                             await navigator.clipboard.write([
                                new ClipboardItem({ [clip.content.type]: clip.content })
                            ]);
                            showToast('Image Copied');
                        } else {
                            throw new Error('Unsupported mime type for direct copy');
                        }

                    } catch (err) {
                        // Fallback 1: Convert to PNG
                        try {
                            showToast('Converting to PNG...');
                            const pngBlob = await convertToPng(clip.content);
                            await navigator.clipboard.write([
                                new ClipboardItem({ 'image/png': pngBlob })
                            ]);
                            showToast('Image Copied (Converted)');
                        } catch (convErr) {
                            // Fallback 2: Download File
                            console.warn('Copy failed, downloading instead.', convErr);
                            showToast('Copy Failed - Downloading');

                            const url = URL.createObjectURL(clip.content);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = clip.name || `image-${Date.now()}.${clip.content.type.split('/')[1] || 'png'}`;
                            a.click();
                            URL.revokeObjectURL(url);
                        }
                    }
                }
                else if (clip.type === 'file') {
                    const url = URL.createObjectURL(clip.content);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = clip.name;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('File Downloaded');
                }
            });

            return card;
        };

        const renderAll = async () => {
            grid.innerHTML = '';
            grid.appendChild(emptyState);
            const clips = await getAllClips();

            clips.forEach(clip => {
                const card = createCard(clip);
                grid.appendChild(card);
            });
            updateEmptyState();
        };

        // --- INPUT HANDLERS ---

        // REVISED PASTE HANDLER
        document.addEventListener('paste', async (e) => {
            const items = e.clipboardData.items;
            let hasFile = false;

            // 1. Priority: Files (Images/Binaries)
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file') {
                    hasFile = true;
                    const blob = items[i].getAsFile();
                    let type = blob.type.startsWith('image/') ? 'image' : 'file';

                    const name = blob.name || `pasted_item_${Date.now()}`;

                    const clip = await saveClip(type, blob, {
                        name: name,
                        size: blob.size,
                        mime: blob.type
                    });
                    grid.insertBefore(createCard(clip), grid.children[1] || null);
                }
            }

            // 2. Fallback: Text
            if (!hasFile) {
                const text = e.clipboardData.getData('text/plain');
                if (text && text.trim()) {
                    const clip = await saveClip('text', text);
                    grid.insertBefore(createCard(clip), grid.children[1] || null);
                }
            }

            updateEmptyState();
        });

        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('active');
        });

        window.addEventListener('dragleave', (e) => {
            if (e.clientX === 0 && e.clientY === 0) {
            }
            dropZone.classList.remove('active');
        });

        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            if (e.dataTransfer.files.length) {
                const files = Array.from(e.dataTransfer.files);
                for (const file of files) {
                    let type = 'file';
                    if (file.type.startsWith('image/')) type = 'image';
                    const clip = await saveClip(type, file, { name: file.name, size: file.size, mime: file.type });
                    grid.insertBefore(createCard(clip), grid.children[1] || null);
                }
                updateEmptyState();
            }
        });

        clearBtn.addEventListener('click', async () => {
            await clearAllClips();
            renderAll();
        });

        // --- INIT ---
        (async () => {
            try {
                await initDB();
                await renderAll();
            } catch (err) {
                console.error("Failed to load DB", err);
                showToast('Database Error');
            }
        })();
    </script>
  </body>
</html>
