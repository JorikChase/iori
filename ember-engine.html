<body>
    <canvas id="glcanvas"></canvas>

    <script>
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl2', { antialias: false });

        if (!gl) {
            alert('WebGL 2.0 is not supported by your browser.');
        }

        // We require floating-point color buffers to store precise CA state (fuel, heat)
        const ext = gl.getExtension('EXT_color_buffer_float');
        if (!ext) {
            console.warn('EXT_color_buffer_float not available. Simulation may lose precision.');
        }

        // --- SHADER CODE ---

        const vertexShaderSource = `#version 300 es
        in vec2 a_position;
        out vec2 v_uv;
        void main() {
            v_uv = a_position * 0.5 + 0.5;
            gl_Position = vec4(a_position, 0.0, 1.0);
        }`;

        // Generates the initial state: R=1.0 (Fuel), G=0.0 (Heat), B=Noise (Structural Density)
        const initFragmentShaderSource = `#version 300 es
        precision highp float;
        uniform vec2 u_resolution;
        out vec4 outColor;

        float hash(vec2 p) {
            return fract(1e4 * sin(17.0 * p.x + p.y * 0.1) * (0.1 + abs(sin(p.y * 13.0 + p.x))));
        }

        float noise(vec2 x) {
            vec2 i = floor(x);
            vec2 f = fract(x);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 4; i++) {
                v += a * noise(p);
                p *= 2.0;
                a *= 0.5;
            }
            return v;
        }

        void main() {
            vec2 uv = gl_FragCoord.xy / u_resolution.y; // Isotropic scaling
            float n = fbm(uv * 8.0); // Generate structural paper grain
            outColor = vec4(1.0, 0.0, n, 0.0); // Fuel is full, RedHeat is zero, BlueHeat is zero
        }`;

        // The Cellular Automata Engine (Calculates next physical frame)
        const simFragmentShaderSource = `#version 300 es
        precision highp float;
        uniform vec2 u_resolution;
        uniform vec4 u_mouse;
        uniform float u_deltaTime;
        uniform sampler2D u_state;
        out vec4 outColor;

        void main() {
            vec2 uv = gl_FragCoord.xy / u_resolution;
            vec2 pixel = 1.0 / u_resolution;

            // Current state
            vec4 center = texture(u_state, uv);
            float fuel = center.r;
            float heat = center.g;
            float noise = center.b;
            float blueHeat = center.a;

            // Sample 8 neighbors for heat diffusion (Optimized to vec4 reads)
            vec4 n1 = texture(u_state, uv + vec2(-pixel.x, 0.0));
            vec4 n2 = texture(u_state, uv + vec2(pixel.x, 0.0));
            vec4 n3 = texture(u_state, uv + vec2(0.0, -pixel.y));
            vec4 n4 = texture(u_state, uv + vec2(0.0, pixel.y));
            vec4 n5 = texture(u_state, uv + vec2(-pixel.x, -pixel.y));
            vec4 n6 = texture(u_state, uv + vec2(pixel.x, -pixel.y));
            vec4 n7 = texture(u_state, uv + vec2(-pixel.x, pixel.y));
            vec4 n8 = texture(u_state, uv + vec2(pixel.x, pixel.y));

            float avgHeat = (n1.g + n2.g + n3.g + n4.g) + (n5.g + n6.g + n7.g + n8.g) * 0.707;
            float avgBlue = (n1.a + n2.a + n3.a + n4.a) + (n5.a + n6.a + n7.a + n8.a) * 0.707;
            
            avgHeat /= 6.828; // Normalize weights
            avgBlue /= 6.828;

            // Global simulation speed
            float dt = u_deltaTime * 4.5;

            // 1. Heat Diffusion (Heat tries to equalize with surroundings)
            heat += (avgHeat - heat) * 0.9 * dt;
            blueHeat += (avgBlue - blueHeat) * 0.9 * dt;

            // 2. Combustion Mechanics
            // The paper grain (noise) dictates how easily it catches fire
            float ignitionThreshold = 0.12 + noise * 0.15; 
            float burnRate = 0.6 + noise * 0.6;
            
            // Red combustion (paper -> ash)
            if (heat > ignitionThreshold && fuel > 0.0) {
                fuel -= burnRate * dt;
                heat += burnRate * 2.2 * dt; // Exothermic reaction
            }
            
            // Blue combustion (ash -> paper)
            if (blueHeat > ignitionThreshold && fuel < 1.0) {
                fuel += burnRate * dt;
                blueHeat += burnRate * 2.2 * dt; // Exothermic healing reaction
            }

            // 3. Cooling / Dissipation
            if (fuel <= 0.0) {
                heat -= 1.0 * dt; // Rapid cooling once completely turned to ash
            } else {
                heat -= 0.05 * dt; // Slight natural ambient heat loss
            }

            if (fuel >= 1.0) {
                blueHeat -= 1.0 * dt; // Rapid cooling once completely healed to paper
            } else {
                blueHeat -= 0.05 * dt; 
            }

            // FIX: Prevent temperatures from going negative before checking collisions!
            // Without this, subtracting a negative collision value actually ADDS heat.
            heat = max(0.0, heat);
            blueHeat = max(0.0, blueHeat);

            // Mutual annihilation if red and blue flames collide
            float cancel = min(heat, blueHeat) * 10.0 * dt;
            heat -= cancel;
            blueHeat -= cancel;

            heat = clamp(heat, 0.0, 1.0);
            blueHeat = clamp(blueHeat, 0.0, 1.0);
            fuel = clamp(fuel, 0.0, 1.0);

            // 4. Mouse Injection (Spark)
            if (u_mouse.z > 0.5) {
                float dist = distance(gl_FragCoord.xy, u_mouse.xy);
                if (dist < u_mouse.w) {
                    if (fuel < 0.5) {
                        blueHeat = 1.0; // Inject maximum blue heat
                        fuel += 0.5 * dt; // Force structural recovery to guarantee ignition start
                    } else {
                        heat = 1.0; // Inject maximum red heat
                        fuel -= 0.5 * dt; // Force degradation to guarantee ignition start
                    }
                }
            }

            outColor = vec4(fuel, heat, noise, blueHeat);
        }`;

        // Transforms the raw data into visually realistic colors
        const renderFragmentShaderSource = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        uniform sampler2D u_state;
        out vec4 outColor;

        void main() {
            vec4 state = texture(u_state, v_uv);
            float fuel = state.r;
            float heat = state.g;
            float noise = state.b;
            float blueHeat = state.a;

            // Physical Materials
            vec3 paper = vec3(0.96, 0.94, 0.90) * (0.95 + 0.05 * noise); // Warm off-white
            vec3 ash = vec3(0.0); // Absolute solid black ash
            vec3 charEdge = vec3(0.1, 0.05, 0.02); // Dark brown edge right before burning

            vec3 baseColor = paper;

            // Map physical state to base structural color
            if (fuel < 0.95) {
                // Starts charring
                baseColor = mix(charEdge, paper, smoothstep(0.8, 0.95, fuel));
            }
            if (fuel < 0.2) {
                // Transitions completely to black ash
                baseColor = mix(ash, charEdge, smoothstep(0.0, 0.2, fuel));
            }

            // Blackbody Ember Gradient (Red Fire)
            vec3 glow = vec3(0.0);
            if (heat > 0.01) {
                vec3 red = vec3(0.9, 0.15, 0.0);
                vec3 orange = vec3(1.0, 0.4, 0.0);
                vec3 yellow = vec3(1.0, 0.9, 0.2);

                if (heat < 0.4) {
                    glow = mix(vec3(0.0), red, smoothstep(0.05, 0.4, heat));
                } else if (heat < 0.7) {
                    glow = mix(red, orange, smoothstep(0.4, 0.7, heat));
                } else {
                    glow = mix(orange, yellow, smoothstep(0.7, 1.0, heat));
                }
            }

            // Bluebody Ember Gradient (Healing Fire)
            vec3 blueGlow = vec3(0.0);
            if (blueHeat > 0.01) {
                vec3 deepBlue = vec3(0.0, 0.2, 0.9);
                vec3 cyan = vec3(0.0, 0.8, 1.0);
                vec3 white = vec3(0.9, 0.95, 1.0);

                if (blueHeat < 0.4) {
                    blueGlow = mix(vec3(0.0), deepBlue, smoothstep(0.05, 0.4, blueHeat));
                } else if (blueHeat < 0.7) {
                    blueGlow = mix(deepBlue, cyan, smoothstep(0.4, 0.7, blueHeat));
                } else {
                    blueGlow = mix(cyan, white, smoothstep(0.7, 1.0, blueHeat));
                }
            }

            // Combine Structure + Emission
            // The embers glow aggressively, overriding the dark ash/char
            vec3 finalColor = baseColor + (glow * 1.3) + (blueGlow * 1.3);

            outColor = vec4(clamp(finalColor, 0.0, 1.0), 1.0);
        }`;

        // --- WEBGL HELPER FUNCTIONS ---

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(vsSource, fsSource) {
            const vs = compileShader(gl.VERTEX_SHADER, vsSource);
            const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.bindAttribLocation(prog, 0, "a_position"); // Force standard attribute location
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(prog));
            }
            return prog;
        }

        function createFBO(width, height) {
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            // Using RGBA32F for exact physical representation
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, width, height, 0, gl.RGBA, gl.FLOAT, null);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

            const fbo = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
            return { fbo, tex, width, height };
        }

        // --- SETUP ---

        let width, height;
        let fboA, fboB;

        const initProg = createProgram(vertexShaderSource, initFragmentShaderSource);
        const simProg = createProgram(vertexShaderSource, simFragmentShaderSource);
        const renderProg = createProgram(vertexShaderSource, renderFragmentShaderSource);

        const quadBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        // Uniform locations
        const uResInit = gl.getUniformLocation(initProg, "u_resolution");
        const uResSim = gl.getUniformLocation(simProg, "u_resolution");
        const uMouseSim = gl.getUniformLocation(simProg, "u_mouse");
        const uTimeSim = gl.getUniformLocation(simProg, "u_deltaTime");
        const uStateSim = gl.getUniformLocation(simProg, "u_state");
        const uStateRender = gl.getUniformLocation(renderProg, "u_state");

        // Interaction State
        let mouseX = -100, mouseY = -100, isDown = false;
        let lastMouseX = -100, lastMouseY = -100;
        let cursorRadius = 3.0;
        let simSpeedMultiplier = 1.0;

        function updateMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = canvas.height - (e.clientY - rect.top); // WebGL Y is flipped
        }

        canvas.addEventListener('mousedown', (e) => { isDown = true; updateMousePos(e); });
        canvas.addEventListener('mousemove', (e) => { if (isDown) updateMousePos(e); });
        window.addEventListener('mouseup', () => { isDown = false; });

        canvas.addEventListener('touchstart', (e) => { isDown = true; updateMousePos(e.touches[0]); });
        canvas.addEventListener('touchmove', (e) => { if (isDown) updateMousePos(e.touches[0]); });
        window.addEventListener('touchend', () => { isDown = false; });

        // Scroll to change speed
        canvas.addEventListener('wheel', (e) => {
            if (e.deltaY < 0) {
                simSpeedMultiplier *= 1.2; // Scroll up -> Faster
            } else if (e.deltaY > 0) {
                simSpeedMultiplier /= 1.2; // Scroll down -> Slower
            }
            // Clamp the speed to prevent freezing the browser or stopping completely
            simSpeedMultiplier = Math.max(0.1, Math.min(simSpeedMultiplier, 10.0));
        });

        // Architecture Setup
        function initEngine() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);

            if (fboA) gl.deleteFramebuffer(fboA.fbo);
            if (fboB) gl.deleteFramebuffer(fboB.fbo);

            fboA = createFBO(width, height);
            fboB = createFBO(width, height);

            // Run Init Shader to generate paper structural noise
            gl.useProgram(initProg);
            gl.uniform2f(uResInit, width, height);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fbo);
            gl.bindVertexArray(vao);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        }

        window.addEventListener('resize', initEngine);
        initEngine();

        // --- RENDER LOOP ---

        let lastTime = 0;
        let accumulator = 0;
        const FIXED_DT = 1.0 / 60.0; // Math requires constant timesteps for stability

        function render(time) {
            let dt = (time - lastTime) / 1000.0;
            lastTime = time;

            // Prevent spiral of death if user tabs out
            dt = Math.min(dt, 0.1);

            // Apply the scroll-based speed multiplier
            accumulator += dt * simSpeedMultiplier;

            // Calculate velocity-based cursor radius
            let dx = mouseX - lastMouseX;
            let dy = mouseY - lastMouseY;
            let velocity = dt > 0.0 ? Math.sqrt(dx * dx + dy * dy) / dt : 0.0;

            // Map velocity: 0 px/s -> 3px radius, ~1500 px/s -> 6px radius
            let targetRadius = Math.max(3.0, Math.min(6.0, 3.0 + (velocity / 500.0)));
            cursorRadius += (targetRadius - cursorRadius) * 0.15; // Smooth size transition

            lastMouseX = mouseX;
            lastMouseY = mouseY;

            gl.bindVertexArray(vao);

            // 1. Simulation Pass (Fixed Time Step)
            gl.useProgram(simProg);
            gl.uniform2f(uResSim, width, height);
            gl.uniform4f(uMouseSim, mouseX, mouseY, isDown ? 1.0 : 0.0, cursorRadius);
            gl.uniform1f(uTimeSim, FIXED_DT);
            gl.uniform1i(uStateSim, 0);

            // Process CA logic in steady physical slices
            while (accumulator >= FIXED_DT) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, fboB.fbo);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, fboA.tex);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                // Ping-Pong Data Flip
                let temp = fboA;
                fboA = fboB;
                fboB = temp;

                accumulator -= FIXED_DT;
            }

            // 2. Visual Render Pass
            gl.useProgram(renderProg);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null); // Draw back to canvas screen
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, fboA.tex);
            gl.uniform1i(uStateRender, 0);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);

    </script>
