                vec2 vin = c.z > 0.5 ? fetchCell(uVelocity, c + vec3(0, 0, -1)).xy : vel;
                vec2 vout = c.z < K - 1.5 ? fetchCell(uVelocity, c + vec3(0, 0, 1)).xy : vel;
                vel = mix(vel, 0.5 * (vin + vout), uCouple);
                outColor = vec4(vel, 0.0, 1.0);
            }`;

            // Temperature advection + radial coupling + fuel source + strain emission.
            const advectDensFs = `${atlasLib}${noiseLib}${strainLib}
            uniform sampler2D uVelocity; uniform sampler2D uSource; uniform float uDissipation;
            uniform float uCouple, uExpand, uFuel, uEmit, uCool, uFireShare;
            void main() {
                vec3 c = cellCoord();
                vec2 past = c.xy + 0.5 - uDt * fetchCell(uVelocity, c).xy;
                float mask = step(0.0, past.y) * step(past.y, NY);
                // Outer shells and the tip entrain cold air: cooling grows with radius and height.
                float shellFrac = (c.z + 0.5) / K;
                float diss = uDissipation - uCool * shellFrac * shellFrac - 0.05 * smoothstep(0.55, 1.0, (c.y + 0.5) / NY);
                float T = sampleSlice(uSource, past, c.z).r * diss * mask;
                // Radial: diffuse across shells, and let hot inner gas push outward.
                float Tin = c.z > 0.5 ? sampleSlice(uSource, past, c.z - 1.0).r : T;
                float Tout = c.z < K - 1.5 ? sampleSlice(uSource, past, c.z + 1.0).r : 0.0;
                T = mix(T, 0.5 * (Tin + Tout), uCouple);
                T += uExpand * max(Tin - T, 0.0) * 0.5;
                // Constant fuel at the root: a flickering ring on the inner shells.
                vec3 np = cylPos(c);
                float flick = 0.55 + 0.45 * (fbm3(vec3(np.x, np.z, uTime * 1.4) * 2.5 + c.z * 0.3) * 0.5 + 0.5);
                float radial = 1.0 - smoothstep(0.0, K * 0.4, c.z + 0.5);
                float band = exp(-pow((c.y + 0.5 - 5.0) / 4.5, 2.0));
                // The mix is a budget: the automata sliders take their share of
                // the base fuel and the pure flame keeps the remainder.
                T = max(T, uFuel * uFireShare * radial * band * flick);
                // Automata are fuel: every strain pours its own heat into the carrier.
                T = max(T, emitOf(fetchCell(uStrain, c)) * uEmit);
                outColor = vec4(min(T, 2.5), 0.0, 0.0, 1.0);
            }`;

            // --- STRAIN PASSES -------------------------------------------------

            // Carry the strain field with the flame. Discrete states cannot be
            // interpolated, so the displacement is rounded stochastically
            // (one jitter per step): the average motion is exact, patterns
            // shear and tear where the flow does — that is the fire at work.
            const strainDriftFs = `${atlasLib}${strainLib}
            uniform sampler2D uVelocity; uniform float uDrift, uJitter;
            void main() {
                vec3 c = cellCoord();
                vec2 disp = fetchCell(uVelocity, c).xy * uDt * uDrift;
                vec2 src = c.xy - floor(disp + uJitter);
                if (src.y < 0.0 || src.y > NY - 1.0) { outColor = vec4(0.0); return; }
                outColor = fetchCell(uStrain, vec3(src, c.z));
            }`;

            // One multiplexed step for every strain on the field.
            const strainStepFs = `${atlasLib}${noiseLib}
            uniform float uBurn;
            ${strainLib}${strainRulesLib}
            uniform sampler2D uDensity; uniform float uRnd, uAggro, uSterile, uSpawn;
            uniform float uMix[10];
            void main() {
                vec3 c = cellCoord();
                vec4 s = fetchCell(uStrain, c);
                float heat = fetchCell(uDensity, c).r;
                float rnd = hash13(c + vec3(uRnd, uRnd * 1.7, uRnd * 0.3));
                float rnd2 = hash13(c.zxy + vec3(uRnd * 2.3, 7.1, uRnd));
                int id = int(s.a + 0.5);

                vec4 o = s;
                if (id == 1) o = ruleLife(s, c, heat, rnd);
                else if (id == 2) o = ruleAnt(s, c, heat, rnd);
                else if (id == 3) o = ruleCyclic(s, c, heat, rnd);
                else if (id == 4) o = ruleEmber(s, c, heat, rnd);
                else if (id == 5) o = ruleGS(s, c, heat, rnd);
                else if (id == 6) o = ruleWolfram(s, c, heat, rnd);
                else if (id == 7) o = ruleBrain(s, c, heat, rnd);
                else if (id == 8) o = ruleForest(s, c, heat, rnd);
                else if (id == 9) o = ruleCrystal(s, c, heat, rnd);

                // An ant walking in claims the cell, whatever lived here —
                // unless the fire takes the walker first: past ~1.0 heat the
                // ant burns, flaring into a briefly burning ember cell.
                int arr = antArriving(c);
                if (arr >= 0) {
                    if (heat > 1.0 && rnd2 < uBurn) o = vec4(0.0, 1.0, rnd, 4.0);
                    else o = vec4(id == 2 ? o.r : 0.0, 1.0, float(arr), 2.0);
                }

                // Dead ground is contested, but only where the fire makes it habitable:
                // a living neighbour of another strain may take it. Elsewhere it turns to ash.
                if (alive(o) < 0.5) {
                    if (rnd2 < uAggro && heat > 0.02 && heat < 0.9) {
                        for (int j = 0; j < 4; j++) {
                            vec2 d = dirVec(j);
                            vec4 t = NS(c, d.x, d.y);
                            if (t.a > 0.5 && !isId(t, o.a) && alive(t) > 0.5 && rnd < aggroOf(t.a)) { o = deadOf(t.a, rnd2); break; }
                        }
                    } else if (rnd < decayOf(o)) o = vec4(0.0);
                }
                // The fire's core sterilises everything.
                if (heat > uSterile && rnd2 < 0.25) o = vec4(0.0);

                // THE MIX. The base fuel births strains: empty ground at the
                // flame's root spawns each automaton in proportion to its
                // slider. Spawning is decided per 5x5 block, so every newborn
                // is a viable nucleus, and the flow carries it up into the fire.
                if (o.a < 0.5 && (c.y + 0.5) < NY * 0.28 && heat > 0.05 && heat < uSterile) {
                    float total = 0.0;
                    for (int i = 1; i < 10; i++) total += uMix[i];
                    if (total > 0.0) {
                        vec2 bc = floor(c.xy / 5.0);
                        vec3 bkey = vec3(bc, c.z * 7.77);
                        float rnd3 = hash13(bkey + vec3(3.7, uRnd * 1.3, uRnd));
                        if (rnd3 < total * 0.0000008 * uSpawn) {
                            float pickv = hash13(bkey.yxz + vec3(uRnd * 0.7, 11.3, uRnd * 2.9)) * total;
                            float id = 9.0, acc = 0.0;
                            for (int i = 1; i < 10; i++) { acc += uMix[i]; if (pickv < acc) { id = float(i); break; } }
                            float h = hash13(c.xzy + vec3(5.1, uRnd, 1.9));
                            float g = fbm3(cylPos(c) * 6.0 + uRnd) * 0.5 + 0.5;
                            bool center = mod(c.x, 5.0) == 2.0 && mod(c.y, 5.0) == 2.0;
                            o = initStrain(id, h, g, center);
                        }
                    }
                }
                outColor = o;
            }`;

            // Seed a blob of one strain around a cell, on the chosen shells.
            const strainSeedFs = `${atlasLib}${noiseLib}${strainLib}
            uniform vec3 uSeedCell; uniform float uSeedRadius, uSeedId, uSeedShells, uSeedRnd;
            void main() {
                vec3 c = cellCoord();
                vec4 cur = fetchCell(uStrain, c);
                float dx = mod(c.x - uSeedCell.x + NT * 1.5, NT) - NT * 0.5;
                float dy = c.y - uSeedCell.y;
                float d = length(vec2(dx, dy));
                bool inK = abs(c.z - uSeedCell.z) <= uSeedShells + 0.01;
                if (d < uSeedRadius && inK) {
                    float h = hash13(c + vec3(uSeedRnd * 3.1, uSeedRnd, 0.7));
                    float g = fbm3(cylPos(c) * 6.0 + uSeedRnd) * 0.5 + 0.5;
                    bool center = d < 0.71 && abs(c.z - uSeedCell.z) < 0.5;
                    outColor = initStrain(uSeedId, h, g, center);
                } else outColor = cur;
            }`;

            // --- DISPLAY: VOLUMETRIC RAYMARCH ----------------------------------

            const raymarchFs = `${atlasLib}${noiseLib}${paletteLib}${strainLib}
            uniform sampler2D uDensity; uniform sampler2D uSpin;
            uniform vec3 uCamPos, uCamRight, uCamUp, uCamFwd; uniform vec2 uScreen;
            uniform float uSteps, uWarp, uGlow, uCrisp, uDens, uFrame, uFlat, uDbg;
            const float H = ${H}, R0 = ${R0};

            float profile(float v) { return mix(0.85, 1.0, smoothstep(0.0, 0.15, v)) * (1.0 - 0.75 * smoothstep(0.25, 1.0, v)); }
            // World -> (x cells, y cells, continuous shell coordinate; shell centers at k + 0.5).
            vec3 toCell(vec3 p) {
                float v = p.y / H;
                float th = atan(p.z, p.x);
                float rho = length(p.xz) / (R0 * profile(clamp(v, 0.0, 1.0)));
                return vec3((th / TAU + 0.5) * NT, v * NY, rho * (K + 0.5));
            }

            vec3 tintOf(vec4 s) {
                int id = int(s.a + 0.5);
                if (id == 1) return s.r > 0.5 ? mix(vec3(1.4), vec3(0.2, 0.9, 1.2), smoothstep(0.0, 40.0, s.g)) : vec3(0.0);
                if (id == 2) return s.g > 0.5 ? vec3(3.0) : (s.r > 0.5 ? hsv(0.55 + 0.4 * s.r / max(uAntN, 2.0), 0.6, 0.8) : vec3(0.0));
                if (id == 3) return hsv(s.r / uCyclicN, 0.85, 0.7);
                if (id == 4) return vec3(1.0, 0.35, 0.05) * s.g * 0.8;
                if (id == 5) return vec3(0.9, 0.25, 1.2) * s.g * 1.4;
                if (id == 6) return s.r > 0.5 ? vec3(1.5, 1.15, 0.45) : vec3(0.0);
                if (id == 7) return s.r > 1.5 ? vec3(0.8, 1.1, 2.2) : (s.r > 0.5 ? vec3(0.15, 0.25, 0.9) : vec3(0.0));
                if (id == 8) return s.r > 1.5 ? vec3(2.2, 0.55, 0.08) : (s.r > 0.5 ? vec3(0.1, 0.75, 0.18) * 0.55 : vec3(0.0));
                if (id == 9) return s.r > 0.5 ? vec3(0.75, 1.3, 1.9) * (0.7 + 0.3 * sin(s.g * 0.4 + uTime * 2.0)) : vec3(0.0);
                return vec3(0.0);
            }
            // Strains are read crisp in theta/height, blended across the two nearest shells.
            vec3 strainTint(vec3 cell) {
                vec2 xy = floor(cell.xy);
                float kk = cell.z - 0.5; float k0 = floor(kk); float f = kk - k0;
                vec3 a = tintOf(fetchCell(uStrain, vec3(xy, max(k0, 0.0))));
                if (k0 < 0.0) return a;
                vec3 b = (k0 + 1.0 > K - 1.0) ? vec3(0.0) : tintOf(fetchCell(uStrain, vec3(xy, k0 + 1.0)));
                return mix(a, b, f);
            }

            vec4 shade(float T, vec3 cell, vec3 p) {
                float smokeNoise = noise(p * 5.0 + vec3(0.0, -uTime * 0.7, 0.0));
                vec3 smokeColor = mix(vec3(0.06, 0.06, 0.08), vec3(0.22, 0.21, 0.24), smokeNoise);
                vec3 fire = firePalette(smoothstep(0.1, 1.0, T));
                float f = smoothstep(0.1, 0.35, T);
                if (uDbg == 2.0) smokeColor = vec3(1.0, 0.0, 1.0) * 0.2;
                vec3 col = mix(smokeColor, fire, f);
                float spin = uDbg == 1.0 ? 0.0 : sampleVol(uSpin, cell).r;
                float magic = smoothstep(4.0, 12.0, spin);
                if (magic > 0.0) {
                    float palT = uTime * 0.5 + p.x * 3.0 + p.y * 3.0 - spin * 0.1;
                    float tempMask = smoothstep(0.01, 0.2, T) * (1.0 - smoothstep(0.4, 0.9, T));
                    col += rainbowPalette(palT) * magic * 1.2 * tempMask;
                }
                if (uGlow > 0.0 && uDbg != 3.0) col += strainTint(cell) * uGlow * smoothstep(0.02, 0.2, T);
                float sigma = uDens * (smoothstep(0.08, 0.6, T) + 0.07 * smoothstep(0.01, 0.12, T) * (1.0 - f));
                return vec4(col, sigma);
            }

            // Fetch + fade + shade at one cell position.
            vec4 shadePoint(vec3 cell, vec3 p) {
                float T = sampleVol(uDensity, cell).r * (1.0 - smoothstep(0.9, 1.0, p.y / H));
                if (T < 0.01) return vec4(0.0);
                if (uFlat > 0.5) return vec4(vec3(T), uDens * smoothstep(0.01, 0.6, T));
                return shade(T, cell, p);
            }

            void main() {
                vec2 ndc = vUv * 2.0 - 1.0;
                vec3 rd = normalize(uCamFwd + uCamRight * ndc.x * uScreen.x + uCamUp * ndc.y * uScreen.y);
                vec3 ro = uCamPos;
                vec3 bg = vec3(0.0196, 0.0, 0.0);

                // The floor: a dark plane lit by the fire.
                vec3 floorCol = bg;
                if (rd.y < -1e-4) {
                    float tf = -ro.y / rd.y;
                    vec3 fp = ro + rd * tf;
                    float d2 = dot(fp.xz, fp.xz);
                    float grit = 0.75 + 0.25 * (fbm3(fp * 4.0) * 0.5 + 0.5);
                    floorCol += vec3(0.45, 0.16, 0.05) * grit * 0.22 / (1.0 + d2 * 2.5);
                }

                vec3 boxMin = vec3(-R0, 0.0, -R0), boxMax = vec3(R0, H, R0);
                vec3 invd = 1.0 / rd;
                vec3 t1 = (boxMin - ro) * invd, t2 = (boxMax - ro) * invd;
                vec3 lo = min(t1, t2), hi = max(t1, t2);
                float tNear = max(max(lo.x, lo.y), lo.z), tFar = min(min(hi.x, hi.y), hi.z);
                if (tNear > tFar || tFar < 0.0) { outColor = vec4(floorCol, 1.0); return; }
                tNear = max(tNear, 0.0);

                float n = uSteps;
                float ds = (tFar - tNear) / n;
                float jitter = fract(52.9829189 * fract(0.06711056 * gl_FragCoord.x + 0.00583715 * gl_FragCoord.y) + uFrame * 0.618034);
                float t = tNear + ds * jitter;

                vec4 acc = vec4(0.0);
                for (int i = 0; i < 256; i++) {
                    if (float(i) >= n) break;
                    vec3 p = ro + rd * t; t += ds;
                    if (p.y < 0.0 || p.y > H) continue;
                    vec3 cell = toCell(p);
                    if (cell.z > K + 1.5) continue;
                    // Rising domain warp: hides the shells, gives the lick.
                    if (uWarp > 0.0) {
                        vec3 q = p * 2.4 + vec3(0.0, -uTime * 1.1, 0.0);
                        vec2 w = vec2(noise(q) - 0.5, noise(q + vec3(31.7, 0.0, 12.3)) - 0.5) * 2.0;
                        p.xz += w * uWarp * (0.35 + p.y / H);
                        cell = toCell(p);
                        if (cell.z > K) continue;
                    }
                    if (uCrisp > 0.0) cell = mix(cell, floor(cell) + 0.5, uCrisp);
                    // Near the axis a ray degenerates to two theta values of
                    // the ring, so its integral loses the ring's variety and a
                    // coherent smoke column can shadow the core. Blend those
                    // samples toward the shaded 4-point ring average - at the
                    // manifold's centre the ring genuinely fuses into one.
                    float w = 1.0 - smoothstep(0.045, 0.22, length(p.xz));
                    vec4 s = shadePoint(cell, p);
                    if (w > 0.003) {
                        vec4 m = s;
                        for (int j = 1; j < 4; j++) m += shadePoint(vec3(cell.x + float(j) * NT * 0.25, cell.y, cell.z), p);
                        s = mix(s, m * 0.25, w);
                    }
                    if (s.a < 0.001) continue;
                    float a = 1.0 - exp(-s.a * ds);
                    acc.rgb += (1.0 - acc.a) * a * s.rgb;
                    acc.a += (1.0 - acc.a) * a;
                    if (acc.a > 0.985) break;
                }
                vec3 col = acc.rgb + floorCol * (1.0 - acc.a);
                col = col / (1.0 + col * 0.12);   // soft shoulder for the hottest core
                outColor = vec4(col, 1.0);
            }`;

            // Atlas inspector: the raw field, one tile per shell (A key).
            const atlasViewFs = `${atlasLib}${paletteLib}${strainLib}
            uniform sampler2D uDensity; uniform float uMode;
            const float H = ${H}, R0 = ${R0};
            float profile(float v) { return mix(0.85, 1.0, smoothstep(0.0, 0.15, v)) * (1.0 - 0.75 * smoothstep(0.25, 1.0, v)); }
            vec3 toCell(vec3 p) {
                float v = p.y / H;
                float th = atan(p.z, p.x);
                float rho = length(p.xz) / (R0 * profile(clamp(v, 0.0, 1.0)));
                return vec3((th / TAU + 0.5) * NT, v * NY, rho * (K + 0.5));
            }
            void main() {
                vec2 uv = vUv;
                if (uMode > 2.5) {
                    // A vertical slice through the axis: world x in [-R0, R0], y in [0, H], z = 0.
                    vec3 p = vec3((uv.x * 2.0 - 1.0) * R0, uv.y * H, 0.0);
                    vec3 cell = toCell(p);
                    float T = cell.z > K ? 0.0 : sampleVol(uDensity, cell).r;
                    outColor = vec4(firePalette(smoothstep(0.0, 1.0, T)) * smoothstep(0.0, 0.02, T), 1.0);
                    return;
                }
                vec4 d = texture(uDensity, uv);
                vec4 s = texture(uStrain, uv);
                vec3 col;
                if (uMode < 1.5) col = firePalette(smoothstep(0.0, 1.0, d.r)) * smoothstep(0.0, 0.02, d.r);
                else {
                    int id = int(s.a + 0.5);
                    col = id == 1 ? mix(vec3(0.0, 0.15, 0.2), vec3(0.3, 1.0, 1.0), s.r)
                        : id == 2 ? (s.g > 0.5 ? vec3(1.0) : mix(vec3(0.15, 0.1, 0.0), vec3(0.9, 0.6, 0.1), s.r / max(uAntN - 1.0, 1.0)))
                        : id == 3 ? hsv(s.r / uCyclicN, 0.8, 0.8)
                        : id == 4 ? vec3(s.g, s.r * 0.35, 0.0)
                        : id == 5 ? vec3(s.g * 1.5, 0.1, s.g * 2.0)
                        : id == 6 ? vec3(s.r, s.r * 0.8, 0.2)
                        : id == 7 ? (s.r > 1.5 ? vec3(0.6, 0.8, 1.0) : vec3(0.1, 0.15, 0.5) * s.r)
                        : id == 8 ? (s.r > 1.5 ? vec3(1.0, 0.4, 0.0) : vec3(0.05, 0.5, 0.1) * s.r)
                        : id == 9 ? vec3(0.4, 0.8, 1.0) * s.r : vec3(0.0);
                }
                outColor = vec4(col, 1.0);
            }`;

            // --- WEBGL PLUMBING ------------------------------------------------

            function createProgram(vs, fs, name) {
                const program = gl.createProgram();
                const v = gl.createShader(gl.VERTEX_SHADER), f = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(v, vs); gl.shaderSource(f, fs);
                gl.compileShader(v); gl.compileShader(f);
                if (!gl.getShaderParameter(f, gl.COMPILE_STATUS)) throw new Error(name + ': ' + gl.getShaderInfoLog(f));
                gl.attachShader(program, v); gl.attachShader(program, f); gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(name + ' link: ' + gl.getProgramInfoLog(program));
                const uni = {};
                const n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
                for (let i = 0; i < n; i++) {
                    const info = gl.getActiveUniform(program, i);
                    uni[info.name] = { loc: gl.getUniformLocation(program, info.name), type: info.type };
                }
                return { id: program, uni };
            }

            function createFBO(w, h) {
                const texture = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
                const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
                return { fbo, texture, width: w, height: h };
            }
            function createDoubleFBO(w, h) {
                let a = createFBO(w, h), b = createFBO(w, h);
                return { read: () => a, write: () => b, swap: () => { const t = a; a = b; b = t; }, clear: () => { for (const f of [a, b]) { gl.bindFramebuffer(gl.FRAMEBUFFER, f.fbo); gl.clear(gl.COLOR_BUFFER_BIT); } } };
            }

            const programs = {
                buoyancy: createProgram(baseVs, buoyancyFs, 'buoyancy'),
                curl: createProgram(baseVs, curlFs, 'curl'),
                spinAccum: createProgram(baseVs, spinAccumFs, 'spinAccum'),
                vorticity: createProgram(baseVs, vorticityFs, 'vorticity'),
                divergence: createProgram(baseVs, divergenceFs, 'divergence'),
                pressure: createProgram(baseVs, pressureFs, 'pressure'),
                gradient: createProgram(baseVs, gradientFs, 'gradient'),
                advectVel: createProgram(baseVs, advectVelFs, 'advectVel'),
                advectDens: createProgram(baseVs, advectDensFs, 'advectDens'),
                strainDrift: createProgram(baseVs, strainDriftFs, 'strainDrift'),
                strainStep: createProgram(baseVs, strainStepFs, 'strainStep'),
                strainSeed: createProgram(baseVs, strainSeedFs, 'strainSeed'),
                raymarch: createProgram(baseVs, raymarchFs, 'raymarch'),
                atlasView: createProgram(baseVs, atlasViewFs, 'atlasView')
            };

            const quadVAO = gl.createVertexArray();
            gl.bindVertexArray(quadVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(0);

            function blit(dest) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, dest ? dest.fbo : null);
                gl.viewport(0, 0, dest ? dest.width : canvas.width, dest ? dest.height : canvas.height);
                gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
            }

            // Uniforms by name; textures as { tex, unit }; ints as { int }.
            function runProgram(p, uniforms, out) {
                gl.useProgram(p.id);
                for (const k in uniforms) {
                    const u = p.uni[k]; if (!u) continue;
                    const v = uniforms[k];
                    if (v && v.texture !== undefined) { gl.activeTexture(gl.TEXTURE0 + v.unit); gl.bindTexture(gl.TEXTURE_2D, v.texture); gl.uniform1i(u.loc, v.unit); }
                    else if (v && v.int !== undefined) gl.uniform1i(u.loc, v.int);
                    else if (v && v.arr !== undefined) gl.uniform1fv(u.loc, v.arr);
                    else if (typeof v === 'number') gl.uniform1f(u.loc, v);
                    else if (v.length === 2) gl.uniform2fv(u.loc, v);
                    else if (v.length === 3) gl.uniform3fv(u.loc, v);
                    else if (v.length === 4) gl.uniform4fv(u.loc, v);
                }
                blit(out);
            }
            const T = (fbo, unit) => ({ texture: fbo.texture, unit });

            const velocity = createDoubleFBO(ATLAS[0], ATLAS[1]);
            const density = createDoubleFBO(ATLAS[0], ATLAS[1]);
            const pressure = createDoubleFBO(ATLAS[0], ATLAS[1]);
            const spinMemory = createDoubleFBO(ATLAS[0], ATLAS[1]);
            const strain = createDoubleFBO(ATLAS[0], ATLAS[1]);
            const divergence = createFBO(ATLAS[0], ATLAS[1]);
            const curl = createFBO(ATLAS[0], ATLAS[1]);

            // --- SEEDING -------------------------------------------------------

            function seed(id, x, y, k, radius, shells) {
                runProgram(programs.strainSeed, {
                    uStrain: T(strain.read(), 0),
                    uSeedCell: [x, y, k], uSeedRadius: radius, uSeedId: id, uSeedShells: shells,
                    uSeedRnd: Math.random() * 100.0, uCyclicN: P.cyc, uAntN: P.antN
                }, strain.write());
                strain.swap();
            }
            function seedRandom(id, count, kLo, kHi, radius) {
                for (let i = 0; i < count; i++) {
                    const k = kLo + Math.floor(Math.random() * (kHi - kLo + 1));
                    seed(id, Math.random() * NT, NY * (0.06 + Math.random() * 0.7), k, radius, 0);
                }
            }
            function clearStrains() { strain.clear(); }

            // --- THE MIX: presets --------------------------------------------
            // A preset is a recipe: what the base fuel spawns (percent per
            // strain), plus optional rule and ecology overrides. The sliders
            // stay live afterwards — presets are starting points for mixing.
            const STRAIN_NAMES = { 1: 'life', 2: 'ant', 3: 'cyclic', 4: 'ember', 5: 'gray-scott', 6: 'wolfram', 7: 'brain', 8: 'forest', 9: 'crystal' };
            const PRESETS = {
                'pure fire':  { mix: {} },
                'ember bed':  { mix: { 4: 65 } },
                'garden':     { mix: { 1: 40, 4: 15, 8: 10 }, set: { lifeB: 8, lifeS: 12 } },
                'seed storm': { mix: { 1: 55 }, set: { lifeB: 4, lifeS: 0 } },
                'colony':     { mix: { 2: 35, 4: 10 } },
                'hypnosis':   { mix: { 3: 60 }, set: { cyc: 14 } },
                'alchemy':    { mix: { 3: 8, 5: 50 }, set: { gsF: 0.037, gsK: 0.06 } },
                'sierpinski': { mix: { 6: 55 }, set: { wolf: 90 } },
                'lightning':  { mix: { 6: 12, 7: 45 }, set: { wolf: 30 } },
                'wildfire':   { mix: { 4: 15, 8: 65 } },
                'frost':      { mix: { 5: 10, 9: 45 } },
                'ecosystem':  { mix: { 1: 12, 2: 8, 3: 10, 4: 18, 5: 8, 6: 8, 7: 8, 8: 12, 9: 6 } },
                'war':        { mix: { 1: 22, 3: 22, 5: 14, 7: 16, 8: 20 }, set: { aggro: 0.6 } }
            };
            // Shells where a strain feels at home, as fractions of K (for bursts).
            const HOME_SHELLS = { 1: [0.4, 0.65], 2: [0.25, 0.5], 3: [0.55, 0.8], 4: [0.0, 0.3], 5: [0.5, 0.75], 6: [0.3, 0.6], 7: [0.4, 0.7], 8: [0.1, 0.45], 9: [0.6, 0.9] };
            function syncUI() {
                for (const k in P) { const el = $(k); if (el && el.tagName === 'INPUT') { el.value = P[k]; } }
                syncMix();
                for (const [sel, keys] of [['lifeRule', ['lifeB', 'lifeS']], ['gsRule', ['gsF', 'gsK']], ['wolfRule', ['wolf']]]) {
                    const el = $(sel), want = keys.map(k => P[k]).join(',');
                    for (const opt of el.options) if (opt.value === want) el.value = want;
                }
                ['shell','brush','hz','drift','aggro','glow','cyc','fuel','swirl','wind','couple','cool','expand','burn','warp','dens','crisp','steps','spawn'].forEach(id => { const el = $(id), o = $(id + 'V'); if (el && o) o.textContent = (''+P[id]).length > 4 ? (+P[id]).toFixed(2) : P[id]; });
            }
            // Instant gratification: scatter the current mix over the flame.
            function burst() {
                for (let i = 1; i <= 9; i++) {
                    const pct = P['mix' + i]; if (pct <= 0) continue;
                    const n = Math.max(1, Math.round(pct / 10));
                    const [lo, hi] = HOME_SHELLS[i];
                    seedRandom(i, n, Math.round(lo * (K - 1)), Math.round(hi * (K - 1)), i === 2 ? 8 : 16 + pct * 0.2);
                }
            }
            function applyPreset(name, withBurst) {
                const pr = PRESETS[name]; if (!pr) return;
                for (let i = 1; i <= 9; i++) P['mix' + i] = pr.mix[i] || 0;
                if (pr.set) Object.assign(P, pr.set);
                syncUI();
                presetButtons.forEach(b => b.classList.toggle('on', b.textContent === name));
                if (withBurst) burst();
            }

            // --- ORBIT CAMERA + PICKING ----------------------------------------

            const TARGET = [0, H * 0.42, 0];
            const MIN_PHI = 0.35, MAX_PHI = 1.75;
            const MIN_RADIUS = 1.6, MAX_RADIUS = 9.0;
            let theta = 0.6, phi = 1.25, radius = 4.6;
            let tTheta = theta, tPhi = phi, tRadius = radius;
            const FOV = Math.PI * 0.22;
            let cam = { eye: [0, 0, 0], right: [1, 0, 0], up: [0, 1, 0], fwd: [0, 0, -1], screen: [1, 1] };

            function updateCamera() {
                theta += (tTheta - theta) * 0.12; phi += (tPhi - phi) * 0.12; radius += (tRadius - radius) * 0.12;
                const eye = [TARGET[0] + radius * Math.sin(phi) * Math.sin(theta), TARGET[1] + radius * Math.cos(phi), TARGET[2] + radius * Math.sin(phi) * Math.cos(theta)];
                let fx = TARGET[0] - eye[0], fy = TARGET[1] - eye[1], fz = TARGET[2] - eye[2];
                const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
                let rx = -fz, rz = fx; const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
                const ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;
                const tanHalf = Math.tan(FOV / 2);
                cam = { eye, right: [rx, 0, rz], up: [ux, uy, uz], fwd: [fx, fy, fz], screen: [tanHalf * (canvas.width / canvas.height), tanHalf] };
            }
            const profile = v => (0.85 + 0.15 * smooth(0, 0.15, v)) * (1 - 0.75 * smooth(0.25, 1, v));
            function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

            // Ray from a screen point, marched until it enters the selected shell.
            function pick(px, py) {
                const ndcx = (px / canvas.clientWidth) * 2 - 1, ndcy = 1 - (py / canvas.clientHeight) * 2;
                const rd = [0, 1, 2].map(i => cam.fwd[i] + cam.right[i] * ndcx * cam.screen[0] + cam.up[i] * ndcy * cam.screen[1]);
                const l = Math.hypot(...rd); rd[0] /= l; rd[1] /= l; rd[2] /= l;
                const ro = cam.eye;
                const rhoSel = (P.shell + 0.5) / (K + 0.5);
                for (let t = 0; t < 14; t += 0.008) {
                    const x = ro[0] + rd[0] * t, y = ro[1] + rd[1] * t, z = ro[2] + rd[2] * t;
                    if (y < 0 || y > H) continue;
                    const v = y / H;
                    const rho = Math.hypot(x, z) / (R0 * profile(v));
                    if (rho <= rhoSel) {
                        const th = Math.atan2(z, x);
                        return { x: (th / (2 * Math.PI) + 0.5) * NT, y: v * NY };
                    }
                }
                return null;
            }

            let dragging = false, moved = 0, lastX = 0, lastY = 0, downX = 0, downY = 0;
            canvas.addEventListener('mousedown', e => { dragging = true; moved = 0; lastX = downX = e.clientX; lastY = downY = e.clientY; canvas.style.cursor = 'grabbing'; });
            window.addEventListener('mouseup', e => {
                if (dragging && moved < 4 && e.target === canvas) {
                    const hit = pick(e.clientX, e.clientY);
                    if (hit) seed(e.shiftKey ? 0 : P.strain, hit.x, hit.y, P.shell, P.brush, 1);
                }
                dragging = false; canvas.style.cursor = 'grab';
            });
            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
                tTheta -= (e.clientX - lastX) * 0.005;
                tPhi = Math.max(MIN_PHI, Math.min(MAX_PHI, tPhi + (e.clientY - lastY) * 0.005));
                lastX = e.clientX; lastY = e.clientY;
            });
            canvas.addEventListener('wheel', e => { e.preventDefault(); tRadius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, tRadius * Math.exp(e.deltaY * 0.001))); }, { passive: false });
            canvas.addEventListener('contextmenu', e => e.preventDefault());

            let pinch = 0;
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                if (e.touches.length === 1) { dragging = true; moved = 0; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
                else if (e.touches.length === 2) { dragging = false; pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (e.touches.length === 1 && dragging) {
                    moved += Math.abs(e.touches[0].clientX - lastX) + Math.abs(e.touches[0].clientY - lastY);
                    tTheta -= (e.touches[0].clientX - lastX) * 0.005;
                    tPhi = Math.max(MIN_PHI, Math.min(MAX_PHI, tPhi + (e.touches[0].clientY - lastY) * 0.005));
                    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    if (pinch > 0) tRadius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, tRadius * pinch / d));
                    pinch = d;
                }
            }, { passive: false });
            window.addEventListener('touchend', e => {
                if (e.touches.length === 0) {
                    if (dragging && moved < 6) { const hit = pick(lastX, lastY); if (hit) seed(P.strain, hit.x, hit.y, P.shell, P.brush, 1); }
                    dragging = false;
                }
            });

            // --- UI ------------------------------------------------------------

            const $ = id => document.getElementById(id);
            function bindSlider(id, key, fmt) {
                const el = $(id), out = $(id + 'V');
                const show = () => { if (out) out.textContent = fmt ? fmt(P[key]) : P[key]; };
                el.value = P[key];
                el.addEventListener('input', () => { P[key] = parseFloat(el.value); show(); if (key === 'scale') resize(); });
                show();
            }
            bindSlider('shell', 'shell'); bindSlider('brush', 'brush'); bindSlider('hz', 'hz');
            // The mix is a budget. Raising one automaton's share squeezes the
            // others proportionally so the total never passes 100%; whatever is
            // left over stays pure fire, and the base fuel is split accordingly.
            const mixTotal = () => { let t = 0; for (let i = 1; i <= 9; i++) t += P['mix' + i]; return t; };
            function setMix(i, v) {
                P['mix' + i] = v;
                const others = mixTotal() - v;
                if (v + others > 100 && others > 0) {
                    const k = (100 - v) / others;
                    for (let j = 1; j <= 9; j++) if (j !== i) P['mix' + j] = Math.floor(P['mix' + j] * k);
                }
                syncMix();
            }
            function syncMix() {
                for (let i = 1; i <= 9; i++) { $('mix' + i).value = P['mix' + i]; $('mix' + i + 'V').textContent = P['mix' + i] + '%'; }
                $('fireShareV').textContent = Math.max(0, 100 - mixTotal()) + '%';
            }
            for (let i = 1; i <= 9; i++) {
                const el = $('mix' + i);
                el.addEventListener('input', () => setMix(i, parseFloat(el.value)));
            }
            syncMix();
            bindSlider('spawn', 'spawn', v => v.toFixed(2));
            bindSlider('drift', 'drift', v => v.toFixed(2)); bindSlider('aggro', 'aggro', v => v.toFixed(2)); bindSlider('glow', 'glow', v => v.toFixed(2));
            bindSlider('cyc', 'cyc'); bindSlider('fuel', 'fuel', v => v.toFixed(2)); bindSlider('swirl', 'swirl', v => v.toFixed(2)); bindSlider('wind', 'wind', v => v.toFixed(2));
            bindSlider('couple', 'couple', v => v.toFixed(2)); bindSlider('cool', 'cool', v => v.toFixed(3)); bindSlider('expand', 'expand', v => v.toFixed(2)); bindSlider('burn', 'burn', v => v.toFixed(2));
            bindSlider('warp', 'warp', v => v.toFixed(3)); bindSlider('dens', 'dens'); bindSlider('crisp', 'crisp', v => v.toFixed(2));
            bindSlider('steps', 'steps'); bindSlider('scale', 'scale', v => v.toFixed(1));
            $('shell').max = K - 1;

            $('wolfRule').addEventListener('change', e => { P.wolf = parseInt(e.target.value); });
            $('lifeRule').addEventListener('change', e => { const [b, s] = e.target.value.split(',').map(Number); P.lifeB = b; P.lifeS = s; });
            $('antRule').addEventListener('change', e => { const [r, n] = e.target.value.split(',').map(Number); P.antRule = r; P.antN = n; });
            $('gsRule').addEventListener('change', e => { const [f, k] = e.target.value.split(',').map(Number); P.gsF = f; P.gsK = k; });

            const strainButtons = Array.from(document.querySelectorAll('button[data-id]'));
            function selectStrain(id) {
                P.strain = id;
                strainButtons.forEach(b => b.classList.toggle('on', parseInt(b.dataset.id) === id));
            }
            strainButtons.forEach(b => b.addEventListener('click', () => selectStrain(parseInt(b.dataset.id))));
            selectStrain(1);

            const presetButtons = [];
            for (const name in PRESETS) {
                const b = document.createElement('button');
                b.textContent = name;
                const parts = Object.entries(PRESETS[name].mix).map(([i, v]) => STRAIN_NAMES[i] + ' ' + v + '%');
                b.title = parts.length ? 'Mix: ' + parts.join(', ') : 'Nothing but fire';
                b.addEventListener('click', () => applyPreset(name, true));
                $('presets').appendChild(b); presetButtons.push(b);
            }
            $('bSeed').addEventListener('click', () => { if (P.strain > 0) seedRandom(P.strain, 8, Math.max(0, P.shell - 1), Math.min(K - 1, P.shell + 1), P.brush); });
            $('bBurst').addEventListener('click', burst);
            $('bClear').addEventListener('click', clearStrains);
            $('bPause').addEventListener('click', togglePause);
            $('bAtlas').addEventListener('click', () => { P.view = (P.view + 1) % 5; $('bAtlas').classList.toggle('on', P.view > 0); });
            function togglePause() { P.paused = !P.paused; $('bPause').classList.toggle('on', P.paused); }

            window.addEventListener('keydown', e => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                if (e.key >= '0' && e.key <= '9') selectStrain(parseInt(e.key));
                else if (e.key === 'r' || e.key === 'R') $('bSeed').click();
                else if (e.key === 'c' || e.key === 'C') clearStrains();
                else if (e.key === ' ') { e.preventDefault(); togglePause(); }
                else if (e.key === 'h' || e.key === 'H') $('ui').classList.toggle('hidden');
                else if (e.key === 'x' || e.key === 'X') burst();
                else if (e.key === 'a' || e.key === 'A') $('bAtlas').click();
            });

            // --- MAIN LOOP -----------------------------------------------------

            function windOsc(a) { return (Math.cos(a) * 0.5 + Math.cos(a * 2.7) * 0.3 + Math.cos(a * 5.1) * 0.2) * CONFIG.WIND_STRENGTH; }

            const startTime = Date.now();
            let lastTime = Date.now(), frame = 0, strainAcc = 0;
            let fpsT = Date.now(), fpsN = 0, fps = 0;

            function simStep(dt, time) {
                const windAnim = time * 0.4;
                const wind = [windOsc(windAnim) * P.wind, windOsc(windAnim + 1.7) * P.wind];
                runProgram(programs.buoyancy, { uVelocity: T(velocity.read(), 0), uDensity: T(density.read(), 1), uStrain: T(strain.read(), 2), uBuoyancy: CONFIG.BUOYANCY, uWind: wind, uSwirl: P.swirl, uDt: dt }, velocity.write()); velocity.swap();
                runProgram(programs.curl, { uVelocity: T(velocity.read(), 0) }, curl);
                runProgram(programs.spinAccum, { uVelocity: T(velocity.read(), 0), uSource: T(spinMemory.read(), 1), uCurl: T(curl, 2), uDt: dt, uDissipation: CONFIG.SPIN_DISSIPATION }, spinMemory.write()); spinMemory.swap();
                runProgram(programs.vorticity, { uVelocity: T(velocity.read(), 0), uCurl: T(curl, 1), uCurlScale: CONFIG.CURL, uDt: dt, uTime: time }, velocity.write()); velocity.swap();
                runProgram(programs.divergence, { uVelocity: T(velocity.read(), 0) }, divergence);
                for (let i = 0; i < CONFIG.PRESSURE_ITERATIONS; i++) {
                    runProgram(programs.pressure, { uPressure: T(pressure.read(), 0), uDivergence: T(divergence, 1) }, pressure.write()); pressure.swap();
                }
                runProgram(programs.gradient, { uPressure: T(pressure.read(), 0), uVelocity: T(velocity.read(), 1) }, velocity.write()); velocity.swap();
                runProgram(programs.advectVel, { uVelocity: T(velocity.read(), 0), uDt: dt, uDissipation: CONFIG.VELOCITY_DISSIPATION, uCouple: P.couple * 0.5 }, velocity.write()); velocity.swap();
                runProgram(programs.advectDens, {
                    uVelocity: T(velocity.read(), 0), uSource: T(density.read(), 1), uStrain: T(strain.read(), 2),
                    uDt: dt, uTime: time, uDissipation: CONFIG.DENSITY_DISSIPATION,
                    uCouple: P.couple, uExpand: P.expand, uFuel: P.fuel, uEmit: 1.0, uCool: P.cool,
                    uFireShare: Math.max(0, 100 - (P.mix1 + P.mix2 + P.mix3 + P.mix4 + P.mix5 + P.mix6 + P.mix7 + P.mix8 + P.mix9)) / 100,
                    uAntN: P.antN, uCyclicN: P.cyc
                }, density.write()); density.swap();
            }

            function strainTick(dt) {
                if (P.drift > 0) {
                    runProgram(programs.strainDrift, { uStrain: T(strain.read(), 0), uVelocity: T(velocity.read(), 1), uDt: dt, uDrift: P.drift, uJitter: Math.random() }, strain.write()); strain.swap();
                }
                runProgram(programs.strainStep, {
                    uStrain: T(strain.read(), 0), uDensity: T(density.read(), 1),
                    uRnd: Math.random() * 1000.0, uAggro: P.aggro, uBurn: P.burn, uSterile: 1.35,
                    uSpawn: P.spawn, 'uMix[0]': { arr: [0, P.mix1, P.mix2, P.mix3, P.mix4, P.mix5, P.mix6, P.mix7, P.mix8, P.mix9] },
                    uWolfram: { int: P.wolf },
                    uLifeB: { int: P.lifeB }, uLifeS: { int: P.lifeS }, uAntRule: { int: P.antRule },
                    uAntN: P.antN, uCyclicN: P.cyc, uGS: [P.gsF, P.gsK]
                }, strain.write()); strain.swap();
            }

            function update() {
                const now = Date.now();
                const baseDt = Math.min((now - lastTime) / 1000, 0.016);
                lastTime = now;
                const dt = baseDt * CONFIG.SIM_SPEED;
                const time = ((now - startTime) / 1000.0) * CONFIG.SIM_SPEED;

                gl.bindVertexArray(quadVAO);
                gl.disable(gl.BLEND);

                if (!P.paused) {
                    for (let sub = 0; sub < P.substeps; sub++) {
                        simStep(dt, time + sub * dt);
                        strainAcc += baseDt * P.hz;
                        let ticks = 0;
                        while (strainAcc >= 1 && ticks < 3) { strainTick(1 / P.hz * CONFIG.SIM_SPEED); strainAcc -= 1; ticks++; }
                        if (strainAcc > 3) strainAcc = 0;
                    }
                }

                updateCamera();
                if (P.view > 0 && P.view < 4) runProgram(programs.atlasView, { uDensity: T(density.read(), 0), uStrain: T(strain.read(), 1), uMode: P.view, uAntN: P.antN, uCyclicN: P.cyc }, null);
                else runProgram(programs.raymarch, {
                    uDensity: T(density.read(), 0), uSpin: T(spinMemory.read(), 1), uStrain: T(strain.read(), 2),
                    uTime: time, uFrame: frame,
                    uCamPos: cam.eye, uCamRight: cam.right, uCamUp: cam.up, uCamFwd: cam.fwd, uScreen: cam.screen,
                    uSteps: P.steps, uWarp: P.warp, uGlow: P.glow, uCrisp: P.crisp, uDens: P.dens, uFlat: P.view >= 4 ? 1 : 0, uDbg: P.dbg,
                    uAntN: P.antN, uCyclicN: P.cyc
                }, null);

                frame++; fpsN++;
                if (now - fpsT > 1000) { fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; $('stat').textContent = fps.toFixed(0) + ' fps · ' + NT + '×' + NY + '×' + K + ' cells · ' + canvas.width + '×' + canvas.height; }
                requestAnimationFrame(update);
            }

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2) * P.scale;
                canvas.width = Math.round(window.innerWidth * dpr);
                canvas.height = Math.round(window.innerHeight * dpr);
            }
            window.addEventListener('resize', resize); resize();

            // Debug probe: march the center ray and an offset ray on the CPU,
            // reading temperatures straight from the density atlas.
            window.__probeRays = function () {
                const fb = density.read();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb.fbo);
                const buf = new Float32Array(ATLAS[0] * ATLAS[1] * 4);
                gl.readPixels(0, 0, ATLAS[0], ATLAS[1], gl.RGBA, gl.FLOAT, buf);
                const fetch = (x, y, k) => {
                    k = Math.max(0, Math.min(K - 1, Math.floor(k)));
                    const tx = k % TILES[0], ty = Math.floor(k / TILES[0]);
                    x = ((Math.floor(x) % NT) + NT) % NT; y = Math.max(0, Math.min(NY - 1, Math.floor(y)));
                    return buf[((ty * NY + y) * ATLAS[0] + tx * TW + 1 + x) * 4];
                };
                const toCell = p2 => {
                    const v = p2[1] / H, th = Math.atan2(p2[2], p2[0]);
                    const rho = Math.hypot(p2[0], p2[2]) / (R0 * profile(Math.max(0, Math.min(1, v))));
                    return [(th / (2 * Math.PI) + 0.5) * NT, v * NY, rho * (K + 0.5)];
                };
                const march = ndcx => {
                    const rd = [0, 1, 2].map(i => cam.fwd[i] + cam.right[i] * ndcx * cam.screen[0] + cam.up[i] * 0.05 * cam.screen[1]);
                    const l = Math.hypot(...rd); rd.forEach((v, i) => rd[i] = v / l);
                    const out = [];
                    for (let t = 3.0; t < 7.0; t += 0.04) {
                        const p2 = [cam.eye[0] + rd[0] * t, cam.eye[1] + rd[1] * t, cam.eye[2] + rd[2] * t];
                        if (p2[1] < 0 || p2[1] > H) continue;
                        const c = toCell(p2);
                        if (c[2] > K + 0.5) continue;
                        const kk = c[2] - 0.5;
                        const k0 = Math.floor(kk);
                        let T;
                        if (k0 < 0) T = fetch(c[0], c[1], 0);
                        else { const f = kk - k0; const a2 = fetch(c[0], c[1], k0); const b2 = k0 + 1 > K - 1 ? 0 : fetch(c[0], c[1], k0 + 1); T = a2 * (1 - f) + b2 * f; }
                        out.push([+t.toFixed(2), +c[2].toFixed(2), +T.toFixed(3)]);
                    }
                    return out;
                };
                return { center: march(0.0005), off: march(0.06) };
            };
            if (Q.get('preset') && PRESETS[Q.get('preset')]) applyPreset(Q.get('preset'), true);
            else if ([1,2,3,4,5,6,7,8,9].some(i => Q.has('mix' + i))) { syncUI(); burst(); }
            else applyPreset('ecosystem', true);
            update();
        })();
    </script>
