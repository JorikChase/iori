            // --- COLOUR SCHEMES ------------------------------------------------
            // Five fire stops + two smoke tones. 'classic fire' is byte-identical
            // to the original hardcoded ramp and stays the default.
            const PALETTES = {
                'classic fire': { pal: [[0.02, 0, 0], [0.8, 0.05, 0], [1, 0.4, 0], [1, 0.9, 0.1], [1, 1, 1]], smoke: [[0.027, 0.027, 0.036], [0.099, 0.095, 0.108]] },
                'blue gas':     { pal: [[0, 0.005, 0.025], [0.02, 0.1, 0.55], [0.1, 0.4, 1], [0.6, 0.85, 1], [1, 1, 1]], smoke: [[0.023, 0.027, 0.041], [0.081, 0.09, 0.117]] },
                'violet plasma':{ pal: [[0.02, 0, 0.03], [0.3, 0.02, 0.5], [0.85, 0.15, 1], [1, 0.65, 1], [1, 1, 1]], smoke: [[0.032, 0.023, 0.041], [0.099, 0.081, 0.117]] },
                'emerald':      { pal: [[0, 0.02, 0.008], [0.02, 0.32, 0.1], [0.2, 0.85, 0.25], [0.75, 1, 0.5], [1, 1, 1]], smoke: [[0.023, 0.032, 0.027], [0.077, 0.099, 0.086]] },
                'toxic':        { pal: [[0.012, 0.02, 0], [0.25, 0.4, 0], [0.72, 0.92, 0.05], [1, 1, 0.4], [1, 1, 1]], smoke: [[0.027, 0.032, 0.018], [0.09, 0.104, 0.068]] },
                'white heat':   { pal: [[0.02, 0.02, 0.025], [0.28, 0.28, 0.33], [0.7, 0.7, 0.76], [0.95, 0.95, 1], [1, 1, 1]], smoke: [[0.023, 0.023, 0.027], [0.072, 0.072, 0.081]] },
                'ember dusk':   { pal: [[0.03, 0, 0.012], [0.5, 0.05, 0.12], [1, 0.25, 0.2], [1, 0.7, 0.35], [1, 1, 0.9]], smoke: [[0.036, 0.023, 0.027], [0.108, 0.081, 0.09]] }
            };
            let PAL = PALETTES['classic fire'];
            const hsv2rgb = (h, sat, v) => { h = ((h % 1) + 1) % 1; return [5, 3, 1].map(n => { const k2 = (h * 6 + n) % 6; return v - v * sat * Math.max(0, Math.min(k2, 4 - k2, 1)); }); };
            // --- COLOUR HARMONY --------------------------------------------
            // Random colours are never lawless: every roll picks ONE base hue
            // and a harmony scheme, and everything - the fire ramp, the shell
            // strata, the strains in complementary batches - is drawn from
            // that scheme's hues. Random, but paired well by construction.
            const SCHEMES = {
                analogous: h => [h, h + 0.06, h - 0.06],
                complementary: h => [h, h + 0.5],
                split: h => [h, h + 0.42, h + 0.58],
                triadic: h => [h, h + 0.333, h + 0.667]
            };
            const HARMONY = { base: 0.05, hues: [0.05], scheme: 'analogous' };

            }
            // A palette from the harmony: dark and mid stops on the base hue,
            // the hot stops leaning toward one partner hue.

                rollHarmony();

                    pal: [hsv2rgb(h, sat, 0.025), hsv2rgb(lean(0.15), sat, 0.5), hsv2rgb(lean(0.35), sat * 0.95, 1.0),

                const hues = HARMONY.hues;
                const order = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);
                const perBatch = hues.map(() => RAMP_NAMES[Math.floor(Math.random() * RAMP_NAMES.length)]);

            // --- SEEDING -------------------------------------------------------

            function seed(id, x, y, k, radius, shells) {

            // --- THE MIX: presets --------------------------------------------

            function syncUI() {
                for (const k in P) { const el = $(k); if (el && el.tagName === 'INPUT') { el.value = P[k]; } }

                $('trailSel').value = P.trail; $('layerSel').value = P.layered; $('fireModeSel').value = P.fireMode;

            }
            // Instant gratification: scatter the current mix over the flame.

            // --- ORBIT CAMERA + PICKING ----------------------------------------

            const TARGET = [0, H * 0.42, 0];
            const MIN_PHI = 0.35, MAX_PHI = 1.75;

            let cam = { eye: [0, 0, 0], right: [1, 0, 0], up: [0, 1, 0], fwd: [0, 0, -1], screen: [1, 1] };

            function updateCamera() {
                theta += (tTheta - theta) * 0.12; phi += (tPhi - phi) * 0.12; radius += (tRadius - radius) * 0.12;
                const eye = [TARGET[0] + radius * Math.sin(phi) * Math.sin(theta), TARGET[1] + radius * Math.cos(phi), TARGET[2] + radius * Math.sin(phi) * Math.cos(theta)];
                let fx = TARGET[0] - eye[0], fy = TARGET[1] - eye[1], fz = TARGET[2] - eye[2];
                const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
                let rx = -fz, rz = fx; const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
                const ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;
                const tanHalf = Math.tan(FOV / 2);
                cam = { eye, right: [rx, 0, rz], up: [ux, uy, uz], fwd: [fx, fy, fz], screen: [tanHalf * (canvas.width / canvas.height), tanHalf] };
            }
            const profile = v => (0.85 + 0.15 * smooth(0, 0.15, v)) * (1 - 0.75 * smooth(0.25, 1, v));
            function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

            // Ray from a screen point, marched until it enters the selected shell.
            function pick(px, py) {
                const ndcx = (px / canvas.clientWidth) * 2 - 1, ndcy = 1 - (py / canvas.clientHeight) * 2;
                const rd = [0, 1, 2].map(i => cam.fwd[i] + cam.right[i] * ndcx * cam.screen[0] + cam.up[i] * ndcy * cam.screen[1]);
                const l = Math.hypot(...rd); rd[0] /= l; rd[1] /= l; rd[2] /= l;
                const ro = cam.eye;
                const rhoSel = (P.shell + 0.5) / (K + 0.5);
                for (let t = 0; t < 14; t += 0.008) {
                    const x = ro[0] + rd[0] * t, y = ro[1] + rd[1] * t, z = ro[2] + rd[2] * t;
                    if (y < 0 || y > H) continue;
                    const v = y / H;
                    const rho = Math.hypot(x, z) / (R0 * profile(v));
                    if (rho <= rhoSel) {
                        const th = Math.atan2(z, x);
                        return { x: (th / (2 * Math.PI) + 0.5) * NT, y: v * NY };

                return null;
            }

            // --- AUTO MODE -----------------------------------------------------
            // Press A: the UI folds away and the flame drives itself. Every
            // exposed parameter random-walks toward slowly re-rolled targets

            // now and then a slot swaps to another catalog system or the
            // palette morphs; the camera circles and breathes; the thermostat
            // keeps the whole thing from whiting out. Nothing jumps - every
            // change is a drift, so the flame is always new and never broken.
            const AUTO = { on: false, params: [], t: 0, nextSwap: 20, nextPal: 45, nextMix: 12, palFrom: null, palTo: null, palT: 1, camDir: 1 };
            const AUTO_SKIP = new Set(['shell', 'brush', 'scale', 'steps', 'trailDecay', 'emitG', 'exposure']);
            function autoRegistry() {
                const list = [];
                for (const el of document.querySelectorAll('input[type=range]')) {
                    const key = el.id;
                    if (!(key in P) || AUTO_SKIP.has(key) || /^mix\d$/.test(key)) continue;
                    const lo = +el.min, hi = +el.max, pad = (hi - lo) * 0.15;
                    list.push({ get: () => P[key], set: v => { P[key] = v; }, min: lo + pad, max: hi - pad, target: P[key], next: 0, span: 0.18 });
                }
                // each slot's own knobs, hue included
                for (let i = 1; i <= 9; i++) {

                    list.push({ get: () => sl.spread, set: v => sl.spread = v, min: 0, max: 1, target: sl.spread, next: 0, span: 0.25, slot: i });
                    for (const key of ['emit', 'aggro', 'burn']) list.push({ get: () => sl[key], set: v => sl[key] = v, min: 0.3, max: 1.8, target: sl[key], next: 0, span: 0.3, slot: i });
                }

            }
            function autoSlotParams() {

                for (let i = 1; i <= 9; i++) {
                    const sl = slots[i], kern = CATALOG[sl.cat][1];
                    for (const [label, idx, min, max, step] of (KPARAMS[kern] || [])) {
                        if (label === 'material') continue;
                        list.push({ get: () => sl.p[idx] ?? min, set: v => sl.p[idx] = step >= 1 ? Math.round(v) : v, min, max, target: sl.p[idx] ?? min, next: 0, span: 0.2, slot: i });

            let autoSlotList = [];
            function toggleAuto() {

            function driftParam(q, dt) {
                if (AUTO.t >= q.next) {

                    q.target = q.wrap ? ((t % 1) + 1) % 1 : Math.min(q.max, Math.max(q.min, t));
                    q.next = AUTO.t + 6 + Math.random() * 30;

                for (const q of autoSlotList) driftParam(q, dt);

                if (AUTO.t >= AUTO.nextMix) {

                    if (total > 75) { const k = 75 / total; for (let i = 1; i <= 9; i++) P['mix' + i] *= k; }
                }
                // a slot swaps to something else from the catalog
                if (AUTO.t >= AUTO.nextSwap) {
                    AUTO.nextSwap = AUTO.t + 30 + Math.random() * 70;
                    const i = 1 + Math.floor(Math.random() * 9);
                    const keep = { ...slots[i] };
                    slots[i] = freshSlot(Math.floor(Math.random() * CATALOG.length));
                    if (Math.random() < 0.5) Object.assign(slots[i], { ramp: keep.ramp, hue: keep.hue, sat: keep.sat, bright: keep.bright, spread: keep.spread });
                    else if (Math.random() < 0.5) randomSlotColor(slots[i]);
                    if (P['mix' + i] < 4) { AUTO.mixTarget = AUTO.mixTarget || {}; AUTO.mixTarget[i] = 8 + Math.random() * 20; }
                    autoSlotList = autoSlotParams();
                    AUTO.params = autoRegistry();
                    burst();
                }
                // colours morph now and then, mostly gently
                if (AUTO.t >= AUTO.nextPal) {
                    AUTO.nextPal = AUTO.t + 45 + Math.random() * 90;
                    const names = Object.keys(PALETTES);
                    AUTO.palFrom = JSON.parse(JSON.stringify(PAL));
                    AUTO.palTo = Math.random() < 0.55 ? randomPalette() : PALETTES[names[Math.floor(Math.random() * names.length)]];

                        AUTO.params.forEach(q => {
                            if (q.slot && q.wrap) {
                                const b = q.slot % hues.length;

                AUTO.hueVel = AUTO.hueVel || [0, 0, 0, 0, 0];

                    const drifted = { pal: [], smoke: src.smoke };
                    for (let i = 0; i < 5; i++) {
                        AUTO.hueVel[i] += (Math.random() - 0.5) * dt * 0.004;
                        AUTO.hueVel[i] *= Math.exp(-dt * 0.15);
                        AUTO.hueWalk[i] += AUTO.hueVel[i] * dt * 10;
                        const [h, sa, v] = rgb2hsv(...AUTO.palBase.pal[i]);
                        drifted.pal.push(hsv2rgb(h + AUTO.hueWalk[i] * (i === 4 ? 0.3 : 1.0), Math.min(1, sa * (1 + 0.15 * Math.sin(AUTO.t * 0.07 + i))), v));
                    }
                    PAL = drifted;
                }
                if (AUTO.palT < 1 && AUTO.palTo) {
                    AUTO.palT = Math.min(1, AUTO.palT + dt / 12);
                    const t = AUTO.palT * AUTO.palT * (3 - 2 * AUTO.palT);
                    PAL = { pal: AUTO.palFrom.pal.map((c, i) => c.map((v, j) => v + (AUTO.palTo.pal[i][j] - v) * t)),
                            smoke: AUTO.palFrom.smoke.map((c, i) => c.map((v, j) => v + (AUTO.palTo.smoke[i][j] - v) * t)) };
                }
                // one strain changes its ramp now and then
                if (Math.random() < dt / 50) {
                    const i = 1 + Math.floor(Math.random() * 9);
                    const target = HARMONY.hues[i % HARMONY.hues.length];
                    slots[i].ramp = nearestRamp(target);
                    slots[i].hue = ((target - RAMP_HUE[slots[i].ramp]) % 1 + 1) % 1;
                }
                // traces come and go
                if (Math.random() < dt / 90) P.trail = Math.random() < 0.5 ? 0 : (Math.random() < 0.7 ? 1 : 2);
                // the camera circles slowly and breathes
                if (Math.random() < dt / 60) AUTO.camDir = -AUTO.camDir;
                tTheta += AUTO.camDir * dt * (0.045 + 0.03 * Math.sin(AUTO.t * 0.1));
                tPhi = 1.15 + 0.35 * Math.sin(AUTO.t * 0.05);
                tRadius = 4.2 + 1.3 * Math.sin(AUTO.t * 0.031 + 1.0);
            }

            // --- MAIN LOOP -----------------------------------------------------

            function windOsc(a) { return (Math.cos(a) * 0.5 + Math.cos(a * 2.7) * 0.3 + Math.cos(a * 5.1) * 0.2) * CONFIG.WIND_STRENGTH; }

            const startTime = Date.now();
            let lastTime = Date.now(), frame = 0, strainAcc = 0;
            let fpsT = Date.now(), fpsN = 0, fps = 0;

            function simStep(dt, time) {
                const windAnim = time * 0.4;
                const wind = [windOsc(windAnim) * P.wind, windOsc(windAnim + 1.7) * P.wind];
                runProgram(programs.buoyancy, { uVelocity: T(velocity.read(), 0), uDensity: T(density.read(), 1), uStrain: T(strain.read(), 2), uBuoyancy: CONFIG.BUOYANCY * P.buoy, uWind: wind, uSwirl: P.swirl, uDt: dt, ...slotUniforms() }, velocity.write()); velocity.swap();
                runProgram(programs.curl, { uVelocity: T(velocity.read(), 0) }, curl);
                runProgram(programs.spinAccum, { uVelocity: T(velocity.read(), 0), uSource: T(spinMemory.read(), 1), uCurl: T(curl, 2), uDt: dt, uDissipation: CONFIG.SPIN_DISSIPATION }, spinMemory.write()); spinMemory.swap();
                runProgram(programs.vorticity, { uVelocity: T(velocity.read(), 0), uCurl: T(curl, 1), uCurlScale: CONFIG.CURL * P.curl, uDt: dt, uTime: time }, velocity.write()); velocity.swap();
                runProgram(programs.divergence, { uVelocity: T(velocity.read(), 0) }, divergence);
                for (let i = 0; i < CONFIG.PRESSURE_ITERATIONS; i++) {
                    runProgram(programs.pressure, { uPressure: T(pressure.read(), 0), uDivergence: T(divergence, 1) }, pressure.write()); pressure.swap();
                }
                runProgram(programs.gradient, { uPressure: T(pressure.read(), 0), uVelocity: T(velocity.read(), 1) }, velocity.write()); velocity.swap();
                runProgram(programs.advectVel, { uVelocity: T(velocity.read(), 0), uDt: dt, uDissipation: CONFIG.VELOCITY_DISSIPATION, uCouple: P.couple * 0.5 }, velocity.write()); velocity.swap();
                runProgram(programs.advectDens, {
                    uVelocity: T(velocity.read(), 0), uSource: T(density.read(), 1), uStrain: T(strain.read(), 2),
                    uDt: dt, uTime: time, uDissipation: CONFIG.DENSITY_DISSIPATION,
                    uCouple: P.couple, uExpand: P.expand, uFuel: GOV.fuelS,
                    // fuel is energy too: a fuller supply burns hotter, but
                    // never so much that turning it down blacks the flame out
                    uEmit: P.emitG * Math.max(0.2, Math.min(1.3, 0.35 + 0.65 * GOV.fuelS / 1.5)), uCool: P.cool, uBandY: P.bandY, uBandW: P.bandW,
                    // 'automata only': no abstract fuel column - just a faint
                    // pilot ring at the root, enough to ignite what spawns there
                    uFireShare: P.fireMode ? Math.max(0, 100 - mixTotal()) / 100 : 0.2,
                    // heat is a source with inertia (~8/s toward the emitter),
                    // smoke has a lifetime of its own
                    uHeatRate: 1 - Math.exp(-dt / CONFIG.SIM_SPEED * 60.0), uSmokeDecay: Math.exp(-dt / CONFIG.SIM_SPEED / Math.max(0.2, P.smokeLife)), uSmokeGain: 0.02,
                    ...slotUniforms()
                }, density.write()); density.swap();
            }

            function strainTick(dt) {
                if (P.drift > 0) {
                    runProgram(programs.strainDrift, { uStrain: T(strain.read(), 0), uVelocity: T(velocity.read(), 1), uDt: dt, uDrift: P.drift, uJitter: Math.random() }, strain.write()); strain.swap();
                }
                runProgram(programs.strainStep, {
                    uStrain: T(strain.read(), 0), uDensity: T(density.read(), 1),
                    uRnd: Math.random() * 1000.0, uAggro: P.aggro, uBurn: P.burn, uSterile: 1.1,
                    uSpawn: P.spawn, 'uMix[0]': { arr: [0, P.mix1, P.mix2, P.mix3, P.mix4, P.mix5, P.mix6, P.mix7, P.mix8, P.mix9] },
                    uCoreSpawn: P.fireMode ? 4.0 : 8.0, uBandY2: P.bandY, uBandW2: P.bandW,
                    // the economy: reserve spent per tick (a lifetime of P.life
                    // seconds away from the root), recharge at the root, and
                    // the governor's birth-rate scaling
                    uSpend: GOV.spendGain / Math.max(1, P.life * P.hz), uRecharge: 1.5 / Math.max(1, P.life * P.hz), uSpawnGain: GOV.spawnGain,
                    ...slotUniforms()
                }, strain.write()); strain.swap();
                stepCount++;
            }

            // Fixed-step simulation: the carrier steps at SIM_HZ regardless of
            // the display rate, so every lifetime, gain and dissipation means
            // the same thing at 40 fps and at 120. The display renders the
            // latest state once per frame.
            const SIM_HZ = 60;
            let simAcc = 0, simTime = 0;
            function update() {
                const now = Date.now();
                const elapsed = Math.min((now - lastTime) / 1000, 0.1);
                lastTime = now;
                simAcc += elapsed;
                let steps = Math.floor(simAcc * SIM_HZ);
                if (steps > 3) { steps = 3; simAcc = 0; } else simAcc -= steps / SIM_HZ;
                if (P.paused) steps = 0;
                const stepDt = 1 / SIM_HZ, dt = stepDt * CONFIG.SIM_SPEED;

                gl.bindVertexArray(quadVAO);
                gl.disable(gl.BLEND);

                if (frame % 12 === 0) senseHeat();
                for (let s = 0; s < steps * P.substeps; s++) {
                    governor(stepDt);
                    if (AUTO.on) autoTick(stepDt);
                    simTime += dt;
                    simStep(dt, simTime);
                    strainAcc += stepDt * P.hz;
                    let ticks = 0;
                    while (strainAcc >= 1 && ticks < 3) { strainTick(1 / P.hz * CONFIG.SIM_SPEED); strainAcc -= 1; ticks++; }
                    if (strainAcc > 3) strainAcc = 0;
                }
                if (steps === 0) governor(elapsed);   // exposure keeps following even when paused
                if (frame % 10 === 0 && !$('ui').classList.contains('hidden')) {
                    $('bThermo').textContent = GOV.active ? 'governor ↓' : 'governor';
                    $('bThermo').style.color = GOV.active ? '#ff8060' : '';
                }

                updateCamera();
                const time = simTime;
                if (P.view > 0 && P.view < 4) runProgram(programs.atlasView, { uDensity: T(density.read(), 0), uStrain: T(strain.read(), 1), uMode: P.view, ...slotUniforms(), ...paletteUniforms() }, null);
                else {
                    // HDR raymarch -> bloom -> exposure + tonemap
                    runProgram(programs.raymarch, {
                        uDensity: T(density.read(), 0), uSpin: T(spinMemory.read(), 1), uStrain: T(strain.read(), 2),
                        uTime: time, uFrame: frame,
                        uCamPos: cam.eye, uCamRight: cam.right, uCamUp: cam.up, uCamFwd: cam.fwd, uScreen: cam.screen,
                        uSteps: P.steps, uWarp: P.warp, uGlow: P.glow, uCrisp: P.crisp, uDens: P.dens, uFlat: P.view >= 4 ? 1 : 0, uDbg: P.dbg, uSmoke: P.smoke, uAbsorb: P.absorb,
                        ...slotUniforms(), ...paletteUniforms()
                    }, hdr);
                    if (frame % 12 === 6) senseLum(hdr);
                    const expo = GOV.expo * P.exposure;
                    runProgram(programs.bright, { uFrame: T(hdr, 0), uExposure: expo, uTexel: [1 / hdr.width, 1 / hdr.height] }, bloomA);
                    runProgram(programs.blur, { uFrame: T(bloomA, 0), uDir: [1.6 / bloomA.width, 0] }, bloomB);
                    runProgram(programs.blur, { uFrame: T(bloomB, 0), uDir: [0, 1.6 / bloomA.height] }, bloomA);
                    runProgram(programs.blur, { uFrame: T(bloomA, 0), uDir: [3.2 / bloomA.width, 0] }, bloomB);
                    runProgram(programs.blur, { uFrame: T(bloomB, 0), uDir: [0, 3.2 / bloomA.height] }, bloomA);
                    runProgram(programs.composite, { uFrame: T(hdr, 0), uBloom: T(bloomA, 1), uExposure: expo, uBloomAmt: P.bloom, uBg: PAL.pal[0] }, null);
                }

                frame++; fpsN++;
                if (now - fpsT > 1000) { fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; $('stat').textContent = fps.toFixed(0) + ' fps · ' + NT + '×' + NY + '×' + K + ' cells · ' + canvas.width + '×' + canvas.height + ' · size ' + (GOV.cov * 100).toFixed(0) + '% / ' + (GOV.target * 100).toFixed(0) + '% · heat ' + HEAT.mean.toFixed(2) + ' · expo ' + GOV.expo.toFixed(2); }
                requestAnimationFrame(update);
            }

            let hdr = null, bloomA = null, bloomB = null;
            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2) * P.scale;
                canvas.width = Math.round(window.innerWidth * dpr);
                canvas.height = Math.round(window.innerHeight * dpr);
                for (const f of [hdr, bloomA, bloomB]) if (f) { gl.deleteFramebuffer(f.fbo); gl.deleteTexture(f.texture); }
                hdr = createFBO(canvas.width, canvas.height);
                const bw = Math.max(1, Math.round(canvas.width / 4)), bh = Math.max(1, Math.round(canvas.height / 4));
                bloomA = createFBO(bw, bh); bloomB = createFBO(bw, bh);
            }
            window.addEventListener('resize', resize); resize();

            // Debug probe: march the center ray and an offset ray on the CPU,
            // reading temperatures straight from the density atlas.
            window.__probeRays = function () {
                const fb = density.read();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb.fbo);
                const buf = new Float32Array(ATLAS[0] * ATLAS[1] * 4);
                gl.readPixels(0, 0, ATLAS[0], ATLAS[1], gl.RGBA, gl.FLOAT, buf);
                const fetch = (x, y, k) => {
                    k = Math.max(0, Math.min(K - 1, Math.floor(k)));
                    const tx = k % TILES[0], ty = Math.floor(k / TILES[0]);
                    x = ((Math.floor(x) % NT) + NT) % NT; y = Math.max(0, Math.min(NY - 1, Math.floor(y)));
                    return buf[((ty * NY + y) * ATLAS[0] + tx * TW + 1 + x) * 4];
                };
                const toCell = p2 => {
                    const v = p2[1] / H, th = Math.atan2(p2[2], p2[0]);
                    const rho = Math.hypot(p2[0], p2[2]) / (R0 * profile(Math.max(0, Math.min(1, v))));
                    return [(th / (2 * Math.PI) + 0.5) * NT, v * NY, rho * (K + 0.5)];
                };
                const march = ndcx => {
                    const rd = [0, 1, 2].map(i => cam.fwd[i] + cam.right[i] * ndcx * cam.screen[0] + cam.up[i] * 0.05 * cam.screen[1]);
                    const l = Math.hypot(...rd); rd.forEach((v, i) => rd[i] = v / l);
                    const out = [];
                    for (let t = 3.0; t < 7.0; t += 0.04) {
                        const p2 = [cam.eye[0] + rd[0] * t, cam.eye[1] + rd[1] * t, cam.eye[2] + rd[2] * t];
                        if (p2[1] < 0 || p2[1] > H) continue;
                        const c = toCell(p2);
                        if (c[2] > K + 0.5) continue;
                        const kk = c[2] - 0.5;
                        const k0 = Math.floor(kk);
                        let T;
                        if (k0 < 0) T = fetch(c[0], c[1], 0);
                        else { const f = kk - k0; const a2 = fetch(c[0], c[1], k0); const b2 = k0 + 1 > K - 1 ? 0 : fetch(c[0], c[1], k0 + 1); T = a2 * (1 - f) + b2 * f; }
                        out.push([+t.toFixed(2), +c[2].toFixed(2), +T.toFixed(3)]);
                    }
                    return out;
                };
                return { center: march(0.0005), off: march(0.06) };
            };
            if (Q.get('preset') && PRESETS[Q.get('preset')]) applyPreset(Q.get('preset'), true);
            else if ([1,2,3,4,5,6,7,8,9].some(i => Q.has('mix' + i))) { syncUI(); burst(); }
            else applyPreset('ecosystem', true);
            window.__P = P; window.__HEAT = HEAT; window.__GOV = GOV; window.__LUM = LUM;
            update();
        })();
    </script>
</body>

</html>
