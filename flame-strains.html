    <script>
        (function () {
            // =================================================================
            // FLAME STRAINS — a living flame engine for 2D automata
            //
            // THE IDEA. Every automaton stays strictly two-dimensional. What
            // makes the fire three-dimensional is not the automaton's storage
            // but the manifold its field is wrapped on: a stack of K concentric
            // shells around the flame axis, each shell a (theta, height) grid
            // that wraps in theta. The carrier — the flame-simulation.html
            // stable-fluids loop — runs on those shells with a weak radial
            // coupling, so it is a thin true-3D fluid at 2D cost. Strains —
            // Life, turmites, cyclic waves, embers, Gray-Scott — are rule
            // functions on ONE shared state texture whose alpha channel is the
            // strain id: one multiplexed step pass switches on the id per cell,
            // so completely different automata coexist, compete for dead
            // ground, and burn in the same fire. The carrier's temperature is an
            // input to every rule (fire kills, sparks, erases) and every rule
            // emits heat back into the carrier (automata are fuel).
            //
            // STORAGE. WebGL2 cannot render into a 3D texture in one pass, so
            // the shells are tiled into one 2D atlas and every pass is a single
            // fullscreen quad. Each tile carries a one-texel pad column on each
            // side: every pass evaluates the pad texel as the wrapped cell, so
            // hardware bilinear filtering across the theta seam is exact with no
            // extra copy pass. Sampling is bilinear in-shell, lerped across
            // shells; strains are fetched exactly (texelFetch), never filtered.
            //
            // DISPLAY. A single-scattering raymarch through the flame's cone.
            // Each sample point is domain-warped by rising noise (hides the
            // shell structure, gives the lick), mapped to (theta, height,
            // shell), and shaded with the archetype's palette, smoke and spin
            // overlay. Strain tints are fetched crisp, so the automata read as
            // sharp cells inside a soft volume. Render resolution is decoupled
            // from cell resolution: that is the sub-pixel volume look.
            //
            // ADDING AN AUTOMATON (per AUTOMATA_CATALOG.md): if its kernel
            // exists — life-like, Generations, elementary, cyclic, turmite,
            // Gray-Scott, ember, forest, crystal — it is ONE line of data in
            // CATALOG below. A new kernel is one rule function plus a branch
            // in the strainLib tables (alive/decay/aggro/emit/init/deadOf)
            // and a tint. The 9 mix slots each bind one catalog entry; the
            // sliders share a 100% fuel budget with the pure flame.
            // =================================================================

            function showError(msg) {
                const errDiv = document.getElementById('error-msg');
                errDiv.style.display = 'block';
                errDiv.innerText = msg;
            }
            window.addEventListener('error', e => showError('Error: ' + e.message));

            const canvas = document.getElementById('c');
            const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
            if (!gl) { showError('WebGL 2.0 is not supported on your device.'); return; }
            if (!gl.getExtension('EXT_color_buffer_float')) { showError('Floating point render targets are not supported on this device.'); return; }

            // --- FIELD LAYOUT --------------------------------------------------
            // NT cells around, NY cells up, K shells. Tiles are (NT+2) wide: one
            // pad column per side so bilinear reads wrap across the theta seam.
            // URL overrides: ?nt=320&ny=256&k=12 (field), any P key (?steps=64&scale=0.7 ...).
            const Q = new URLSearchParams(location.search);
            const qi = (n, d) => { const v = parseInt(Q.get(n)); return isFinite(v) && v > 0 ? v : d; };
            const NT = qi('nt', 320), NY = qi('ny', 256), K = qi('k', 12);
            const TILES = [Math.ceil(Math.sqrt(K)), 0]; TILES[1] = Math.ceil(K / TILES[0]);
            const TW = NT + 2;
            const ATLAS = [TW * TILES[0], NY * TILES[1]];  // 966 x 1024
            const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
            if (ATLAS[0] > maxTex || ATLAS[1] > maxTex) { showError('Atlas ' + ATLAS.join('x') + ' exceeds MAX_TEXTURE_SIZE ' + maxTex); return; }

            // World geometry of the manifold: a cone H tall, R0 wide at its
            // waist, tapering to the tip by profile(). Cell (x, y, k) sits at
            // theta = x / NT * 2pi, height = y / NY * H, radius = R0 * profile * (k + 0.5) / K.
            const H = 2.6, R0 = 0.7;

            // Velocities are cells/second; the 2D flame was 144 cells tall.
            const SCALE = NY / 144.0;
            const CONFIG = {
                DENSITY_DISSIPATION: 0.997,
                VELOCITY_DISSIPATION: 0.992,
                SPIN_DISSIPATION: 0.995,
                PRESSURE_ITERATIONS: 14,
                CURL: 30.0 * SCALE,
                BUOYANCY: 180.0 * SCALE,
                SIM_SPEED: 1.6,
                WIND_STRENGTH: 25.0 * SCALE
            };

            // Live parameters (bound to the sliders below).
            const P = {
                shell: 8, brush: 18, hz: 24, drift: 0.3, aggro: 0.3, glow: 0.9,
                fuel: 1.5, swirl: 0.0, wind: 1.0, couple: 0.06, expand: 0.06, burn: 0.3, cool: 0.05,
                warp: 0.06, dens: 14, crisp: 0.0, steps: 96, scale: 1.0,
                mix1: 0, mix2: 0, mix3: 0, mix4: 0, mix5: 0, mix6: 0, mix7: 0, mix8: 0, mix9: 0, spawn: 1.0,
                trail: 0, trailDecay: 0.9, layered: 0, shellVar: 0, fireMode: 0, buoy: 1.0, curl: 1.0, bandY: 10, bandW: 5.5, emitG: 1.0, exposure: 1.0, smoke: 1.0, thermo: 1,
                // the combustion economy: how much of the field may burn at
                // once, how long a cell lives away from the root, how long
                // smoke lingers; and the render's absorption and bloom
                size: 0.10, life: 8, smokeLife: 2.5, absorb: 0.12, bloom: 0.25, autoExpo: 1,
                strain: 1, paused: false, substeps: 1, view: 0, dbg: 0
            };
            for (const k in P) if (Q.has(k) && typeof P[k] === 'number') { const v = parseFloat(Q.get(k)); if (isFinite(v)) P[k] = v; }

            // --- SHADER BUILDING BLOCKS ----------------------------------------

            const baseVs = `#version 300 es
            in vec2 aPosition; out vec2 vUv;
            void main() { vUv = aPosition * 0.5 + 0.5; gl_Position = vec4(aPosition, 0.0, 1.0); }`;

            // Atlas addressing, shared by every pass.
            const atlasLib = `#version 300 es
            precision highp float; precision highp int; precision highp sampler2D;
            in vec2 vUv; out vec4 outColor;
            uniform float uDt; uniform float uTime;
            const float NT = ${NT}.0, NY = ${NY}.0, K = ${K}.0, TW = ${TW}.0;
            const vec2 TILES = vec2(${TILES[0]}.0, ${TILES[1]}.0);
            const vec2 ATLAS = vec2(${ATLAS[0]}.0, ${ATLAS[1]}.0);
            const float TAU = 6.28318530718;

            // This fragment's cell: x in [0,NT), y in [0,NY), k in [0,K).
            // Pad texels resolve to the wrapped cell, so they are always valid.
            vec3 cellCoord() {
                vec2 f = floor(gl_FragCoord.xy);
                vec2 tile = floor(f / vec2(TW, NY));
                float k = tile.y * TILES.x + tile.x;
                vec2 local = f - tile * vec2(TW, NY);
                float x = mod(local.x - 1.0 + NT, NT);
                return vec3(x, local.y, k);
            }
            // Exact fetch at an integer cell. Wraps x, clamps y and k.
            vec4 fetchCell(sampler2D t, vec3 c) {
                float k = clamp(c.z, 0.0, K - 1.0);
                vec2 tile = vec2(mod(k, TILES.x), floor(k / TILES.x));
                float x = mod(c.x + NT, NT);
                float y = clamp(c.y, 0.0, NY - 1.0);
                return texelFetch(t, ivec2(tile * vec2(TW, NY) + vec2(1.0 + x, y)), 0);
            }
            // Bilinear in-shell sample at fractional cell coords (centers at i + 0.5).
            vec4 sampleSlice(sampler2D t, vec2 p, float k) {
                k = clamp(floor(k), 0.0, K - 1.0);
                vec2 tile = vec2(mod(k, TILES.x), floor(k / TILES.x));
                float x = mod(p.x, NT);
                float y = clamp(p.y, 0.5, NY - 0.5);
                return texture(t, (tile * vec2(TW, NY) + vec2(1.0 + x, y)) / ATLAS);
            }
            // Trilinear: p.z is a continuous shell coordinate, shell centers at k + 0.5.
            // Inside the innermost shell the core value holds; beyond the outermost it fades to zero.
            vec4 sampleVol(sampler2D t, vec3 p) {
                float kk = p.z - 0.5;
                float k0 = floor(kk);
                if (k0 < 0.0) return sampleSlice(t, p.xy, 0.0);
                float f = kk - k0;
                vec4 a = sampleSlice(t, p.xy, k0);
                vec4 b = (k0 + 1.0 > K - 1.0) ? vec4(0.0) : sampleSlice(t, p.xy, k0 + 1.0);
                return mix(a, b, f);
            }
            // Cylinder position of a cell, for noise that must be continuous across the seam.
            vec3 cylPos(vec3 c) {
                float th = (c.x + 0.5) / NT * TAU;
                return vec3(cos(th), (c.y + 0.5) / NY * 2.0, sin(th)) + c.z * 0.13;
            }`;

            const noiseLib = `
            float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
            float noise(vec3 x) {
                vec3 i = floor(x); vec3 f = fract(x); vec3 u = f*f*(3.0-2.0*f);
                return mix(mix(mix( hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)),u.x),
                               mix( hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)),u.x),u.y),
                           mix(mix( hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)),u.x),
                               mix( hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)),u.x),u.y),u.z);
            }
            float fbm3(vec3 p) {
                float v = 0.0; float a = 0.5; vec3 shift = vec3(100.0);
                for (int i = 0; i < 3; ++i) { v += a * (noise(p) * 2.0 - 1.0); p = p * 2.0 + shift; a *= 0.5; }
                return v;
            }
            // Per-cell, per-step random in [0,1).
            float hash13(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }`;

            const paletteLib = `
            vec3 rainbowPalette(float t) {
                vec3 a = vec3(0.5), b = vec3(0.5), c = vec3(1.0), d = vec3(0.00, 0.33, 0.67);
                return a + b * cos(6.28318 * (c * t + d));
            }
            // The fire ramp is data: five stops, uploaded per frame, so whole
            // colour schemes swap live while the default stays the classic fire.
            // Every SHELL of the atlas carries its own copy of the ramp (hue-
            // rotated by the shell variety), so each layer can burn a colour.
            uniform vec3 uPal[5];
            uniform vec3 uPalS[80];      // up to 16 shells x 5 stops
            uniform vec3 uSmokeA, uSmokeB;
            vec3 fireStops(float x, vec3 c0, vec3 c1, vec3 c2, vec3 c3, vec3 c4) {
                x = clamp(x, 0.0, 1.0);
                if (x < 0.1) return mix(c0, c1, x * 10.0);
                if (x < 0.35) return mix(c1, c2, (x - 0.1) * 4.0);
                if (x < 0.7) return mix(c2, c3, (x - 0.35) * 2.85);
                return mix(c3, c4, (x - 0.7) * 3.33);
            }
            vec3 firePalette(float x) { return fireStops(x, uPal[0], uPal[1], uPal[2], uPal[3], uPal[4]); }
            vec3 firePaletteAt(float x, int k) { int b = k * 5; return fireStops(x, uPalS[b], uPalS[b + 1], uPalS[b + 2], uPalS[b + 3], uPalS[b + 4]); }
            vec3 firePaletteK(float x, float kk) {
                float kf = clamp(kk - 0.5, 0.0, K - 1.0);
                int k0 = int(floor(kf));
                return mix(firePaletteAt(x, k0), firePaletteAt(x, min(k0 + 1, int(K) - 1)), fract(kf));
            }
            vec3 hsv(float h, float s, float v) {
                vec3 c = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
                return v * mix(vec3(1.0), c, s);
            }`;

            // --- STRAIN INTERFACE: KERNELS + DATA ------------------------------
            // Following AUTOMATA_CATALOG.md: a handful of kernels, and every
            // named automaton is a parameter set, not code. Each of the 9 mix
            // SLOTS is bound to one catalog entry: uSlotK[slot] names the
            // kernel, uSlotP[slot] carries its parameters, uSlotRamp its colour ramp.
            // The cell's alpha channel stores the SLOT id, so two slots may run
            // the same rule as rival strains.
            //
            // Kernels (state channel semantics per kernel):
            //   1 LIFE     outer-totalistic + Generations ageing (K2).
            //              P = (B mask, S mask, C states). C=2 is plain
            //              life-like; C>2 makes dying-age trails (Brian's
            //              Brain, Star Wars, Lava...). r = 0 dead, 1 alive,
            //              2..C-1 dying; g = generations alive.
            //   2 TURMITE  agent-as-CA (K9). P = (turn mask: bit c set = turn
            //              right on colour c, colour count). r colour, g ant,
            //              b heading.
            //   3 CYCLIC   cyclic CA (Fisch-Gravner-Griffeath). P = (n states,
            //              threshold). r state, g steps-since-advance.
            //   4 EMBER    fuel/heat/grain combustion CA. r fuel, g heat, b grain.
            //   5 GS       Gray-Scott reaction-diffusion (K3+K5). P = (F, k).
            //              r U, g V.
            //   6 WOLFRAM  elementary CA, rows climb with the flame (K1).
            //              P = (8-bit rule). r bit.
            //   7 FOREST   Drossel-Schwabl forest fire. P = (regrow p,
            //              lightning f). r 0 ash / 1 tree / 2 burning.
            //   8 CRYSTAL  frost growth + melt. P = (stick p, melt T). r ice.
            //
            // Every kernel sees: NS(c,dx,dy) in-shell neighbours (same-slot
            // checks via isId), NR(c,dk) radial neighbours, the carrier heat,
            // and a random number. It returns a full state with slot id in .a.
            // Adding a kernel = one branch in each table below + a rule; adding
            // an automaton on an existing kernel = one line of DATA in CATALOG.
            const strainLib = `
            uniform sampler2D uStrain;
            uniform float uBurn;
            uniform float uSlotK[10];
            uniform vec4 uSlotP[10];
            uniform vec3 uSlotRamp[40];  // per-slot colour ramp: 4 stops, slot i at [i*4 .. i*4+3]
            uniform vec4 uSlotMod[10];   // per-slot (emission x, aggression x, flammability x, spectrum spread)
            // A strain's colour at position t (0..1) along its ramp; spread
            // pulls every state toward the ramp's middle when small.
            vec3 rampOf(float id, float t) {
                int b = int(id + 0.5) * 4;
                t = clamp(0.5 + (t - 0.5) * uSlotMod[int(id + 0.5)].w, 0.0, 1.0) * 3.0;
                int i = min(int(floor(t)), 2);
                return mix(uSlotRamp[b + i], uSlotRamp[b + i + 1], t - float(i));
            }

            uniform float uTrail, uTrailDecay, uHasMat, uHasFw, uStep;
            uniform float uLayered, uSlotShell[10];
            int kernelOf(float id) { int i = int(id + 0.5); return (i < 1 || i > 9) ? 0 : int(uSlotK[i] + 0.5); }
            // Ghosts: traces left by movers. Encoded as a NEGATIVE slot id;
            // r = intensity, g = hue (0..15) for fireworks, else unused.
            bool isGhost(vec4 s) { return s.a < -0.5; }
            vec4 ghostOf(float slot, float hue16) { return vec4(1.0, hue16, 0.0, -slot); }
            // Material of a cell for the sand/water partition: 0 free, 1 sand, 2 water, 3 stone, 4 wall.
            int matOf(vec4 s) {
                if (s.a < 0.5) return (isGhost(s) && uTrail > 1.5) ? 4 : 0;
                if (kernelOf(s.a) == 9) return int(s.r + 0.5);
                return 4;
            }
            vec4 paramsOf(float id) { return uSlotP[int(id + 0.5)]; }
            bool isId(vec4 s, float id) { return abs(s.a - id) < 0.5; }
            // Neighbour in-shell: wraps theta, EMPTY beyond top and bottom.
            vec4 NS(vec3 c, float dx, float dy) {
                float y = c.y + dy;
                if (y < 0.0 || y > NY - 1.0) return vec4(0.0);
                return fetchCell(uStrain, vec3(c.x + dx, y, c.z));
            }
            // Radial neighbour: EMPTY beyond the innermost and outermost shell.
            vec4 NR(vec3 c, float dk) {
                float k = c.z + dk;
                if (k < 0.0 || k > K - 1.0) return vec4(0.0);
                return fetchCell(uStrain, vec3(c.xy, k));
            }
            // Is this cell "alive" for its kernel? Dead ground is contested.
            float alive(vec4 s) {
                int k = kernelOf(s.a);
                if (k == 1) return step(0.5, s.r);             // alive or dying
                if (k == 2) return max(s.g, step(0.5, s.r));
                if (k == 3) return step(s.g, 5.5);             // a wave passed recently
                if (k == 4) return step(0.05, s.g);            // burning
                if (k == 5) return step(0.15, s.g);
                if (k == 6) return step(0.5, s.r);
                if (k == 7) return step(0.5, s.r);             // tree or burning
                if (k == 8) return step(0.5, s.r);             // ice
                if (k == 9) return step(0.5, s.r);             // any material
                if (k == 10) return step(0.5, s.r);            // rocket, spark or flash
                return 0.0;
            }
            // Chance per step that a dead cell returns to empty ground (ash).
            float decayOf(vec4 s) {
                int k = kernelOf(s.a);
                if (k == 4) return s.r < 0.05 ? 0.02 : 0.0;    // a fuel bed persists
                if (k == 7) return 0.015;
                if (k == 1) return 0.006;                      // a rule's dead substrate lingers
                if (k == 3 || k == 5 || k == 8) return 0.01;
                if (k == 9 || k == 10) return 1.0;             // movers leave no territory
                return k == 0 ? 0.0 : 0.02;
            }
            // How eagerly each kernel takes dead ground (scaled by aggression).
            float aggroBase(int k);
            float aggroOf(float id) {
                int k = kernelOf(id);
                return k >= 1 ? uSlotMod[int(id + 0.5)].y * aggroBase(k) : 0.0;
            }
            float aggroBase(int k) {
                if (k == 1) return 1.0;
                if (k == 2) return 0.0;    // ants colonise by walking
                if (k == 3) return 0.12;
                if (k == 4) return 0.5;
                if (k == 5) return 0.35;
                if (k == 6) return 0.7;    // rows need width to draw triangles
                if (k == 7) return 0.8;    // the forest reclaims ground
                if (k == 8) return 0.35;
                return 0.0;   // materials and fireworks move; they do not colonise
            }
            // Heat a strain cell pours into the carrier. Automata are fuel.
            float burnRateOf(float id) { return uBurn * uSlotMod[int(id + 0.5)].z; }
            float emitOfRaw(vec4 s, int k, vec4 P) {
                if (k == 1) {
                    if (s.r < 0.5) return 0.0;
                    if (s.r < 1.5) return mix(0.62, 0.42, smoothstep(0.0, 30.0, s.g));
                    return 0.45 * (1.0 - (s.r - 1.0) / max(P.z - 1.0, 1.0));   // Generations trail glows out
                }
                if (k == 2) return s.g > 0.5 ? 0.8 : 0.25 * s.r / max(P.y - 1.0, 1.0);
                if (k == 3) return 0.55 * exp(-s.g * 0.6);
                if (k == 4) return s.g * 0.9;
                if (k == 5) return s.g * 1.2;
                if (k == 6) return s.r > 0.5 ? 0.72 : 0.0;
                if (k == 7) return s.r > 1.5 ? 1.0 : s.r > 0.5 ? 0.05 : 0.0;
                if (k == 8) return s.r > 0.5 ? 0.3 : 0.0;
                if (k == 9) { int m = int(s.r + 0.5); return m == 1 ? 0.12 + s.g * 0.7 : m == 2 ? 0.12 : m == 3 ? 0.2 : 0.0; }
                if (k == 10) { int t = int(s.r + 0.5); return t == 1 ? 0.5 : t == 2 ? 0.9 * clamp(s.g / max(P.y, 1.0), 0.2, 1.0) : t == 3 ? 1.2 : 0.0; }
                return 0.0;
            }
            // THE ECONOMY. Colonisers carry an energy reserve in .b that
            // burning spends; the root recharges it. When it runs out the cell
            // dims to an ember and drops to ASH (slot 0 with .g = ash), which
            // smoulders into smoke and then blows away. Movers, embers and
            // fireworks bound themselves and carry no reserve.
            bool hasEnergy(int k) { return k == 1 || k == 3 || k == 5 || k == 6 || k == 7 || k == 8; }
            float energyOf(vec4 s) { return hasEnergy(kernelOf(s.a)) ? clamp(s.b, 0.0, 1.0) : 1.0; }
            float vigourOf(vec4 s) { return 0.1 + 0.9 * smoothstep(0.0, 0.3, energyOf(s)); }
            bool isAsh(vec4 s) { return s.a > -0.5 && s.a < 0.5 && s.g > 0.001; }
            vec4 ashOf(float amount) { return vec4(0.0, amount, 0.0, 0.0); }
            float emitOf(vec4 s) {
                if (isGhost(s)) return uTrail > 1.5 ? 0.12 : 0.35 * s.r;
                if (s.a < 0.5) return 0.0;
                return emitOfRaw(s, kernelOf(s.a), paramsOf(s.a)) * uSlotMod[int(s.a + 0.5)].x * vigourOf(s);
            }
            // Water quenches the carrier; stone shades it a little.
            float quenchOf(vec4 s) {
                if (kernelOf(s.a) != 9) return 0.0;
                int m = int(s.r + 0.5);
                return m == 2 ? 0.3 : m == 3 ? 0.06 : 0.0;
            }
            // Force a strain cell exerts on the carrier (cells/s^2).
            vec2 forceOf(vec4 s) {
                if (kernelOf(s.a) == 2 && s.g > 0.5) { int d = int(s.b + 0.5); return 60.0 * (d == 0 ? vec2(1, 0) : d == 1 ? vec2(0, 1) : d == 2 ? vec2(-1, 0) : vec2(0, -1)); }
                return vec2(0.0);
            }
            // Fresh state when a slot is seeded (h random, g grain noise).
            vec4 initStrain(float id, float h, float g, bool center) {
                int k = kernelOf(id);
                if (k == 1) return vec4(h < 0.35 ? 1.0 : 0.0, 0.0, 1.0, id);
                if (k == 2) return vec4(0.0, center ? 1.0 : 0.0, floor(h * 4.0), id);
                if (k == 3) return vec4(floor(h * paramsOf(id).x), 0.0, 1.0, id);
                if (k == 4) return vec4(1.0, center ? 1.0 : 0.0, g, id);
                if (k == 5) return vec4(0.5, 0.25 + 0.1 * h, 1.0, id);
                if (k == 6) return vec4(h < 0.25 ? 1.0 : 0.0, 0.0, 1.0, id);
                if (k == 7) return vec4(h < 0.02 ? 2.0 : (h < 0.65 ? 1.0 : 0.0), 0.0, 1.0, id);
                if (k == 8) return vec4((h < 0.1 || center) ? 1.0 : 0.0, 0.0, 1.0, id);
                if (k == 9) { float mt = paramsOf(id).x; return (mt < 1.5 && h > 0.55) ? vec4(0.0) : vec4(mt, 0.0, 0.0, id); }   // sand falls as grains, liquids as blobs
                if (k == 10) return center ? vec4(1.0, 10.0 + h * paramsOf(id).x, floor(g * 15.99) * 8.0 + 2.0, id) : vec4(0.0);   // one rocket, random hue
                return vec4(0.0);
            }
            // Dead ground a strain claims when it colonises a neighbour cell.
            vec4 deadOf(float id, float h) {
                int k = kernelOf(id);
                if (k == 1) return vec4(h < 0.25 ? 1.0 : 0.0, 0.0, 1.0, id);   // spores land alive
                if (k == 3) return vec4(floor(h * paramsOf(id).x), 20.0, 1.0, id);
                if (k == 4) return vec4(0.0, 0.0, h, id);
                if (k == 5) return vec4(1.0, 0.0, 1.0, id);
                if (k == 7) return vec4(h < 0.3 ? 1.0 : 0.0, 0.0, 1.0, id);   // saplings
                return vec4(0.0, 0.0, 1.0, id);
            }`;

            const strainRulesLib = `
            vec2 dirVec(int d) { return d == 0 ? vec2(1.0, 0.0) : d == 1 ? vec2(0.0, 1.0) : d == 2 ? vec2(-1.0, 0.0) : vec2(0.0, -1.0); }
            int turn(int d, int col, int mask) { return (((mask >> col) & 1) == 1) ? (d + 3) & 3 : (d + 1) & 3; }
            bool bitOf(int mask, int i) { return ((mask >> i) & 1) == 1; }

            // 1 LIFE — every life-like AND Generations rule is data: B mask,
            // S mask, C states. Only age-1 cells count as neighbours; with
            // C > 2 a failing cell ages through dying states instead of
            // vanishing, which is where the plasma-trail look comes from.
            vec4 ruleLife(vec4 s, vec3 c, float heat, float rnd) {
                vec4 P = paramsOf(s.a);
                int B = int(P.x + 0.5), S = int(P.y + 0.5); float C = P.z;
                int n = 0;
                for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
                    if (dx == 0 && dy == 0) continue;
                    vec4 t = NS(c, float(dx), float(dy));
                    if (isId(t, s.a) && t.r > 0.5 && t.r < 1.5) n++;
                }
                float st = s.r, age = s.g;
                if (st < 0.5) {                                    // dead
                    st = bitOf(B, n) ? 1.0 : 0.0; age = 0.0;
                    if (st < 0.5 && heat > 0.45 && rnd > 1.0 - 0.015 * heat) st = 1.0;  // sparked by the fire
                } else if (st < 1.5) {                             // alive
                    if (bitOf(S, n)) age = min(age + 1.0, 250.0);
                    else { st = C > 2.5 ? 2.0 : 0.0; age = 0.0; }
                    if (rnd < burnRateOf(s.a) * 0.1 * clamp(heat - 0.6, 0.0, 1.0)) { st = C > 2.5 ? 2.0 : 0.0; age = 0.0; }  // scorched by the plume
                } else {                                           // dying
                    st = st + 1.0 >= C ? 0.0 : st + 1.0;
                }
                return vec4(st, age, s.b, s.a);
            }

            // 2 TURMITE — Langton's ant and friends as a CA: the ant that
            // would step onto this cell is found by asking the neighbours.
            // Returns slot*4 + direction, or -1. Checked for EVERY cell,
            // since an ant may walk into any strain's territory.
            int antArriving(vec3 c) {
                for (int j = 0; j < 4; j++) {
                    vec2 o = dirVec(j);
                    vec4 t = NS(c, o.x, o.y);
                    if (kernelOf(t.a) == 2 && t.g > 0.5) {
                        int nd = turn(int(t.b + 0.5), int(t.r + 0.5), int(paramsOf(t.a).x + 0.5));
                        if (nd == ((j + 2) & 3)) return int(t.a + 0.5) * 4 + nd;
                    }
                }
                return -1;
            }
            vec4 ruleAnt(vec4 s, vec3 c, float heat, float rnd) {
                float col = s.r;
                if (s.g > 0.5) col = mod(col + 1.0, paramsOf(s.a).y);   // ant leaves, cell flips
                if (rnd < burnRateOf(s.a) * 0.12 * clamp(heat - 0.5, 0.0, 1.0)) col = 0.0;   // fire chars the trail away
                return vec4(col, 0.0, 0.0, s.a);
            }

            // 3 CYCLIC — n states in a cycle, advance when >= threshold
            // neighbours (incl. radial) hold the next state. Spirals in 3D.
            vec4 ruleCyclic(vec4 s, vec3 c, float heat, float rnd) {
                vec4 P = paramsOf(s.a);
                float nx = mod(s.r + 1.0, P.x);
                int n = 0;
                for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
                    if (dx == 0 && dy == 0) continue;
                    vec4 t = NS(c, float(dx), float(dy));
                    if (isId(t, s.a) && abs(t.r - nx) < 0.5) n++;
                }
                vec4 ri = NR(c, -1.0), ro = NR(c, 1.0);
                if (isId(ri, s.a) && abs(ri.r - nx) < 0.5) n++;
                if (isId(ro, s.a) && abs(ro.r - nx) < 0.5) n++;
                bool adv = n >= int(P.y + 0.5);
                if (heat > 0.5 && rnd < 0.03 * heat) adv = true;
                if (rnd < burnRateOf(s.a) * 0.1 * clamp(heat - 0.7, 0.0, 1.0)) return vec4(0.0);   // the base burns the waves out
                return vec4(adv ? nx : s.r, adv ? 0.0 : min(s.g + 1.0, 250.0), s.b, s.a);
            }

            // 4 EMBER — fuel/heat/grain combustion, lit by the carrier,
            // regrows when cold (from ember-engine.html).
            vec4 ruleEmber(vec4 s, vec3 c, float heat, float rnd) {
                float fuel = s.r, h = s.g, grain = s.b;
                float sum = 0.0, wsum = 0.0;
                for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
                    if (dx == 0 && dy == 0) continue;
                    float w = (dx != 0 && dy != 0) ? 0.707 : 1.0;
                    vec4 t = NS(c, float(dx), float(dy));
                    sum += (isId(t, s.a) ? t.g : 0.0) * w; wsum += w;
                }
                vec4 ri = NR(c, -1.0), ro = NR(c, 1.0);
                sum += (isId(ri, s.a) ? ri.g : 0.0) * 0.7 + (isId(ro, s.a) ? ro.g : 0.0) * 0.7; wsum += 1.4;
                float dt = 0.075;
                h += (sum / wsum - h) * 0.9 * dt;
                vec4 P = paramsOf(s.a);
                h += clamp(heat - 0.35, 0.0, 1.0) * P.y * dt;
                float ign = 0.12 + grain * 0.15, rate = 0.6 + grain * 0.6;
                if (h > ign && fuel > 0.0) { fuel -= rate * dt; h += rate * 2.2 * dt; }
                h -= (fuel <= 0.0 ? 1.0 : 0.05) * dt;
                if (h < 0.02) fuel += P.x * dt;
                return vec4(clamp(fuel, 0.0, 1.0), clamp(h, 0.0, 1.0), grain, s.a);
            }

            // 5 GS — Gray-Scott. Foreign cells read as (U=1, V=0); the fire
            // evaporates V. Parameter map regimes per Munafo/xmorphia.
            vec4 ruleGS(vec4 s, vec3 c, float heat, float rnd) {
                vec4 P = paramsOf(s.a);
                vec2 lap = vec2(0.0);
                for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
                    if (dx == 0 && dy == 0) continue;
                    float w = (dx != 0 && dy != 0) ? 0.05 : 0.2;
                    vec4 t = NS(c, float(dx), float(dy));
                    lap += (isId(t, s.a) ? t.rg : vec2(1.0, 0.0)) * w;
                }
                lap -= s.rg;
                vec4 ri = NR(c, -1.0), ro = NR(c, 1.0);
                vec2 rad = (isId(ri, s.a) ? ri.rg : s.rg) + (isId(ro, s.a) ? ro.rg : s.rg);
                float uvv = s.r * s.g * s.g;
                float U = s.r + (1.0 * lap.x - uvv + P.x * (1.0 - s.r));
                float V = s.g + (0.5 * lap.y + uvv - (P.x + P.y) * s.g);
                V = mix(V, rad.y * 0.5, 0.04);
                if (heat > 0.7) V -= 0.25 * (heat - 0.7);
                return vec4(clamp(U, 0.0, 1.0), clamp(V, 0.0, 1.0), s.b, s.a);
            }

            // 6 WOLFRAM — elementary CA; each cell reads the row below through
            // the 8-bit rule, so the space-time diagram climbs with the flame.
            vec4 ruleWolfram(vec4 s, vec3 c, float heat, float rnd) {
                int R = int(paramsOf(s.a).x + 0.5);
                vec4 L = NS(c, -1.0, -1.0), C = NS(c, 0.0, -1.0), R2 = NS(c, 1.0, -1.0);
                float bit;
                if (!isId(C, s.a)) bit = rnd < 0.02 ? 1.0 : 0.0;
                else {
                    int idx = (isId(L, s.a) && L.r > 0.5 ? 4 : 0) + (C.r > 0.5 ? 2 : 0) + (isId(R2, s.a) && R2.r > 0.5 ? 1 : 0);
                    bit = bitOf(R, idx) ? 1.0 : 0.0;
                }
                if (rnd < burnRateOf(s.a) * 0.15 * clamp(heat - 0.65, 0.0, 1.0)) bit = 0.0;
                return vec4(bit, 0.0, s.b, s.a);
            }

            // 7 FOREST — Drossel-Schwabl: trees grow, fronts catch from
            // neighbours, the carrier's heat, or lightning.
            vec4 ruleForest(vec4 s, vec3 c, float heat, float rnd) {
                vec4 P = paramsOf(s.a);
                float st = s.r;
                if (st > 1.5) st = 0.0;
                else if (st > 0.5) {
                    bool near = false;
                    for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
                        if (dx == 0 && dy == 0) continue;
                        vec4 t = NS(c, float(dx), float(dy));
                        if (isId(t, s.a) && t.r > 1.5) near = true;
                    }
                    vec4 ri = NR(c, -1.0), ro = NR(c, 1.0);
                    if ((isId(ri, s.a) && ri.r > 1.5) || (isId(ro, s.a) && ro.r > 1.5)) near = true;
                    if (near || (heat > 0.8 && rnd < 0.3) || rnd < P.y) st = 2.0;
                } else if (rnd < P.x * (1.0 - clamp(heat, 0.0, 1.0))) st = 1.0;
                return vec4(st, 0.0, s.b, s.a);
            }

            // 9 MATERIAL — falling sand, water and stone: the catalog's K6
            // scheduler done on a Margolus partition. Every step the grid is
            // tiled into 2x2 blocks (offset alternating with uStep); all four
            // cells of a block read the same four states and compute the same
            // outcome, so each writes its own cell consistently. Evaluated for
            // EVERY cell (empties must receive falling grains).
            bool falls(int m) { return m == 1 || m == 2; }
            vec4 materialMove(vec3 c, vec4 self, float rndUnused) {
                float par = mod(uStep, 2.0);
                vec2 base = floor((c.xy - par) / 2.0) * 2.0 + par;
                int lx = int(c.x - base.x + 0.5), ly = int(c.y - base.y + 0.5);
                int me = lx + ly * 2;                       // 0 BL, 1 BR, 2 TL, 3 TR
                vec4 st[4]; int m[4];
                for (int i = 0; i < 4; i++) {
                    vec2 q = base + vec2(float(i & 1), float(i >> 1));
                    if (q.y < 0.0 || q.y > NY - 1.0) { st[i] = vec4(0.0); m[i] = 4; continue; }
                    st[i] = (i == me) ? self : fetchCell(uStrain, vec3(q, c.z));
                    m[i] = matOf(st[i]);
                }
                float rb = hash13(vec3(base, c.z * 3.1) + vec3(uRnd, 0.0, uRnd * 0.7));
                float spread = paramsOf(st[0].a).y + paramsOf(st[1].a).y + paramsOf(st[2].a).y + paramsOf(st[3].a).y;
                #define SWAP(i, j) { vec4 t4 = st[i]; st[i] = st[j]; st[j] = t4; int ti = m[i]; m[i] = m[j]; m[j] = ti; }
                // gravity in each column; sand sinks through water
                if (falls(m[2]) && (m[0] == 0 || (m[2] == 1 && m[0] == 2))) SWAP(2, 0)
                if (falls(m[3]) && (m[1] == 0 || (m[3] == 1 && m[1] == 2))) SWAP(3, 1)
                // diagonal slide when blocked
                if (rb < 0.5) {
                    if (falls(m[2]) && m[1] == 0) SWAP(2, 1)
                    if (falls(m[3]) && m[0] == 0) SWAP(3, 0)
                } else {
                    if (falls(m[3]) && m[0] == 0) SWAP(3, 0)
                    if (falls(m[2]) && m[1] == 0) SWAP(2, 1)
                }
                // liquids level out sideways
                if (spread > 0.0 && rb < spread * 0.5 + 0.2) {
                    if (m[0] == 2 && m[1] == 0) SWAP(0, 1) else if (m[1] == 2 && m[0] == 0) SWAP(1, 0)
                    if (m[2] == 2 && m[3] == 0) SWAP(2, 3) else if (m[3] == 2 && m[2] == 0) SWAP(3, 2)
                }
                #undef SWAP
                vec4 o = st[me];
                // a grain left this cell: leave a trace if traces are on
                if (matOf(self) >= 1 && matOf(self) <= 3 && m[me] == 0 && uTrail > 0.5) o = ghostOf(self.a, 0.0);
                return o;
            }
            // Per-cell material behaviour after the move: sand heats and glows, water boils off.
            vec4 ruleMaterial(vec4 s, vec3 c, float heat, float rnd) {
                int mt = int(s.r + 0.5);
                if (mt == 1) return vec4(1.0, mix(s.g, clamp(heat, 0.0, 1.0), 0.15), 0.0, s.a);
                if (mt == 2) { if (rnd < paramsOf(s.a).z * clamp(heat - 0.5, 0.0, 1.0)) return vec4(0.0); return s; }
                return s;
            }

            // 10 FIREWORK — rockets climb one cell per step, burst into a ring
            // of sparks that fly out then fall; each rocket carries its own hue.
            // r: 1 rocket, 2 spark, 3 flash · g: life · b: hue16 * 8 + dir (8-way).
            vec2 dir8(int d) { return d == 0 ? vec2(1, 0) : d == 1 ? vec2(1, 1) : d == 2 ? vec2(0, 1) : d == 3 ? vec2(-1, 1) : d == 4 ? vec2(-1, 0) : d == 5 ? vec2(-1, -1) : d == 6 ? vec2(0, -1) : vec2(1, -1); }
            int fallDir(int d) { return (d == 0 || d == 1 || d == 7) ? 7 : (d == 3 || d == 4 || d == 5) ? 5 : 6; }
            // What arrives here from neighbouring rockets, sparks and flashes. a = 0 if nothing.
            vec4 fireworkArriving(vec3 c, float rnd) {
                for (int j = 0; j < 8; j++) {
                    vec2 o = dir8(j);
                    vec4 t = NS(c, o.x, o.y);
                    if (kernelOf(t.a) != 10 || t.r < 0.5) continue;
                    int ty = int(t.r + 0.5); int hb = int(t.b + 0.5); int hue = hb / 8; int d = hb - hue * 8;
                    vec4 P = paramsOf(t.a);
                    if (ty == 3) {                                                   // a flash: I become a spark flying away from it
                        return vec4(2.0, P.y, float(hue * 8 + ((j + 4) & 7)), t.a);
                    }
                    if (ty == 1 && j == 6 && t.g > 1.5) return vec4(1.0, t.g - 1.0, t.b, t.a);   // rocket below, still climbing
                    if (ty == 2 && t.g > 1.5) {
                        int nd = t.g < P.y * 0.55 ? fallDir(d) : d;
                        if (rnd < 0.2) nd = (nd + (rnd < 0.1 ? 1 : 7)) & 7;
                        if ((d + 4) % 8 == j) return vec4(2.0, t.g - 1.0, float(hue * 8 + nd), t.a);   // it was heading here
                    }
                }
                return vec4(0.0);
            }

            // 8 CRYSTAL — frost: grows tip-first where it is cool, melts back
            // wherever the fire reaches it.
            vec4 ruleCrystal(vec4 s, vec3 c, float heat, float rnd) {
                vec4 P = paramsOf(s.a);
                float ice = s.r;
                if (ice > 0.5) {
                    if (rnd < burnRateOf(s.a) * 0.3 * clamp(heat - P.y, 0.0, 1.0)) ice = 0.0;
                } else {
                    int n = 0;
                    for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
                        if (dx == 0 && dy == 0) continue;
                        vec4 t = NS(c, float(dx), float(dy));
                        if (isId(t, s.a) && t.r > 0.5) n++;
                    }
                    if (n >= 1 && n <= 3 && rnd < P.x * (1.0 - clamp(heat, 0.0, 1.0))) ice = 1.0;
                }
                return vec4(ice, min(s.g + 1.0, 250.0), s.b, s.a);
            }`;

            // --- SIMULATION PASSES (the archetype's 2D scheme, per shell) --------

            const buoyancyFs = `${atlasLib}${strainLib}
            uniform sampler2D uVelocity; uniform sampler2D uDensity; uniform float uBuoyancy; uniform vec2 uWind; uniform float uSwirl;
            void main() {
                vec3 c = cellCoord();
                vec2 vel = fetchCell(uVelocity, c).xy;
                vec4 dens = fetchCell(uDensity, c);
                float T = dens.r;
                float hot = smoothstep(0.05, 0.4, T);
                // Hot fire rises quickly. Cooler gas loses lift and drifts;
                // smoke keeps a lazy lift of its own so it leaves through the tip.
                vel.y += T * mix(uBuoyancy * 0.05, uBuoyancy, hot) * uDt;
                vel.y += dens.g * uBuoyancy * 0.15 * uDt;
                // World wind, projected onto this shell's tangent at theta.
                float th = (c.x + 0.5) / NT * TAU;
                float tangential = dot(uWind, vec2(-sin(th), cos(th)));
                vel.x += T * tangential * uDt * mix(1.5, 1.0, hot);
                vel.x += T * uSwirl * 120.0 * uDt;
                vel += forceOf(fetchCell(uStrain, c)) * uDt;
                outColor = vec4(vel, 0.0, 1.0);
            }`;

            const curlFs = `${atlasLib}
            uniform sampler2D uVelocity;
            void main() {
                vec3 c = cellCoord();
                float L = fetchCell(uVelocity, c + vec3(-1, 0, 0)).y, R = fetchCell(uVelocity, c + vec3(1, 0, 0)).y;
                float T = fetchCell(uVelocity, c + vec3(0, 1, 0)).x, B = fetchCell(uVelocity, c + vec3(0, -1, 0)).x;
                outColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
            }`;

            const spinAccumFs = `${atlasLib}
            uniform sampler2D uVelocity; uniform sampler2D uSource; uniform sampler2D uCurl; uniform float uDissipation;
            void main() {
                vec3 c = cellCoord();
                vec2 past = c.xy + 0.5 - uDt * fetchCell(uVelocity, c).xy;
                float pastSpin = sampleSlice(uSource, past, c.z).x;
                float mask = step(0.0, past.y) * step(past.y, NY);
                float curlPower = smoothstep(20.0, 60.0, abs(fetchCell(uCurl, c).x)) * 1.2;
                outColor = vec4(pastSpin * uDissipation * mask + curlPower, 0.0, 0.0, 1.0);
            }`;

            const vorticityFs = `${atlasLib}${noiseLib}
            uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float uCurlScale;
            void main() {
                vec3 c = cellCoord();
                float L = fetchCell(uCurl, c + vec3(-1, 0, 0)).x, R = fetchCell(uCurl, c + vec3(1, 0, 0)).x;
                float T = fetchCell(uCurl, c + vec3(0, 1, 0)).x, B = fetchCell(uCurl, c + vec3(0, -1, 0)).x, C = fetchCell(uCurl, c).x;
                vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
                force /= length(force) + 0.0001;
                vec3 nc = cylPos(c) * 5.0 + vec3(0.0, 0.0, uTime * 0.4);
                vec2 micro = vec2(fbm3(nc), fbm3(nc + vec3(100.0, -100.0, 50.0)));
                force += micro * 2.0;
                force *= uCurlScale * C;
                force.y *= -1.0;
                outColor = vec4(fetchCell(uVelocity, c).xy + force * uDt, 0.0, 1.0);
            }`;

            const divergenceFs = `${atlasLib}
            uniform sampler2D uVelocity;
            void main() {
                vec3 c = cellCoord();
                float L = fetchCell(uVelocity, c + vec3(-1, 0, 0)).x, R = fetchCell(uVelocity, c + vec3(1, 0, 0)).x;
                float T = fetchCell(uVelocity, c + vec3(0, 1, 0)).y, B = fetchCell(uVelocity, c + vec3(0, -1, 0)).y;
                outColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
            }`;

            const pressureFs = `${atlasLib}
            uniform sampler2D uPressure; uniform sampler2D uDivergence;
            void main() {
                vec3 c = cellCoord();
                float L = fetchCell(uPressure, c + vec3(-1, 0, 0)).x, R = fetchCell(uPressure, c + vec3(1, 0, 0)).x;
                float T = fetchCell(uPressure, c + vec3(0, 1, 0)).x, B = fetchCell(uPressure, c + vec3(0, -1, 0)).x;
                outColor = vec4((L + R + T + B - fetchCell(uDivergence, c).x) * 0.25, 0.0, 0.0, 1.0);
            }`;

            const gradientFs = `${atlasLib}
            uniform sampler2D uPressure; uniform sampler2D uVelocity;
            void main() {
                vec3 c = cellCoord();
                float L = fetchCell(uPressure, c + vec3(-1, 0, 0)).x, R = fetchCell(uPressure, c + vec3(1, 0, 0)).x;
                float T = fetchCell(uPressure, c + vec3(0, 1, 0)).x, B = fetchCell(uPressure, c + vec3(0, -1, 0)).x;
                vec2 vel = fetchCell(uVelocity, c).xy - vec2(R - L, T - B) * 0.5;
                outColor = vec4(vel, 0.0, 1.0);
            }`;

            // Velocity advection with a weak radial coupling, so vortices correlate across shells.
            const advectVelFs = `${atlasLib}
            uniform sampler2D uVelocity; uniform float uDissipation; uniform float uCouple;
            void main() {
                vec3 c = cellCoord();
                vec2 past = c.xy + 0.5 - uDt * fetchCell(uVelocity, c).xy;
                float mask = step(0.0, past.y) * step(past.y, NY);
                vec2 vel = sampleSlice(uVelocity, past, c.z).xy * uDissipation * mask;
                vec2 vin = c.z > 0.5 ? fetchCell(uVelocity, c + vec3(0, 0, -1)).xy : vel;
                vec2 vout = c.z < K - 1.5 ? fetchCell(uVelocity, c + vec3(0, 0, 1)).xy : vel;
                vel = mix(vel, 0.5 * (vin + vout), uCouple);
                outColor = vec4(vel, 0.0, 1.0);
            }`;

            // Temperature + smoke advection, radial coupling, fuel source, strain emission.
            // Density atlas: .r = heat T, .g = smoke.
            const advectDensFs = `${atlasLib}${noiseLib}${strainLib}
            uniform sampler2D uVelocity; uniform sampler2D uSource; uniform float uDissipation;
            uniform float uCouple, uExpand, uFuel, uEmit, uCool, uFireShare, uBandY, uBandW;
            uniform float uHeatRate, uSmokeDecay, uSmokeGain;
            void main() {
                vec3 c = cellCoord();
                vec2 past = c.xy + 0.5 - uDt * fetchCell(uVelocity, c).xy;
                float mask = step(0.0, past.y) * step(past.y, NY);
                // Outer shells and the tip entrain cold air: cooling grows with radius and height.
                float shellFrac = (c.z + 0.5) / K;
                float diss = uDissipation - uCool * shellFrac * shellFrac - 0.05 * smoothstep(0.55, 1.0, (c.y + 0.5) / NY);
                vec4 src = sampleSlice(uSource, past, c.z);
                float T = src.r * diss * mask;
                float Sm = src.g * uSmokeDecay * mask;
                // A touch of in-plane thermal diffusion: the flame softens and
                // warmth reaches the cells beside it, not only downstream.
                vec4 n4 = (fetchCell(uSource, c + vec3(1, 0, 0)) + fetchCell(uSource, c + vec3(-1, 0, 0))
                         + fetchCell(uSource, c + vec3(0, 1, 0)) + fetchCell(uSource, c + vec3(0, -1, 0))) * 0.25;
                T = mix(T, n4.r * diss, 0.12);
                Sm = mix(Sm, n4.g * uSmokeDecay, 0.12);
                // Radial: diffuse across shells, and let hot inner gas push outward.
                vec4 sin_ = c.z > 0.5 ? sampleSlice(uSource, past, c.z - 1.0) : vec4(T, Sm, 0.0, 0.0);
                vec4 sout = c.z < K - 1.5 ? sampleSlice(uSource, past, c.z + 1.0) : vec4(0.0);
                T = mix(T, 0.5 * (sin_.r + sout.r), uCouple);
                T += uExpand * max(sin_.r - T, 0.0) * 0.5;
                Sm = mix(Sm, 0.5 * (sin_.g + sout.g), uCouple);
                // Constant fuel at the root: a flickering ring on the inner shells.
                vec3 np = cylPos(c);
                float flick = 0.55 + 0.45 * (fbm3(vec3(np.x, np.z, uTime * 1.4) * 2.5 + c.z * 0.3) * 0.5 + 0.5);
                float radial = 1.0 - smoothstep(0.0, K * 0.4, c.z + 0.5);
                float band = exp(-pow((c.y + 0.5 - uBandY) / uBandW, 2.0));
                // The mix is a budget: the automata sliders take their share of
                // the base fuel and the pure flame keeps the remainder.
                T = max(T, uFuel * uFireShare * radial * band * flick);
                // Automata are fuel: a live cell heats its voxel toward its own
                // emission temperature at a finite rate - a source with inertia,
                // not a floor - so cooling can win once the cell is gone.
                vec4 S = fetchCell(uStrain, c);
                float E = emitOf(S) * uEmit;
                if (E > T) T += (E - T) * uHeatRate;
                float q = quenchOf(S);
                T *= 1.0 - q;   // water puts it out
                // Smoke: ash smoulders, water steams.
                float ash = isAsh(S) ? S.g : 0.0;
                Sm += uSmokeGain * (ash + 0.6 * q * T);
                outColor = vec4(min(T, 2.5), min(Sm, 1.0), 0.0, 1.0);
            }`;

            // --- STRAIN PASSES -------------------------------------------------

            // Carry the strain field with the flame. Discrete states cannot be
            // interpolated, so the displacement is rounded stochastically
            // (one jitter per step): the average motion is exact, patterns
            // shear and tear where the flow does — that is the fire at work.
            const strainDriftFs = `${atlasLib}${strainLib}
            uniform sampler2D uVelocity; uniform float uDrift, uJitter;
            void main() {
                vec3 c = cellCoord();
                vec4 here = fetchCell(uStrain, c);
                int kh = kernelOf(here.a);
                // Things with their own motion - falling materials, flying
                // fireworks - are never carried by the flow, or gravity loses.
                if (kh == 9 || kh == 10) { outColor = here; return; }
                vec2 disp = fetchCell(uVelocity, c).xy * uDt * uDrift;
                vec2 src = c.xy - floor(disp + uJitter);
                if (src.y < 0.0 || src.y > NY - 1.0) { outColor = vec4(0.0); return; }
                vec4 from = fetchCell(uStrain, vec3(src, c.z));
                int kf = kernelOf(from.a);
                outColor = (kf == 9 || kf == 10) ? here : from;
            }`;

            // One multiplexed step for every strain on the field.
            const strainStepFs = `${atlasLib}${noiseLib}
            uniform float uRnd;
            ${strainLib}${strainRulesLib}
            uniform sampler2D uDensity; uniform float uAggro, uSterile, uSpawn;
            uniform float uMix[10];
            uniform float uCoreSpawn, uBandY2, uBandW2;
            uniform float uSpend, uRecharge, uSpawnGain;
            void main() {
                vec3 c = cellCoord();
                vec4 s = fetchCell(uStrain, c);
                float heat = fetchCell(uDensity, c).r;
                float rnd = hash13(c + vec3(uRnd, uRnd * 1.7, uRnd * 0.3));
                float rnd2 = hash13(c.zxy + vec3(uRnd * 2.3, 7.1, uRnd));

                // Ash smoulders away; the density pass turns it into smoke.
                if (isAsh(s)) { s.g *= 0.9; if (s.g < 0.02) s = vec4(0.0); }
                vec4 was = s;

                // Traces fade (or stay, in solid mode) - they are not rules.
                if (isGhost(s)) {
                    if (uTrail > 1.5) { outColor = s; return; }
                    vec4 g = s; g.r *= uTrailDecay;
                    outColor = g.r < 0.02 ? vec4(0.0) : g;
                    // a mover may still land on a fading trace - fall through with s = ghost
                    if (uHasFw < 0.5 && uHasMat < 0.5) return;
                    s = outColor;
                }
                // Materials move first: the partition decides what sits here now.
                if (uHasMat > 0.5) s = materialMove(c, s, rnd);
                int kern = kernelOf(s.a);

                vec4 o = s;
                if (kern == 9) o = ruleMaterial(s, c, heat, rnd);
                else if (kern == 10) {
                    // a rocket at the end of its climb bursts; everything else in flight
                    // either arrives somewhere else or leaves a trace here
                    int ty = int(s.r + 0.5);
                    if (ty == 1 && s.g <= 1.5) o = vec4(3.0, 2.0, s.b, s.a);
                    else if (ty == 3 && s.g > 1.5) o = vec4(3.0, s.g - 1.0, s.b, s.a);
                    else o = uTrail > 0.5 && ty != 3 ? ghostOf(s.a, floor(s.b / 8.0)) : vec4(0.0);
                }
                if (uHasFw > 0.5) {
                    vec4 arr2 = fireworkArriving(c, rnd);
                    if (arr2.a > 0.5 && (kern != 10 || o.r < 0.5 || o.r > 2.5)) o = arr2;
                }
                if (kern == 1) o = ruleLife(s, c, heat, rnd);
                else if (kern == 2) o = ruleAnt(s, c, heat, rnd);
                else if (kern == 3) o = ruleCyclic(s, c, heat, rnd);
                else if (kern == 4) o = ruleEmber(s, c, heat, rnd);
                else if (kern == 5) o = ruleGS(s, c, heat, rnd);
                else if (kern == 6) o = ruleWolfram(s, c, heat, rnd);
                else if (kern == 7) o = ruleForest(s, c, heat, rnd);
                else if (kern == 8) o = ruleCrystal(s, c, heat, rnd);

                // An ant walking in claims the cell, whatever lived here —
                // unless the fire takes the walker first: past ~1.0 heat the
                // ant burns, flaring into a briefly burning ember cell.
                int arr = antArriving(c);
                if (arr >= 0) {
                    float antSlot = float(arr / 4);
                    if (rnd2 < burnRateOf(antSlot) * 0.3 * clamp(heat - 0.95, 0.0, 1.0)) o = vec4(0.6, 0.0, 0.0, o.a);   // the walker burns
                    else o = vec4(kern == 2 ? o.r : 0.0, 1.0, float(arr - (arr / 4) * 4), antSlot);
                }

                // Dead ground is contested, but only where the fire makes it habitable:
                // a living neighbour of another strain may take it. Elsewhere it turns to ash.
                if (alive(o) < 0.5 && !isGhost(o)) {
                    if (rnd2 < uAggro && heat > 0.01 && heat < 0.95) {
                        for (int j = 0; j < 4; j++) {
                            vec2 d = dirVec(j);
                            vec4 t = NS(c, d.x, d.y);
                            if (t.a > 0.5 && !isId(t, o.a) && alive(t) > 0.5 && rnd < aggroOf(t.a)) {
                                o = deadOf(t.a, rnd2);
                                if (hasEnergy(kernelOf(t.a))) o.b = t.b * 0.9;   // a colony spreads its reserve thin
                                break;
                            }
                        }
                    } else if (rnd < decayOf(o)) o = vec4(0.0);
                }
                // The fire's core sterilises everything.
                if (rnd2 < 0.15 * clamp(heat - uSterile, 0.0, 1.0)) o = vec4(0.0);

                // THE ECONOMY. Burning spends the reserve, faster where it is
                // hot; the root band feeds it back. A cell that runs dry drops
                // to ash. This is what bounds the flame: what the flow carries
                // up is consumed, what stays at the root endures.
                int ko = kernelOf(o.a);
                if (hasEnergy(ko) && o.a > 0.5 && alive(o) > 0.5) {
                    float yy = (c.y + 0.5) / NY;
                    float root = 1.0 - smoothstep(0.1, 0.3, yy);
                    // the rim is cold air: cells carried outward burn out faster,
                    // so the flame thins toward its edge instead of filling the cone
                    float rim = smoothstep(0.5, 0.9, (c.z + 0.5) / K);
                    o.b = clamp(o.b - uSpend * (0.5 + 0.5 * clamp(heat, 0.0, 1.0)) * (1.0 + 3.0 * rim) + uRecharge * root, 0.0, 1.0);
                    if (o.b <= 0.0) o = ashOf(0.8);
                }
                // Anything ALIVE that died this step leaves ash (substrate
                // fading to empty ground does not; movers just move).
                if (was.a > 0.5 && alive(was) > 0.5 && o.a < 0.5 && !isGhost(o) && !isAsh(o)) {
                    int kw = kernelOf(was.a);
                    bool moved = kw == 9 || (kw == 10 && was.r < 2.5);
                    if (!moved) o = ashOf(0.6);
                }

                // THE MIX. The base fuel births strains: empty ground at the
                // flame's root spawns each automaton in proportion to its
                // slider. Spawning is decided per 5x5 block, so every newborn
                // is a viable nucleus, and the flow carries it up into the fire.
                // The governor scales the birth rate by how far the flame is
                // below its size target, and nothing is born on the rim shells.
                if (o.a < 0.5 && !isGhost(o) && heat < uSterile && uSpawnGain > 0.0 && c.z + 0.5 < K - 2.0) {
                    float total = 0.0;
                    for (int i = 1; i < 10; i++) total += uMix[i];
                    if (total > 0.0) {
                        vec2 bc = floor(c.xy / 5.0);
                        vec3 bkey = vec3(bc, c.z * 7.77);
                        float rnd3 = hash13(bkey + vec3(3.7, uRnd * 1.3, uRnd));
                        // The centre is the injector: where the pure-fire jet
                        // used to sit, automata are born far more densely, so
                        // the core column burns like the old fuel jet did.
                        float coreW = 1.0 + uCoreSpawn
                            * (1.0 - smoothstep(0.0, K * 0.45, c.z + 0.5))
                            * exp(-pow((c.y + 0.5 - uBandY2) / (uBandW2 * 1.8), 2.0));
                        if (rnd3 < total * 0.00001 * uSpawn * uSpawnGain * coreW) {
                            float pickv = hash13(bkey.yxz + vec3(uRnd * 0.7, 11.3, uRnd * 2.9)) * total;
                            float id = 9.0, acc = 0.0;
                            for (int i = 1; i < 10; i++) { acc += uMix[i]; if (pickv < acc) { id = float(i); break; } }
                            float yy = (c.y + 0.5) / NY;
                            bool zone = kernelOf(id) == 9 ? (yy > 0.45 && yy < 0.85 && heat > 0.02)   // materials rain from the flame
                                                          : (yy < 0.28 && heat > 0.05);              // everything else is born at the root
                            // layered mode: every automaton keeps to its own shell
                            if (uLayered > 0.5 && abs(c.z - uSlotShell[int(id + 0.5)]) > 0.6) zone = false;
                            if (zone) {
                                float h = hash13(c.xzy + vec3(5.1, uRnd, 1.9));
                                float g = fbm3(cylPos(c) * 6.0 + uRnd) * 0.5 + 0.5;
                                bool center = mod(c.x, 5.0) == 2.0 && mod(c.y, 5.0) == 2.0;
                                o = initStrain(id, h, g, center);
                            }
                        }
                    }
                }
                outColor = o;
            }`;

            // Seed a blob of one strain around a cell, on the chosen shells.
            const strainSeedFs = `${atlasLib}${noiseLib}${strainLib}
            uniform vec3 uSeedCell; uniform float uSeedRadius, uSeedId, uSeedShells, uSeedRnd;
            void main() {
                vec3 c = cellCoord();
                vec4 cur = fetchCell(uStrain, c);
                float dx = mod(c.x - uSeedCell.x + NT * 1.5, NT) - NT * 0.5;
                float dy = c.y - uSeedCell.y;
                float d = length(vec2(dx, dy));
                bool inK = abs(c.z - uSeedCell.z) <= uSeedShells + 0.01;
                if (d < uSeedRadius && inK) {
                    float h = hash13(c + vec3(uSeedRnd * 3.1, uSeedRnd, 0.7));
                    float g = fbm3(cylPos(c) * 6.0 + uSeedRnd) * 0.5 + 0.5;
                    bool center = d < 0.71 && abs(c.z - uSeedCell.z) < 0.5;
                    outColor = initStrain(uSeedId, h, g, center);
                } else outColor = cur;
            }`;

            // --- DISPLAY: VOLUMETRIC RAYMARCH ----------------------------------

            const raymarchFs = `${atlasLib}${noiseLib}${paletteLib}${strainLib}
            uniform sampler2D uDensity; uniform sampler2D uSpin;
            uniform vec3 uCamPos, uCamRight, uCamUp, uCamFwd; uniform vec2 uScreen;
            uniform float uSteps, uWarp, uGlow, uCrisp, uDens, uFrame, uFlat, uDbg, uSmoke, uAbsorb;
            const float H = ${H}, R0 = ${R0};

            float profile(float v) { return mix(0.85, 1.0, smoothstep(0.0, 0.15, v)) * (1.0 - 0.75 * smoothstep(0.25, 1.0, v)); }
            // World -> (x cells, y cells, continuous shell coordinate; shell centers at k + 0.5).
            vec3 toCell(vec3 p) {
                float v = p.y / H;
                float th = atan(p.z, p.x);
                float rho = length(p.xz) / (R0 * profile(clamp(v, 0.0, 1.0)));
                return vec3((th / TAU + 0.5) * NT, v * NY, rho * (K + 0.5));
            }

            // Every strain is drawn through its own colour ramp: each kernel
            // maps what matters about a cell (age, state, temperature,
            // concentration, life) to a position along the ramp.
            vec3 tintOf(vec4 s) {
                int k = kernelOf(s.a);
                vec4 P = paramsOf(s.a);
                if (k == 1) {
                    if (s.r < 0.5) return vec3(0.0);
                    if (s.r < 1.5) return rampOf(s.a, mix(0.95, 0.55, smoothstep(0.0, 40.0, s.g))) * mix(1.6, 0.9, smoothstep(0.0, 40.0, s.g));
                    float f = 1.0 - (s.r - 1.0) / max(P.z - 1.0, 1.0);          // Generations trail
                    return rampOf(s.a, f * 0.75) * f * 1.2;
                }
                if (k == 2) return s.g > 0.5 ? mix(rampOf(s.a, 0.95), vec3(1.0), 0.4) * 2.4 : (s.r > 0.5 ? rampOf(s.a, 0.2 + 0.75 * s.r / max(P.y - 1.0, 1.0)) * 0.9 : vec3(0.0));
                if (k == 3) return rampOf(s.a, s.r / P.x) * 0.8;
                if (k == 4) return rampOf(s.a, s.g) * s.g * 0.9;
                if (k == 5) return rampOf(s.a, clamp(s.g * 1.6, 0.0, 1.0)) * s.g * 1.6;
                if (k == 6) return s.r > 0.5 ? rampOf(s.a, 0.8) * 1.4 : vec3(0.0);
                if (k == 7) return s.r > 1.5 ? rampOf(s.a, 0.95) * 2.2 : (s.r > 0.5 ? rampOf(s.a, 0.2) * 0.55 : vec3(0.0));
                if (k == 8) return s.r > 0.5 ? rampOf(s.a, 0.55 + 0.4 * sin(s.g * 0.4 + uTime * 2.0)) * 1.6 : vec3(0.0);
                if (k == 9) { int m = int(s.r + 0.5); return m == 1 ? rampOf(s.a, 0.15 + 0.8 * s.g) * (0.6 + 1.4 * s.g) : m == 2 ? rampOf(s.a, 0.6) * 1.6 : m == 3 ? rampOf(s.a, 0.35) * 1.2 : vec3(0.0); }
                if (k == 10) {
                    int t = int(s.r + 0.5);
                    float h16 = floor(s.b / 8.0) / 16.0;                            // each rocket sits somewhere on the ramp
                    return t == 1 ? rampOf(s.a, 0.9) * 2.0 : t == 2 ? rampOf(s.a, h16) * 2.6 * clamp(s.g / max(P.y, 1.0), 0.15, 1.0) : t == 3 ? mix(rampOf(s.a, h16), vec3(1.0), 0.5) * 3.0 : vec3(0.0);
                }
                return vec3(0.0);
            }
            vec3 ghostTint(vec4 s) {
                float slot = -s.a;
                float t = kernelOf(slot) == 10 ? s.g / 16.0 : 0.6;
                return rampOf(slot, t) * 1.3 * (uTrail > 1.5 ? 0.6 : s.r);
            }
            // Strains are read crisp in theta/height, blended across the two nearest shells.
            vec3 strainTint(vec3 cell) {
                vec2 xy = floor(cell.xy);
                float kk = cell.z - 0.5; float k0 = floor(kk); float f = kk - k0;
                vec4 sa = fetchCell(uStrain, vec3(xy, max(k0, 0.0)));
                vec3 a = isGhost(sa) ? ghostTint(sa) : tintOf(sa);
                if (k0 < 0.0) return a;
                if (k0 + 1.0 > K - 1.0) return mix(a, vec3(0.0), f);
                vec4 sb = fetchCell(uStrain, vec3(xy, k0 + 1.0));
                vec3 b = isGhost(sb) ? ghostTint(sb) : tintOf(sb);
                return mix(a, b, f);
            }

            // Palettes and ramps are authored as display colours; the volume
            // integrates light, so they are linearised here and the composite
            // pass encodes the result back. Hue is linearised, magnitude kept.
            vec3 toLin(vec3 c) { c = max(c, vec3(0.0)); float m = max(c.r, max(c.g, c.b)); return m > 0.0001 ? pow(c / m, vec3(2.2)) * m : vec3(0.0); }

            // THE LOOK. Fire is light, not paint: every sample EMITS through
            // its palette and absorbs only a little, so structures behind
            // structures stay visible and a full volume sums to brightness,
            // never to grey. Smoke is the one thing that absorbs. Returns
            // emitted radiance density (rgb) and extinction (a).
            vec4 shade(float T, float Sm, vec3 cell, vec3 p) {
                float body = smoothstep(0.04, 0.55, T);
                vec3 fire = toLin(firePaletteK(smoothstep(0.08, 1.0, T), cell.z));
                // the gas itself glows faintly; only a truly hot core is bright.
                // The strains are the light, so the automata read against the gas.
                float hotCore = smoothstep(0.5, 1.3, T);
                vec3 E = fire * (0.15 + 1.2 * smoothstep(0.1, 0.8, T) + 1.8 * hotCore * hotCore);
                float spin = uDbg == 1.0 ? 0.0 : sampleVol(uSpin, cell).r;
                float magic = smoothstep(4.0, 12.0, spin);
                if (magic > 0.0) {
                    float palT = uTime * 0.5 + p.x * 3.0 + p.y * 3.0 - spin * 0.1;
                    float tempMask = smoothstep(0.01, 0.2, T) * (1.0 - smoothstep(0.4, 0.9, T));
                    E += toLin(rainbowPalette(palT)) * magic * 0.12 * tempMask;
                }
                // Strains are emitters in their OWN colour: where a strain
                // lives its ramp replaces the fire's hue and adds light of its
                // own, so it reads as lit from within. Glow scales that light.
                float pres = 0.0;
                if (uGlow > 0.0 && uDbg != 3.0) {
                    vec3 st = strainTint(cell);
                    float m = max(st.r, max(st.g, st.b));
                    pres = smoothstep(0.02, 0.25, m) * smoothstep(0.02, 0.12, T);
                    vec3 Es = toLin(st) * (0.4 + 0.9 * smoothstep(0.04, 0.7, T)) * uGlow;
                    E = mix(E, Es, pres * 0.75) + Es * pres * 0.3;
                }
                // emission density, weighted by the volume a cell stands for:
                // the innermost shells are a sliver of the cone, not a column
                float sigE = uDens * body * min(1.0, (cell.z + 0.5) / 2.0);
                // extinction: the gas barely, smoke a lot, and a strain cell is
                // matter - it hides what is behind it, which is what gives depth
                float sigA = uDens * (uAbsorb * body + 0.2 * uSmoke * Sm + 2.5 * pres);
                float smokeNoise = noise(p * 5.0 + vec3(0.0, -uTime * 0.7, 0.0));
                vec3 smokeCol = toLin(mix(uSmokeA, uSmokeB, smokeNoise));
                if (uDbg == 2.0) smokeCol = vec3(1.0, 0.0, 1.0) * 0.3;
                // smoke is lit by the fire around it: dim and grey when cold, warm where it is hot
                vec3 lit = smokeCol * 0.12 + fire * 0.6 * smoothstep(0.1, 0.6, T);
                vec3 Erad = (E * sigE + lit * uDens * 0.2 * uSmoke * Sm) * 4.0;
                return vec4(Erad, sigA);
            }

            // Fetch + fade + shade at one cell position.
            vec4 shadePoint(vec3 cell, vec3 p) {
                // Fade at both ends of the axis and at the rim: the tip
                // dissolves, the root rounds off, and the outer shells never
                // show the container's silhouette.
                float v = p.y / H;
                float fade = (1.0 - smoothstep(0.78, 1.0, v)) * smoothstep(0.0, 0.02, v) * (1.0 - smoothstep(K - 3.5, K - 0.3, cell.z));
                vec4 d = sampleVol(uDensity, cell);
                float T = d.r * fade, Sm = d.g * fade;
                if (T < 0.01 && Sm < 0.01) return vec4(0.0);
                if (uFlat > 0.5) return vec4(vec3(T) * uDens * smoothstep(0.01, 0.6, T), uDens * 0.2 * smoothstep(0.01, 0.6, T));
                return shade(T, Sm, cell, p);
            }

            void main() {
                vec2 ndc = vUv * 2.0 - 1.0;
                vec3 rd = normalize(uCamFwd + uCamRight * ndc.x * uScreen.x + uCamUp * ndc.y * uScreen.y);
                vec3 ro = uCamPos;
                vec3 bg = uPal[0];

                // No ground plane: the flame floats in the dark.
                vec3 floorCol = bg;

                vec3 boxMin = vec3(-R0, 0.0, -R0), boxMax = vec3(R0, H, R0);
                vec3 invd = 1.0 / rd;
                vec3 t1 = (boxMin - ro) * invd, t2 = (boxMax - ro) * invd;
                vec3 lo = min(t1, t2), hi = max(t1, t2);
                float tNear = max(max(lo.x, lo.y), lo.z), tFar = min(min(hi.x, hi.y), hi.z);
                if (tNear > tFar || tFar < 0.0) { outColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
                tNear = max(tNear, 0.0);

                float n = uSteps;
                float ds = (tFar - tNear) / n;
                float jitter = fract(52.9829189 * fract(0.06711056 * gl_FragCoord.x + 0.00583715 * gl_FragCoord.y) + uFrame * 0.618034);
                float t = tNear + ds * jitter;

                // Emission-absorption integral in linear HDR; the composite
                // pass exposes, blooms and tonemaps it.
                vec3 L = vec3(0.0); float Tr = 1.0;
                for (int i = 0; i < 256; i++) {
                    if (float(i) >= n) break;
                    vec3 p = ro + rd * t; t += ds;
                    if (p.y < 0.0 || p.y > H) continue;
                    vec3 cell = toCell(p);
                    if (cell.z > K + 1.5) continue;
                    // Rising domain warp: hides the shells, gives the lick.
                    if (uWarp > 0.0) {
                        vec3 q = p * 2.4 + vec3(0.0, -uTime * 1.1, 0.0);
                        vec2 w = vec2(noise(q) - 0.5, noise(q + vec3(31.7, 0.0, 12.3)) - 0.5) * 2.0;
                        p.xz += w * uWarp * (0.35 + p.y / H);
                        cell = toCell(p);
                        if (cell.z > K) continue;
                    }
                    if (uCrisp > 0.0) cell = mix(cell, floor(cell) + 0.5, uCrisp);
                    // Near the axis a ray degenerates to two theta values of
                    // the ring, so its integral loses the ring's variety and a
                    // coherent smoke column can shadow the core. Blend those
                    // samples toward the shaded 4-point ring average - at the
                    // manifold's centre the ring genuinely fuses into one.
                    float w = 1.0 - smoothstep(0.03, 0.12, length(p.xz));
                    vec4 s = shadePoint(cell, p);
                    if (w > 0.003) {
                        vec4 m = s;
                        for (int j = 1; j < 4; j++) m += shadePoint(vec3(cell.x + float(j) * NT * 0.25, cell.y, cell.z), p);
                        s = mix(s, m * 0.25, w);
                    }
                    L += Tr * s.rgb * ds;
                    Tr *= exp(-s.a * ds);
                    if (Tr < 0.01) break;
                }
                // radiance in rgb, transmittance in alpha: the background is
                // composited after the tonemap so it stays the colour it was authored
                outColor = vec4(L, Tr);
            }`;

            // --- POST: bloom, exposure, tonemap --------------------------------
            const postLib = `#version 300 es
            precision highp float; in vec2 vUv; out vec4 outColor;
            uniform sampler2D uFrame;
            float lumOf(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }`;
            // Bright pass at quarter resolution: what sits above the shoulder blooms.
            const brightFs = `${postLib}
            uniform float uExposure; uniform vec2 uTexel;
            void main() {
                vec3 c = (texture(uFrame, vUv + uTexel * vec2(-1.0, -1.0)).rgb + texture(uFrame, vUv + uTexel * vec2(1.0, -1.0)).rgb
                        + texture(uFrame, vUv + uTexel * vec2(-1.0, 1.0)).rgb + texture(uFrame, vUv + uTexel * vec2(1.0, 1.0)).rgb) * 0.25 * uExposure;
                c = clamp(c, vec3(0.0), vec3(64.0));   // never let a stray NaN/Inf poison the blur
                if (any(isnan(c))) c = vec3(0.0);
                float l = lumOf(c);
                outColor = vec4(c * smoothstep(1.0, 3.0, l), 1.0);
            }`;
            const blurFs = `${postLib}
            uniform vec2 uDir;
            void main() {
                float w[5] = float[5](0.227027, 0.1945946, 0.1216216, 0.054054, 0.016216);
                vec3 c = texture(uFrame, vUv).rgb * w[0];
                for (int i = 1; i < 5; i++) { c += texture(uFrame, vUv + uDir * float(i)).rgb * w[i]; c += texture(uFrame, vUv - uDir * float(i)).rgb * w[i]; }
                outColor = vec4(c, 1.0);
            }`;
            const compositeFs = `${postLib}
            uniform sampler2D uBloom; uniform float uExposure, uBloomAmt; uniform vec3 uBg;
            vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
            void main() {
                vec4 f = texture(uFrame, vUv);
                vec3 c = f.rgb * uExposure + texture(uBloom, vUv).rgb * uBloomAmt;
                c = pow(aces(c), vec3(1.0 / 2.2));
                outColor = vec4(c + uBg * f.a, 1.0);
            }`;

            // Heat probe: a 32x32 target where every texel samples four random
            // cells, read back every few frames to sense how hot the field runs.
            // (mean T, hot fraction, warm fraction, live-strain fraction)
            const probeFs = `${atlasLib}${noiseLib}${strainLib}
            uniform sampler2D uDensity; uniform float uRnd;
            void main() {
                float meanT = 0.0, hot = 0.0, warm = 0.0, live = 0.0;
                for (int i = 0; i < 4; i++) {
                    vec2 uv = vec2(hash13(vec3(gl_FragCoord.xy, float(i) * 3.1 + uRnd)), hash13(vec3(gl_FragCoord.yx, float(i) * 7.7 + uRnd * 1.3)));
                    float Tv = texture(uDensity, uv).r;

            float h13(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }

            uniform sampler2D uDensity; uniform float uMode;
            const float H = ${H}, R0 = ${R0};
            float profile(float v) { return mix(0.85, 1.0, smoothstep(0.0, 0.15, v)) * (1.0 - 0.75 * smoothstep(0.25, 1.0, v)); }
            vec3 toCell(vec3 p) {
                float v = p.y / H;
                float th = atan(p.z, p.x);
                float rho = length(p.xz) / (R0 * profile(clamp(v, 0.0, 1.0)));
                return vec3((th / TAU + 0.5) * NT, v * NY, rho * (K + 0.5));
            }
            void main() {
                vec2 uv = vUv;
                if (uMode > 2.5) {

                        : k == 9 ? (s.r < 1.5 ? rampOf(s.a, 0.15 + 0.8 * s.g) : s.r < 2.5 ? rampOf(s.a, 0.6) : rampOf(s.a, 0.35))

            function createProgram(vs, fs, name) {

            const divergence = createFBO(ATLAS[0], ATLAS[1]);
            const probeFBO = createFBO(32, 32);
            const probeBuf = new Float32Array(32 * 32 * 4);
            // Field statistics, refreshed by the probe: mean heat, hot and warm

            const HEAT = { mean: 0, hot: 0, warm: 0, live: 0 };
            function senseHeat() {
                runProgram(programs.probe, { uDensity: T(density.read(), 0), uStrain: T(strain.read(), 1), uRnd: Math.random() * 100, ...slotUniforms() }, probeFBO);
                gl.readPixels(0, 0, 32, 32, gl.RGBA, gl.FLOAT, probeBuf);
                let m = 0, h = 0, w = 0, l = 0;
                for (let i = 0; i < 1024; i++) { m += probeBuf[i * 4]; h += probeBuf[i * 4 + 1]; w += probeBuf[i * 4 + 2]; l += probeBuf[i * 4 + 3]; }

            // Births taper as it approaches the target; above it, burning
            // speeds up. Fuel is the user's target for size and energy and is
            // followed smoothly, so nothing pops. Exposure: the brightest few
            // percent of the frame are held at the tonemap's shoulder.
            const GOV = { fuelS: 1.5, target: 0, cov: 0, spawnGain: 1, spendGain: 1, active: false, expoLog: 0, expo: 1 };
            const THERMO = GOV;
            function governor(dt) {
                GOV.fuelS += (P.fuel - GOV.fuelS) * (1 - Math.exp(-dt / 1.2));

                    const sg = Math.max(0, 1 - ratio * ratio);

            // Kernels that have a natural ramp; everything else gets the ramp whose hot stop is nearest the catalog hue.
            const KRAMP = { 4: 'ember', 7: 'forest', 8: 'ice', 9: 'gold', 10: 'rainbow' };
            const NAME_RAMP = { 'Water': 'ocean', 'Oil': 'gold', 'Stone': 'mono', 'Fountain': 'neon', 'Skyrockets': 'sunset', 'Falling Sand': 'gold', 'Cyclic 14': 'rainbow', 'Rock Paper Scissors': 'rainbow', 'Droplets': 'rainbow', 'Turbulence': 'rainbow' };
            const KSPREAD = { 2: 1.0, 3: 1.0, 10: 1.0 };

            function freshSlot(ci) {

                return { cat: ci, p: e[2].slice(), ramp, hue: 0, sat: 1, bright: 1, spread: KSPREAD[e[1]] ?? 0.5, emit: 1, aggro: 1, burn: 1 };

            // Roll a strain a new look: a ramp, a hue shift (usually small, so

            const KPARAMS = {

                7: [['regrow', 0, 0.001, 0.05, 0.001], ['lightning', 1, 0, 0.001, 0.00002]],
                8: [['stick', 0, 0.05, 0.8, 0.01], ['melt at', 1, 0.3, 1.2, 0.01]],

            let openEditor = 0, stepCount = 0;

            function buildSlotEditor(i) {

                const mk = (label, get, set, min, max, step, fmt) => {

                mk('saturation', () => sl.sat, v => { sl.sat = v; syncSwatch(i); }, 0, 2, 0.02, v => (+v).toFixed(2));
                mk('brightness', () => sl.bright, v => { sl.bright = v; syncSwatch(i); }, 0.2, 2.5, 0.05, v => (+v).toFixed(2));
                mk('spectrum', () => sl.spread, v => sl.spread = v, 0, 1, 0.01, v => (+v).toFixed(2));

            }
            const toHex = rgb => '#' + rgb.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0')).join('');
