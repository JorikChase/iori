<!DOCTYPE html>
<html>

<head>
    <!-- Dynamic SEO & Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GKKJ5VX340"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ERECDMYSNT"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        if (window.location.hostname.includes('3die.fr')) {
            gtag('config', 'G-ERECDMYSNT');
        } else {
            gtag('config', 'G-GKKJ5VX340');
        }

        // Dynamic Canonical
        (function () {
            let canon = document.querySelector("link[rel='canonical']") || document.createElement('link');
            canon.rel = 'canonical';
            canon.href = window.location.origin + window.location.pathname;
            if (!document.head.contains(canon)) document.head.appendChild(canon);
        })();

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Fire Simulator</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050000;
            width: 100%;
            height: 100%;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(255, 200, 100, 0.7);
            pointer-events: none;
            text-shadow: 0px 2px 10px rgba(255, 100, 0, 0.5);
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <script>
        (function () {
            const canvas = document.getElementById('c');
            const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
            if (!gl) return;

            const CONFIG = {
                SIM_RES: 256, DYE_RES: 1024, DENSITY_DISSIPATION: 0.99, VELOCITY_DISSIPATION: 0.995,
                PRESSURE_ITERATIONS: 20, CURL: 30.0, SPLAT_RADIUS: 0.008, SPLAT_FORCE: 200.0,
                BUOYANCY: 180.0,
                SIM_SPEED: 1.6
            };
            gl.getExtension('EXT_color_buffer_float');
            gl.getExtension('OES_texture_float_linear');

            const baseVs = `#version 300 es
            in vec2 aPosition; out vec2 vUv;
            void main() { vUv = aPosition * 0.5 + 0.5; gl_Position = vec4(aPosition, 0.0, 1.0); }`;

            const commonFs = `#version 300 es
            precision highp float; precision highp sampler2D; in vec2 vUv; out vec4 outColor; uniform vec2 uTexelSize; uniform float uDt;`;

            const buoyancyFs = `${commonFs}
            uniform sampler2D uVelocity; uniform sampler2D uDensity; uniform float uBuoyancy;
            void main() { vec2 vel = texture(uVelocity, vUv).xy; float T = texture(uDensity, vUv).r; vel.y += T * uBuoyancy * uDt; outColor = vec4(vel, 0.0, 1.0); }`;

            const curlFs = `${commonFs}
            uniform sampler2D uVelocity;
            void main() {
                float L = texture(uVelocity, vUv - vec2(uTexelSize.x, 0.0)).y; float R = texture(uVelocity, vUv + vec2(uTexelSize.x, 0.0)).y;
                float T = texture(uVelocity, vUv + vec2(0.0, uTexelSize.y)).x; float B = texture(uVelocity, vUv - vec2(0.0, uTexelSize.y)).x;
                outColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0); }`;

            const vorticityFs = `${commonFs}
            uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float uCurlScale; uniform float uTime;
            
            // 3D Hash and Noise to prevent any directional panning biases
            float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
            float noise(vec3 x) {
                vec3 i = floor(x); vec3 f = fract(x); vec3 u = f*f*(3.0-2.0*f);
                return mix(mix(mix( hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)),u.x),
                               mix( hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)),u.x),u.y),
                           mix(mix( hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)),u.x),
                               mix( hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)),u.x),u.y),u.z);
            }
            
            // Zero-Mean fBm patched to avoid sub-Nyquist spatial aliasing
            float fbm(vec3 p) {
                float v = 0.0; float a = 0.5; vec3 shift = vec3(100.0);
                for (int i = 0; i < 3; ++i) { // Reduced to 3 octaves to prevent aliasing
                    v += a * (noise(p) * 2.0 - 1.0);
                    p = p * 2.0 + shift; 
                    a *= 0.5;
                }
                return v;
            }

            void main() {
                float L = texture(uCurl, vUv - vec2(uTexelSize.x, 0.0)).x; float R = texture(uCurl, vUv + vec2(uTexelSize.x, 0.0)).x;
                float T = texture(uCurl, vUv + vec2(0.0, uTexelSize.y)).x; float B = texture(uCurl, vUv - vec2(0.0, uTexelSize.y)).x; float C = texture(uCurl, vUv).x;
                vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L)); 
                force /= length(force) + 0.0001; 
                
                // Map coordinates to a lower-frequency 3D space to stay within grid resolution bounds
                vec3 noiseCoord = vec3(vUv * 15.0, uTime * 0.4); // Lowered scalar from 45.0 to 15.0
                
                vec2 microForce = vec2(
                    fbm(noiseCoord),
                    fbm(noiseCoord + vec3(100.0, -100.0, 50.0))
                );
                
                // Inject the intricate details into the macroscopic curl
                force += microForce * 2.0; 
                
                force *= uCurlScale * C; 
                force.y *= -1.0;
                outColor = vec4(texture(uVelocity, vUv).xy + force * uDt, 0.0, 1.0); }`;

            const advectFs = `${commonFs}
            uniform sampler2D uVelocity; uniform sampler2D uSource; uniform float uDissipation;
            void main() { 
                vec2 coord = vUv - uDt * texture(uVelocity, vUv).xy * uTexelSize;
                vec4 result = texture(uSource, coord);
                float mask = step(0.0, coord.x) * step(coord.x, 1.0) * step(0.0, coord.y) * step(coord.y, 1.0);
                outColor = result * uDissipation * mask; 
            }`;

            const divergenceFs = `${commonFs}
            uniform sampler2D uVelocity;
            void main() {
                float L = texture(uVelocity, vUv - vec2(uTexelSize.x, 0.0)).x; float R = texture(uVelocity, vUv + vec2(uTexelSize.x, 0.0)).x;
                float T = texture(uVelocity, vUv + vec2(0.0, uTexelSize.y)).y; float B = texture(uVelocity, vUv - vec2(0.0, uTexelSize.y)).y;
                outColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0); }`;

            const pressureFs = `${commonFs}
            uniform sampler2D uPressure; uniform sampler2D uDivergence;
            void main() {
                float L = texture(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x; float R = texture(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
                float T = texture(uPressure, vUv + vec2(0.0, uTexelSize.y)).x; float B = texture(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
                outColor = vec4((L + R + T + B - texture(uDivergence, vUv).x) * 0.25, 0.0, 0.0, 1.0); }`;

            const gradientFs = `${commonFs}
            uniform sampler2D uPressure; uniform sampler2D uVelocity;
            void main() {
                float L = texture(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x; float R = texture(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
                float T = texture(uPressure, vUv + vec2(0.0, uTexelSize.y)).x; float B = texture(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
                vec2 velocity = texture(uVelocity, vUv).xy; velocity.xy -= vec2(R - L, T - B) * 0.5; outColor = vec4(velocity, 0.0, 1.0); }`;

            const splatFs = `${commonFs}
        uniform sampler2D uTarget; uniform float uAspectRatio; uniform vec2 uPoint; uniform vec3 uColor; uniform float uRadius; uniform float uTime;
        
        // 3D Hash and Noise to allow animation on the Z-axis (Depth)
        float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
        float noise(vec3 x) {
            vec3 i = floor(x); vec3 f = fract(x); vec3 u = f*f*(3.0-2.0*f);
            return mix(mix(mix( hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)),u.x),
                           mix( hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)),u.x),u.y),
                       mix(mix( hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)),u.x),
                           mix( hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)),u.x),u.y),u.z);
        }
        
        // 3D Recursive Fractional Brownian Motion (fBm) patched for zero-mean
        float fbm(vec3 p) {
            float v = 0.0; float a = 0.5; vec3 shift = vec3(100.0);
            for (int i = 0; i < 4; ++i) {
                v += a * (noise(p) * 2.0 - 1.0); // FIXED: Forces average back to 0.0
                p = p * 2.0 + shift; a *= 0.5;
            }
            return v;
        }
        
        void main() {
            vec2 p = vUv - uPoint.xy; 
            p.x *= uAspectRatio;
            
            vec3 noiseCoord = vec3(p * 8.0, uTime * 0.8);
            
            // Use 3D FBM for highly detailed warp
            float warpX = fbm(noiseCoord) * 2.0 - 1.0;
            float warpY = fbm(noiseCoord + vec3(100.0, -100.0, 50.0)) * 2.0 - 1.0; 
            
            vec2 warpedP = p + vec2(warpX, warpY) * 0.035; 
            
            float shape = exp(-dot(warpedP, warpedP) / uRadius);
            
            // And use 3D FBM for the inner texture, also slowed down
            float nTexture = fbm(noiseCoord * 2.0 + vec3(0.0, 0.0, uTime * 0.5));
            shape *= 0.6 + 0.4 * nTexture; 
            
            outColor = vec4(max(texture(uTarget, vUv).xyz, shape * uColor), 1.0); 
        }`;

            const displayFs = `${commonFs}
        uniform sampler2D uTexture;
            vec3 firePalette(float x) {
                x = clamp(x, 0.0, 1.0);
                vec3 c1 = vec3(0.02, 0.0, 0.0); vec3 c2 = vec3(0.8, 0.05, 0.0); vec3 c3 = vec3(1.0, 0.4, 0.0); vec3 c4 = vec3(1.0, 0.9, 0.1); vec3 c5 = vec3(1.0, 1.0, 1.0);
                if (x < 0.1) return mix(c1, c2, x * 10.0);
                if (x < 0.35) return mix(c2, c3, (x - 0.1) * 4.0);
                if (x < 0.7) return mix(c3, c4, (x - 0.35) * 2.85);
                return mix(c4, c5, (x - 0.7) * 3.33); }
            void main() {
                float temperature = texture(uTexture, vUv).r;
                vec3 finalColor = firePalette(smoothstep(0.0, 1.0, temperature));
                float R = texture(uTexture, vUv + vec2(uTexelSize.x, 0.0)).r; float T = texture(uTexture, vUv + vec2(0.0, uTexelSize.y)).r;
                finalColor += max(0.0, temperature - (R + T)*0.5) * 0.5 * vec3(1.0, 0.8, 0.4);
                if (temperature < 0.01) finalColor = vec3(0.0); outColor = vec4(finalColor, 1.0); }`;

            function createProgram(fs) {
                const program = gl.createProgram();
                const vsShader = gl.createShader(gl.VERTEX_SHADER); const fsShader = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(vsShader, baseVs); gl.shaderSource(fsShader, fs);
                gl.compileShader(vsShader); gl.compileShader(fsShader);
                gl.attachShader(program, vsShader); gl.attachShader(program, fsShader); gl.linkProgram(program);
                return {
                    id: program, uni: Object.fromEntries(['uTexelSize', 'uDt', 'uVelocity', 'uSource', 'uPressure', 'uDivergence', 'uCurl', 'uCurlScale', 'uDissipation', 'uTarget', 'uAspectRatio', 'uPoint', 'uColor', 'uRadius', 'uTexture', 'uDensity', 'uBuoyancy', 'uTime']
                        .map(n => [n, gl.getUniformLocation(program, n)]))
                };
            }

            function createFBO(w, h, type = gl.HALF_FLOAT) {
                gl.activeTexture(gl.TEXTURE0); const texture = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, type, null);
                const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                gl.viewport(0, 0, w, h); gl.clear(gl.COLOR_BUFFER_BIT);
                return { fbo, texture, width: w, height: h, attach: (id) => { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id; } };
            }

            function createDoubleFBO(w, h, type) { let fbo1 = createFBO(w, h, type), fbo2 = createFBO(w, h, type); return { read: () => fbo1, write: () => fbo2, swap: () => { let t = fbo1; fbo1 = fbo2; fbo2 = t; } }; }

            const programs = { buoyancy: createProgram(buoyancyFs), curl: createProgram(curlFs), vorticity: createProgram(vorticityFs), advect: createProgram(advectFs), divergence: createProgram(divergenceFs), pressure: createProgram(pressureFs), gradient: createProgram(gradientFs), splat: createProgram(splatFs), display: createProgram(displayFs) };

            const blit = (() => {
                gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
                gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(0);
                return (destFBO) => {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, destFBO ? destFBO.fbo : null); gl.viewport(0, 0, destFBO ? destFBO.width : canvas.width, destFBO ? destFBO.height : canvas.height); gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
                };
            })();

            let velocity, density, pressure, divergence, curl;
            function initFBOs() {
                const w = canvas.width, h = canvas.height, simW = CONFIG.SIM_RES, simH = Math.floor(simW * h / w), dyeW = CONFIG.DYE_RES, dyeH = Math.floor(dyeW * h / w);
                velocity = createDoubleFBO(simW, simH); density = createDoubleFBO(dyeW, dyeH); pressure = createDoubleFBO(simW, simH); divergence = createFBO(simW, simH); curl = createFBO(simW, simH);
            }

            function runProgram(p, uniforms, outputFBO) {
                gl.useProgram(p.id);
                for (let k in uniforms) { if (p.uni[k]) { if (uniforms[k].attach) gl.uniform1i(p.uni[k], uniforms[k].attach(uniforms[k].unit)); else if (uniforms[k].length === 2) gl.uniform2fv(p.uni[k], uniforms[k]); else if (uniforms[k].length === 3) gl.uniform3fv(p.uni[k], uniforms[k]); else gl.uniform1f(p.uni[k], uniforms[k]); } }
                blit(outputFBO);
            }

            let startTime = Date.now();

            function applySplat(x, y, dx, dy, colorIntensity, rMult = 1.0, timeOverride) {
                runProgram(programs.splat, { uTarget: { ...velocity.read(), unit: 0 }, uAspectRatio: velocity.read().width / velocity.read().height, uPoint: [x, y], uColor: [dx * CONFIG.SPLAT_FORCE, dy * CONFIG.SPLAT_FORCE, 0.0], uRadius: CONFIG.SPLAT_RADIUS * rMult, uTime: timeOverride }, velocity.write()); velocity.swap();
                runProgram(programs.splat, { uTarget: { ...density.read(), unit: 0 }, uAspectRatio: density.read().width / density.read().height, uPoint: [x, y], uColor: [colorIntensity, 0.0, 0.0], uRadius: CONFIG.SPLAT_RADIUS * rMult, uTime: timeOverride }, density.write()); density.swap();
            }

            let lastTime = Date.now(), pointers = [];
            function update() {
                // Calculate real delta time, then scale it by our new SIM_SPEED multiplier
                let baseDt = Math.min((Date.now() - lastTime) / 1000, 0.016);
                lastTime = Date.now();
                let dt = baseDt * CONFIG.SIM_SPEED;

                // Scale the absolute time as well so shader noise boils faster proportionately
                let time = ((Date.now() - startTime) / 1000.0) * CONFIG.SIM_SPEED;

                if (pointers.length > 0) pointers.forEach(p => {
                    let cDx = Math.max(-100.0, Math.min(100.0, p.dx));
                    let cDy = Math.max(-100.0, Math.min(100.0, p.dy));

                    applySplat(p.x / canvas.width, 1.0 - p.y / canvas.height, cDx / canvas.width, -cDy / canvas.height + 0.01, 2.5, 1.0, time);
                    p.dx = 0;
                    p.dy = 0;
                });

                runProgram(programs.buoyancy, { uVelocity: { ...velocity.read(), unit: 0 }, uDensity: { ...density.read(), unit: 1 }, uBuoyancy: CONFIG.BUOYANCY, uDt: dt }, velocity.write()); velocity.swap();
                runProgram(programs.curl, { uTexelSize: [1.0 / velocity.read().width, 1.0 / velocity.read().height], uVelocity: { ...velocity.read(), unit: 0 } }, curl);
                runProgram(programs.vorticity, { uTexelSize: [1.0 / velocity.read().width, 1.0 / velocity.read().height], uVelocity: { ...velocity.read(), unit: 0 }, uCurl: { ...curl, unit: 1 }, uCurlScale: CONFIG.CURL, uDt: dt, uTime: time }, velocity.write()); velocity.swap();
                runProgram(programs.divergence, { uTexelSize: [1.0 / velocity.read().width, 1.0 / velocity.read().height], uVelocity: { ...velocity.read(), unit: 0 } }, divergence);
                for (let i = 0; i < CONFIG.PRESSURE_ITERATIONS; i++) { runProgram(programs.pressure, { uTexelSize: [1.0 / velocity.read().width, 1.0 / velocity.read().height], uPressure: { ...pressure.read(), unit: 0 }, uDivergence: { ...divergence, unit: 1 } }, pressure.write()); pressure.swap(); }
                runProgram(programs.gradient, { uTexelSize: [1.0 / velocity.read().width, 1.0 / velocity.read().height], uPressure: { ...pressure.read(), unit: 0 }, uVelocity: { ...velocity.read(), unit: 1 } }, velocity.write()); velocity.swap();
                runProgram(programs.advect, { uTexelSize: [1.0 / velocity.read().width, 1.0 / velocity.read().height], uVelocity: { ...velocity.read(), unit: 0 }, uSource: { ...velocity.read(), unit: 0 }, uDt: dt, uDissipation: CONFIG.VELOCITY_DISSIPATION }, velocity.write()); velocity.swap();
                runProgram(programs.advect, { uTexelSize: [1.0 / velocity.read().width, 1.0 / velocity.read().height], uVelocity: { ...velocity.read(), unit: 0 }, uSource: { ...density.read(), unit: 1 }, uDt: dt, uDissipation: CONFIG.DENSITY_DISSIPATION }, density.write()); density.swap();
                runProgram(programs.display, { uTexelSize: [1.0 / density.read().width, 1.0 / density.read().height], uTexture: { ...density.read(), unit: 0 } }, null);
                requestAnimationFrame(update);
            }

            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initFBOs(); }
            window.addEventListener('resize', resize); resize();
            canvas.addEventListener('mousemove', e => { if (e.buttons > 0) pointers = [{ x: e.offsetX, y: e.offsetY, dx: (e.movementX || 0), dy: (e.movementY || 0) }]; else pointers = []; });
            canvas.addEventListener('mousedown', e => pointers = [{ x: e.offsetX, y: e.offsetY, dx: 0, dy: 0 }]);
            canvas.addEventListener('touchmove', e => { e.preventDefault(); pointers = Array.from(e.targetTouches).map(t => { const last = pointers.find(p => p.id === t.identifier); return { x: t.clientX, y: t.clientY, dx: last ? t.clientX - last.x : 0, dy: last ? t.clientY - last.y : 0, id: t.identifier }; }); }, { passive: false });
            canvas.addEventListener('touchstart', e => { e.preventDefault(); pointers = Array.from(e.targetTouches).map(t => ({ x: t.clientX, y: t.clientY, dx: 0, dy: 0, id: t.identifier })); }, { passive: false });
            window.addEventListener('mouseup', () => pointers = []); canvas.addEventListener('touchend', () => pointers = []);
            update();
        })();
    </script>
</body>

</html>
