// Shading: graphs to compare the GPU's register interpreter against core/shade.js evalShade — a ramp
// for every interpolation in every colour space and mapping mode, then maths and colour mixes
const SH_GRAPHS = (() => {

  INTERPS.forEach((interp, k) => SPACES.forEach((space) => {
    const mode = MODES[k % 3];
    out.push({ nodes: [{ id: 'x', type: ['col', 'trap', 'depth', 'lyap', 'facing'][k] }, { id: 'r', type: 'ramp', in: { v: 'x' }, p: { stops, interp, space, map: { scale: 1.3, offset: -0.1, mode, log: k === 1, invert: k === 4 } } }], out: { color: 'r' } });
  }));
  MATH_OPS.forEach((op, k) => out.push({
    nodes: [{ id: 'a', type: 'col' }, { id: 'b', type: 'lyap' }, { id: 'm', type: 'math', in: { a: 'a', b: 'b' }, p: { op } }, { id: 'n', type: 'math', in: { a: 'm' }, p: { op: MATH_OPS[(k + 3) % MATH_OPS.length], c: 0.37 } },
      { id: 'r', type: 'ramp', in: { v: 'n' }, p: { ...rampPreset('film'), map: { scale: 0.7, offset: 0.2, mode: 'repeat', log: false, invert: false } } }],
    out: { color: 'r', glow: 'n' },
  }));
  MIX_MODES.forEach((mode) => out.push({
    nodes: [{ id: 'c', type: 'col' }, { id: 's', type: 'species' }, { id: 'w', type: 'w' }, { id: 'r1', type: 'ramp', in: { v: 'c' }, p: rampPreset('fire') }, { id: 'r2', type: 'ramp', in: { v: 'w' }, p: rampPreset('ice') },
      { id: 'm', type: 'mixc', in: { a: 'r1', b: 'r2', f: 's' }, p: { mode } }],
    out: { color: 'm', glow: 'r2' },
  }));
  out.push(defaultShade());
  return out.map(normShade);
})();

const SHADE_D_SHADER = INTERP + `
@group(0) @binding(2) var<storage, read> pts: array<vec4f>;
@group(0) @binding(3) var<storage, read_write> outp: array<vec4f>;
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u) {

  r.col = a.x; r.trap = a.y; r.depth = a.z; r.lyap = a.w; r.facing = b.x; r.species = b.y; r.w = b.z;
  let o = shadeRun(r);

  outp[4u * i + 1u] = o.glow;

}`;

const INV_SHADER = INTERP + DUAL + `
var<private> rngState: u32;
fn pcg(v: u32) -> u32 {
  let s = v * 747796405u + 2891336453u;
  let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
fn pick(n: u32) -> u32 { rngState = pcg(rngState); return min(u32(f32(rngState >> 8u) / 16777216.0 * f32(n)), max(n, 1u) - 1u); }
` + INVERSE + `
@group(0) @binding(2) var<storage, read> pts: array<vec4f>;
@group(0) @binding(3) var<storage, read_write> outp: array<vec4f>;
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let i = gid.x;
  if (i >= arrayLength(&pts)) { return; }
  rngState = pcg(i * 7919u + 17u);
  var p = pts[i];
  var ok = 1.0;
  // a chimera's context in the inverse: the point's own trap, iteration 0 of 1 (as the CPU check sets it)
  fTrap = dot(p, p); fIter = 0.0; fIters = 1.0;
  // drivers as the push walk reads them: at the point, iteration 0 of 1
  if (DRIVE_ON) { driveStart(p); if (drvAny) { driveIter(p, 1.0, 0u, 1.0); } }
  let start = slotStart(0u);
  let len = slotLen(0u);
  for (var j = 0u; j < len; j++) {
    let s = invAt(start + len - 1u - j, p, head.c);
    if (!s.ok) { ok = 0.0; break; }
    p = s.p;
  }
  outp[i] = p;
  outp[arrayLength(&pts) + i] = vec4f(ok);
}`;

      const e = (await m.getCompilationInfo()).messages.filter((x) => x.type === 'error');
      if (e.length) throw new Error(label + ': ' + e.map((x) => `${x.lineNum}: ${x.message}`).join('\n'));
      return device.createComputePipelineAsync({ layout: 'auto', compute: { module: m, entryPoint: 'main' } });
    };
    const collageRows = (await collageSuite(device, compileOnly)).map((r) => ({ ...r, drv: r.kind === 'forward' && collageCase(r.case)[1].pieces.some((q) => drives(q.f)) }));
    const ok = collageRows.every(collagePass);
    window.__parity = { ok, collageRows };
    out.innerHTML = (ok ? 'PASS' : '<span class="bad">FAIL</span>') + '\n\n' + collageRows.map((r) => `${r.formula}\n  ${JSON.stringify(r)}`).join('\n\n');
    return;
  }
  mark('compile', 'SHADER');
  const module = device.createShaderModule({ code: SHADER });
  const info = await module.getCompilationInfo();
  const errs = info.messages.filter((m) => m.type === 'error');
  if (errs.length) throw new Error(errs.map((m) => `${m.lineNum}: ${m.message}`).join('\n'));
  const pipe0 = await device.createComputePipelineAsync({ layout: 'auto', compute: { module, entryPoint: 'main' } });
  // a driven formula runs in the drivers' variant of each shader (gpu/wgsl.js withDrive)
  const compilePipe = async (code, label) => {
    mark('compile', label);
    const m = device.createShaderModule({ code });
    const e = (await m.getCompilationInfo()).messages.filter((x) => x.type === 'error');
    if (e.length) throw new Error(label + ': ' + e.map((x) => `${x.lineNum}: ${x.message}`).join('\n'));
    return device.createComputePipelineAsync({ layout: 'auto', compute: { module: m, entryPoint: 'main' } });
  };
  const pipeD = await compilePipe(withDrive(SHADER), 'SHADER+drive');
  const rows = [];
  for (const [text, R] of FORMULAS) {
    mark('forward', text);
    const f = parse(text);
    const pk = pack(f);
    const pipe = drives(pk.formula) ? pipeD : pipe0;
    const rng = makeRng(5);
    const pts = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) pts.set(rng.ball().map((x) => x * R), i * 4);
    const mk = (size, usage) => device.createBuffer({ size, usage });
    const head = mk(HEAD_BYTES, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
    const ops = mk(OPS_FLOATS * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const pb = mk(pts.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const ob = mk(pts.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC);
    const rb = mk(pts.byteLength, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST);
    device.queue.writeBuffer(head, 0, pk.head);
    device.queue.writeBuffer(ops, 0, pk.ops);
    device.queue.writeBuffer(pb, 0, pts);
    const bg = device.createBindGroup({
      layout: pipe.getBindGroupLayout(0),
      entries: [head, ops, pb, ob].map((b, i) => ({ binding: i, resource: { buffer: b } })),
    });
    const enc = device.createCommandEncoder();
    const cp = enc.beginComputePass();
    cp.setPipeline(pipe); cp.setBindGroup(0, bg); cp.dispatchWorkgroups(Math.ceil(N / 64)); cp.end();
    enc.copyBufferToBuffer(ob, 0, rb, 0, pts.byteLength);
    device.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ);
    const g = new Float32Array(rb.getMappedRange().slice(0));
    rb.unmap();

    // compare in float32 terms: single precision drifts along chaotic orbits, so the DE is compared
    // only where both orbits did the same number of iterations, and the mismatch rates are reported
    let maxRel = 0, iterMismatch = 0, escMismatch = 0, compared = 0;
    const rels = [];
    for (let i = 0; i < N; i++) {
      const p = [pts[i * 4], pts[i * 4 + 1], pts[i * 4 + 2]];
      const o = iterate(f, p, f.c || lift(f, p));
      const d = de(f, p);
      if (o.n !== g[i * 4 + 1]) { iterMismatch++; continue; }
      if (o.escaped !== (g[i * 4 + 2] > 0.5)) { escMismatch++; continue; }
      const gd = g[i * 4];
      const rel = Math.abs(gd - d) / Math.max(Math.abs(d), 1e-6);
      rels.push(rel); compared++;
      maxRel = Math.max(maxRel, rel);
    }
    rels.sort((a, b) => a - b);
    const median = rels[Math.floor(rels.length / 2)] || 0;
    const p99 = rels[Math.floor(rels.length * 0.99)] || 0;
    rows.push({ formula: text, n: N, compared, median, p99, maxRel, iterMismatch, escMismatch });
    [head, ops, pb, ob, rb].forEach((b) => b.destroy());
  }
  // inverse steps
  mark('compile', 'INV_SHADER');
  const invModule = device.createShaderModule({ code: INV_SHADER });
  const invErrs = (await invModule.getCompilationInfo()).messages.filter((m) => m.type === 'error');
  if (invErrs.length) throw new Error(invErrs.map((m) => `${m.lineNum}: ${m.message}`).join('\n'));
  const invPipe0 = await device.createComputePipelineAsync({ layout: 'auto', compute: { module: invModule, entryPoint: 'main' } });
  const invPipeD = await compilePipe(withDrive(INV_SHADER), 'INV_SHADER+drive');
  const invRows = [];
  for (const [text, R] of INV_FORMULAS) {
    mark('inverse', text);
    const f = normalize(parse(text));
    const pk = pack(f);
    const invPipe = drives(f) ? invPipeD : invPipe0;
    const rng = makeRng(8);
    const slot = slotAt(f, 0);
    // q = the forward image of a random point, so q has at least one preimage
    const qs = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) {
      const s = { p: [...rng.ball(), rng.float() * 2 - 1].map((x) => x * R * 0.85), c: f.c || [0, 0, 0, 0], dr: 1 };
      stepForward(s, slot);
      qs.set(s.p, i * 4);
    }
    const mk = (size, usage) => device.createBuffer({ size, usage });
    const head = mk(HEAD_BYTES, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
    const ops = mk(OPS_FLOATS * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const pb = mk(qs.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    // the preimages, then a success flag per point
    const ob = mk(qs.byteLength * 2, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC);
    const rb = mk(qs.byteLength * 2, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST);
    device.queue.writeBuffer(head, 0, pk.head);
    device.queue.writeBuffer(ops, 0, pk.ops);
    device.queue.writeBuffer(pb, 0, qs);
    const bg = device.createBindGroup({
      layout: invPipe.getBindGroupLayout(0),
      entries: [head, ops, pb, ob].map((b, i) => ({ binding: i, resource: { buffer: b } })),
    });
    const enc = device.createCommandEncoder();
    const cp = enc.beginComputePass();
    cp.setPipeline(invPipe); cp.setBindGroup(0, bg); cp.dispatchWorkgroups(Math.ceil(N / 64)); cp.end();
    enc.copyBufferToBuffer(ob, 0, rb, 0, qs.byteLength * 2);
    device.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ);
    const g = new Float32Array(rb.getMappedRange().slice(0));
    rb.unmap();
    let found = 0, wrong = 0;
    const errs = [];
    for (let i = 0; i < N; i++) {
      if (g[(N + i) * 4] < 0.5) continue;
      found++;
      const q = [qs[i * 4], qs[i * 4 + 1], qs[i * 4 + 2], qs[i * 4 + 3]];
      const pre = [g[i * 4], g[i * 4 + 1], g[i * 4 + 2], g[i * 4 + 3]];
      const s = { p: pre, c: f.c || [0, 0, 0, 0], dr: 1, ctx: { p0: pre, trap: q[0] * q[0] + q[1] * q[1] + q[2] * q[2] + q[3] * q[3], i: 0, n: 1 } };
      // the drivers as the GPU read them: at q
      const D = driveRuntime(f, q, 0);
      if (D) { D.step(readingsOf({ p: q, dr: 1, ctx: { trap: s.ctx.trap } }, 0, 1)); s.ctx.drv = D.map; }
      stepForward(s, slot);
      const e = Math.hypot(s.p[0] - q[0], s.p[1] - q[1], s.p[2] - q[2]) / Math.max(1, Math.hypot(...q));
      errs.push(e);
      if (e > 1e-3) wrong++;
    }
    errs.sort((a, b) => a - b);
    invRows.push({ formula: text, found, wrong, p99: errs[Math.floor(errs.length * 0.99)] || 0 });
    [head, ops, pb, ob, rb].forEach((b) => b.destroy());
  }

  // dual numbers
  mark('compile', 'DUAL_SHADER');
  const dualModule = device.createShaderModule({ code: DUAL_SHADER });
  const dualErrs = (await dualModule.getCompilationInfo()).messages.filter((m) => m.type === 'error');
  if (dualErrs.length) throw new Error(dualErrs.map((m) => `${m.lineNum}: ${m.message}`).join('\n'));
  const dualPipe0 = await device.createComputePipelineAsync({ layout: 'auto', compute: { module: dualModule, entryPoint: 'main' } });
  const dualPipeD = await compilePipe(withDrive(DUAL_SHADER), 'DUAL_SHADER+drive');
  const dualRows = [];
  for (const [text, R] of DUAL_FORMULAS) {
    mark('dual', text);
    const f = normalize(parse(text));
    const pk = pack(f);
    const dualPipe = drives(f) ? dualPipeD : dualPipe0;
    const tg = paramTangents(f);
    const rows = Math.max(1, tg.list.length);
    const rng = makeRng(13);
    // points just outside the set: positive DE, not too far
    const pts = new Float32Array(DN * 4);
    // (capped: a formula whose estimate stays below the threshold must not hang the page)
    for (let i = 0, tries = 0; i < DN && tries < 400 * DN; tries++) {
      const p = rng.ball().map((x) => x * R);
      const d = de(f, p);
      if (d > 1e-4 && d < 0.5 * R) { pts.set(p, i * 4); i++; }
      if (tries === 400 * DN - 1) throw new Error(`dual: too few points outside the set for ${text}`);
    }
    const mk = (size, usage) => device.createBuffer({ size, usage });
    const head = mk(HEAD_BYTES, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
    const ops = mk(OPS_FLOATS * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const pb = mk(pts.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const outBytes = DN * rows * 32;
    const ob = mk(outBytes, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC);
    const rb = mk(outBytes, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST);
    const tb = mk(tg.buf.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    device.queue.writeBuffer(head, 0, pk.head);
    device.queue.writeBuffer(ops, 0, pk.ops);
    device.queue.writeBuffer(pb, 0, pts);
    device.queue.writeBuffer(tb, 0, tg.buf);
    const bg = device.createBindGroup({
      layout: dualPipe.getBindGroupLayout(0),
      entries: [head, ops, pb, ob, tb].map((b, i) => ({ binding: i, resource: { buffer: b } })),
    });
    const enc = device.createCommandEncoder();
    const cp = enc.beginComputePass();
    cp.setPipeline(dualPipe); cp.setBindGroup(0, bg); cp.dispatchWorkgroups(Math.ceil(DN / 64), rows); cp.end();
    enc.copyBufferToBuffer(ob, 0, rb, 0, outBytes);
    device.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ);
    const g = new Float32Array(rb.getMappedRange().slice(0));
    rb.unmap();
    // gradient: angle between GPU and CPU gradients; parameters: relative error of ∂DE/∂θ; λ: absolute
    const ang = [], prel = [], lerr = [];
    for (let i = 0; i < DN; i++) {
      const p = [pts[i * 4], pts[i * 4 + 1], pts[i * 4 + 2]];
      const cg = deGrad(f, p), gg = [g[i * 8], g[i * 8 + 1], g[i * 8 + 2]];
      const nc = Math.hypot(...cg), ng = Math.hypot(...gg);
      if (nc > 1e-6 && ng > 0) ang.push(Math.acos(Math.max(-1, Math.min(1, (cg[0] * gg[0] + cg[1] * gg[1] + cg[2] * gg[2]) / (nc * ng)))) * 180 / Math.PI);
      lerr.push(Math.abs(lyapunovOrbit(f, p) - g[i * 8 + 5]));
      tg.list.forEach((t, j) => {
        if (i % 4) return; // a quarter of the points per parameter is plenty
        const cpu = t.drive ? deDrive(f, p, t.drive) : deParam(f, p, t.oi, t.key), gpu = g[(j * DN + i) * 2 * 4 + 4];
        prel.push(Math.abs(gpu - cpu) / Math.max(Math.abs(cpu), 1e-3 * de(f, p) + 1e-6));
      });
    }
    const med = (a) => (a.sort((x, y) => x - y), a[Math.floor(a.length / 2)] || 0);
    const p90 = (a) => (a.sort((x, y) => x - y), a[Math.floor(a.length * 0.9)] || 0);
    dualRows.push({ formula: text, params: tg.list.length, gradDegMed: med(ang), gradDegP90: p90(ang),
      paramRelMed: med(prel), paramRelP90: p90(prel), lyapAbsMed: med(lerr), lyapAbsP90: p90(lerr) });
    [head, ops, pb, ob, rb, tb].forEach((b) => b.destroy());
  }

  // overrides
  mark('compile', 'OV_SHADER');
  const ovModule = device.createShaderModule({ code: OV_SHADER });
  const ovErrs = (await ovModule.getCompilationInfo()).messages.filter((m) => m.type === 'error');
  if (ovErrs.length) throw new Error(ovErrs.map((m) => `${m.lineNum}: ${m.message}`).join('\n'));
  const ovPipe = await device.createComputePipelineAsync({ layout: 'auto', compute: { module: ovModule, entryPoint: 'main' } });
  const ovRows = [];
  for (const [text, R, params] of OV_CASES) {
    mark('override', text);
    const f = normalize(parse(text));
    const pk = pack(f);
    const tg = paramTangents(f).list;
    const ds = params.map((_, i) => [0.07, -0.05][i]);
    const g = JSON.parse(JSON.stringify(f));
    const flat = g.slots.flat();
    params.forEach(([oi, key], i) => { flat[oi].p[key] += ds[i]; });
    const ovData = new Float32Array(48);
    ovData.set([params[0][0], params[1] ? params[1][0] : 0, params.length, 0, ds[0], ds[1] || 0, 0, 0]);
    params.forEach(([oi, key], i) => ovData.set(tg.find((t) => t.oi === oi && t.key === key).drec, 8 + i * 20));
    const rng = makeRng(21);
    const pts = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) pts.set(rng.ball().map((x) => x * R), i * 4);
    const mk = (size, usage) => device.createBuffer({ size, usage });
    const head = mk(HEAD_BYTES, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
    const ops = mk(OPS_FLOATS * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const pb = mk(pts.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const ob = mk(pts.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC);
    const rb = mk(pts.byteLength, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST);
    const vb = mk(ovData.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    device.queue.writeBuffer(head, 0, pk.head);
    device.queue.writeBuffer(ops, 0, pk.ops);
    device.queue.writeBuffer(pb, 0, pts);
    device.queue.writeBuffer(vb, 0, ovData);
    const bg = device.createBindGroup({
      layout: ovPipe.getBindGroupLayout(0),
      entries: [head, ops, pb, ob, vb].map((b, i) => ({ binding: i, resource: { buffer: b } })),
    });
    const enc = device.createCommandEncoder();
    const cp = enc.beginComputePass();
    cp.setPipeline(ovPipe); cp.setBindGroup(0, bg); cp.dispatchWorkgroups(Math.ceil(N / 64)); cp.end();
    enc.copyBufferToBuffer(ob, 0, rb, 0, pts.byteLength);
    device.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ);
    const gd = new Float32Array(rb.getMappedRange().slice(0));
    rb.unmap();
    const rels = [];
    for (let i = 0; i < N; i++) {
      const p = [pts[i * 4], pts[i * 4 + 1], pts[i * 4 + 2]];
      const c = de(g, p);
      rels.push(Math.abs(gd[i * 4] - c) / Math.max(Math.abs(c), 1e-4));
    }
    rels.sort((a, b) => a - b);
    ovRows.push({ formula: text, params: params.map((q) => q.join('.')).join(' '), median: rels[N >> 1], p99: rels[Math.floor(N * 0.99)] });
    [head, ops, pb, ob, rb, vb].forEach((b) => b.destroy());
  }

  // JIT vs interpreter
  const jitRows = [];
  for (const [text, R] of FORMULAS) {
    mark('jit', text);
    const f = normalize(parse(text));
    const pk = pack(f);
    const rng = makeRng(31);
    const pts = new Float32Array(JIT_N * 4);
    for (let i = 0; i < JIT_N; i++) pts.set(rng.ball().map((x) => x * R), i * 4);
    const mk = (size, usage) => device.createBuffer({ size, usage });
    const head = mk(HEAD_BYTES, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
    const ops = mk(OPS_FLOATS * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const pb = mk(pts.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    device.queue.writeBuffer(head, 0, pk.head);
    device.queue.writeBuffer(ops, 0, pk.ops);
    device.queue.writeBuffer(pb, 0, pts);
    const runOne = async (code) => {
      const module = device.createShaderModule({ code });
      const errs = (await module.getCompilationInfo()).messages.filter((m) => m.type === 'error');
      if (errs.length) throw new Error('jit: ' + errs.map((m) => `${m.lineNum}: ${m.message}`).join('\n'));
      const pipe = await device.createComputePipelineAsync({ layout: 'auto', compute: { module, entryPoint: 'main' } });
      const ob = mk(pts.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC);
      const rb = mk(pts.byteLength, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST);
      const bg = device.createBindGroup({
        layout: pipe.getBindGroupLayout(0),
        entries: [head, ops, pb, ob].map((b, i) => ({ binding: i, resource: { buffer: b } })),
      });
      const go = () => {
        const enc = device.createCommandEncoder();
        const cp = enc.beginComputePass();
        cp.setPipeline(pipe); cp.setBindGroup(0, bg); cp.dispatchWorkgroups(Math.ceil(JIT_N / 64)); cp.end();
        device.queue.submit([enc.finish()]);
        return device.queue.onSubmittedWorkDone();
      };
      await go(); // warm
      const t0 = performance.now();
      for (let k = 0; k < 4; k++) await go();
      const ms = (performance.now() - t0) / 4;
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(ob, 0, rb, 0, pts.byteLength);
      device.queue.submit([enc.finish()]);
      await rb.mapAsync(GPUMapMode.READ);
      const g = new Float32Array(rb.getMappedRange().slice(0));
      rb.unmap();
      ob.destroy(); rb.destroy();
      return { g, ms };
    };
    const base = drives(f) ? withDrive(timedDE) : timedDE;
    const a = await runOne(base);
    const b = await runOne(withJit(base, f));
    const sj = await runOne(withJit(base, f, 'structure'));
    const relsOf = (g) => {
      const rels = [];
      for (let i = 0; i < JIT_N; i += 16) rels.push(Math.abs(a.g[i * 4] - g[i * 4]) / Math.max(Math.abs(a.g[i * 4]), 1e-6));
      return rels.sort((p, q) => p - q);
    };
    const rl = relsOf(b.g), rs = relsOf(sj.g);
    jitRows.push({
      formula: text, median: rl[rl.length >> 1], p99: rl[Math.floor(rl.length * 0.99)],
      sMedian: rs[rs.length >> 1], sP99: rs[Math.floor(rs.length * 0.99)],
      interpMs: a.ms, jitMs: b.ms, structMs: sj.ms, speedup: a.ms / b.ms, structSpeedup: a.ms / sj.ms,
    });
    [head, ops, pb].forEach((q) => q.destroy());
  }

  // pass: the median agrees to float precision, 99 % of points within 2 %, and fewer than 2 % of
  // orbits diverge in iteration count. The tail is float32, not a bug: a point within rounding of a
  // fold edge takes the other branch on one side (measured 2026-10-25: Mandelbox p99 0.4–0.9 %, every
  // other formula p99 ≤ 2e-4, zero iteration or escape mismatches anywhere). The marcher steps at
  // 0.9 of the estimate, so a 2 % error never crosses a surface.
  // inverse: a preimage the GPU returns is a preimage (fewer than 1 % wrong — float32 at fold edges),
  // and a single random attempt finds one for at least a third of the points
  const invOk = invRows.every((r) => r.wrong / Math.max(r.found, 1) < 0.01 && r.found / N > 0.33);
  // duals: gradients within a degree and parameter derivatives within 1 % for most points, λ within
  // 0.01 (the tails are fold edges, where a derivative jumps and central differences straddle it)
  const dualOk = dualRows.every((r) => r.gradDegMed < 1 && r.paramRelMed < 0.01 && r.lyapAbsMed < 0.01);
  const ovOk = ovRows.every((r) => r.median < 1e-4 && r.p99 < 2e-2);
  // the JIT is the same arithmetic in another order: float precision, the same fold-edge tails
  const jitOk = jitRows.every((r) => r.median < 1e-4 && r.p99 < 2e-2 && r.sMedian < 1e-4 && r.sP99 < 2e-2);
  // shading: the GPU's interpreter against evalShade on random readings — float32 colour maths, so a
  // few 1e-6; the steps (constant interpolation, bands, segment edges) may land on the other side
  mark('compile', 'SHADE_SHADER');
  const shModule = device.createShaderModule({ code: SHADE_SHADER });
  const shErrs = (await shModule.getCompilationInfo()).messages.filter((m) => m.type === 'error');
  if (shErrs.length) throw new Error(shErrs.map((m) => `${m.lineNum}: ${m.message}`).join('\n'));
  const shPipe = await device.createComputePipelineAsync({ layout: 'auto', compute: { module: shModule, entryPoint: 'main' } });
  const shadeRows = [];
  for (const [gi, sh] of SH_GRAPHS.entries()) {
    mark('shade', String(gi));
    const pk = pack({ ...normalize(parse('abs ×1')), shade: sh });
    const rng = makeRng(40 + gi);
    const rd = new Float32Array(SH_N * 8);
    const readings = [];
    for (let i = 0; i < SH_N; i++) {
      const r = { col: rng.float(), trap: rng.float() * 4, depth: rng.float(), lyap: rng.float() * 2 - 1, facing: rng.float() * 2 - 1, species: rng.float(), w: rng.float() * 2 - 1 };
      readings.push(r);
      rd.set([r.col, r.trap, r.depth, r.lyap, r.facing, r.species, r.w, 0], i * 8);
    }
    const mk = (size, usage) => device.createBuffer({ size, usage });
    const head = mk(HEAD_BYTES, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
    const ops = mk(OPS_FLOATS * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const pb = mk(rd.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);
    const ob = mk(rd.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC);
    const rb = mk(rd.byteLength, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST);
    device.queue.writeBuffer(head, 0, pk.head);
    device.queue.writeBuffer(ops, 0, pk.ops);
    device.queue.writeBuffer(pb, 0, rd);
    const bg = device.createBindGroup({ layout: shPipe.getBindGroupLayout(0), entries: [head, ops, pb, ob].map((b, i) => ({ binding: i, resource: { buffer: b } })) });
    const enc = device.createCommandEncoder();
    const cp = enc.beginComputePass();
    cp.setPipeline(shPipe); cp.setBindGroup(0, bg); cp.dispatchWorkgroups(Math.ceil(SH_N / 64)); cp.end();
    enc.copyBufferToBuffer(ob, 0, rb, 0, rd.byteLength);
    device.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ);
    const g = new Float32Array(rb.getMappedRange().slice(0));
    rb.unmap();
    const errs = [];
    let off = 0;
    for (let i = 0; i < SH_N; i++) {
      const c = evalShade(sh, readings[i]);
      const e = Math.max(...c.color.map((x, k) => Math.abs(x - g[i * 8 + k])));
      const ge = c.glow == null ? 0 : Array.isArray(c.glow) ? Math.max(...c.glow.map((x, k) => Math.abs(x - g[i * 8 + 4 + k]))) : Math.abs(c.glow - g[i * 8 + 4]) / Math.max(1, Math.abs(c.glow));
      const m = Math.max(e, ge);
      errs.push(m);
      if (m > 1e-3) off++;
    }
    errs.sort((a, b) => a - b);
    const n0 = sh.nodes.find((q) => q.type === 'ramp');
    shadeRows.push({ graph: gi, what: n0 ? `${n0.p.interp}/${n0.p.space}/${n0.p.map.mode}` : '', nodes: sh.nodes.map((q) => q.type + (q.p.op ? ':' + q.p.op : q.p.mode && q.type === 'mixc' ? ':' + q.p.mode : '')).join(' '), median: errs[SH_N >> 1], p99: errs[Math.floor(SH_N * 0.99)], max: errs[SH_N - 1], off });
    [head, ops, pb, ob, rb].forEach((b) => b.destroy());
  }
  // drivers → colour: the interpreter with registers given, then whole orbits
  const shDPipe = await compilePipe(withDrive(SHADE_D_SHADER), 'SHADE_D_SHADER');
  for (const [gi, sh] of SH_DRIVEN.entries()) {
    mark('shade', 'driven ' + gi);
    const pk = pack({ ...normalize(parse('abs ×1')), drive: SH_DRIVERS, shade: sh });
    const rng = makeRng(90 + gi);
    const rd = new Float32Array(SH_N * 16);
    const readings = [], regs = [];
    for (let i = 0; i < SH_N; i++) {
      const r = { col: rng.float(), trap: rng.float() * 4, depth: rng.float(), lyap: rng.float() * 2 - 1, facing: rng.float() * 2 - 1, species: rng.float(), w: rng.float() * 2 - 1 };
      const d = Array.from({ length: 8 }, () => rng.float() * 1.4 - 0.2);
      readings.push(r); regs.push(Object.fromEntries(d.map((v, k) => ['d' + k, Math.fround(v)])));
      rd.set([r.col, r.trap, r.depth, r.lyap, r.facing, r.species, r.w, 0, ...d], i * 16);
    }
    const g = await runPipe(device, shDPipe, pk, rd, SH_N);
    const errs = [];
    let off = 0;
    for (let i = 0; i < SH_N; i++) {
      const c = evalShade(sh, readings[i], regs[i]);
      const e = Math.max(...c.color.map((x, k) => Math.abs(x - g[i * 16 + k])));
      const ge = c.glow == null ? 0 : Array.isArray(c.glow) ? Math.max(...c.glow.map((x, k) => Math.abs(x - g[i * 16 + 4 + k]))) : Math.abs(c.glow - g[i * 16 + 4]) / Math.max(1, Math.abs(c.glow));
      const m = Math.max(e, ge, Math.abs(c.gain - g[i * 16 + 8]) / Math.max(1, c.gain));
      errs.push(m);
      if (m > 1e-3) off++;
    }
    errs.sort((a, b) => a - b);
    shadeRows.push({ graph: 'd' + gi, what: 'driven', nodes: sh.nodes.map((q) => q.type).join(' ') + ' bind ' + (sh.bind || []).map((b) => b.to).join(','), median: errs[SH_N >> 1], p99: errs[Math.floor(SH_N * 0.99)], max: errs[SH_N - 1], off });
  }
  const colourPipe = await compilePipe(withDrive(COLOUR_SHADER), 'COLOUR_SHADER');
  const colourRows = [];
  for (const [text, R] of COLOUR) {
    mark('colour', text.slice(0, 40));
    const f = normalize(parse(text));
    const pk = pack(f);
    new Float32Array(pk.head)[CLOCK_WORD] = COLOUR_T;
    const rng = makeRng(17);
    const pts = new Float32Array(COLOUR_N * 8);
    for (let i = 0; i < COLOUR_N; i++) pts.set(rng.ball().map((x) => x * R), i * 8);
    const g = await runPipe(device, colourPipe, pk, pts, COLOUR_N);
    const errs = [];
    let compared = 0, iterMismatch = 0, off = 0;
    for (let i = 0; i < COLOUR_N; i++) {
      const p = [pts[i * 8], pts[i * 8 + 1], pts[i * 8 + 2]];
      const o = iterate(f, p, f.c || lift(f, p), { time: Math.fround(COLOUR_T) });
      if (o.n !== g[i * 8 + 6]) { iterMismatch++; continue; }
      const c = evalShade(f.shade, { col: 0.25 }, o.drv);
      const m = Math.max(...c.color.map((x, k) => Math.abs(x - g[i * 8 + k])), Math.abs(c.glow - g[i * 8 + 4]) / Math.max(1, Math.abs(c.glow)), Math.abs(c.gain - g[i * 8 + 5]) / Math.max(1, c.gain));
      errs.push(m); compared++;
      if (m > 1e-2) off++;
    }
    errs.sort((a, b) => a - b);
    colourRows.push({ formula: text, compared, iterMismatch, median: errs[compared >> 1] || 0, p99: errs[Math.floor(compared * 0.99)] || 0, off });
  }
  const collageRows = (await collageSuite(device, compilePipe)).map((r) => ({ ...r, drv: r.kind === 'forward' && collageCase(r.case)[1].pieces.some((q) => drives(q.f)) }));
  const collageOk = collageRows.every(collagePass);
  const shadeOk = shadeRows.every((r) => r.median < 1e-5 && r.off / SH_N < 0.005);
  // whole orbits: float32 orbits and noise a few 1e-6 off move a ramp read through repeat or a hue a
  // little; where a ramp's input lands on a stop or a repeat seam the colour may jump (counted in off)
  const colourOk = colourRows.every((r) => r.median < 1e-4 && r.off / Math.max(1, r.compared) < 0.02 && r.iterMismatch / COLOUR_N < 0.02);
  // A driven formula's tail is wider: a parameter that varies over space or along the orbit carries
  // float32's own error (noise and orbit a few 1e-6 off) into every iteration, and the Mandelbox raises it
  // to the twelfth power at its fold edges — p99 3–5 % with any spatially varying scale, fold or radius
  // (measured 2026-10-27; Q2's steep fields showed the same). The median stays near float precision, with
  // room for a rotation rebuilt in float32 (its own value rebuilt: 4.7e-5 against the packed 2.5e-5) whose
  // angle follows the trap (1.1e-4).
  const drv = (r) => r.formula.includes('drive=');
  const ok = rows.every((r) => r.median < (drv(r) ? 3e-4 : 1e-4) && r.p99 < (drv(r) ? 5e-2 : 2e-2) && r.iterMismatch / r.n < 0.02) && invOk && dualOk && ovOk && jitOk && shadeOk && colourOk && collageOk;
  window.__parity = { ok, rows, invRows, dualRows, ovRows, jitRows, shadeRows, colourRows, collageRows };
  out.innerHTML = (ok ? 'PASS' : '<span class="bad">FAIL</span>') + '\n\n' + rows.map((r) =>
    `${r.formula}\n  compared ${r.compared}/${r.n}  median rel ${r.median.toExponential(2)}  p99 ${r.p99.toExponential(2)}  max ${r.maxRel.toExponential(2)}  iter≠ ${r.iterMismatch}  esc≠ ${r.escMismatch}`).join('\n\n')
    + '\n\ninverse steps (GPU preimage → CPU forward)\n\n' + invRows.map((r) =>
    `${r.formula}\n  found ${r.found}/${N}  wrong ${r.wrong}  p99 err ${r.p99.toExponential(2)}`).join('\n\n')
    + '\n\nJIT vs interpreter (' + JIT_N + ' points × 9 estimates)\n\n' + jitRows.map((r) =>
    `${r.formula}\n  literal: median rel ${r.median.toExponential(2)} p99 ${r.p99.toExponential(2)}  structure: median rel ${r.sMedian.toExponential(2)} p99 ${r.sP99.toExponential(2)}\n  interpreter ${r.interpMs.toFixed(2)} ms  literal ${r.jitMs.toFixed(2)} ms ×${r.speedup.toFixed(2)}  structure ${r.structMs.toFixed(2)} ms ×${r.structSpeedup.toFixed(2)}`).join('\n\n')
    + '\n\noverrides (lens): GPU record + d · d record/dθ vs CPU with the value changed\n\n' + ovRows.map((r) =>
    `${r.formula}  [${r.params}]\n  median rel ${r.median.toExponential(2)}  p99 ${r.p99.toExponential(2)}`).join('\n\n')
    + '\n\nshading (GPU interpreter vs evalShade, ' + SH_N + ' random readings)\n\n' + shadeRows.map((r) =>
    `#${r.graph} ${r.nodes} ${r.what}\n  max channel err median ${r.median.toExponential(2)} p99 ${r.p99.toExponential(2)} max ${r.max.toExponential(2)}  off (>1e-3) ${r.off}`).join('\n\n')
    + '\n\ndrivers → colour (whole orbits at t = ' + COLOUR_T + ', ' + COLOUR_N + ' points)\n\n' + colourRows.map((r) =>
    `${r.formula}\n  compared ${r.compared}  iter≠ ${r.iterMismatch}  max channel err median ${r.median.toExponential(2)} p99 ${r.p99.toExponential(2)}  off (>1e-2) ${r.off}`).join('\n\n')
    + '\n\ncollage (GPU collage program vs collageAt, the keep rule, the step factor)\n\n' + collageRows.map((r) => `${r.formula}\n  ${JSON.stringify(Object.fromEntries(Object.entries(r).filter(([k]) => k !== 'formula').map(([k, v]) => [k, typeof v === 'number' && !Number.isInteger(v) ? +v.toExponential(2) : v])))}`).join('\n\n')
    + '\n\ndual numbers (GPU tangents vs CPU central differences)\n\n' + dualRows.map((r) =>
    `${r.formula}\n  gradient angle median ${r.gradDegMed.toFixed(3)}° p90 ${r.gradDegP90.toFixed(2)}°   ∂DE/∂θ (${r.params} params) median rel ${r.paramRelMed.toExponential(2)} p90 ${r.paramRelP90.toExponential(2)}   λ median |err| ${r.lyapAbsMed.toExponential(2)} p90 ${r.lyapAbsP90.toExponential(2)}`).join('\n\n');
}
run().catch((e) => { out.textContent = 'ERROR ' + e.message; window.__parity = { ok: false, error: e.message }; });
</script>
</body>
