        body {

        /* The backdrop index.html paints before WebGL has a context, so the
           canvas fades up over the right colours rather than out of black.
           MEASURED, not modelled — run tools/index_backdrop.html to regenerate.
           The page draws through an EffectComposer that writes its linear render
           target straight to the canvas, so it shows up about 40% darker than the
           same scene through a plain render; a gradient derived from the HDRI
           alone opens washed out and visibly darkens as the canvas takes over. */
        :root {
            --backdrop: linear-gradient(180deg, rgb(50,61,100) 0%, rgb(52,64,106) 17%, rgb(65,77,116) 33%, rgb(78,82,102) 50%, rgb(43,51,74) 67%, rgb(27,33,53) 83%, rgb(25,29,46) 100%);
        }

        /* On both: body's copy rides inside the blur, html's is what the blur
           bleeds into at the viewport edge. Without the second one the soft edge
           fades to the black in main.css and rims the page with a dark vignette. */
        html,
        body {
            background: var(--backdrop);
        }

        /* The reveal. One continuous transition from soft to sharp, run when the
           full-resolution sky has landed and actually been drawn — not a crossfade
           between two states. */
        body {
            filter: blur(var(--reveal-blur, 26px));
            transition: filter 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
            /* A filtered element is the containing block for its fixed children,
               so body has to fill the viewport or the nav and the menu would
               anchor to a zero-height box. dvh tracks the mobile toolbar. */
            min-height: 100vh;
            min-height: 100dvh;
        }

        body.revealed {
            --reveal-blur: 0px;
        }

        /* Only for a sky that arrives after the failsafe already sharpened the
           page: a short dip back out of focus, so the jump from the 32x16
           environment to the real one reads as the image settling. */
        body.refocus {
            --reveal-blur: 9px;
            transition-duration: 220ms;
        }

        /* Blur samples past the viewport edge, which would otherwise let the
           backdrop bleed in as a soft frame. Overscanning hides it, and the scale
           relaxes on the same curve so it reads as the image settling. */

           percent off the real frame. Fading rather than cutting keeps that
           margin of error from reading as a flash. */
        body.lit canvas {

                sphere,

                sextahedron,
                material,
                effect;

            let environmentLoaded = false;
            let cubeCamera, cubeRenderTarget, cubeFrame = 0;
            let drawn = false;
            let mouseX = 0,
                mouseY = 0;
            let windowHalfX = window.innerWidth / 2;
            let windowHalfY = window.innerHeight / 2;

            init();

            function init() {
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setAnimationLoop(animation);
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.3;
                document.body.appendChild(renderer.domElement);

                document.addEventListener("mousemove", onDocumentMouseMove);
                window.addEventListener("resize", onWindowResized);

                camera = new THREE.PerspectiveCamera(
                    90,
                    window.innerWidth / window.innerHeight,
                    1,
                    1000,
                );
                camera.position.z = 70;

                scene = new THREE.Scene();
                scene.rotation.y = 0.5; // avoid flying objects occluding the sun

                // hdri — the inlined preview first, synchronously, so the very
                // first frame this renderer draws is already lit and in colour
                const hdrLoader = new HDRLoader();
                const preview = hdrLoader.createDataTexture(
                    Uint8Array.from(atob(HDR_PREVIEW), (c) => c.charCodeAt(0))
                        .buffer,
                );
                preview.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = preview;
                scene.environment = preview;
                environmentLoaded = true;

                // ...then the real thing, already in flight since the <head>
                window.__sky
                    .then(function (buffer) {
                        const texture = hdrLoader.createDataTexture(buffer);
                        texture.mapping =
                            THREE.EquirectangularReflectionMapping;

                        scene.background = texture;
                        scene.environment = texture;
                        preview.dispose();
                        if (revealed) refocus();
                        else reveal();
                    })
                    // A sky that never arrives must not leave the page blurred
                    // forever — the 32x16 one is a perfectly good fallback.
                    .catch(reveal);

                setTimeout(reveal, 8000);

                // cubeRenderCamera
                cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256);
                cubeRenderTarget.texture.type = THREE.HalfFloatType;
                cubeCamera = new THREE.CubeCamera(1, 1000, cubeRenderTarget);

                // objects
                material = new THREE.MeshStandardMaterial({
                    envMap: cubeRenderTarget.texture,
                    roughness: 0.05,
                    metalness: 1,
                });

                const radius = 7.5;
                sphere = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(20, 8),
                    material,
                );
                scene.add(sphere);

                const material2 = new THREE.MeshStandardMaterial({
                    roughness: 0.05,
                    metalness: 0,
                });

                cube = new THREE.Mesh(
                    new THREE.BoxGeometry(radius, radius, radius),
                    material2,
                );
                scene.add(cube);

                pentahedron = new THREE.Mesh(
                    new THREE.TorusGeometry(radius - 3, 3, 15, 20),
                    material2,
                );
                scene.add(pentahedron);

                tetrahedron = new THREE.Mesh(
                    new THREE.TetrahedronGeometry(radius),
                    material2,
                );
                scene.add(tetrahedron);

                dodecahedron = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(radius),
                    material2,
                );
                scene.add(dodecahedron);

                donut = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(radius, 8),
                    material2,
                );
                scene.add(donut);

                octahedron = new THREE.Mesh(
                    new THREE.OctahedronGeometry(radius),
                    material2,
                );
                scene.add(octahedron);

                torus = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(radius, 8),
                    material2,
                );
                scene.add(torus);

                sextahedron = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(radius),
                    material2,
                );

                composer.addPass(new RenderPass(scene, camera));

                const effect2 = new ShaderPass(RGBShiftShader);
                effect2.uniforms["amount"].value = 0.001;
                composer.addPass(effect2);

            // The canvas is transparent until it has something to show; without
            // this it would cut over the CSS backdrop with a visible seam.
            function lit() {
                document.body.classList.add("lit");
            }

            // Sharpen once, and only once the full-resolution sky has actually
            // been drawn. Two frames: the first submits it, the second is on
            // screen by the time the transition starts, so the blur never lifts
            // off a stale frame.
            let revealed = false;
            function reveal() {
                if (revealed) return;
                revealed = true;
                requestAnimationFrame(() =>
                    requestAnimationFrame(() =>
                        document.body.classList.add("revealed"),
                    ),
                );
            }

            function refocus() {
                document.body.classList.add("refocus");
                setTimeout(() => document.body.classList.remove("refocus"), 240);
            }

            function onWindowResized() {
                windowHalfX = window.innerWidth / 2;
                windowHalfY = window.innerHeight / 2;

                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);

                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }

            // FIX 3: Flag to play audio only once
            let audioStarted = false;

            function onDocumentMouseMove(event) {
                mouseX = (event.clientX - windowHalfX) / 2;
                mouseY = (event.clientY - windowHalfY) / 2;

                // FIX 3: Play audio on first user interaction to avoid autoplay error
                if (!audioStarted) {
                    const audio = document.getElementById("backgroundMusic");
                    if (audio) {
                        audio.play().catch(e => console.warn("Audio play failed:", e));
                    }
                    audioStarted = true;
                }
            }

            function animation(msTime) {
                // FIX 4: Add guard clause to prevent crash if objects aren't initialized
                if (!cube || !torus || !tetrahedron || !dodecahedron || !donut || !octahedron || !pentahedron || !sextahedron) {
                    return; // Wait for init() to complete
                }

                // rotating objects
                const time = msTime / 1000;

                cube.position.x = Math.cos(time) * 30;
                cube.position.y = Math.sin(time) * 30;
                cube.position.z = Math.sin(time) * 30;
                cube.rotation.x += 0.02;
                cube.rotation.y += 0.03;

                torus.position.x = Math.cos(time + 30) * 30;
                torus.position.y = Math.sin(time + 30) * 30;
                torus.position.z = Math.sin(time + 30) * 30;
                torus.rotation.x += 0.02;
                torus.rotation.y += 0.03;

                tetrahedron.position.x = Math.cos(time + 60) * 30;
                tetrahedron.position.y = Math.sin(time + 60) * 30;
                tetrahedron.position.z = Math.sin(time + 60) * 30;
                tetrahedron.rotation.x += 0.02;
                tetrahedron.rotation.y += 0.03;

                dodecahedron.position.x = Math.cos(time + 90) * 30;
                dodecahedron.position.y = Math.sin(time + 90) * 30;
                dodecahedron.position.z = Math.sin(time + 90) * 30;
                dodecahedron.rotation.x += 0.02;
                dodecahedron.rotation.y += 0.03;

                donut.position.x = Math.sin(time + 15) * 30;
                donut.position.y = Math.cos(time + 15) * 30;
                donut.position.z = Math.sin(time + 15) * 30;
                donut.rotation.x += 0.02;
                donut.rotation.y += 0.03;

                octahedron.position.x = Math.cos(time + 15 + 30) * 30;
                octahedron.position.y = Math.cos(time + 15 + 30) * 30;
                octahedron.position.z = Math.sin(time + 15 + 30) * 30;
                octahedron.rotation.x += 0.02;
                octahedron.rotation.y += 0.03;

                pentahedron.position.x = Math.sin(time + 15 + 60) * 30;
                pentahedron.position.y = Math.cos(time + 15 + 60) * 30;
                pentahedron.position.z = Math.sin(time + 15 + 60) * 30;
                pentahedron.rotation.x += 0.02;
                pentahedron.rotation.y += 0.03;

                sextahedron.position.x = Math.cos(time + 15 + 90) * 30;
                sextahedron.position.y = Math.cos(time + 15 + 90) * 30;
                sextahedron.position.z = Math.sin(time + 15 + 90) * 30;
                sextahedron.rotation.x += 0.02;
                sextahedron.rotation.y += 0.03;

                // fps update
                camera.position.x += (mouseX / 5 - camera.position.x) * 0.01;
                camera.position.y += (-mouseY / 5 - camera.position.y) * 0.02;
                camera.lookAt(scene.position);

                // The environment is static, so the only thing that changes in
                // the cube map is the handful of small objects reflected in the
                // ball. Refreshing it every frame costs six extra scene renders
                // for a difference nobody can see.
                cubeFrame += 1;
                if (environmentLoaded && cubeFrame % 2 === 0) {
                    cubeCamera.update(renderer, scene);
                }

                // composer's RenderPass draws the scene; rendering it directly
                // first only produced a frame that was immediately overwritten.
                composer.render();

                if (!drawn) {
                    drawn = true;
                    requestAnimationFrame(lit);
                }
            }
