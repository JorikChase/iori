        <script type="module">
            import * as THREE from "three";

            import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

            import { GUI } from "three/addons/libs/lil-gui.module.min.js";

            import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
            import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
            import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
            import { FilmPass } from "three/addons/postprocessing/FilmPass.js";
            import { RGBShiftShader } from "three/addons/shaders/RGBShiftShader.js";

            import { FontLoader } from "three/addons/loaders/FontLoader.js";
            import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

            // declarations

            let camera, scene, renderer, composer;
            let cube,
                foregroundObj,
                midgroundObj,
                backgroundObj,
                foregroundMaterial,
                midgroundMaterial,
                backgroundMaterial,
                textObj,
                textGeometry,
                textMaterial;

            let cubeCamera, cubeRenderTarget;

            let mouseX = 0,
                mouseY = 0;

            let windowHalfX = window.innerWidth / 2;
            let windowHalfY = window.innerHeight / 2;

            init();

            //init

            function init() {
                //scope

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setAnimationLoop(animation);
                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.3;
                document.body.appendChild(renderer.domElement);

                document.addEventListener("mousemove", onDocumentMouseMove);

                window.addEventListener("resize", onWindowResized);

                // camera

                camera = new THREE.PerspectiveCamera(
                    90,
                    window.innerWidth / window.innerHeight,
                    1,
                    1000,
                );
                camera.position.z = 70;

                scene = new THREE.Scene();

                // hdri

                new RGBELoader()
                    .setPath("/assets/")
                    .load("3dieMainBckg.hdr", function (texture) {
                        texture.mapping =
                            THREE.EquirectangularReflectionMapping;

                        scene.background = texture;
                        scene.environment = texture;
                    });

                // objects

                const foregroundTexture = new THREE.TextureLoader().load(
                    "/assets/contact/background.jpg",
                );
                const foregroundAplha = new THREE.TextureLoader().load(
                    "/assets/contact/foreground.jpg",
                );

                foregroundMaterial = new THREE.MeshStandardMaterial({
                    transparent: true,
                    alphaMap: foregroundAplha,
                    map: foregroundTexture,
                });
                const midgroundTexture = new THREE.TextureLoader().load(
                    "/assets/contact/background.jpg",
                );
                const midgroundAlpha = new THREE.TextureLoader().load(
                    "/assets/contact/midground.jpg",
                );

                midgroundMaterial = new THREE.MeshStandardMaterial({
                    transparent: true,
                    alphaMap: midgroundAlpha,
                    map: midgroundTexture,
                });
                const backgroundTexture = new THREE.TextureLoader().load(
                    "/assets/contact/background.jpg",
                );

                backgroundMaterial = new THREE.MeshStandardMaterial({
                    map: backgroundTexture,
                });

                foregroundObj = new THREE.Mesh(
                    new THREE.PlaneGeometry(350 / 2, 248 / 2),
                    foregroundMaterial,
                );
                scene.add(foregroundObj);
                foregroundObj.position.y = 15;
                foregroundObj.position.z = 10;

                midgroundObj = new THREE.Mesh(
                    new THREE.PlaneGeometry(350 * 4, 248 * 4),
                    midgroundMaterial,
                );
                scene.add(midgroundObj);
                midgroundObj.position.y = 20;
                midgroundObj.position.z = -200;

                backgroundObj = new THREE.Mesh(
                    new THREE.PlaneGeometry(350 * 10, 248 * 10),
                    backgroundMaterial,
                );
                scene.add(backgroundObj);
                backgroundObj.position.y = 20;
                backgroundObj.position.z = -500;

                const loader = new FontLoader();
                loader.load(
                    "/assets/contactFont.json",
                    function (font) {
                        const color = 0xfffb00;

                        const matDark = new THREE.LineBasicMaterial({
                            color: color,
                            side: THREE.DoubleSide,
                        });

                        const matLite = new THREE.MeshBasicMaterial({
                            color: color,
                            transparent: true,
                            opacity: 1,
                            side: THREE.DoubleSide,
                        });

                        const message =
                            "design\n art \n technologies \n and their fusion \n websites \n design \n motion design \n sound visualisations \n";

                        if (
                            /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
                                navigator.userAgent,
                            )
                        ) {
                            const message =
                                "We love design\n art \n technologies \n and their fusion \n websites \n design \n motion design \n sound visualisations \n visualisations\n";
                        }

                        const shapes = font.generateShapes(message, 45);

                        const geometry = new THREE.ShapeGeometry(shapes);

                        geometry.computeBoundingBox();

                        const xMid =
                            -0.5 *
                            (geometry.boundingBox.max.x -
                                geometry.boundingBox.min.x);

                        geometry.translate(xMid, 0, 0);

                        // make shape ( N.B. edge view not visible )

                        const text = new THREE.Mesh(geometry, matLite);
                        text.position.z = -150;
                        text.position.y = 100;
                        text.scale.setScalar(0.00025 * window.innerWidth);
                        if (
                            /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
                                navigator.userAgent,
                            )
                        ) {
                            text.position.y = 65;
                            text.scale.setScalar(0.00035 * window.innerWidth);
                        }
                        scene.add(text);

                        // make line shape ( N.B. edge view remains visible )

                        const holeShapes = [];

                        for (let i = 0; i < shapes.length; i++) {
                            const shape = shapes[i];

                            if (shape.holes && shape.holes.length > 0) {
                                for (let j = 0; j < shape.holes.length; j++) {
                                    const hole = shape.holes[j];
                                    holeShapes.push(hole);
                                }
                            }
                        }

                        shapes.push.apply(shapes, holeShapes);

                        const lineText = new THREE.Object3D();

                        for (let i = 0; i < shapes.length; i++) {
                            const shape = shapes[i];

                            const points = shape.getPoints();
                            const geometry =
                                new THREE.BufferGeometry().setFromPoints(
                                    points,
                                );

                            geometry.translate(xMid, 0, 0);

                            const lineMesh = new THREE.Line(geometry, matDark);
                            lineText.add(lineMesh);
                        }

                        lineText.position.z = -100;
                        lineText.position.y = 350;
                        lineText.scale.x = 0.5;
                        lineText.scale.y = 1;
                        scene.add(lineText);
                    },
                ); //end load function

                // postprocessing

                composer = new EffectComposer(renderer);
                composer.addPass(new RenderPass(scene, camera));

                const effect2 = new ShaderPass(RGBShiftShader);
                effect2.uniforms["amount"].value = 0.001;
                composer.addPass(effect2);

                //
            }

            function onWindowResized() {
                windowHalfX = window.innerWidth / 2;
                windowHalfY = window.innerHeight / 2;

                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);

                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }

            function onDocumentMouseMove(event) {
                mouseX = (event.clientX - windowHalfX) / 2;
                mouseY = (event.clientY - windowHalfY) / 2;
            }

            function animation(msTime) {
                // fps update

                camera.position.x += (-mouseX / 15 - camera.position.x) * 0.01;
                camera.position.y += (mouseY / 15 - camera.position.y) * 0.02;

                camera.lookAt(scene.position);

                renderer.render(scene, camera);

                composer.render();
            }
        </script>

        <!-- contact form (posts to api.3die.fr -> dashboard inbox) -->
        <style>
            .contact-trigger {
                position: fixed; bottom: 1.2rem; left: 1.2rem; z-index: 60;
                font-family: "Courier New", monospace; font-size: .8rem;
                letter-spacing: .2em; text-transform: uppercase;
                background: transparent; color: #fff; border: 1px solid #fff;
                padding: .6em 1.2em; cursor: pointer; transition: all 140ms ease;
            }
            .contact-trigger:hover { background: #fff; color: #000; }
            .contact-panel {
                position: fixed; bottom: 4.5rem; left: 1.2rem; z-index: 60;
                width: min(92vw, 380px);
                background: #000; border: 2px solid #fff;
                padding: 1.2rem; font-family: "Courier New", monospace;
                display: none; box-shadow: 8px 8px 0 rgba(255,255,255,.15);
            }
            .contact-panel.open { display: block; animation: cpop 140ms ease; }
            @keyframes cpop { from { transform: translateY(10px); opacity: 0; } }
            .contact-panel .cp-title { letter-spacing: .3em; font-size: .85rem; margin-bottom: .8rem; color: #fff; }
            .contact-panel input, .contact-panel textarea {
                width: 100%; font: inherit; font-size: .85rem;
                background: #000; color: #fff; border: 1px solid #555;
                padding: .5em .7em; margin-bottom: .6rem; outline: none;
            }
            .contact-panel input:focus, .contact-panel textarea:focus { border-color: #fff; }
            .contact-panel button {
                font: inherit; letter-spacing: .2em; text-transform: uppercase;
                background: #fff; color: #000; border: 1px solid #fff;
                padding: .5em 1.4em; cursor: pointer;
            }
            .contact-panel .cp-status { margin-top: .6rem; font-size: .78rem; min-height: 1.1em; color: #aaa; }
            .contact-panel .cp-status.err { color: #ff3b30; }
        </style>
        <button class="contact-trigger" id="contact-trigger">contact</button>
        <form class="contact-panel" id="contact-panel">
            <div class="cp-title">MESSAGE THE LABEL</div>
            <input id="cf-name" type="text" placeholder="name" maxlength="120">
            <input id="cf-email" type="email" placeholder="email" maxlength="200">
            <textarea id="cf-body" placeholder="your message" rows="4" maxlength="8000" required></textarea>
            <button type="submit">send</button>
            <div class="cp-status" id="cf-status"></div>
        </form>
        <script>
            (function () {
                var trigger = document.getElementById("contact-trigger");
                var panel = document.getElementById("contact-panel");
                var status = document.getElementById("cf-status");
                trigger.addEventListener("click", function () {
                    panel.classList.toggle("open");
                });
                panel.addEventListener("submit", function (e) {
                    e.preventDefault();
                    status.className = "cp-status";
                    status.textContent = "sending…";
                    fetch("https://api.3die.fr/contact", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            name: document.getElementById("cf-name").value,
                            email: document.getElementById("cf-email").value,
                            body: document.getElementById("cf-body").value
                        })
                    }).then(function (r) {
                        if (!r.ok) throw new Error("send failed (" + r.status + ")");
                        status.textContent = "sent — we read everything.";
                        document.getElementById("cf-body").value = "";
                    }).catch(function (err) {
                        status.className = "cp-status err";
                        status.textContent = err.message + " — try 3diefr@gmail.com";
                    });
                });
            })();
        </script>
