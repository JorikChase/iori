<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splat Showcase — Engine Core</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #viewer-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #ui-overlay { position: absolute; top: 20px; left: 20px; z-index: 10; color: #fff; pointer-events: none; }
        h1 { margin: 0 0 5px 0; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.9; }
        .status { font-size: 0.8rem; color: #00ffcc; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1 id="scene-title">Initializing Viewer</h1>
        <div id="scene-status" class="status">Pre-fetching assets...</div>
    </div>

    <div id="viewer-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
            }
        }
    </script>

    <script type="module">
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        // 1. Point this directly to your Hugging Face outputs or your local Caddy assets folder
const CDN_BASE = "https://huggingface.co/datasets/iorioriori/splats/resolve/main/";

        // 2. Instantiate the unified WebGL & Worker Sort Engine
        const viewer = new GaussianSplats3D.Viewer({
            'initialCameraPosition': [0, 2, 5],
            'initialCameraLookAt': [0, 0, 0],
            'cameraUp': [0, 1, 0],
            'showLoadingUI': false, // We use our own clean UI overlay
            'rootElement': document.getElementById('viewer-container')
        });

        let currentSceneId = null;

        async function switchScene(sceneName) {
            const titleEl = document.getElementById('scene-title');
            const statusEl = document.getElementById('scene-status');
            
            titleEl.innerText = sceneName.replace("gs_", "").toUpperCase();
            statusEl.innerText = "Streaming compressed SPZ layers...";

            // Gracefully drop old memory contexts to prevent canvas leakage
            if (currentSceneId !== null) {
                await viewer.removeSplatScene(currentSceneId);
                currentSceneId = null;
            }

            try {
                const url = `${CDN_BASE}${sceneName}.spz`;
                
                // Natively streams, decompresses ZSTD layers, and retains reflection attributes
                currentSceneId = await viewer.addSplatScene(url, {
                    'progressiveLoad': true,
                    'splatAlphaRemovalThreshold': 5
                });

                statusEl.innerText = "✨ Active (Full Spherical Harmonics Loaded)";
            } catch (err) {
                console.error("❌ Stream Error:", err);
                statusEl.innerText = "⚠️ Network drop detected. Retrying...";
            }
        }

        // Initialize the base loop and drop into your first scene
        viewer.start();
        switchScene("gs_kyticki");

        // Expose to window for your navigation controls
        window.switchShowcaseScene = switchScene;
    </script>
</body>
</html>
