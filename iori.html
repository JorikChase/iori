    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
            }
        }
    </script>

    <script type="module">
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        const splatScenes = [
            "gs_Dandy", "gs_alive", "gs_and_l", "gs_carousel", "gs_creatures",
            "gs_fia", "gs_flora", "gs_govno", "gs_ior", "gs_iridescence",
            "gs_iriscient", "gs_jjj", "gs_kaczinski", "gs_kanal", "gs_kolo",
            "gs_kyticki", "gs_lili", "gs_lou", "gs_ma_bh", "gs_meadow",
            "gs_moses", "gs_my_man", "gs_nova_scena", "gs_p_edti", "gs_pool",
            "gs_puddy", "gs_pulz", "gs_rapture", "gs_rozi", "gs_ruh",
            "gs_scen_rie", "gs_shack", "gs_stvana", "gs_tick", "gs_umu",
            "gs_vltava", "gs_vodn_k", "gs_yum", "gs_yummy_like_u", "gs_zoch"
        ];

        const CDN_BASE = "./splats/";
        let currentSceneId = null;
        let isTransitioning = false;

        const viewer = new GaussianSplats3D.Viewer({
            'initialCameraPosition': [0, 1.5, 4],
            'initialCameraLookAt': [0, 0, 0],
            'cameraUp': [0, 1, 0],
            'showLoadingUI': false,
            'rootElement': document.getElementById('viewer-container'),
            'dynamicScene': true,
            'integerCoordinateResolution': false
        });

        const menuContainer = document.getElementById('menu-container');
        splatScenes.forEach((sceneName) => {
            const btn = document.createElement('button');
            btn.className = 'scene-btn';
            btn.id = `btn-${sceneName}`;
            btn.innerText = sceneName.replace("gs_", "").replace(/_/g, " ");
            
            btn.addEventListener('click', () => {
                if (btn.classList.contains('active') || isTransitioning) return;
                switchScene(sceneName);
            });
            menuContainer.appendChild(btn);
        });

        async function switchScene(sceneName) {
            isTransitioning = true;
            const titleEl = document.getElementById('scene-title');
            const statusEl = document.getElementById('scene-status');
            
            document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${sceneName}`);
            if (activeBtn) activeBtn.classList.add('active');

            titleEl.innerText = sceneName.replace("gs_", "").replace(/_/g, " ").toUpperCase();
            statusEl.innerText = "Streaming optimized splat buffers...";

            if (currentSceneId !== null) {
                statusEl.innerText = "Purging memory graphics grids...";
                await viewer.removeSplatScene(currentSceneId);
                currentSceneId = null;
            }

            try {
                // Now streaming native .ksplat binary files
                const url = `${CDN_BASE}${sceneName}.ksplat`;
                
                currentSceneId = await viewer.addSplatScene(url, {
                    'progressiveLoad': true,
                    'splatAlphaRemovalThreshold': 5
                });

                statusEl.innerText = "Render Stable (Reflections Active)";
            } catch (err) {
                console.error("❌ Local asset execution failure:", err);
                statusEl.innerText = "⚠️ Streaming fault. Retrying...";
            } finally {
                isTransitioning = false;
            }
        }

        // Archive probe: if the splat files are not deployed (production),
        // show an archive notice instead of failing scene by scene.
        // Locally (splats/ present) the showcase boots normally.
        async function probeCollection() {
            try {
                const r = await fetch(`${CDN_BASE}${splatScenes[0]}.ksplat`, { method: 'HEAD' });
                // The SPA fallback serves web.html (text/html) for missing files,
                // so status alone is not enough — verify it's really the binary.
                const type = r.headers.get('content-type') || '';
                return r.ok && !type.includes('text/html');
            } catch (e) {
                return false;
            }
        }

        function showArchiveNotice() {
            document.getElementById('viewer-container').style.display = 'none';
            document.getElementById('ui-layer').innerHTML = `
                <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;text-align:center;padding:2rem;z-index:100;">
                    <div>
                        <div style="font-size:1.6rem;letter-spacing:.35em;margin-bottom:1.2rem;">COLLECTION ARCHIVED</div>
                        <div style="opacity:.55;max-width:34rem;line-height:1.7;font-size:.9rem;">
                            The interactive 3D showcase is being rebuilt and will return in a new form.
                            <br><br>
                            <a href="/web.html" style="color:#fff;border-bottom:1px solid #fff;text-decoration:none;">&larr; back to the node web</a>
                        </div>
                    </div>
                </div>`;
        }

        probeCollection().then((available) => {
            if (!available) {
                showArchiveNotice();
                return;
            }
            viewer.start();
            switchScene("gs_kyticki");
        });

        window.switchShowcaseScene = switchScene;
    </script>
