<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IORI</title>

    <style>
        /* --- BRUTALIST & MINIMALIST RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #ffffff;
        }

        /* --- BACKGROUND CANVAS LAYER --- */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            transition: filter 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease;
            opacity: 0;
            filter: brightness(0) contrast(1.8) blur(30px);
        }

        #canvas-container.active {
            opacity: 1;
            filter: brightness(1.05) contrast(1.02) blur(0px);
        }

        #splat-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- ULTRA-MINIMAL BRUTALIST OVERLAY --- */
        .brutalist-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .brand-title {
            font-family: 'Syne', 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(5rem, 25vw, 32rem);
            font-weight: 800;
            line-height: 0.75;
            letter-spacing: -0.06em;
            text-transform: uppercase;
            color: #ffffff;
            text-align: center;
            mix-blend-mode: difference;
        }

        /* --- SUBTLE SCANLINE FILTER --- */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            opacity: 0.25;
        }

        /* --- LOADING LAYOUT --- */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-left-color: #ffffff;
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="canvas-container">
        <canvas id="splat-canvas"></canvas>
    </div>

    <div class="brutalist-overlay">
        <h1 class="brand-title">IORI</h1>
    </div>

    <div id="boot-screen">
        <div class="spinner"></div>
    </div>

    <script type="module">
        import * as SPLAT from "https://cdn.jsdelivr.net/npm/gsplat@1.2.0/dist/index.js";

        const HF_USER_REPO = "iorioriori/splats";

        const splatScenes = [
            "gs_Dandy", "gs_alive", "gs_and_l", "gs_carousel", "gs_creatures",
            "gs_fia", "gs_flora", "gs_govno", "gs_ior", "gs_iridescence",
            "gs_iriscient", "gs_jjj", "gs_kaczinski", "gs_kanal", "gs_kolo",
            "gs_kyticki", "gs_lili", "gs_lou", "gs_ma_bh", "gs_meadow",
            "gs_moses", "gs_my_man", "gs_nova_scena", "gs_p_edti", "gs_pool",
            "gs_puddy", "gs_pulz", "gs_rapture", "gs_rozi", "gs_ruh",
            "gs_scen_rie", "gs_shack", "gs_stvana", "gs_tick", "gs_umu",
            "gs_vltava", "gs_vodn_k", "gs_yum", "gs_yummy_like_u", "gs_zoch"
        ];

        const chosenScene = splatScenes[Math.floor(Math.random() * splatScenes.length)];
        const hfRoot = `https://huggingface.co/datasets/${HF_USER_REPO}/resolve/main/${chosenScene}`;

        let renderer, scene, camera, controls;
        let isLoaded = false; 

        const container = document.getElementById("canvas-container");
        const canvas = document.getElementById("splat-canvas");
        const bootScreen = document.getElementById("boot-screen");

        function initEngine() {
            try {
                // Initialize core components EXACTLY ONCE
                renderer = new SPLAT.WebGLRenderer(canvas);
                scene = new SPLAT.Scene();
                camera = new SPLAT.Camera();
                controls = new SPLAT.OrbitControls(camera, canvas);

                camera.position = new SPLAT.Vector3(0, 1.2, 3.5);

                resizeCanvas();
                runProgressiveWaterfall();
            } catch (err) {
                console.warn("WebGL runtime initialization failure. Launching fallback engine...", err);
                initFallbackEngine();
            }
        }

        async function runProgressiveWaterfall() {
            try {
                // ---- STAGE 1: CORE FOCUS PASS ----
                console.log(`[NET FETCH] Downloading core focus pass...`);
                const response = await fetch(`${hfRoot}_part1.ply`);
                if (!response.ok) throw new Error("Network request rejected.");
                const blob = await response.blob();
                
                const blobUrl = URL.createObjectURL(blob);
                await SPLAT.Loader.LoadAsync(blobUrl, scene);
                URL.revokeObjectURL(blobUrl);
                
                // Unveil scene immediately when part 1 handles parsing safely
                isLoaded = true;
                container.classList.add("active");
                bootScreen.style.opacity = "0";
                bootScreen.style.pointerEvents = "none";

                // ---- STAGES 2-5: CONTROLLED PROGRESSIVE UPDATES ----
                for (let i = 2; i <= 5; i++) {
                    // Give the GPU buffer 500ms to cycle frames and settle data structures 
                    // from the previous part before choking the stream with a new network request
                    await new Promise(resolve => setTimeout(resolve, 500));

                    console.log(`[NET FETCH] Downloading part ${i}...`);
                    const res = await fetch(`${hfRoot}_part${i}.ply`);
                    if (!res.ok) break; 
                    const dataBlob = await res.blob();
                    
                    const bUrl = URL.createObjectURL(dataBlob);
                    await SPLAT.Loader.LoadAsync(bUrl, scene);
                    URL.revokeObjectURL(bUrl);
                    
                    console.log(`[GPU ALLOCATED] Part ${i} successfully bound to unified layout.`);
                }
                console.log("%c[SUCCESS] All point clouds successfully unified on canvas.", "color: #00ff00");

            } catch (err) {
                console.error("Pipeline breakdown across data streams:", err);
                initFallbackEngine();
            }
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            if (!isLoaded) return; 

            controls.update();
            renderer.render(scene, camera);
        }

        function resizeCanvas() { if (renderer) renderer.setSize(window.innerWidth, window.innerHeight); }
        window.addEventListener("resize", resizeCanvas);

        // =========================================================================
        // --- VECTOR CLOUD FALLBACK SUBSYSTEM ---
        // =========================================================================
        let fallbackCtx; let points = []; const maxPoints = 300;
        function initFallbackEngine() {
            container.innerHTML = '<canvas id="fallback-canvas" style="display:block; width:100%; height:100%;"></canvas>';
            const fallbackCanvas = document.getElementById("fallback-canvas");
            fallbackCtx = fallbackCanvas.getContext("2d");
            fallbackCanvas.width = window.innerWidth; fallbackCanvas.height = window.innerHeight;
            for (let i = 0; i < maxPoints; i++) {
                points.push({ x: (Math.random() - 0.5) * 500, y: (Math.random() - 0.5) * 500, z: Math.random() * 500, radius: Math.random() * 1.5 + 0.5, pulse: Math.random() * Math.PI });
            }
            bootScreen.style.opacity = "0"; bootScreen.style.pointerEvents = "none"; container.classList.add("active");
            fallbackRenderLoop();
        }
        function fallbackRenderLoop() {
            requestAnimationFrame(fallbackRenderLoop);
            fallbackCtx.fillStyle = "rgba(5, 5, 5, 0.25)"; fallbackCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            const centerX = window.innerWidth / 2; const centerY = window.innerHeight / 2; const perspectiveScale = 400;
            for (let i = 0; i < points.length; i++) {
                let pt = points[i]; let dZ = pt.z + 350;
                if (dZ > 0) {
                    const scrX = pt.x * (perspectiveScale / dZ) + centerX; const scrY = pt.y * (perspectiveScale / dZ) + centerY; const scrSize = pt.radius * (perspectiveScale / dZ);
                    pt.pulse += 0.01; const opacity = (Math.abs(Math.sin(pt.pulse)) * 0.4 + 0.5) * (1 - (pt.z / 500));
                    fallbackCtx.beginPath(); fallbackCtx.arc(scrX, scrY, scrSize, 0, Math.PI * 2); fallbackCtx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.85})`; fallbackCtx.fill();
                }
            }
        }
        window.onload = () => { initEngine(); renderLoop(); };
    </script>
</body>
</html>
