<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IORI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">

    <style>
        /* --- BRUTALIST & MINIMALIST RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #ffffff;
        }

        /* --- BACKGROUND CANVAS LAYER --- */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            transition: filter 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease;
            opacity: 0;
            filter: brightness(0) contrast(1.8) blur(30px);
        }

        #canvas-container.active {
            opacity: 1;
            filter: brightness(1.05) contrast(1.02) blur(0px);
        }

        #splat-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- ULTRA-MINIMAL BRUTALIST OVERLAY --- */
        .brutalist-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .brand-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(5rem, 25vw, 32rem);
            font-weight: 800;
            line-height: 0.75;
            letter-spacing: -0.06em;
            text-transform: uppercase;
            color: #ffffff;
            text-align: center;
            mix-blend-mode: difference;
        }

        /* --- SUBTLE SCANLINE FILTER --- */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            opacity: 0.25;
        }

        /* --- LOADING LAYOUT --- */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-left-color: #ffffff;
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="canvas-container">
        <canvas id="splat-canvas"></canvas>
    </div>

    <div class="brutalist-overlay">
        <h1 class="brand-title">IORI</h1>
    </div>

    <div id="boot-screen">
        <div class="spinner"></div>
    </div>

    <script type="module">
        import * as SPLAT from "https://cdn.jsdelivr.net/npm/gsplat@1.2.0/dist/index.js";

        const HF_USER_REPO = "iorioriori/splats";

        const splatScenes = [
            "gs_Dandy", "gs_alive", "gs_and_l", "gs_carousel", "gs_creatures",
            "gs_fia", "gs_flora", "gs_govno", "gs_ior", "gs_iridescence",
            "gs_iriscient", "gs_jjj", "gs_kaczinski", "gs_kanal", "gs_kolo",
            "gs_kyticki", "gs_lili", "gs_lou", "gs_ma_bh", "gs_meadow",
            "gs_moses", "gs_my_man", "gs_nova_scena", "gs_p_edti", "gs_pool",
            "gs_puddy", "gs_pulz", "gs_rapture", "gs_rozi", "gs_ruh",
            "gs_scen_rie", "gs_shack", "gs_stvana", "gs_tick", "gs_umu",
            "gs_vltava", "gs_vodn_k", "gs_yum", "gs_yummy_like_u", "gs_zoch"
        ];

        const chosenScene = splatScenes[Math.floor(Math.random() * splatScenes.length)];
        const hfRoot = `https://huggingface.co/datasets/${HF_USER_REPO}/resolve/main/${chosenScene}`;

        let renderer, scene, camera;
        let isUsingFallback = false;
        let isLoaded = false; 

        let ndcX = 0, ndcY = 0, smoothX = 0, smoothY = 0;
        
        // Target tracking center will update dynamically on file parse completion
        let sceneCenter = { x: 0, y: 0, z: 0 };
        let cameraOffset = { x: 0, y: 0.5, z: 4.0 };

        const container = document.getElementById("canvas-container");
        const canvas = document.getElementById("splat-canvas");
        const bootScreen = document.getElementById("boot-screen");

        function initEngine() {
            try {
                renderer = new SPLAT.WebGLRenderer(canvas);
                scene = new SPLAT.Scene();
                camera = new SPLAT.Camera();
                resizeCanvas();
                loadFrontLoadedWaterfall();
            } catch (err) {
                console.warn("WebGL initialization failed. Loading backup vector layout...", err);
                initFallbackEngine();
            }
        }

        async function loadFrontLoadedWaterfall() {
            container.classList.remove("active");
            bootScreen.style.opacity = "1";
            bootScreen.style.pointerEvents = "auto";
            isLoaded = false; 
            scene = new SPLAT.Scene();

            try {
                const targetUrl = `${hfRoot}_part1.ply`;
                console.log(`[START] Querying Hugging Face: ${targetUrl}`);

                // ---- STAGE 1: CORE FOCUS PASS ----
                const coreObject = await SPLAT.Loader.LoadAsync(targetUrl, scene);
                
                // ---- CALCULATE TRUE COORD CENTER ----
                const data = coreObject.data || coreObject.splatData || coreObject;
                const positions = data ? (data.positions || data._positions) : null;
                const vertexCount = positions ? (positions.length / 3) : 0;
                const sampleCount = Math.min(vertexCount, 2500);
                
                if (sampleCount > 0 && positions) {
                    let sumX = 0, sumY = 0, sumZ = 0;
                    for (let i = 0; i < sampleCount; i++) {
                        sumX += positions[i * 3];
                        sumY += positions[i * 3 + 1];
                        sumZ += positions[i * 3 + 2];
                    }
                    sceneCenter.x = sumX / sampleCount;
                    sceneCenter.y = sumY / sampleCount;
                    sceneCenter.z = sumZ / sampleCount;
                }
                console.log(`[AUTOFRAME] Object isolated at structural world vectors:`, sceneCenter);

                // Set initial camera frame layout safely relative to calculated spatial cluster
                camera.position.x = sceneCenter.x + cameraOffset.x;
                camera.position.y = sceneCenter.y + cameraOffset.y;
                camera.position.z = sceneCenter.z + cameraOffset.z;

                isLoaded = true;
                container.classList.add("active");
                bootScreen.style.opacity = "0";
                bootScreen.style.pointerEvents = "none";

                // ---- STAGES 2-5: BACKGROUND CASCADE PIPELINE ----
                // Runs completely asynchronously without halting active frame updates
                const streamPart = (num) => {
                    return SPLAT.Loader.LoadAsync(`${hfRoot}_part${num}.ply`, scene)
                        .then(() => console.log(`[WATERFALL ${num}/5] Injected layer components into canvas context.`));
                };

                streamPart(2)
                    .then(() => streamPart(3))
                    .then(() => streamPart(4))
                    .then(() => streamPart(5))
                    .then(() => console.log("%c[SUCCESS] Volumetric field synchronized completely.", "color: #00ff00"))
                    .catch(e => console.warn("Background asset append dropped:", e));

            } catch (err) {
                console.error("Pipeline failure:", err);
                initFallbackEngine();
            }
        }

        window.addEventListener("mousemove", (e) => {
            ndcX = (e.clientX / window.innerWidth) * 2 - 1;
            ndcY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener("touchmove", (e) => {
            if (e.touches.length > 0) {
                ndcX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                ndcY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        });

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            if (isUsingFallback || !isLoaded) return; 

            smoothX += (ndcX - smoothX) * 0.05;
            smoothY += (ndcY - smoothY) * 0.05;

            // Anchor view transforms relative to the calculated data coordinates
            camera.position.x = (sceneCenter.x + cameraOffset.x) + (smoothX * 1.5);
            camera.position.y = (sceneCenter.y + cameraOffset.y) + (smoothY * 1.0);
            camera.position.z = (sceneCenter.z + cameraOffset.z);

            const dir = new SPLAT.Vector3(
                camera.position.x - sceneCenter.x,
                camera.position.y - sceneCenter.y,
                camera.position.z - sceneCenter.z
            );
            camera.rotation = SPLAT.Quaternion.LookRotation(dir, new SPLAT.Vector3(0, 1, 0));

            renderer.render(scene, camera);
        }

        function resizeCanvas() { if (renderer) renderer.setSize(window.innerWidth, window.innerHeight); }
        window.addEventListener("resize", resizeCanvas);

        // =========================================================================
        // --- BACKUP VECTOR CLOUD FALLBACK SUBSYSTEM ---
        // =========================================================================
        let fallbackCtx; let points = []; const maxPoints = 300;
        function initFallbackEngine() {
            isUsingFallback = true;
            container.innerHTML = '<canvas id="fallback-canvas" style="display:block; width:100%; height:100%;"></canvas>';
            const fallbackCanvas = document.getElementById("fallback-canvas");
            fallbackCtx = fallbackCanvas.getContext("2d");
            window.addEventListener("resize", () => { fallbackCanvas.width = window.innerWidth; fallbackCanvas.height = window.innerHeight; });
            fallbackCanvas.width = window.innerWidth; fallbackCanvas.height = window.innerHeight;

            for (let i = 0; i < maxPoints; i++) {
                points.push({ x: (Math.random() - 0.5) * 500, y: (Math.random() - 0.5) * 500, z: Math.random() * 500, radius: Math.random() * 1.5 + 0.5, pulse: Math.random() * Math.PI });
            }
            bootScreen.style.opacity = "0"; bootScreen.style.pointerEvents = "none"; container.classList.add("active");
            fallbackRenderLoop();
        }

        function fallbackRenderLoop() {
            if (!isUsingFallback) return; requestAnimationFrame(fallbackRenderLoop);
            fallbackCtx.fillStyle = "rgba(5, 5, 5, 0.25)"; fallbackCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            smoothX += (ndcX - smoothX) * 0.05;
            const centerX = window.innerWidth / 2; const centerY = window.innerHeight / 2; const perspectiveScale = 400;

            for (let i = 0; i < points.length; i++) {
                let pt = points[i]; let cosY = Math.cos(smoothX * 0.4); let sinY = Math.sin(smoothX * 0.4);
                let x1 = pt.x * cosY - pt.z * sinY; let z1 = pt.x * sinY + pt.z * cosY; let dZ = z1 + 350;

                if (dZ > 0) {
                    const scrX = x1 * (perspectiveScale / dZ) + centerX; const scrY = pt.y * (perspectiveScale / dZ) + centerY; const scrSize = pt.radius * (perspectiveScale / dZ);
                    pt.pulse += 0.01; const opacity = (Math.abs(Math.sin(pt.pulse)) * 0.4 + 0.5) * (1 - (z1 / 500));
                    fallbackCtx.beginPath(); fallbackCtx.arc(scrX, scrY, scrSize, 0, Math.PI * 2); fallbackCtx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.85})`; fallbackCtx.fill();
                }
            }
        }

        window.onload = () => { initEngine(); renderLoop(); };
    </script>
</body>
</html>
