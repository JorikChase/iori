<!doctype html>
<html lang="en">
<head>

<title>Iris Engine — 3.11 shell mock (study/09)</title>
<!-- Static mock for study/09-ui-shell-plan.md. No engine, no WebGL: a drawn stand-in iris, the 3.11 window
     manager, the gaze rules and the native photo overlay, so the design can be judged before the app is touched.
     ?phone forces the phone layout, ?touch forces touch sizing. -->
<style>
    :root { --row: 22px; --cap: 18px; --fs: 12px; --grey: #c0c0c0; --dk: #808080; --navy: #000080; --n: 23px; --menuh: 20px; }
    body.touch { --row: 40px; --cap: 30px; --fs: 15px; --n: 35px; --menuh: 34px; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    body { --font: Arial, Helvetica, sans-serif; --fw: 700; font: var(--fw) var(--fs)/1 var(--font); -webkit-font-smoothing: none; font-smooth: never; color: #000; user-select: none; -webkit-user-select: none; touch-action: none; }
    button { font: inherit; color: inherit; margin: 0; }
    svg { display: block; }

    /* ---- application frame: caption + menu bar ---- */
    #app-cap, .cap { height: var(--cap); display: flex; align-items: stretch; background: #fff; color: #000; border-bottom: 1px solid #000; }
    #app-cap, .win.active .cap { background: var(--navy); color: #fff; }
    b, .grp > b { font-weight: var(--fw); } .cap-t { flex: 1; text-align: center; line-height: var(--cap); white-space: nowrap; overflow: hidden; cursor: default; }
    .ctl { width: var(--cap); padding: 0; background: var(--grey); border: 0; border-right: 1px solid #000; position: relative; }
    .ctl::after { content: ""; position: absolute; left: 3px; right: 4px; top: 50%; height: 3px; margin-top: -2px; background: #fff; border: 1px solid #000; box-shadow: 1px 1px 0 var(--dk); box-sizing: border-box; }
    .capb { width: var(--cap); padding: 0; background: var(--grey); border: 0; border-left: 1px solid #000; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--dk); display: grid; place-items: center; }
    .capb:active { box-shadow: inset 1px 1px 0 var(--dk); }
    #menubar { height: var(--menuh); display: flex; align-items: stretch; background: #fff; border-bottom: 1px solid #000; position: relative; z-index: 50; }
    .m-top { padding: 0 8px; line-height: var(--menuh); cursor: default; }
    .m-top.open { background: var(--navy); color: #fff; }
    #status { margin-left: auto; padding: 0 8px; line-height: var(--menuh); font-weight: normal; white-space: nowrap; overflow: hidden; }
    .menu { position: fixed; background: #fff; border: 1px solid #000; z-index: 9000; min-width: 170px; max-height: 80vh; overflow-y: auto; }
    .mi { padding: 0 24px; line-height: calc(var(--row) - 2px); white-space: nowrap; position: relative; cursor: default; }
    .mi:hover, .mi.hot { background: var(--navy); color: #fff; }
    .mi.dis { color: var(--dk); } .mi.dis:hover { background: #fff; color: var(--dk); }
    .mi.chk::before { content: "\2713"; position: absolute; left: 7px; }
    .mi.sub::after { content: ""; position: absolute; right: 7px; top: 50%; margin-top: -4px; border: 4px solid transparent; border-left-color: currentColor; border-right: 0; }
    .sep { border-top: 1px solid #000; margin: 2px 0; }

    /* ---- scene ---- */
    #scene { position: fixed; left: 0; right: 0; top: calc(var(--cap) + var(--menuh) + 2px); bottom: 0; perspective: 900px; overflow: hidden; }
    #eye { position: absolute; left: 50%; top: 50%; will-change: transform; }
    #eye canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #pupil { position: absolute; left: 50%; top: 50%; width: 33.12%; height: 33.12%; border-radius: 50%; background: radial-gradient(closest-side, #000 90%, rgba(0,0,0,0)); }
    #photo, #marks, #wipe { display: none; }
    #marks { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #marks .hnd { fill: #fff; stroke: #000; stroke-width: 1; cursor: move; } #marks .hit { fill: transparent; cursor: move; }
    #wipe { position: absolute; top: -4%; bottom: -4%; width: 2px; margin-left: -1px; background: #ff0; outline: 1px solid #000; cursor: ew-resize; }
    #wipe::after { content: ""; position: absolute; left: -21px; top: 50%; width: 44px; height: 44px; margin-top: -22px; background: radial-gradient(circle, var(--grey) 0 7px, #000 7px 8px, transparent 8px); }

    /* ---- windows ---- */
    .win { position: fixed; width: 286px; background: var(--grey); border: 1px solid #000; padding: 3px; box-sizing: border-box; z-index: 100; display: none; }
    .win.open { display: block; }
    .win::before { content: ""; position: absolute; inset: 0; pointer-events: none; background:
        linear-gradient(#000,#000) var(--n) 0 / 1px 4px no-repeat, linear-gradient(#000,#000) calc(100% - var(--n)) 0 / 1px 4px no-repeat,
        linear-gradient(#000,#000) var(--n) 100% / 1px 4px no-repeat, linear-gradient(#000,#000) calc(100% - var(--n)) 100% / 1px 4px no-repeat,
        linear-gradient(#000,#000) 0 var(--n) / 4px 1px no-repeat, linear-gradient(#000,#000) 0 calc(100% - var(--n)) / 4px 1px no-repeat,
        linear-gradient(#000,#000) 100% var(--n) / 4px 1px no-repeat, linear-gradient(#000,#000) 100% calc(100% - var(--n)) / 4px 1px no-repeat; }
    .win-in { border: 1px solid #000; background: var(--grey); }
    .win .cap-t { cursor: move; }
    .win-body { padding: 6px 7px 7px; }
    .b { background: var(--grey); border: 1px solid #000; border-radius: 3px; height: var(--row); padding: 0 8px; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--dk), inset -2px -2px 0 var(--dk); display: inline-grid; place-items: center; white-space: nowrap; }
    .b:active, .b.on { box-shadow: inset 1px 1px 0 var(--dk), inset 2px 2px 0 var(--dk); padding: 1px 7px 0 9px; }
    .b.on { background: #dcdcdc; }
    .b.def { box-shadow: 0 0 0 1px #000, inset 1px 1px 0 #fff, inset -1px -1px 0 var(--dk), inset -2px -2px 0 var(--dk); }
    .brow { display: flex; gap: 4px; margin: 6px 0 0; flex-wrap: wrap; } .brow .b { flex: 1; padding: 0 3px; } .brow .b:active, .brow .b.on { padding: 1px 2px 0 4px; }
    .grp { border: 1px solid var(--dk); box-shadow: 1px 1px 0 #fff, inset 1px 1px 0 #fff; padding: 9px 6px 6px; margin: 10px 0 0; position: relative; }
    .grp > b { position: absolute; top: -6px; left: 8px; background: var(--grey); padding: 0 3px; }
    .grp .brow:first-of-type { margin-top: 0; }
    .log { background: #fff; border: 1px solid #000; box-shadow: inset 1px 1px 0 var(--dk); margin-top: 8px; padding: 4px 5px; font-weight: normal; line-height: 1.35; min-height: 2.7em; }

    /* scrubber = Apple-Photos ruler dressed as a 3.1 scroll bar */
    .scrub { display: grid; grid-template-columns: 54px 1fr 50px; align-items: center; gap: 5px; height: calc(var(--row) + 2px); }
    .s-bar { display: flex; height: calc(var(--row) - 4px); border: 1px solid #000; }
    .s-a { width: calc(var(--row) - 6px); min-width: 16px; padding: 0; background: var(--grey); border: 0; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--dk); display: grid; place-items: center; }
    .s-a:active { box-shadow: inset 1px 1px 0 var(--dk); }
    .s-r { flex: 1; position: relative; overflow: hidden; background: #fff; border-left: 1px solid #000; border-right: 1px solid #000; cursor: ew-resize; touch-action: none; }
    .s-r canvas { position: absolute; left: 0; top: 0; }
    .s-r i { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--navy); pointer-events: none; }
    .s-v { text-align: right; font-weight: normal; font-variant-numeric: tabular-nums; cursor: text; white-space: nowrap; }
    .s-v input { width: 100%; box-sizing: border-box; font: inherit; border: 1px solid #000; padding: 0 2px; text-align: right; }

    /* Design = Paintbrush: two-column tool box, settings beside it, palette strip below */
    .pb { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
    .tools { display: grid; grid-template-columns: repeat(2, calc(var(--row) + 6px)); border: 1px solid #000; background: #000; gap: 1px; align-self: start; }
    .tool { height: calc(var(--row) + 6px); padding: 0; border: 0; background: #fff; display: grid; place-items: center; }
    .tool.on { background: #000; } .tool.on svg { filter: invert(1); }
    .pal { display: grid; grid-template-columns: calc(var(--row) * 2) repeat(8, 1fr); gap: 0; margin-top: 8px; border: 1px solid #000; background: #000; }
    .pal span { height: calc(var(--row) / 2 + 3px); box-shadow: inset 0 0 0 1px #000; }
    .pal .cur { grid-row: 1 / 3; height: auto; display: grid; place-items: center; background: var(--grey); }
    .pal .cur em { width: 55%; height: 55%; border: 1px solid #000; }

    /* ---- desktop icons ---- */
    #icons { position: fixed; left: 64px; bottom: 6px; display: flex; gap: 6px; align-items: flex-end; z-index: 60; }
    .dicon { width: 66px; padding: 4px 0; background: none; border: 0; display: grid; justify-items: center; gap: 3px; }
    .dicon img { width: 32px; height: 32px; image-rendering: pixelated; }
    .dicon span { padding: 1px 3px; background: #fff; } .dicon:active span, .dicon.on span { background: var(--navy); color: #fff; }
    #burger { position: fixed; left: 14px; bottom: 12px; width: 36px; height: 44px; display: grid; place-items: center; z-index: 61; opacity: .9; }

    /* ---- modal dialog ---- */
    #veil { position: fixed; inset: 0; z-index: 9500; display: none; place-items: center; } #veil.on { display: grid; }
    #about { position: static; display: block; width: 300px; }
    #about .win-body { display: grid; grid-template-columns: 40px 1fr; gap: 8px 10px; padding: 12px; font-weight: normal; line-height: 1.4; }

    /* ---- phone: one bottom sheet + icon strip ---- */
    body.phone #menubar, body.phone #app-cap .capb { display: none; }
    body.phone #scene { top: calc(var(--cap) + 1px); }
    body.phone #icons { left: 56px; right: 0; bottom: 0; height: 68px; gap: 0; overflow-x: auto; touch-action: pan-x; background: #fff; border-top: 1px solid #000; align-items: center; }
    body.phone .dicon { flex: 1 0 50px; width: auto; font-size: 11px; } body.phone .dicon span { padding: 1px 1px; }
    body.phone .win { left: 0 !important; right: 0; top: auto !important; bottom: 69px; width: auto; padding: 0; border-left: 0; border-right: 0; }
    body.phone .win::before { display: none; } body.phone .win-in { border-left: 0; border-right: 0; border-bottom: 0; }
    body.phone .win-body { max-height: calc(40vh - var(--cap)); overflow-y: auto; touch-action: pan-y; }
    body.phone .win .cap-t { cursor: default; }
    body.phone #burger { bottom: 12px; }
</style>
</head>
<body>
<div id="app-cap"><button class="ctl" id="app-ctl" aria-label="Control menu"></button><span class="cap-t">Iris Engine</span><button class="capb" aria-label="Minimize"><svg width="9" height="5"><path d="M0 0h9L4.5 5z"/></svg></button><button class="capb" aria-label="Maximize"><svg width="9" height="5"><path d="M0 5h9L4.5 0z"/></svg></button></div>
<div id="menubar"></div>
<div id="scene">
    <div id="eye">
        <canvas id="render" width="768" height="768"></canvas>
        <div id="pupil"></div>
        <canvas id="photo" width="768" height="768"></canvas>
        <svg id="marks" viewBox="0 0 512 512"></svg>
        <div id="wipe" class="ui"></div>
    </div>
</div>
<div id="icons"></div>
<div id="burger" title="the site burger stays here (menu_pos: bl)"><svg width="24" height="34" viewBox="0 0 24 34"><path d="M12 0l11 10H1z" fill="#7be07b"/><path d="M12 11l11 10H1z" fill="#6cc4f5"/><path d="M12 22l11 10H1z" fill="#f5b942"/></svg></div>
<div id="veil"><div class="win active" id="about"><div class="win-in"><div class="cap"><button class="ctl" data-close></button><span class="cap-t">About Iris Engine</span></div>
    <div class="win-body"><img id="about-ico" width="32" height="32" style="image-rendering:pixelated" alt=""><div><b>Iris Engine</b><br>3.11 shell mock · study/09<br>Own icons and chrome, drawn in the idiom — nothing copied from Microsoft.</div><span></span><div style="text-align:right"><button class="b def" data-close style="min-width:70px">OK</button></div></div></div></div></div>

<script>
(() => {
    const $ = s => document.querySelector(s);
    const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const tri = d => `<svg width="5" height="9"><path d="${d < 0 ? 'M5 0v9L0 4.5z' : 'M0 0v9L5 4.5z'}"/></svg>`;
    const q = location.search;
    let phone = false, overlay = 'off', zTop = 100, active = null;
    const say = t => { flash = t; flashT = 2.5; };
    let flash = '', flashT = 0;

    // =====================================================================================================
    // icons: drawn with canvas commands on a 32 × 32 grid, then quantised to the 16-colour VGA palette with a
    // 4 × 4 Bayer dither (the 3.1 look: black outline, flat colour, dithered shading). Our own drawings.
    // =====================================================================================================
    const VGA = [[0,0,0],[128,0,0],[0,128,0],[128,128,0],[0,0,128],[128,0,128],[0,128,128],[192,192,192],[128,128,128],[255,0,0],[0,255,0],[255,255,0],[0,0,255],[255,0,255],[0,255,255],[255,255,255]];
    const B4 = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
    const ICON = {
        eye(c) { c.beginPath(); c.moveTo(1.5, 16.5); c.quadraticCurveTo(16, 1, 30.5, 16.5); c.quadraticCurveTo(16, 32, 1.5, 16.5); c.fillStyle = '#fff'; c.fill(); c.stroke();
            const g = c.createRadialGradient(16, 16.5, 3, 16, 16.5, 8); g.addColorStop(0, '#0ff'); g.addColorStop(1, '#008080'); disc(c, 16, 16.5, 7.5, g); disc(c, 16, 16.5, 3, '#000', 0); c.fillStyle = '#fff'; c.fillRect(18, 12, 2, 2); },
        camera(c) { box(c, 11, 5, 10, 5, '#808080'); box(c, 2, 9, 28, 18, '#c0c0c0'); c.fillStyle = '#fff'; c.fillRect(3, 10, 26, 1); c.fillRect(3, 10, 1, 16); c.fillStyle = '#808080'; c.fillRect(3, 25, 26, 1); c.fillRect(28, 10, 1, 16);
            const g = c.createRadialGradient(14, 16, 1, 16, 18, 7); g.addColorStop(0, '#0ff'); g.addColorStop(.5, '#00f'); g.addColorStop(1, '#000080'); disc(c, 16, 18, 6.5, g); box(c, 4, 12, 5, 3, '#ff0'); c.fillStyle = '#f00'; c.fillRect(25, 12, 2, 2); },
        material(c) { c.beginPath(); c.ellipse(16, 16.5, 14, 11, -0.2, 0, 6.2832); const g = c.createLinearGradient(4, 6, 28, 28); g.addColorStop(0, '#fff'); g.addColorStop(1, '#c0c0c0'); c.fillStyle = g; c.fill(); c.stroke();
            disc(c, 23, 21, 2.6, '#808080'); [[8, 15, '#f00'], [12, 10, '#ff0'], [18, 8, '#0f0'], [24, 11, '#00f'], [9, 21, '#f0f'], [15, 24, '#808000']].forEach(([x, y, col]) => disc(c, x, y, 2.4, col, 0)); },
        relief(c) { box(c, 2, 26, 28, 4, '#008000'); c.beginPath(); c.moveTo(2.5, 26.5); c.lineTo(11.5, 7.5); c.lineTo(16.5, 17.5); c.lineTo(21.5, 11.5); c.lineTo(29.5, 26.5); c.closePath(); const g = c.createLinearGradient(4, 0, 28, 0); g.addColorStop(0, '#fff'); g.addColorStop(.45, '#c0c0c0'); g.addColorStop(1, '#404040'); c.fillStyle = g; c.fill(); c.stroke();
            c.beginPath(); c.moveTo(11.5, 7.5); c.lineTo(9, 14); c.lineTo(11.5, 12.5); c.lineTo(13, 15); c.lineTo(14.5, 13.5); c.closePath(); c.fillStyle = '#fff'; c.fill(); },
        flow(c) { for (const [y, col] of [[8, '#00f'], [16, '#008080'], [24, '#00f']]) { c.beginPath(); for (let x = 2; x <= 26; x++) { const yy = y + Math.sin(x * 0.55) * 2.6; x === 2 ? c.moveTo(x, yy) : c.lineTo(x, yy); } c.lineWidth = 4; c.strokeStyle = '#000'; c.stroke(); c.lineWidth = 2; c.strokeStyle = col; c.stroke(); c.lineWidth = 1; c.strokeStyle = '#000';
                const ye = y + Math.sin(26 * 0.55) * 2.6; c.beginPath(); c.moveTo(25, ye - 4); c.lineTo(31, ye); c.lineTo(25, ye + 4); c.closePath(); c.fillStyle = col; c.fill(); c.stroke(); } },
        fit(c) { box(c, 2, 4, 28, 24, '#fff'); c.fillStyle = '#000'; c.fillRect(4, 6, 24, 20); disc(c, 16, 16, 7.5, '#808000', 0); disc(c, 16, 16, 2.8, '#000', 0);
            c.strokeStyle = '#ff0'; c.beginPath(); c.arc(16, 16, 8.5, 0, 6.2832); c.stroke(); c.strokeStyle = '#0ff'; c.beginPath(); c.arc(16, 16, 3.5, 0, 6.2832); c.moveTo(16, 11); c.lineTo(16, 21); c.moveTo(11, 16); c.lineTo(21, 16); c.stroke(); c.strokeStyle = '#000'; },
        design(c) { c.save(); c.translate(16, 16); c.rotate(Math.PI / 4); box(c, -4, -15, 7, 5, '#f00'); box(c, -4, -10, 7, 3, '#c0c0c0'); box(c, -4, -7, 7, 14, '#ff0'); c.fillStyle = '#808000'; c.fillRect(0, -6, 2, 13);
            c.beginPath(); c.moveTo(-3.5, 7.5); c.lineTo(3.5, 7.5); c.lineTo(0, 15); c.closePath(); c.fillStyle = '#fff'; c.fill(); c.stroke(); c.beginPath(); c.moveTo(-1.5, 12); c.lineTo(1.5, 12); c.lineTo(0, 15); c.closePath(); c.fillStyle = '#000'; c.fill(); c.restore(); },
    };
    function box(c, x, y, w, hh, col) { c.fillStyle = col; c.fillRect(x, y, w, hh); c.strokeRect(x + .5, y + .5, w - 1, hh - 1); }
    function disc(c, x, y, r, col, line = 1) { c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fillStyle = col; c.fill(); if (line) c.stroke(); }
    function icon(name) {
        const cv = document.createElement('canvas'); cv.width = cv.height = 32; const c = cv.getContext('2d'); c.lineWidth = 1; c.strokeStyle = '#000'; ICON[name](c);
        const im = c.getImageData(0, 0, 32, 32), d = im.data;
        for (let i = 0; i < 1024; i++) { const o = i * 4; if (d[o + 3] < 128) { d[o + 3] = 0; continue; } const t = (B4[((i >> 5) & 3) * 4 + (i & 3)] / 16 - 0.47) * 56; let best = 0, bd = 1e9;
            for (let k = 0; k < 16; k++) { const p = VGA[k], e = (d[o] + t - p[0]) ** 2 + (d[o + 1] + t - p[1]) ** 2 + (d[o + 2] + t - p[2]) ** 2; if (e < bd) { bd = e; best = k; } }

    }
    const GLYPH = {   // 16 px monochrome tool-box glyphs (from ui.js)
        paint: '<path d="M2 14c0-3 2-3 3-5l6-6 2 2-6 6c-2 1-2 3-5 3z" fill="none" stroke="#000"/>', add: '<path d="M8 3v10M3 8h10" stroke="#000" stroke-width="2"/>', sub: '<path d="M3 8h10" stroke="#000" stroke-width="2"/>',
        smooth: '<path d="M8 2c3 4 5 6 5 8a5 5 0 0 1-10 0c0-2 2-4 5-8z" fill="none" stroke="#000"/>', smear: '<path d="M6 14V7a2 2 0 0 1 4 0v3l3-1v3l-3 2z" fill="none" stroke="#000"/>',
        dent: '<path d="M2 6c0 6 12 6 12 0" fill="none" stroke="#000"/><path d="M2 6h12" stroke="#000" stroke-dasharray="1 2"/>', bump: '<path d="M2 10c0-6 12-6 12 0" fill="none" stroke="#000"/><path d="M2 10h12" stroke="#000" stroke-dasharray="1 2"/>',
        streak: '<path d="M3 13L13 3" stroke="#000" stroke-width="2"/>', color: '<path d="M8 2c2 3 4 5 4 8a4 4 0 0 1-8 0c0-3 2-5 4-8z" fill="#000"/>', pick: '<path d="M12 2l2 2-3 3-1-1-5 5-2 1 1-2 5-5-1-1z" fill="none" stroke="#000"/>',
    };

    // =====================================================================================================
    // the stand-in iris (canvas 2-D). The render has no pupil (a DOM disc, so it can constrict) and a white
    // surround; the "photo" is an isolated macro on black with its own seed, so DIFF / WIPE / BLINK show work.
    // =====================================================================================================
    const PRESETS = {
        '09': { name: 'Blue-green · 09', inner: '#b08a3c', mid: '#5f8f8a', outer: '#2f5f6e', fibre: '190,225,225' },
        '25': { name: 'Green, amber ring · 25', inner: '#c8892a', mid: '#7f8f3c', outer: '#3f5a2c', fibre: '225,225,160' },
        '26': { name: 'Green, crypts · 26', inner: '#a88a3a', mid: '#6f8a4a', outer: '#34502f', fibre: '215,230,170' },
        '35': { name: 'Grey-green · 35', inner: '#9a8a5a', mid: '#7a8a80', outer: '#44564f', fibre: '220,228,220' },
        brown: { name: 'Brown (procedural)', inner: '#a8601c', mid: '#7a4312', outer: '#3a1d08', fibre: '235,180,110' },
    };
    let preset = 'brown', seed = 42;
    function drawIris(cv, P, sd, photo) {
        const c = cv.getContext('2d'), S = cv.width, m = S / 2, R = S * 0.46, rp = R * 0.36; let s = sd >>> 0; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
        c.clearRect(0, 0, S, S); if (photo) { c.fillStyle = '#000'; c.fillRect(0, 0, S, S); }
