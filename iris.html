    <meta charset="UTF-8">

    <title>PROCEDURAL IRIS</title>
    <style>
        :root {
            --bg: #d8d8d4;
            --ink: #111111;
            --alert: #ff4400;
            --dim: #888888;
            --panel-bg: rgba(224, 224, 220, 0.9);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            color: var(--ink);
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- BRUTALIST UI --- */
        #ui-container {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            z-index: 10;
            padding: 20px;
            pointer-events: none;
        }

        #ui-panel {
            pointer-events: auto;
            background: var(--panel-bg);
            border: 1px solid var(--ink);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s cubic-bezier(0.1, 0.7, 1.0, 0.1), opacity 0.2s;
            transform-origin: top right;
        }

        #ui-panel.collapsed {
            transform: scaleY(0);
            opacity: 0;
            pointer-events: none;
        }

        .meta-block {
            border-bottom: 1px solid var(--ink);
            padding-bottom: 8px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .meta-id {
            font-weight: bold;
        }

        .meta-stat {
            color: var(--alert);
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: -1px;
        }

        .grid-btn {
            background: transparent;
            border: 1px solid var(--ink);
            margin-right: -1px;
            margin-bottom: -1px;
            color: var(--ink);
            padding: 8px 0;
            cursor: pointer;
            font-size: 10px;
            text-transform: uppercase;
            font-family: inherit;
            transition: background 0.1s;
        }

        .grid-btn:hover {
            background: var(--ink);
            color: var(--bg);
        }

        .grid-btn:active {
            background: var(--alert);
            color: #fff;
        }

        .param-row {
            display: grid;
            grid-template-columns: 40px 1fr 35px;
            align-items: center;
            gap: 10px;
            font-size: 10px;
        }

        .param-label {
            color: var(--dim);
            text-transform: uppercase;
        }

        .param-val {
            text-align: right;
            color: var(--ink);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 1px;
            background: var(--ink);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px;
            height: 12px;
            background: var(--alert);
            border: none;
            cursor: col-resize;
        }

        #ui-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 24px;
            height: 24px;
            border: 1px solid var(--ink);
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            pointer-events: auto;
        }

        #ui-toggle:hover {
            background: var(--ink);
        }

        #ui-toggle:hover svg {
            fill: var(--bg);
        }

        #ui-toggle svg {
            width: 10px;
            height: 10px;
            fill: var(--ink);
        }

        .crosshair {
            position: fixed;
            pointer-events: none;
            background: var(--ink);
        }

        .ch-h {
            height: 1px;
            width: 20px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .ch-v {
            width: 1px;
            height: 20px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .corner {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 1px solid var(--ink);
            pointer-events: none;
            opacity: 0.5;
        }

        .tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        .bl {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .buffer-line {
            height: 2px;
            background: var(--alert);
            width: 0%;
            margin-top: 5px;
            transition: width 0.1s;
        }

        /* --- UPDATED SELECTION MARQUEE (RAINBOW) --- */
        @keyframes rainbow-cycle {
            0% {
                filter: hue-rotate(0deg);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        #selection-marquee {
            position: absolute;
            /* Rainbow Gradient Border */
            border: 1px solid transparent;
            border-image: linear-gradient(45deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00) 1;

            /* Glassy/Saturated Look */
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.2);
            backdrop-filter: saturate(200%) contrast(120%);

            pointer-events: none;
            display: none;
            z-index: 5;
            animation: rainbow-cycle 3s linear infinite;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

    <canvas id="gl"></canvas>

    <!-- VERTEX SHADER -->
    <script id="vs" type="x-shader/x-vertex">
        #version 300 es
        in vec4 position;
        void main() { gl_Position = position; }
    </script>

    <!-- FRAGMENT SHADER -->
    <script id="fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;

        out vec4 fragColor;

        uniform vec2 u_resolution;
        uniform float u_time;
        uniform int u_frame;
        uniform sampler2D u_accum;
        
        uniform vec2 u_mouse;
        uniform float u_zoom;
        uniform float u_isMobile;
        uniform vec4 u_cropRect; 

        uniform float u_dilation;
        uniform float u_chaos;
        uniform float u_collarette;
        uniform float u_melanin;
        uniform float u_heterochromia;
        uniform float u_relief; 

        #define PI 3.14159265359
        #define MAX_DIST 40.0
        #define SURF_DIST 0.002
        
        const vec3 BG_COL = vec3(0.878, 0.878, 0.863); 

        // --- RANDOM UTILS ---
        // High quality hash for stochastic jitter
        float hash(vec2 p) {
            vec3 p3  = fract(vec3(p.xyx) * .1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
        }
        
        float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float ridgedNoise(vec2 p) { return 2.0 * (0.5 - abs(0.5 - noise(p))); }

        float fbm(vec2 p) {
            float v = 0.0; float a = 0.5;
            int octaves = (u_isMobile > 0.5) ? 3 : 5;
            for (int i = 0; i < 5; ++i) {
                if(i >= octaves) break;
                v += a * noise(p);
                p = p * 2.0 + 100.0;
                a *= 0.5;
            }
            return v;
        }

        float warpPattern(vec2 p, float strength) {
            vec2 q = vec2(fbm(p), fbm(p + vec2(5.2, 1.3)));
            return fbm(p + strength * q);
        }
        
        // --- GEOMETRY ---
        float sdCornea(vec3 p) {
            return length(p - vec3(0.0, 0.0, 0.5)) - 2.4;
        }

        float sdSclera(vec3 p) {
            return length(p - vec3(0.0, 0.0, -3.8)) - 5.5;
        }

        vec2 mapIris(vec3 p) {
            vec3 pIrisSpace = p - vec3(0.0, 0.0, 1.3);
            float r = length(pIrisSpace.xy);
            float a = atan(pIrisSpace.y, pIrisSpace.x);
            
            float pupilR = u_dilation * 1.5; 
            float irisR = 1.95; 
            
            float effectiveR = max(r, pupilR + 0.2);
            float coneDepth = (effectiveR - irisR) * 0.25; 
            
            float thickProfile = smoothstep(pupilR, pupilR + 0.05, r);
            thickProfile *= smoothstep(irisR, irisR - 0.2, r);
            float thickness = 0.04 * thickProfile;
            float dPlane = abs(pIrisSpace.z - coneDepth) - thickness;
            
            float disp = 0.0;
            if (dPlane < 0.5) {
                float normR = (r - pupilR)/(irisR - pupilR);
                vec2 pol = vec2(normR, a);
                vec2 mapPos = vec2(pol.x, pol.y * (2.0 + u_chaos * 0.5));
                
                float ridges = ridgedNoise(vec2(mapPos.x * 6.0, mapPos.y * 20.0));
                float warp = warpPattern(vec2(pol.y * 5.0, pol.x * 10.0), 0.5);
                float ridge = smoothstep(0.2, 0.0, abs(pol.x - u_collarette + warp * 0.05));
                ridge *= (0.6 + 0.4 * ridgedNoise(vec2(pol.y * 15.0, pol.x * 5.0)));
                float crypts = smoothstep(0.4, 0.7, noise(vec2(pol.x * 3.0, pol.y * (8.0 + u_chaos))));
                
                float macro = ridges * 0.2 + ridge * 0.4 - crypts * 0.3;
                disp = macro * 0.15 * u_relief * thickProfile; 
            }

            float dDisk = max(r - irisR, pupilR - r);
            return vec2(max(dDisk, dPlane - disp), disp);
        }

        float mapScene(vec3 p) {
            float dC = sdCornea(p);
            float dS = sdSclera(p);
            float k = 0.5;
            float h = clamp( 0.5 + 0.5*(dS-dC)/k, 0.0, 1.0 );
            return mix( dS, dC, h ) - k*h*(1.0-h); 
        }
        
        vec3 getIrisNormal(vec3 p) {
            vec2 e = vec2(0.005, 0.0);
            float d = mapIris(p).x;
            return normalize(d - vec3(mapIris(p-e.xyy).x, mapIris(p-e.yxy).x, mapIris(p-e.yyx).x));
        }

        vec3 getIrisColor(vec3 p, float disp, vec3 normal, vec3 viewDir, vec3 lightDir, bool highQuality) {
            vec3 pIrisSpace = p - vec3(0.0, 0.0, 1.3);
            float r = length(pIrisSpace.xy);
            float a = atan(pIrisSpace.y, pIrisSpace.x);
            
            float pupilR = u_dilation * 1.5;
            float irisR = 2.15;
            float normR = clamp((r - pupilR) / (irisR - pupilR), 0.0, 1.0);
            
            float cloud = fbm(vec2(normR, a * 2.0));
            
            // COLOR PALETTES
            vec3 colBlue = vec3(0.25, 0.5, 0.75);
            vec3 colHazel = vec3(0.55, 0.45, 0.2);
            vec3 colBrown = vec3(0.35, 0.15, 0.05);
            vec3 colHoney = vec3(0.8, 0.6, 0.2);
            
            vec3 outerBase = mix(colBlue, colBrown, u_melanin);
            vec3 outerDetail = mix(vec3(0.9), colHoney, u_melanin);
            
            float innerMelanin = clamp(u_melanin + u_heterochromia * 0.5, 0.0, 1.0);
            vec3 innerBase = mix(colBlue, colHoney, innerMelanin);
            innerBase = mix(innerBase, colHazel, u_heterochromia);

            float zoneMask = smoothstep(u_collarette - 0.1, u_collarette + 0.1, normR);
            vec3 baseColor = mix(innerBase, outerBase, zoneMask);
            vec3 detailColor = mix(vec3(0.9, 0.8, 0.6), outerDetail, zoneMask);
            
            baseColor *= (0.8 + 0.4 * cloud);
            float fiberMask = smoothstep(-0.02, 0.05, disp);
            vec3 col = mix(baseColor * 0.5, detailColor, fiberMask);
            
            float edgeShadow = smoothstep(0.0, 0.1, normR) * smoothstep(1.0, 0.9, normR);
            col *= (0.5 + 0.5 * edgeShadow);

            float diff = clamp(dot(normal, lightDir), 0.0, 1.0);
            float sss = smoothstep(-0.5, 0.5, dot(viewDir, -lightDir));
            col += baseColor * sss * 0.4;
            col *= (0.2 + 0.8 * diff);
            
            // STOCHASTIC MICRO-CAUSTICS (High Quality Only)
            if (highQuality) {
                // High frequency caustic noise
                float microC = pow(noise(p.xy * 200.0 + lightDir.xy * 2.0), 2.0);
                col += vec3(0.2) * microC * diff;
            }

            vec3 h = normalize(lightDir + viewDir);
            float spec = pow(clamp(dot(normal, h), 0.0, 1.0), 40.0);
            col += spec * 0.3;

            return col;
        }

        // Trace function
        vec4 traceIrisRay(vec3 startP, vec3 rayDir, vec3 lightDir, bool highQuality) {
            float tIris = 0.1;
            vec3 pIris = startP;
            float hitDisp = 0.0;
            bool hitIris = false;
            
            // 256 Steps for Rendering Mode
            int maxSteps = highQuality ? 256 : (u_isMobile > 0.5 ? 30 : 64);
            
            for(int i=0; i<maxSteps; i++) {
                pIris = startP + rayDir * tIris;
                vec2 res = mapIris(pIris);
                
                // Extremely tight threshold for ROI
                float threshold = highQuality ? 0.0001 : 0.005;
                
                if(res.x < threshold) { hitIris = true; hitDisp = res.y; break; }
                if(tIris > 3.0) break; 
                tIris += res.x * 0.6;
            }
            
            if (hitIris) {
                vec3 nIris = getIrisNormal(pIris);
                vec3 col = getIrisColor(pIris, hitDisp, nIris, -rayDir, lightDir, highQuality);
                
                float caustic = pow(noise(pIris.xy*3.0 + lightDir.xy), 3.0);
                col += vec3(1.0, 0.9, 0.7) * caustic * 0.2;
                
                float depth = distance(startP, pIris);
                vec3 absorb = vec3(0.92, 0.96, 0.98); 
                col *= pow(absorb, vec3(depth * 3.0));
                return vec4(col, 1.0);
            }
            return vec4(0.0);
        }

        void main() {
            // Screen Jitter (Anti-aliasing)
            vec2 jitter = vec2(hash(gl_FragCoord.xy + u_time), hash(gl_FragCoord.xy + u_time * 1.5)) - 0.5;
            if(u_isMobile > 0.5) jitter = vec2(0.0);
            
            vec2 uv = (gl_FragCoord.xy + jitter - 0.5 * u_resolution.xy) / u_resolution.y;
            
            // --- ROI CHECK ---
            bool insideCrop = false;
            if (u_cropRect.z > 0.0) {
                if (gl_FragCoord.x >= u_cropRect.x && gl_FragCoord.x <= u_cropRect.z &&
                    gl_FragCoord.y >= u_cropRect.y && gl_FragCoord.y <= u_cropRect.w) {
                    insideCrop = true;
                }
            }

            // --- CAMERA ---
            float camDist = u_zoom;
            float rotX = (u_mouse.y / u_resolution.y - 0.5) * 0.75; 
            float rotY = (0.5 - u_mouse.x / u_resolution.x) * 1.0;
            
            vec3 ro = vec3(0.0, 0.0, camDist);
            mat2 ry = mat2(cos(rotY), sin(rotY), -sin(rotY), cos(rotY));
            mat2 rx = mat2(cos(rotX), sin(rotX), -sin(rotX), cos(rotX));
            ro.yz *= rx; ro.xz *= ry;
            
            vec3 rd = normalize(vec3(uv, -2.5));
            rd.yz *= rx; rd.xz *= ry;

            vec3 lightDir = normalize(vec3(2.0, 4.0, 5.0));
            vec3 col = BG_COL; 

            // Raymarch External
            float t = 0.0;
            int hitObj = 0; 
            for(int i=0; i<40; i++) {
                float d = mapScene(ro + rd * t);
                if(d < SURF_DIST) { hitObj = 1; break; }
                if(t > MAX_DIST) break;
                t += d;
            }

            if(hitObj == 1) {
                vec3 pSurf = ro + rd * t;
                vec2 e = vec2(0.001, 0.0);
                float d0 = mapScene(pSurf);
                vec3 nSurf = normalize(d0 - vec3(mapScene(pSurf-e.xyy), mapScene(pSurf-e.yxy), mapScene(pSurf-e.yyx)));
                
                // 1. Base Lighting
                float diff = clamp(dot(nSurf, lightDir), 0.0, 1.0);
                vec3 scleraCol = BG_COL;
                float lightingTerm = mix(0.85, 1.0, diff); 
                scleraCol *= lightingTerm;

                vec3 h = normalize(lightDir - rd);
                float specWet = pow(clamp(dot(nSurf, h), 0.0, 1.0), 30.0);
                scleraCol += specWet * 0.3;

                float rim = 1.0 - max(dot(-rd, nSurf), 0.0);
                float fadeAlpha = pow(rim, 4.0);
                scleraCol = mix(scleraCol, BG_COL, fadeAlpha);

                // --- LIMBUS & IRIS ---
                float rad = length(pSurf.xy);
                float limbusMix = smoothstep(1.75, 2.1, rad); 

                if (limbusMix < 1.0) {
                    vec3 irisFinal = vec3(0.0);
                    vec3 ref = reflect(rd, nSurf);
                    float specCornea = pow(max(dot(ref, lightDir), 0.0), 60.0);
                    
                    if (insideCrop) {
                        // --- STOCHASTIC PATH TRACING MODE ---
                        
                        // 1. Stochastic Dispersion Jitter
                        // Instead of fixed wavelengths, we jitter the IOR per pixel per frame.
                        // This creates noise that resolves into a smooth spectral gradient.
                        
                        // Base IOR is 1.376. We jitter it wildly between 1.34 and 1.41
                        // This corresponds to Red -> Blue shift
                        float randIOR = hash(gl_FragCoord.xy + u_time * 11.0); // 0..1
                        float stochasticIOR = mix(1.34, 1.41, randIOR); // EXAGGERATED SPREAD
                        
                        // Refract using the random IOR
                        vec3 rdIn = refract(rd, nSurf, 1.0/stochasticIOR);
                        
                        // 2. Volume/Glossy Scatter (Depth of Field Simulation)
                        // Add slight random jitter to the ray direction to simulate micro-scattering
                        vec3 scatter = (vec3(hash(gl_FragCoord.xy + u_time), hash(gl_FragCoord.yx + u_time), hash(gl_FragCoord.xx + u_time)) - 0.5) * 0.02;
                        rdIn = normalize(rdIn + scatter);

                        // 3. Trace High Quality
                        vec4 trace = traceIrisRay(pSurf, rdIn, lightDir, true);
                        
                        if (trace.a > 0.0) {
                            // Tint the result based on the chosen wavelength (Fake spectral rendering)
                            // Low IOR (Red) -> High IOR (Blue)
                            vec3 spectralTint = mix(vec3(1.0, 0.5, 0.5), vec3(0.5, 0.5, 1.0), randIOR);
                            // Boost saturation of tint for effect
                            vec3 tinted = trace.rgb * (vec3(0.5) + spectralTint * 0.8);
                            
                            // INVERSE COLOR FOR ROI
                            irisFinal = 1.0 - tinted;
                        } else {
                            irisFinal = vec3(0.0); // Miss = Black void (internal reflection)
                        }
                    
                    } else {
                        // --- STANDARD FAST MODE ---
                        vec3 rdIn = refract(rd, nSurf, 1.0/1.376);
                        vec4 trace = traceIrisRay(pSurf, rdIn, lightDir, false);
                        if (trace.a > 0.5) {
                            irisFinal = trace.rgb;
                        }
                    }

                    irisFinal += specCornea * vec3(1.0);
                    float f = pow(1.0 - max(dot(-rd, nSurf), 0.0), 3.0);
                    irisFinal += f * vec3(0.2, 0.25, 0.3);
                    
                    col = mix(irisFinal, scleraCol, limbusMix);
                } else {
                    col = scleraCol;
                }
            }

            // --- ACCUMULATION ---
            // If inside Crop, we rely heavily on accumulation to denoise the stochastic rays
            if (u_frame > 0) {
                vec3 prev = texture(u_accum, gl_FragCoord.xy / u_resolution.xy).rgb;
                float blend = 1.0 / float(u_frame + 1);
                col = mix(prev, col, blend);
            }
            
            fragColor = vec4(col, 1.0);
        }
    </script>

    <!-- ENGINE LOGIC -->
    <script>
        const canvas = document.getElementById('gl');
        const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
        if (!gl) { document.body.innerHTML = "WEBGL 2.0 ERROR"; }

        function createProgram(vsSource, fsSource) {
            const vs = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vs, vsSource); gl.compileShader(vs);
            if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(vs));
            const fs = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fs, fsSource); gl.compileShader(fs);
            if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(fs));
            const prog = gl.createProgram();
            gl.attachShader(prog, vs); gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            return prog;
        }

        const program = createProgram(document.getElementById('vs').text.trim(), document.getElementById('fs').text.trim());

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, "position");
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        let textures = [], framebuffers = [];
        let texWidth, texHeight;

        function initBuffers() {
            texWidth = canvas.width; texHeight = canvas.height;
            if (textures.length > 0) {
                textures.forEach(t => gl.deleteTexture(t));
                framebuffers.forEach(f => gl.deleteFramebuffer(f));
            }
            textures = []; framebuffers = [];
            gl.getExtension("EXT_color_buffer_float");

            for (let i = 0; i < 2; i++) {
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, texWidth, texHeight, 0, gl.RGBA, gl.FLOAT, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                textures.push(tex);
                const fb = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
                framebuffers.push(fb);
            }
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        }

        // --- STATE & PHYSICS ---
        const state = {
            dilation: 0.35, chaos: 1.2, collarette: 0.45, melanin: 0.5,
            heterochromia: 0.0, relief: 1.0,
            zoom: 16.0, mouseX: 0, mouseY: 0,
            paused: false, mobile: false, frameCount: 0,
            crop: { x: 0, y: 0, w: 0, h: 0, active: false }
        };
        const target = { ...state };
        let isPointerDown = false;
        let isRightDown = false;
        let autoAnimate = true;

        let dragStart = { x: 0, y: 0 };
        const marquee = document.getElementById('selection-marquee');

        const presets = {
            'p1': { melanin: 0.05, chaos: 1.8, collarette: 0.5, heterochromia: 0.1 },
            'p2': { melanin: 0.45, chaos: 0.8, collarette: 0.4, heterochromia: 0.8 },
            'p3': { melanin: 0.25, chaos: 1.4, collarette: 0.45, heterochromia: 0.9 },
            'p4': { melanin: 0.95, chaos: 0.5, collarette: 0.3, heterochromia: 0.0 },
            'p5': { melanin: 0.0, chaos: 2.5, collarette: 0.45, heterochromia: 0.3 },
            'p6': { melanin: 0.7, chaos: 1.1, collarette: 0.35, heterochromia: 0.2 },
        };

        function resetAccumulation() {
            state.frameCount = 0;
            document.getElementById('accum-bar').style.width = '0%';
        }

        // --- INPUT HANDLING ---
        window.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('pointerdown', e => {
            if (e.button === 2) {
                isRightDown = true;
                dragStart = { x: e.clientX, y: e.clientY };

                marquee.style.display = 'block';
                marquee.style.left = e.clientX + 'px';
                marquee.style.top = e.clientY + 'px';
                marquee.style.width = '0px';
                marquee.style.height = '0px';

                state.crop.active = false;
                resetAccumulation();
            } else {
                isPointerDown = true;
                resetAccumulation();
                if (state.crop.active) {
                    state.crop.active = false;
                    state.crop.w = 0;
                    marquee.style.display = 'none';
                    resetAccumulation();
                }
            }
        });

        window.addEventListener('pointermove', e => {
            target.mouseX = e.clientX;
            target.mouseY = e.clientY;

            if (isRightDown) {
                const currentX = e.clientX;
                const currentY = e.clientY;

                const x = Math.min(dragStart.x, currentX);
                const y = Math.min(dragStart.y, currentY);
                const w = Math.abs(currentX - dragStart.x);
                const h = Math.abs(currentY - dragStart.y);

                marquee.style.left = x + 'px';
                marquee.style.top = y + 'px';
                marquee.style.width = w + 'px';
                marquee.style.height = h + 'px';
            } else {
                if (!state.paused && !state.crop.active) resetAccumulation();
            }
        });

        window.addEventListener('pointerup', e => {
            if (e.button === 2) {
                isRightDown = false;
                const rect = marquee.getBoundingClientRect();
                if (rect.width > 5 && rect.height > 5) {
                    state.crop.active = true;
                    state.crop.x = rect.left;
                    state.crop.y = rect.top;
                    state.crop.w = rect.width;
                    state.crop.h = rect.height;
                } else {
                    marquee.style.display = 'none';
                    state.crop.active = false;
                }
                resetAccumulation();
            } else {
                isPointerDown = false;
                resetAccumulation();
            }
        });

        window.addEventListener('wheel', e => {
            state.zoom += e.deltaY * 0.02;
            state.zoom = Math.max(3.0, Math.min(35.0, state.zoom));
            resetAccumulation();
        });

        function bind(id, key) {
            const el = document.getElementById('param-' + id);
            const disp = document.getElementById('val-' + id);
            el.addEventListener('input', e => {
                target[key] = parseFloat(e.target.value);
                disp.innerText = target[key].toFixed(2);
                autoAnimate = false;
                resetAccumulation();
            });
            disp.innerText = target[key].toFixed(2);
            el.value = target[key];
        }

        bind('dilation', 'dilation'); bind('chaos', 'chaos');
        bind('collarette', 'collarette'); bind('melanin', 'melanin');
        bind('heterochromia', 'heterochromia'); bind('relief', 'relief');

        window.loadPreset = (name) => {
            const p = presets[name];
            for (let k in p) {
                target[k] = p[k];
                document.getElementById('param-' + k).value = p[k];
                document.getElementById('val-' + k).innerText = p[k].toFixed(2);
            }
            autoAnimate = false;
            resetAccumulation();
        };

        window.toggleUI = () => {
            const panel = document.getElementById('ui-panel');
            const toggle = document.getElementById('ui-toggle');
            panel.classList.toggle('collapsed');
            toggle.innerHTML = panel.classList.contains('collapsed')
                ? '<svg viewBox="0 0 10 10"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.5"/></svg>'
                : '<svg viewBox="0 0 10 10"><rect x="1" y="2" width="8" height="1"/><rect x="1" y="5" width="8" height="1"/><rect x="1" y="8" width="8" height="1"/></svg>';
        };

        document.getElementById('anim-toggle').onclick = (e) => {
            state.paused = !state.paused;
            e.target.innerText = state.paused ? "RUN" : "HALT";
            if (state.paused) resetAccumulation();
        };

        document.getElementById('res-toggle').onclick = (e) => {
            state.mobile = !state.mobile;
            e.target.style.background = state.mobile ? "var(--ink)" : "";
            e.target.style.color = state.mobile ? "var(--bg)" : "";
            resetAccumulation();
        };

        document.getElementById('shot-btn').onclick = () => {
            const ui = document.getElementById('ui-container');
            const cursors = document.querySelectorAll('.crosshair, .corner');
            const marq = document.getElementById('selection-marquee');

            ui.classList.add('hidden');
            cursors.forEach(c => c.classList.add('hidden'));
            const wasMarqueeVisible = marq.style.display !== 'none';
            marq.style.display = 'none';

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    render(performance.now(), true);
                    const link = document.createElement('a');
                    link.download = `IRIS_BIO_${Date.now()}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    ui.classList.remove('hidden');
                    cursors.forEach(c => c.classList.remove('hidden'));
                    if (wasMarqueeVisible) marq.style.display = 'block';
                });
            });
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
            initBuffers();
            resetAccumulation();
        }
        window.addEventListener('resize', resize);
        resize();

        const uLocs = {
            res: gl.getUniformLocation(program, 'u_resolution'),
            time: gl.getUniformLocation(program, 'u_time'),
            frame: gl.getUniformLocation(program, 'u_frame'),
            accum: gl.getUniformLocation(program, 'u_accum'),
            mouse: gl.getUniformLocation(program, 'u_mouse'),
            zoom: gl.getUniformLocation(program, 'u_zoom'),
            mobile: gl.getUniformLocation(program, 'u_isMobile'),
            cropRect: gl.getUniformLocation(program, 'u_cropRect'),
            dilation: gl.getUniformLocation(program, 'u_dilation'),
            chaos: gl.getUniformLocation(program, 'u_chaos'),
            collarette: gl.getUniformLocation(program, 'u_collarette'),
            melanin: gl.getUniformLocation(program, 'u_melanin'),
            heterochromia: gl.getUniformLocation(program, 'u_heterochromia'),
            relief: gl.getUniformLocation(program, 'u_relief'),
        };

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        function render(time, forceCapture = false) {
            let t = time * 0.001;

            let isMoving = false;

            let dx = target.mouseX - state.mouseX;
            let dy = target.mouseY - state.mouseY;
            if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                state.mouseX += dx * 0.08;
                state.mouseY += dy * 0.08;
                isMoving = true;
            }

            let targetDilation = target.dilation;
            if (autoAnimate && !isPointerDown) {
                targetDilation = target.dilation + Math.sin(t) * 0.03;
            }
            if (isPointerDown) {
                targetDilation = 0.15;
            }
            let pupilSpeed = isPointerDown ? 0.2 : 0.05;

            const keys = ['chaos', 'collarette', 'melanin', 'heterochromia', 'relief'];
            keys.forEach(k => {
                let diff = target[k] - state[k];
                if (Math.abs(diff) > 0.001) {
                    state[k] = lerp(state[k], target[k], 0.08);
                    isMoving = true;
                } else { state[k] = target[k]; }
            });

            let dDiff = targetDilation - state.dilation;
            if (Math.abs(dDiff) > 0.001) {
                state.dilation = lerp(state.dilation, targetDilation, pupilSpeed);
                isMoving = true;
            } else { state.dilation = targetDilation; }

            if ((isPointerDown || autoAnimate) && !state.paused) {
                document.getElementById('val-dilation').innerText = state.dilation.toFixed(2);
            }

            if (isMoving && !state.paused) resetAccumulation();
            if (state.paused) { t = 0; }

            // Allow longer accumulation for Stochastic Mode to clear up noise
            let maxFrames = state.crop.active ? 512 : 128;

            if (state.paused && state.frameCount > maxFrames && !forceCapture) {
                requestAnimationFrame(render);
                return;
            }

            const readIdx = state.frameCount % 2;
            const writeIdx = (state.frameCount + 1) % 2;

            gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[writeIdx]);
            gl.useProgram(program);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, textures[readIdx]);
            gl.uniform1i(uLocs.accum, 0);

            gl.uniform2f(uLocs.res, canvas.width, canvas.height);
            gl.uniform1f(uLocs.time, t);
            gl.uniform1i(uLocs.frame, state.frameCount);
            gl.uniform2f(uLocs.mouse, state.mouseX, state.mouseY);
            gl.uniform1f(uLocs.zoom, state.zoom);
            gl.uniform1f(uLocs.mobile, state.mobile ? 1.0 : 0.0);

            let cx1 = 0, cy1 = 0, cx2 = 0, cy2 = 0;
            if (state.crop.active) {
                cx1 = state.crop.x;
                cy1 = canvas.height - (state.crop.y + state.crop.h);
                cx2 = state.crop.x + state.crop.w;
                cy2 = canvas.height - state.crop.y;
            }
            gl.uniform4f(uLocs.cropRect, cx1, cy1, cx2, cy2);

            gl.uniform1f(uLocs.dilation, state.dilation);
            gl.uniform1f(uLocs.chaos, state.chaos);
            gl.uniform1f(uLocs.collarette, state.collarette);
            gl.uniform1f(uLocs.melanin, state.melanin);
            gl.uniform1f(uLocs.heterochromia, state.heterochromia);
            gl.uniform1f(uLocs.relief, state.relief);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.bindFramebuffer(gl.READ_FRAMEBUFFER, framebuffers[writeIdx]);
            gl.blitFramebuffer(0, 0, texWidth, texHeight, 0, 0, texWidth, texHeight, gl.COLOR_BUFFER_BIT, gl.NEAREST);

            if (state.paused && !isMoving) {
                const pct = Math.min(100, (state.frameCount / maxFrames) * 100);
                document.getElementById('accum-bar').style.width = pct + '%';
            } else {
                document.getElementById('accum-bar').style.width = '0%';
            }

            state.frameCount++;
            if (!forceCapture) requestAnimationFrame(render);
        }

        requestAnimationFrame(render);

    </script>
