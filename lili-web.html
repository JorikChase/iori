<script>
"use strict";
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false});
let W=0,H=0,DPR=1;
const CELL=4;                 /* css px per liquid cell */
let GW=0,GH=0,wtr=null,wDisp=null,wTmp=null,wTmp2=null,solid=null,owner=null,wBytes=null;

/* ================= shaders ================= */
function prog(vs,fs){
  const p=gl.createProgram();
  for(const [t,s] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){
    const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(sh));
    gl.attachShader(p,sh);
  }
  gl.linkProgram(p);return p;
}
const pStrand=prog(
`attribute vec2 p;attribute float side;attribute float amp;
 uniform vec2 res;varying float vs;varying float va;
 void main(){vs=side;va=amp;vec2 c=p/res*2.0-1.0;gl_Position=vec4(c.x,-c.y,0.,1.);}`,
`precision mediump float;varying float vs;varying float va;
 void main(){
   float h=sqrt(max(0.0,1.0-vs*vs))*va;
   gl_FragColor=vec4(h,0.0,0.0,0.0);
 }`);
const pBlob=prog(
`attribute vec2 p;attribute vec2 uv;attribute float w;
 uniform vec2 res;varying vec2 vu;varying float vw;
 void main(){vu=uv;vw=w;vec2 c=p/res*2.0-1.0;gl_Position=vec4(c.x,-c.y,0.,1.);}`,
`precision mediump float;varying vec2 vu;varying float vw;
 void main(){
   float k=max(0.0,1.0-dot(vu,vu));
   gl_FragColor=vec4(k*k*vw,0.0,0.0,0.0);
 }`);
/* composite: Liquid Glass over checkerboard; silk field + CA water texture */
const pComp=prog(
`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`,
`precision mediump float;
 uniform sampler2D field;uniform sampler2D water;
 uniform vec2 res;uniform float dpr;uniform vec2 wcov;
 float checker(vec2 px){
   float s=38.0*dpr;
   float c=mod(floor(px.x/s)+floor(px.y/s),2.0);
   return mix(0.78,0.965,c);
 }
 float cov(vec2 uv){
   float f=texture2D(field,uv).r*1.15;
   vec2 wuv=vec2(uv.x*wcov.x,1.0-uv.y*wcov.y);
   f+=texture2D(water,wuv).r*1.30;
   return smoothstep(0.08,0.44,f);
 }
 float cap(float c){
   float b=min(c*2.6,1.0);
   return sqrt(1.0-(1.0-b)*(1.0-b));
 }
 void main(){
   vec2 uv=gl_FragCoord.xy/res;
   vec2 tx=vec2(1.25,0.0)/res, ty=vec2(0.0,1.25)/res;
   float c0=cov(uv);
   float h0=cap(c0);
   vec2 g=vec2(cap(cov(uv+tx))-cap(cov(uv-tx)),
               cap(cov(uv+ty))-cap(cov(uv-ty)));
   float gm=length(g);
   float bend=clamp(gm*2.2,0.0,1.0);
   float rim=smoothstep(0.04,0.62,bend);
   vec2 n=g/max(gm,1e-4);
   float presence=smoothstep(0.06,0.55,c0);
   vec2 px=gl_FragCoord.xy;
   float S=14.0*dpr;
   vec2 refr=n*rim*S;
   vec3 col=vec3(
     checker(px+refr*0.60),
     checker(px+refr*1.00),
     checker(px+refr*1.55));
   float lit=dot(-n,vec2(-0.55,0.83));
   col+=vec3(1.0)*rim*(0.09+0.46*max(lit,0.0));
   col+=vec3(1.0)*rim*0.15*max(-lit,0.0);
   col*=1.0-0.16*rim*max(-lit,0.0);
   col=col*(1.0+0.05*presence*(1.0-rim))+0.015*presence*(1.0-rim);
   gl_FragColor=vec4(col,1.0);
 }`);
const bufStrand=gl.createBuffer(),bufBlob=gl.createBuffer(),bufQuad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,bufQuad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const aSP=gl.getAttribLocation(pStrand,'p'),aSS=gl.getAttribLocation(pStrand,'side'),
      aSA=gl.getAttribLocation(pStrand,'amp'),uSR=gl.getUniformLocation(pStrand,'res');
const aBP=gl.getAttribLocation(pBlob,'p'),aBU=gl.getAttribLocation(pBlob,'uv'),
      aBW=gl.getAttribLocation(pBlob,'w'),uBR=gl.getUniformLocation(pBlob,'res');
const aCP=gl.getAttribLocation(pComp,'p'),uCF=gl.getUniformLocation(pComp,'field'),
      uCW=gl.getUniformLocation(pComp,'water'),uCR=gl.getUniformLocation(pComp,'res'),
      uCD=gl.getUniformLocation(pComp,'dpr'),uCC=gl.getUniformLocation(pComp,'wcov');
gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
let fbo=null,fboTex=null,waterTex=null;
function makeFBO(){
  if(fboTex)gl.deleteTexture(fboTex);
  if(fbo)gl.deleteFramebuffer(fbo);
  fboTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,fboTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,cv.width,cv.height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,fboTex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function makeWaterTex(){
  if(waterTex)gl.deleteTexture(waterTex);
  waterTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,waterTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,GW,GH,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}

/* ================= silk physics ================= */
let pts=[],cons=[],adj=[],adjDirty=true,sparks=[];
const R=Math.random;
function addPt(x,y,pin){pts.push({x,y,ox:x,oy:y,pin:!!pin});adjDirty=true;return pts.length-1;}
function link(a,b,slack){
  const dx=pts[b].x-pts[a].x,dy=pts[b].y-pts[a].y;
  cons.push({a,b,rest:Math.sqrt(dx*dx+dy*dy)*(slack||1),lim:2.6+R()*0.9,broken:false});
  adjDirty=true;
}
function subdivide(a,b,slack){
  const dx=pts[b].x-pts[a].x,dy=pts[b].y-pts[a].y;
  const d=Math.sqrt(dx*dx+dy*dy),n=Math.max(2,Math.round(d/22));
  let prev=a;
  for(let i=1;i<n;i++){
    const t=i/n,id=addPt(pts[a].x+dx*t,pts[a].y+dy*t,false);
    link(prev,id,slack);prev=id;
  }
  link(prev,b,slack);
}
function rebuildAdj(){
  adj=pts.map(()=>[]);
  for(let i=0;i<cons.length;i++){
    const c=cons[i];if(c.broken)continue;
    adj[c.a].push({n:c.b});adj[c.b].push({n:c.a});
  }
  adjDirty=false;
}
function genBlank(){
  pts=[];cons=[];sparks=[];adjDirty=true;
  if(wtr){wtr.fill(0);wDisp.fill(0);}
  unlockedDrop=false;unlockedHand=false;
  bDrop.classList.add('hide');bHand.classList.add('hide');
  setMode('spin');
}
let grab=-1,px=0,py=0,lx=0,ly=0,down=false,spinFrom=-1;
function physics(steps){
  const time=performance.now();
  for(let k=0;k<steps;k++){
    for(let i=0;i<pts.length;i++){
      const p=pts[i];if(p.pin)continue;
      const vx=(p.x-p.ox)*0.985,vy=(p.y-p.oy)*0.985;
      p.ox=p.x;p.oy=p.y;
      p.x+=vx+Math.sin(time*0.0006+p.y*0.013)*0.006;
      p.y+=vy+0.055;
    }
    for(let it=0;it<4;it++){
      for(let ci=0;ci<cons.length;ci++){
        const c=cons[ci];if(c.broken)continue;
        const A=pts[c.a],B=pts[c.b];
        let dx=B.x-A.x,dy=B.y-A.y;
        const dist=Math.sqrt(dx*dx+dy*dy)||0.0001;
        if(it===0&&dist>c.rest*c.lim){
          c.broken=true;adjDirty=true;
          spark((A.x+B.x)/2,(A.y+B.y)/2);continue;
        }
        const diff=(c.rest-dist)/dist*0.5;
        const kk=dist>c.rest?1:0.08;
        dx*=diff*kk;dy*=diff*kk;
        if(!A.pin&&!B.pin){A.x-=dx;A.y-=dy;B.x+=dx;B.y+=dy;}
        else if(A.pin&&!B.pin){B.x+=dx*2;B.y+=dy*2;}
        else if(!A.pin&&B.pin){A.x-=dx*2;A.y-=dy*2;}
      }
      if(grab>=0){const g=pts[grab];g.x=px;g.y=py;g.ox=px;g.oy=py;}
    }
  }
}
function spark(x,y){
  for(let i=0;i<5;i++){
    const a=R()*Math.PI*2,v=0.6+R()*1.8;
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.4,life:1});
  }
}

/* ================= liquid cellular automata ================= */
const MAXW=1.0, CLING=0.38, SEEP=0.72, MINFLOW=0.002;
let parity=0;
function rasterizeSolids(){
  solid.fill(0);owner.fill(-1);
  for(const c of cons){
    if(c.broken)continue;
    const A=pts[c.a],B=pts[c.b];
    const dx=B.x-A.x,dy=B.y-A.y;
    const d=Math.hypot(dx,dy);
    const n=Math.max(1,Math.ceil(d/(CELL*0.55)));
    let nnx=Math.round(-dy/d),nny=Math.round(dx/d);
    if(nny>0||(nny===0&&nnx<0)){nnx=-nnx;nny=-nny;}
    for(let i=0;i<=n;i++){
      const t=i/n;
      const gx=Math.floor((A.x+dx*t)/CELL),gy=Math.floor((A.y+dy*t)/CELL);
      const own=t<0.5?c.a:c.b;
      for(let k2=0;k2<2;k2++){
        const gx2=gx+(k2?nnx:0),gy2=gy+(k2?nny:0);
        if(gx2<0||gx2>=GW||gy2<0||gy2>=GH)continue;
        const idx=gy2*GW+gx2;
        solid[idx]=1;owner[idx]=own;
      }
    }
  }
  /* water displaced by silk moving into its cell gets pushed up */
  for(let i=0;i<solid.length;i++){
    if(solid[i]&&wtr[i]>0){
      let j=i-GW,hops=0;
      while(j>=0&&hops<4&&solid[j]){j-=GW;hops++;}
      if(j>=0&&!solid[j])wtr[j]+=wtr[i];
      wtr[i]=0;
    }
  }
}
function caStep(){
  parity^=1;
  for(let y=GH-2;y>=0;y--){
    const row=y*GW;
    const x0=parity?0:GW-1, x1=parity?GW:-1, dx=parity?1:-1;
    for(let x=x0;x!==x1;x+=dx){
      const i=row+x;
      let w=wtr[i];
      if(w<=MINFLOW)continue;
      const bi=i+GW;
      /* 1. fall */
      if(!solid[bi]){
        const free=MAXW-wtr[bi];
        if(free>0){
          const f=Math.min(w,free);
          wtr[bi]+=f;w-=f;
        }
      }
      /* crown splash: hard landing on silk or a full pool kicks water sideways */
      if(w>0.5&&(solid[bi]||wtr[bi]>0.9)){
        for(const sd of[-1,1]){
          if(R()>0.45)continue;
          const nx2=x+sd;
          if(nx2<0||nx2>=GW)continue;
          const li=i+sd;
          if(solid[li])continue;
          const free=MAXW-wtr[li];
          const f=Math.min(w*0.12,free);
          if(f>MINFLOW){wtr[li]+=f;w-=f;}
        }
      }
      /* silk is thin: heavy beads seep through to hang and drip below */
      if(w>SEEP&&solid[bi]){
        let j=bi,hops=0;
        const total=GW*GH;
        while(hops<3&&j<total&&solid[j]){j+=GW;hops++;}
        if(j<total&&!solid[j]){
          const free=MAXW-wtr[j];
          const f=Math.min((w-SEEP)*0.22,free);
          if(f>MINFLOW){wtr[j]+=f;w-=f;}
        }
      }
      if(w>MINFLOW){
        const touching=solid[bi]||(x>0&&solid[i-1])||(x<GW-1&&solid[i+1]);
        const held=touching?CLING:0.0;
        /* 2. diagonal slide: downhill threshold is lower than lateral, so beads run */
        const heldD=touching?CLING*0.55:0.0;
        if(w>heldD){
          for(const s of (parity?[1,-1]:[-1,1])){
            const nx2=x+s;
            if(nx2<0||nx2>=GW)continue;
            const di=bi+s;
            if(solid[di]||solid[i+s])continue;
            const free=MAXW-wtr[di];
            if(free>0.01){
              const f=Math.min((w-heldD)*0.55,free);
              if(f>MINFLOW){wtr[di]+=f;w-=f;}
            }
          }
        }
        /* 3. lateral equalize above cling threshold */
        if(w>held){
          for(const s of (parity?[1,-1]:[-1,1])){
            const nx2=x+s;
            if(nx2<0||nx2>=GW)continue;
            const li=i+s;
            if(solid[li])continue;
            const diff=w-wtr[li];
            if(diff>0.02){
              const rate=touching?0.24:0.36;
              const f=Math.min(diff*rate,w-held);
              if(f>MINFLOW){wtr[li]+=f;w-=f;}
            }
          }
        }
        /* surface tension: sub-bead films on silk condense toward the fatter neighbor */
        if(touching&&w<CLING){
          let bestN=-1,bw=w*1.05;
          for(const sd of[-1,1]){
            const nx2=x+sd;
            if(nx2<0||nx2>=GW)continue;
            const li=i+sd;
            if(solid[li])continue;
            if(wtr[li]>bw){bw=wtr[li];bestN=li;}
          }
          if(bestN>=0){
            const f=Math.min(w,0.05);
            wtr[bestN]+=f;w-=f;
          }
        }
        /* tiny film evaporates only away from silk */
        if(!touching&&w<0.004)w=0;
      }
      wtr[i]=w;
    }
  }
  /* floor drains */
  const last=(GH-1)*GW;
  for(let x=0;x<GW;x++)wtr[last+x]=0;
  /* weight of resting water sags the silk */
  for(let y=0;y<GH-1;y++){
    const row=y*GW;
    for(let x=0;x<GW;x++){
      const i=row+x;
      if(wtr[i]>0.03&&solid[i+GW]){
        const o=owner[i+GW];
        if(o>=0&&!pts[o].pin)pts[o].y+=Math.min(0.15,wtr[i]*0.018);
      }
    }
  }
}
function splash(){
  for(let b=0;b<5;b++){
    const cx=2+Math.floor(R()*(GW-4)),cy=1+Math.floor(R()*4),rad=1+Math.floor(R()*2);
    for(let yy=-rad;yy<=rad;yy++)for(let xx=-rad;xx<=rad;xx++){
      if(xx*xx+yy*yy>rad*rad)continue;
      const gx=cx+xx,gy=cy+yy;
      if(gx<0||gx>=GW||gy<0||gy>=GH)continue;
      wtr[gy*GW+gx]=Math.min(1.1,wtr[gy*GW+gx]+0.8);
    }
  }
}
function blurH(src,dst){
  for(let y=0;y<GH;y++){
    const r=y*GW;
    for(let x=0;x<GW;x++){
      const i=r+x;
      const a=x>0?src[i-1]:src[i], b=x<GW-1?src[i+1]:src[i];
      dst[i]=(a+src[i]*2+b)*0.25;
    }
  }
}
function blurV(src,dst){
  for(let y=0;y<GH;y++){
    const r=y*GW;
    for(let x=0;x<GW;x++){
      const i=r+x;
      const a=y>0?src[i-GW]:src[i], b=y<GH-1?src[i+GW]:src[i];
      dst[i]=(a+src[i]*2+b)*0.25;
    }
  }
}
function processWater(){
  /* temporal smoothing hides cell-hops; blur+threshold = SDF-style smooth surface */
  for(let i=0;i<wtr.length;i++)wDisp[i]+=(wtr[i]-wDisp[i])*0.5;
  blurH(wDisp,wTmp); blurV(wTmp,wTmp2);
  for(let i=0;i<wtr.length;i++)wBytes[i]=Math.min(255,wTmp2[i]*255)|0;
  gl.bindTexture(gl.TEXTURE_2D,waterTex);
  gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,GW,GH,gl.LUMINANCE,gl.UNSIGNED_BYTE,wBytes);
}

/* ================= interaction & unlock ================= */
let mode='spin';
const bHand=document.getElementById('bHand'),bSpin=document.getElementById('bSpin'),
      bDrop=document.getElementById('bDrop');
let unlockedDrop=false,unlockedHand=false;
function setMode(m){mode=m;
  bHand.classList.toggle('on',m==='hand');
  bSpin.classList.toggle('on',m==='spin');
}
bHand.onclick=()=>setMode('hand');
bSpin.onclick=()=>setMode('spin');
document.getElementById('bNew').onclick=()=>genBlank();
bDrop.onclick=()=>splash();
function silkLength(){
  let s=0;for(const c of cons)if(!c.broken)s+=c.rest;return s;
}
function checkUnlock(){
  const s=silkLength();
  if(!unlockedDrop&&s>Math.min(W,H)*1.6){unlockedDrop=true;bDrop.classList.remove('hide');}
  if(!unlockedHand&&s>Math.min(W,H)*3.2){unlockedHand=true;bHand.classList.remove('hide');}
}
function nearestPt(x,y,rad){
  if(adjDirty)rebuildAdj();
  let best=-1,bd=rad*rad;
  for(let i=0;i<pts.length;i++){
    if((!adj[i]||adj[i].length===0)&&!pts[i].pin)continue;
    const dx=pts[i].x-x,dy=pts[i].y-y,dd=dx*dx+dy*dy;
    if(dd<bd){bd=dd;best=i;}
  }
  return best;
}
function segInt(x1,y1,x2,y2,x3,y3,x4,y4){
  const d=(x2-x1)*(y4-y3)-(y2-y1)*(x4-x3);
  if(Math.abs(d)<1e-9)return false;
  const t=((x3-x1)*(y4-y3)-(y3-y1)*(x4-x3))/d;
  const u=((x3-x1)*(y2-y1)-(y3-y1)*(x2-x1))/d;
  return t>0&&t<1&&u>0&&u<1;
}
let activeId=null,spinNew=false;
cv.addEventListener('pointerdown',e=>{
  if(activeId!==null)return;
  activeId=e.pointerId;cv.setPointerCapture(e.pointerId);
  px=lx=e.clientX;py=ly=e.clientY;down=true;
  if(mode==='hand'){
    grab=nearestPt(px,py,30);
    if(grab>=0&&pts[grab].pin)grab=-1;
  }else{
    spinFrom=nearestPt(px,py,40);spinNew=false;
    if(spinFrom<0&&(px<40||px>W-40||py<40)){spinFrom=addPt(px,py,true);spinNew=true;}
  }
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==activeId)return;
  lx=px;ly=py;px=e.clientX;py=e.clientY;
  if(mode==='hand'&&down&&grab<0){
    for(const c of cons){
      if(c.broken)continue;
      const A=pts[c.a],B=pts[c.b];
      if(segInt(lx,ly,px,py,A.x,A.y,B.x,B.y)){
        c.broken=true;adjDirty=true;
        spark((A.x+B.x)/2,(A.y+B.y)/2);
      }
    }
  }
});
function endPointer(e){
  if(e.pointerId!==activeId)return;
  activeId=null;down=false;
  if(mode==='spin'&&spinFrom>=0){
    let end=nearestPt(px,py,40);
    if(end===spinFrom)end=-1;
    if(end<0&&(px<40||px>W-40||py<40))end=addPt(px,py,true);
    if(end>=0&&end!==spinFrom){
      subdivide(spinFrom,end,1.035);
    }else if(spinNew&&spinFrom===pts.length-1){
      pts.pop();adjDirty=true;
    }
    checkUnlock();
  }
  grab=-1;spinFrom=-1;spinNew=false;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);

/* ================= render ================= */
let sData=new Float32Array(0),bData=new Float32Array(0);
function pushBlobA(arr,o,x,y,dx,dy,rx,ry,w){
  const ax=dx*rx,ay=dy*rx,bx=-dy*ry,by=dx*ry;
  const v=[[x-ax-bx,y-ay-by,-1,-1],[x+ax-bx,y+ay-by,1,-1],[x-ax+bx,y-ay+by,-1,1],
           [x+ax-bx,y+ay-by,1,-1],[x+ax+bx,y+ay+by,1,1],[x-ax+bx,y-ay+by,-1,1]];
  for(const q of v){arr[o++]=q[0];arr[o++]=q[1];arr[o++]=q[2];arr[o++]=q[3];arr[o++]=w;}
  return o;
}
function render(){
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  let live=0;for(const c of cons)if(!c.broken)live++;
  const prevSegs=(spinFrom>=0)?16:0;
  const needS=(live+prevSegs)*6*4;
  if(sData.length<needS)sData=new Float32Array(needS*2);
  let o=0;
  for(const c of cons){
    if(c.broken)continue;
    const A=pts[c.a],B=pts[c.b];
    const dx=B.x-A.x,dy=B.y-A.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const stretch=dist/c.rest;
    const wHalf=Math.max(0.9,1.5*Math.min(1.1,1/Math.sqrt(stretch)));
    const amp=0.45*Math.min(1.2,1/Math.sqrt(stretch));
    const nx=-dy/dist*wHalf,ny=dx/dist*wHalf;
    const V=[[A.x+nx,A.y+ny,1],[A.x-nx,A.y-ny,-1],[B.x+nx,B.y+ny,1],
             [A.x-nx,A.y-ny,-1],[B.x-nx,B.y-ny,-1],[B.x+nx,B.y+ny,1]];
    for(const q of V){sData[o++]=q[0];sData[o++]=q[1];sData[o++]=q[2];sData[o++]=amp;}
  }
  if(spinFrom>=0){
    const A=pts[spinFrom];
    const dist=Math.hypot(px-A.x,py-A.y);
    const sag=Math.min(70,dist*0.18)+6;
    let qx=A.x,qy=A.y;
    for(let i=1;i<=prevSegs;i++){
      const t=i/prevSegs;
      const x=A.x+(px-A.x)*t;
      const y=A.y+(py-A.y)*t+Math.sin(t*Math.PI)*sag;
      const dxx=x-qx,dyy=y-qy,dd=Math.hypot(dxx,dyy)||1;
      const nx=-dyy/dd*1.2,ny=dxx/dd*1.2,am=0.35;
      const V=[[qx+nx,qy+ny,1],[qx-nx,qy-ny,-1],[x+nx,y+ny,1],
               [qx-nx,qy-ny,-1],[x-nx,y-ny,-1],[x+nx,y+ny,1]];
      for(const q of V){sData[o++]=q[0];sData[o++]=q[1];sData[o++]=q[2];sData[o++]=am;}
      qx=x;qy=y;
    }
  }
  gl.useProgram(pStrand);
  gl.uniform2f(uSR,W,H);
  gl.bindBuffer(gl.ARRAY_BUFFER,bufStrand);
  gl.bufferData(gl.ARRAY_BUFFER,sData.subarray(0,o),gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aSP);gl.vertexAttribPointer(aSP,2,gl.FLOAT,false,16,0);
  gl.enableVertexAttribArray(aSS);gl.vertexAttribPointer(aSS,1,gl.FLOAT,false,16,8);
  gl.enableVertexAttribArray(aSA);gl.vertexAttribPointer(aSA,1,gl.FLOAT,false,16,12);
  gl.drawArrays(gl.TRIANGLES,0,o/4);
  /* anchors + sparks */
  const nBlobs=sparks.length+pts.reduce((n,p)=>n+(p.pin?1:0),0);
  const needB=Math.max(30,nBlobs*6*5);
  if(bData.length<needB)bData=new Float32Array(needB*2);
  let q=0;
  for(const p of pts)if(p.pin)q=pushBlobA(bData,q,p.x,p.y,1,0,7.0,7.0,0.62);
  for(const s of sparks){const sr=Math.max(3,s.life*6);q=pushBlobA(bData,q,s.x,s.y,1,0,sr,sr,0.5*s.life);}
  if(q>0){
    gl.useProgram(pBlob);
    gl.uniform2f(uBR,W,H);
    gl.bindBuffer(gl.ARRAY_BUFFER,bufBlob);
    gl.bufferData(gl.ARRAY_BUFFER,bData.subarray(0,q),gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(aBP);gl.vertexAttribPointer(aBP,2,gl.FLOAT,false,20,0);
    gl.enableVertexAttribArray(aBU);gl.vertexAttribPointer(aBU,2,gl.FLOAT,false,20,8);
    gl.enableVertexAttribArray(aBW);gl.vertexAttribPointer(aBW,1,gl.FLOAT,false,20,16);
    gl.drawArrays(gl.TRIANGLES,0,q/5);
  }
  /* composite */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,cv.width,cv.height);
  gl.disable(gl.BLEND);
  gl.useProgram(pComp);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fboTex);gl.uniform1i(uCF,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,waterTex);gl.uniform1i(uCW,1);
  gl.uniform2f(uCR,cv.width,cv.height);
  gl.uniform1f(uCD,DPR);
  gl.uniform2f(uCC,W/(GW*CELL),H/(GH*CELL));
  gl.bindBuffer(gl.ARRAY_BUFFER,bufQuad);
  gl.enableVertexAttribArray(aCP);gl.vertexAttribPointer(aCP,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ================= loop ================= */
function frame(){
  physics(2);
  rasterizeSolids();
  caStep();caStep();caStep();
  processWater();
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.05;s.life-=0.04;
    if(s.life<=0)sparks.splice(i,1);
  }
  render();
  requestAnimationFrame(frame);
}
function resize(){
  DPR=Math.min(1.75,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  GW=Math.ceil(W/CELL);GH=Math.ceil(H/CELL);
  wtr=new Float32Array(GW*GH);
  wDisp=new Float32Array(GW*GH);
  wTmp=new Float32Array(GW*GH);
  wTmp2=new Float32Array(GW*GH);
  solid=new Uint8Array(GW*GH);
  owner=new Int32Array(GW*GH);
  wBytes=new Uint8Array(GW*GH);
  makeFBO();makeWaterTex();
}
window.addEventListener('resize',()=>{resize();genBlank();});
resize();
genBlank();
frame();
</script>
</body>
