<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive APNG</title>
    <style>
      body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Black background for clean look */
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none; /* Disables browser scrolling gestures */
            -webkit-user-select: none; /* Safari select disable */
            user-select: none;
        }

        canvas {
            display: block;
            /* Default rendering styles */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Loading state for canvas (keeps it invisible until ready) */
        #stage {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        #stage.loaded {
            opacity: 1;
        }

        /* --- Loading Spinner CSS --- */
        #loader {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
            transition: opacity 0.3s ease-out;
            z-index: 10;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <!-- 1. Load Pako (Required dependency for UPNG to unzip data) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- 2. Load UPNG (The PNG decoder) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/upng-js/2.1.0/UPNG.min.js"></script>
  </head>
  <body>
    <!-- Loading Spinner -->
    <div id="loader"></div>
    <canvas id="stage"></canvas>
    <script>
      // --- Configuration ---
        const ASSET_PATH = 'assets/lst.png';
        const SENSITIVITY = 0.5; // Drag sensitivity

        // --- State ---
        let frames = [];
        let currentFrameIndex = 0;
        let isDragging = false;
        let startX = 0;
        let startFrameIndex = 0;
        let canvas, ctx;
        let canvasSize = 0;

        // --- Initialization ---
        async function init() {
            canvas = document.getElementById('stage');
            const loader = document.getElementById('loader');
            ctx = canvas.getContext('2d');

            try {
                // Check if libraries loaded globally
                if (typeof window.UPNG === 'undefined' || typeof window.pako === 'undefined') {
                    throw new Error("Libraries failed to load from cdnjs. Check internet connection.");
                }

                // Fetch the APNG file
                console.log(`Fetching ${ASSET_PATH}...`);
                const response = await fetch(ASSET_PATH);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const buffer = await response.arrayBuffer();

                // --- DEBUGGING CHECK ---
                // Check if the file is actually an HTML page or Proxy Error
                const header = new Uint8Array(buffer.slice(0, 100)); // Read first 100 bytes
                const headerString = String.fromCharCode.apply(null, header);

                // Check for JSON error (like the CORS Proxy one)
                if (headerString.includes('"error":') || headerString.includes('corsproxy')) {
                    console.error("CRITICAL: The server returned a JSON error instead of an image.");
                    console.error("Content:", headerString);
                    alert("Proxy Error Detected: " + headerString);
                    return;
                }

                // PNG signature is: 89 50 4E 47 0D 0A 1A 0A
                if (headerString.includes("<!D") || headerString.includes("<ht")) {
                    console.error("CRITICAL ERROR: The file downloaded appears to be an HTML page, not an image.");
                    throw new Error("File loaded is HTML (likely a 404 page), not a PNG.");
                }

                // Parse APNG structure using Global UPNG object
                const img = UPNG.decode(buffer);

                // Convert frames to RGBA 8-bit buffers
                const rgbaFrames = UPNG.toRGBA8(img);

                // Convert raw buffers to ImageBitmaps for fast drawing
                frames = [];
                for (let i = 0; i < rgbaFrames.length; i++) {
                    const frameData = new Uint8ClampedArray(rgbaFrames[i]);
                    const imageData = new ImageData(frameData, img.width, img.height);

                    const bitmap = await createImageBitmap(imageData);
                    frames.push(bitmap);
                }

                if (frames.length === 0) {
                    throw new Error("No frames could be decoded.");
                }

                console.log(`Success! Loaded ${frames.length} frames.`);

                // Initial Resize & Draw
                handleResize();
                drawFrame(0);

                // Reveal Canvas & Hide Loader
                canvas.classList.add('loaded');
                loader.classList.add('hidden');

                // Setup Input Listeners
                setupInteractions();

            } catch (err) {
                console.error("Error loading APNG:", err);
                alert("Error: " + err.message);
            }
        }

        // --- Rendering ---
        function drawFrame(index) {
            if (frames.length === 0) return;

            // Wrap index to ensure it stays within bounds
            const safeIndex = ((index % frames.length) + frames.length) % frames.length;
            currentFrameIndex = Math.round(safeIndex);

            // Clear and Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // We draw the image to fill the canvas exactly
            ctx.drawImage(frames[currentFrameIndex], 0, 0, canvas.width, canvas.height);
        }

        // --- Layout / Resizing ---
        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isPortrait = height > width;

            // Square asset logic:
            if (isPortrait) {
                canvasSize = width;
            } else {
                canvasSize = height;
            }

            // Update Canvas DOM dimensions (resolution)
            canvas.width = canvasSize;
            canvas.height = canvasSize;

            // Update CSS dimensions
            canvas.style.width = `${canvasSize}px`;
            canvas.style.height = `${canvasSize}px`;

            // Redraw current frame after resize
            drawFrame(currentFrameIndex);
        }

        // --- Interaction Logic ---
        function setupInteractions() {
            // 1. Window Resize
            window.addEventListener('resize', handleResize);

            // 2. Pointer Events (Touch & Mouse unified)
            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerUp);

            // 3. Gyroscope (Device Orientation)
            window.addEventListener('deviceorientation', onDeviceOrientation);
        }

        // --- Pointer Handlers ---
        function onPointerDown(e) {
            isDragging = true;
            startX = e.clientX;
            startFrameIndex = currentFrameIndex;

            // iOS Permission Request Hack
            requestGyroPermission();
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            e.preventDefault();
            const deltaX = e.clientX - startX;
            const frameDelta = Math.floor(deltaX * SENSITIVITY);

            drawFrame(startFrameIndex + frameDelta);
        }

        function onPointerUp() {
            isDragging = false;
        }

        // --- Gyroscope Handlers ---
        let initialGamma = null;

        function onDeviceOrientation(e) {
            // Gamma is left-to-right tilt in degrees (-90 to 90)
            const gamma = e.gamma;

            if (gamma === null) return;

            if (initialGamma === null) initialGamma = gamma;
            const deltaGamma = gamma - initialGamma;

            if (frames.length > 0 && !isDragging) {
                 const framesPerDegree = frames.length / 90;
                 const targetFrame = (gamma + 45) * framesPerDegree;
                 drawFrame(targetFrame);
            }
        }

        // --- iOS Permission Request ---
        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {

                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            // Permission granted
                        }
                    })
                    .catch(console.error);
            }
        }

        // Start
        init();
    </script>
  </body>
</html>
