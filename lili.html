<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive APNG</title>
    <style>
      body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Black background for clean look */
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none; /* Disables browser scrolling gestures */
            -webkit-user-select: none; /* Safari select disable */
            user-select: none;
        }

        canvas {
            display: block;
            /* Default rendering styles */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Loading state (optional, keeps screen black until ready) */
        #stage {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        #stage.loaded {
            opacity: 1;
        }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <!-- Switching to UPNG.js via esm.sh.
         This library is more robust for direct buffer decoding and avoids the class method issues. -->
    <script type="module">
      import UPNG from 'https://esm.sh/upng-js@2.1.0';

        // --- Configuration ---
        const ASSET_PATH = 'assets/lst.png';
        const SENSITIVITY = 0.5; // Drag sensitivity

        // --- State ---
        let frames = [];
        let currentFrameIndex = 0;
        let isDragging = false;
        let startX = 0;
        let startFrameIndex = 0;
        let canvas, ctx;
        let canvasSize = 0;

        // --- Initialization ---
        async function init() {
            canvas = document.getElementById('stage');
            ctx = canvas.getContext('2d');

            try {
                // Ensure the library loaded correctly
                const UpngLib = UPNG.default || UPNG;
                if (!UpngLib || typeof UpngLib.decode !== 'function') {
                    throw new Error("UPNG library failed to load or does not export decode function.");
                }

                // Fetch the APNG file as an ArrayBuffer
                const response = await fetch(ASSET_PATH);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const buffer = await response.arrayBuffer();

                // 1. Decode the APNG structure
                const img = UpngLib.decode(buffer);

                // 2. Convert frames to RGBA 8-bit buffers
                // UPNG.toRGBA8 returns an array of ArrayBuffers (one per frame)
                // This handles the frame composition/blending automatically
                const rgbaFrames = UpngLib.toRGBA8(img);

                // 3. Convert raw buffers to ImageBitmaps for fast drawing
                frames = [];
                for (let i = 0; i < rgbaFrames.length; i++) {
                    const frameData = new Uint8ClampedArray(rgbaFrames[i]);
                    const imageData = new ImageData(frameData, img.width, img.height);

                    // Create bitmap for GPU-accelerated drawing
                    const bitmap = await createImageBitmap(imageData);
                    frames.push(bitmap);
                }

                if (frames.length === 0) {
                    throw new Error("No frames could be decoded.");
                }

                // Initial Resize & Draw
                handleResize();
                drawFrame(0);

                // Reveal Canvas
                canvas.classList.add('loaded');

                // Setup Input Listeners
                setupInteractions();

            } catch (err) {
                console.error("Error loading APNG:", err);
            }
        }

        // --- Rendering ---
        function drawFrame(index) {
            if (frames.length === 0) return;

            // Wrap index to ensure it stays within bounds
            const safeIndex = ((index % frames.length) + frames.length) % frames.length;
            currentFrameIndex = Math.round(safeIndex);

            // Clear and Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // We draw the image to fill the canvas exactly
            ctx.drawImage(frames[currentFrameIndex], 0, 0, canvas.width, canvas.height);
        }

        // --- Layout / Resizing ---
        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isPortrait = height > width;

            // Square asset logic:
            if (isPortrait) {
                canvasSize = width;
            } else {
                canvasSize = height;
            }

            // Update Canvas DOM dimensions (resolution)
            canvas.width = canvasSize;
            canvas.height = canvasSize;

            // Update CSS dimensions
            canvas.style.width = `${canvasSize}px`;
            canvas.style.height = `${canvasSize}px`;

            // Redraw current frame after resize
            drawFrame(currentFrameIndex);
        }

        // --- Interaction Logic ---
        function setupInteractions() {
            // 1. Window Resize
            window.addEventListener('resize', handleResize);

            // 2. Pointer Events (Touch & Mouse unified)
            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerUp);

            // 3. Gyroscope (Device Orientation)
            window.addEventListener('deviceorientation', onDeviceOrientation);
        }

        // --- Pointer Handlers ---
        function onPointerDown(e) {
            isDragging = true;
            startX = e.clientX;
            startFrameIndex = currentFrameIndex;

            // iOS Permission Request Hack
            requestGyroPermission();
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            e.preventDefault();
            const deltaX = e.clientX - startX;
            const frameDelta = Math.floor(deltaX * SENSITIVITY);

            drawFrame(startFrameIndex + frameDelta);
        }

        function onPointerUp() {
            isDragging = false;
        }

        // --- Gyroscope Handlers ---
        let initialGamma = null;

        function onDeviceOrientation(e) {
            // Gamma is left-to-right tilt in degrees (-90 to 90)
            const gamma = e.gamma;

            if (gamma === null) return;

            if (initialGamma === null) initialGamma = gamma;
            const deltaGamma = gamma - initialGamma;

            if (frames.length > 0 && !isDragging) {
                 const framesPerDegree = frames.length / 90;
                 const targetFrame = (gamma + 45) * framesPerDegree;
                 drawFrame(targetFrame);
            }
        }

        // --- iOS Permission Request ---
        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {

                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            // Permission granted
                        }
                    })
                    .catch(console.error);
            }
        }

        // Start
        init();
    </script>
  </body>
</html>
