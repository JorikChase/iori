<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lili</title>
    <style>
      body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Black background for clean look */
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none; /* Disables browser scrolling gestures */
            -webkit-user-select: none; /* Safari select disable */
            user-select: none;
            font-family: monospace;
        }

        canvas {
            display: block;
            /* Default rendering styles */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        canvas.loaded {
            opacity: 1;
        }

        /* Loading / Debug Overlay */
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #444;
            pointer-events: none;
            z-index: 10;
            max-width: 80%;
            word-wrap: break-word;
        }
        #status.error {
            color: #ff4444;
        }
        #status.success {
            color: #44ff44;
            animation: fadeOut 2s forwards 1s;
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }
    </style>
  </head>
  <body>
    <div id="status">Initializing...</div>
    <canvas id="stage"></canvas>
    <script type="module">
      import UPNG from 'https://esm.sh/upng-js@2.1.0';

        // --- Configuration ---
        // We use the absolute URL to ensure it works regardless of where the HTML is hosted.
        const ASSET_URL = 'https://iori.me/assets/lili.png';
        const SENSITIVITY = 0.5; // Drag sensitivity

        // --- State ---
        let frames = [];
        let currentFrameIndex = 0;
        let isDragging = false;
        let startX = 0;
        let startFrameIndex = 0;
        let canvas, ctx;
        let canvasSize = 0;
        const statusEl = document.getElementById('status');

        // --- Logging Helper ---
        function log(msg, type = 'info') {
            console.log(msg);
            statusEl.textContent = msg;
            if (type === 'error') statusEl.className = 'error';
            if (type === 'success') statusEl.className = 'success';
        }

        // --- Initialization ---
        async function init() {
            canvas = document.getElementById('stage');
            ctx = canvas.getContext('2d');

            try {
                // Ensure the library loaded correctly
                const UpngLib = UPNG.default || UPNG;
                if (!UpngLib || typeof UpngLib.decode !== 'function') {
                    throw new Error("UPNG library failed to load.");
                }

                log(`Fetching image...`);

                let buffer;

                // --- ROBUST FETCH STRATEGY ---
                // 1. Try Direct Fetch (Works if Same-Origin or if Server has CORS enabled)
                try {
                    const response = await fetch(ASSET_URL, { mode: 'cors' });
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    buffer = await response.arrayBuffer();
                } catch (directError) {
                    console.warn("Direct fetch failed (likely CORS). Attempting proxy fallback...", directError);
                    log("Direct load failed. Retrying via CORS proxy...");

                    // 2. Fallback: Use a CORS Proxy (Necessary for local testing/previews if server lacks headers)
                    // We use corsproxy.io as a fallback to ensure the asset loads in this preview
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(ASSET_URL)}`;
                    const proxyResponse = await fetch(proxyUrl);
                    if (!proxyResponse.ok) throw new Error(`Proxy Status ${proxyResponse.status}`);
                    buffer = await proxyResponse.arrayBuffer();
                }

                // --- VALIDATION ---
                // Check for HTML response (common 404 masked as 200)
                const header = new Uint8Array(buffer.slice(0, 8));
                const headerString = String.fromCharCode.apply(null, header);

                // PNG signature: 89 50 4E 47 ...
                if (headerString.includes("<!D") || headerString.includes("<ht")) {
                    throw new Error("File loaded is HTML, not PNG. Check URL.");
                }

                log("Decoding APNG...");
                // Parse APNG structure
                const img = UpngLib.decode(buffer);

                // Convert frames to RGBA 8-bit buffers
                const rgbaFrames = UpngLib.toRGBA8(img);

                // Convert raw buffers to ImageBitmaps for fast drawing
                frames = [];
                for (let i = 0; i < rgbaFrames.length; i++) {
                    const frameData = new Uint8ClampedArray(rgbaFrames[i]);
                    const imageData = new ImageData(frameData, img.width, img.height);

                    // Create bitmap for performance
                    const bitmap = await createImageBitmap(imageData);
                    frames.push(bitmap);
                }

                if (frames.length === 0) {
                    throw new Error("No frames found in APNG.");
                }

                log(`Ready (${frames.length} frames)`, 'success');

                // Initial Resize & Draw
                handleResize();
                drawFrame(0);

                // Reveal Canvas
                canvas.classList.add('loaded');

                // Setup Input Listeners
                setupInteractions();

            } catch (err) {
                console.error(err);
                log(`Error: ${err.message}`, 'error');
            }
        }

        // --- Rendering ---
        function drawFrame(index) {
            if (frames.length === 0) return;

            // Wrap index to ensure it stays within bounds
            const safeIndex = ((index % frames.length) + frames.length) % frames.length;
            currentFrameIndex = Math.round(safeIndex);

            // Clear and Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(frames[currentFrameIndex], 0, 0, canvas.width, canvas.height);
        }

        // --- Layout / Resizing ---
        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isPortrait = height > width;

            // Square asset logic:
            if (isPortrait) {
                canvasSize = width;
            } else {
                canvasSize = height;
            }

            // Update Canvas DOM dimensions (resolution)
            canvas.width = canvasSize;
            canvas.height = canvasSize;

            // Update CSS dimensions
            canvas.style.width = `${canvasSize}px`;
            canvas.style.height = `${canvasSize}px`;

            // Redraw current frame after resize
            drawFrame(currentFrameIndex);
        }

        // --- Interaction Logic ---
        function setupInteractions() {
            window.addEventListener('resize', handleResize);

            // Pointer Events (Mouse + Touch)
            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerUp);

            // Gyroscope
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', onDeviceOrientation);
            }
        }

        // --- Pointer Handlers ---
        function onPointerDown(e) {
            isDragging = true;
            startX = e.clientX;
            startFrameIndex = currentFrameIndex;
            canvas.style.cursor = 'grabbing';

            requestGyroPermission();
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const deltaX = e.clientX - startX;
            // Adjust sensitivity relative to screen width for consistency
            const normalizedDelta = deltaX * (frames.length / window.innerWidth) * 2;

            drawFrame(startFrameIndex + normalizedDelta);
        }

        function onPointerUp() {
            isDragging = false;
            canvas.style.cursor = 'default';
        }

        // --- Gyroscope Handlers ---
        let initialGamma = null;

        function onDeviceOrientation(e) {
            const gamma = e.gamma; // Left-to-right tilt (-90 to 90)
            if (gamma === null) return;

            if (initialGamma === null) initialGamma = gamma;

            // Only control if not dragging
            if (frames.length > 0 && !isDragging) {
                 // Map gamma (-45 to 45 degree tilt range) to frame range
                 const tilt = Math.max(-45, Math.min(45, gamma));
                 const percent = (tilt + 45) / 90;
                 const targetFrame = percent * frames.length;

                 // Smooth lerp could be added here, but direct mapping is responsive
                 drawFrame(targetFrame);
            }
        }

        // --- iOS Permission Request ---
        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {

                // Only request if we haven't already (simplified check)
                DeviceOrientationEvent.requestPermission()
                    .then(state => console.log('Gyro permission:', state))
                    .catch(console.error);
            }
        }

        // Start
        init();
    </script>
  </body>
</html>
