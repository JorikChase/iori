<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lili</title>
    <style>
      body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Black background for clean look */
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none; /* Disables browser scrolling gestures */
            -webkit-user-select: none; /* Safari select disable */
            user-select: none;
            font-family: monospace;
        }

        canvas {
            display: block;
            /* removed crisp-edges to allow smooth anti-aliasing */
            transition: opacity 0.5s ease-in;
        }

        /* We no longer need the text status overlay */
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module">
      import UPNG from 'https://esm.sh/upng-js@2.1.0';

        // --- Configuration ---
        const ASSET_URL = 'https://iori.me/assets/lili.png';

        // --- State ---
        let frames = [];
        let currentFrameIndex = 0;
        let isDragging = false;
        let startX = 0;
        let startFrameIndex = 0;
        let canvas, ctx;
        let canvasSize = 0;

        // Loading State
        let isLoading = true;
        let loaderFrameId = null;

        // --- Initialization ---
        async function init() {
            canvas = document.getElementById('stage');
            ctx = canvas.getContext('2d');

            // Set initial size
            handleResize();

            // Start the flower loading animation immediately
            startLoadingAnimation();

            try {
                // Ensure the library loaded correctly
                const UpngLib = UPNG.default || UPNG;
                if (!UpngLib || typeof UpngLib.decode !== 'function') {
                    throw new Error("UPNG library failed to load.");
                }

                // --- Fetch Strategy ---
                let buffer;
                try {
                    const response = await fetch(ASSET_URL, { mode: 'cors' });
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    buffer = await response.arrayBuffer();
                } catch (directError) {
                    console.warn("Direct fetch failed, trying proxy...");
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(ASSET_URL)}`;
                    const proxyResponse = await fetch(proxyUrl);
                    if (!proxyResponse.ok) throw new Error(`Proxy Status ${proxyResponse.status}`);
                    buffer = await proxyResponse.arrayBuffer();
                }

                // --- Validation ---
                const header = new Uint8Array(buffer.slice(0, 8));
                const headerString = String.fromCharCode.apply(null, header);
                if (headerString.includes("<!D") || headerString.includes("<ht")) {
                    throw new Error("File loaded is HTML, not PNG.");
                }

                // --- Decoding ---
                const img = UpngLib.decode(buffer);
                const rgbaFrames = UpngLib.toRGBA8(img);

                // Process frames
                frames = [];
                for (let i = 0; i < rgbaFrames.length; i++) {
                    const frameData = new Uint8ClampedArray(rgbaFrames[i]);
                    const imageData = new ImageData(frameData, img.width, img.height);
                    const bitmap = await createImageBitmap(imageData);
                    frames.push(bitmap);
                }

                if (frames.length === 0) throw new Error("No frames found.");

                // --- Success Transition ---
                isLoading = false;
                if (loaderFrameId) cancelAnimationFrame(loaderFrameId); // Stop loader

                // Final layout update and draw first frame
                handleResize();
                drawFrame(0);

                // Setup Interaction
                setupInteractions();

            } catch (err) {
                console.error(err);
                // If error, we keep the loader running but maybe change color or stop it
                // For now, we just log to console to keep the UI clean as requested ("no text")
            }
        }

        // --- Loading Animation (Flower Theme) ---
        function startLoadingAnimation() {
            let tick = 0;

            function loop() {
                if (!isLoading) return;

                tick += 0.02;

                // Clear with a slight fade trail or full clear
                // Full clear for clean look
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const minDim = Math.min(canvas.width, canvas.height);
                const radius = minDim * 0.15; // Base radius

                // Breathing effect
                const breath = Math.sin(tick * 2) * (radius * 0.1);

                // Draw Flower
                ctx.beginPath();
                const petals = 6;

                for (let i = 0; i <= Math.PI * 2; i += 0.01) {
                    // Polar rose equation: r = cos(k * theta)
                    // We modify it to circle around a center
                    const theta = i;
                    // Petal shape offset
                    const rOffset = Math.sin(theta * petals + tick) * (radius * 0.5);
                    const r = radius + breath + rOffset;

                    const x = cx + Math.cos(theta + tick * 0.3) * r;
                    const y = cy + Math.sin(theta + tick * 0.3) * r;

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.closePath();

                // Styling
                ctx.strokeStyle = `rgba(255, 255, 255, 0.4)`; // Subtle white
                ctx.lineWidth = 2;
                ctx.stroke();

                // Inner circle
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.2 + Math.abs(breath), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, 0.6)`;
                ctx.fill();

                loaderFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        // --- Rendering ---
        function drawFrame(index) {
            // Safety Check 1: Do we have frames?
            if (!frames || frames.length === 0) return;

            // Normalize index
            const safeIndex = ((index % frames.length) + frames.length) % frames.length;
            currentFrameIndex = Math.round(safeIndex);

            // Safety Check 2: Does the specific frame exist?
            // This prevents the "Argument 1 could not be converted" error if index is NaN or out of bounds logic fails
            const frameBitmap = frames[currentFrameIndex];
            if (!frameBitmap) return;

            // Clear and Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            try {
                ctx.drawImage(frameBitmap, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                console.warn("Draw error skipped:", e);
            }
        }

        // --- Layout / Resizing ---
        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isPortrait = height > width;

            if (isPortrait) {
                canvasSize = width;
            } else {
                canvasSize = height;
            }

            canvas.width = canvasSize;
            canvas.height = canvasSize;
            canvas.style.width = `${canvasSize}px`;
            canvas.style.height = `${canvasSize}px`;

            if (!isLoading) {
                drawFrame(currentFrameIndex);
            }
        }

        // --- Interaction Logic ---
        function setupInteractions() {
            window.addEventListener('resize', handleResize);

            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerUp);

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', onDeviceOrientation);
            }
        }

        function onPointerDown(e) {
            if (isLoading) return;
            isDragging = true;
            startX = e.clientX;
            startFrameIndex = currentFrameIndex;
            canvas.style.cursor = 'grabbing';
            requestGyroPermission();
        }

        function onPointerMove(e) {
            if (!isDragging || isLoading) return;
            e.preventDefault();
            const deltaX = e.clientX - startX;
            // Sensitivity math
            const normalizedDelta = deltaX * (frames.length / window.innerWidth) * 2;
            drawFrame(startFrameIndex + normalizedDelta);
        }

        function onPointerUp() {
            isDragging = false;
            canvas.style.cursor = 'default';
        }

        // --- Gyroscope ---
        let initialGamma = null;

        function onDeviceOrientation(e) {
            if (isLoading) return;
            const gamma = e.gamma;
            if (gamma === null) return;
            if (initialGamma === null) initialGamma = gamma;

            if (frames.length > 0 && !isDragging) {
                 const tilt = Math.max(-45, Math.min(45, gamma));
                 const percent = (tilt + 45) / 90;
                 const targetFrame = percent * frames.length;
                 drawFrame(targetFrame);
            }
        }

        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(console.error);
            }
        }

        // Start
        init();
    </script>
  </body>
</html>
