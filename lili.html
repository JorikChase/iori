<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lili</title>
    <style>
      body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: monospace;
        }

        canvas {
            display: block;
            /* Ensure smooth scaling for high-quality rendering */
            image-rendering: auto;
            transition: opacity 0.5s ease-in;
        }

        /* --- Cute Flower Loader CSS --- */
        .flower-loader {
            position: fixed;
            top: 24px;
            left: 24px;
            width: 40px;
            height: 40px;
            z-index: 1000;
            animation: rotateFlower 2.5s linear infinite;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.8s ease-out;
        }

        .flower-loader.hidden {
            opacity: 0;
        }

        .petal {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            margin-top: -5px; /* Half of width to center */
            margin-left: -5px;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
        }

        /* Distribute 6 petals in a circle */
        .petal:nth-child(1) { transform: rotate(0deg) translate(14px); }
        .petal:nth-child(2) { transform: rotate(60deg) translate(14px); }
        .petal:nth-child(3) { transform: rotate(120deg) translate(14px); }
        .petal:nth-child(4) { transform: rotate(180deg) translate(14px); }
        .petal:nth-child(5) { transform: rotate(240deg) translate(14px); }
        .petal:nth-child(6) { transform: rotate(300deg) translate(14px); }

        /* A little center dot */
        .center-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: rgba(255,255,255,0.9);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            margin-top: -3px;
            margin-left: -3px;
        }

        @keyframes rotateFlower {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
  </head>
  <body>
    <!-- Loader Element -->
    <div id="loader" class="flower-loader">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center-dot"></div>
    </div>
    <canvas id="stage"></canvas>
    <script type="module">
      import UPNG from 'https://esm.sh/upng-js@2.1.0';

        // --- Configuration ---
        const ASSET_URL = 'https://iori.me/assets/lili.png';

        // --- State ---
        let frames = []; // Array of ImageBitmaps
        let totalFramesCount = 0; // Total expected frames (for interaction math)
        let currentFrameIndex = 0;
        let targetFrameIndex = 0; // Decoupled target for smooth loop

        let isDragging = false;
        let startX = 0;
        let startFrameIndex = 0;

        let canvas, ctx;
        let canvasSize = 0;
        let maxRenderDim = 1024; // Safety limit for textures

        // State flags
        let isLoading = true;
        let isProcessing = false;

        // --- Initialization ---
        async function init() {
            canvas = document.getElementById('stage');
            ctx = canvas.getContext('2d');

            // Set initial size and determine safe limits
            handleResize();

            // Start Render Loop immediately
            renderLoop();

            try {
                // Ensure library loaded
                const UpngLib = UPNG.default || UPNG;
                if (!UpngLib || typeof UpngLib.decode !== 'function') {
                    throw new Error("UPNG library failed to load.");
                }

                // --- Fetch ---
                let buffer;
                try {
                    const response = await fetch(ASSET_URL, { mode: 'cors' });
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    buffer = await response.arrayBuffer();
                } catch (directError) {
                    console.warn("Direct fetch failed, trying proxy...");
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(ASSET_URL)}`;
                    const proxyResponse = await fetch(proxyUrl);
                    if (!proxyResponse.ok) throw new Error(`Proxy Status ${proxyResponse.status}`);
                    buffer = await proxyResponse.arrayBuffer();
                }

                // --- Validation ---
                const header = new Uint8Array(buffer.slice(0, 8));
                const headerString = String.fromCharCode.apply(null, header);
                if (headerString.includes("<!D") || headerString.includes("<ht")) {
                    throw new Error("File loaded is HTML, not PNG.");
                }

                // --- Decoding ---
                const img = UpngLib.decode(buffer);
                const rgbaFrames = UpngLib.toRGBA8(img);

                // Clear original buffer to free memory immediately
                buffer = null;

                totalFramesCount = rgbaFrames.length;
                if (totalFramesCount === 0) throw new Error("No frames found.");

                // --- Progressive Frame Generation ---
                isProcessing = true;
                frames = [];

                await processFramesProgressively(rgbaFrames, img.width, img.height);

            } catch (err) {
                console.error("Init Error:", err);
            }
        }

        async function processFramesProgressively(rgbaFrames, width, height) {
            // Determine scale factor for memory safety
            // We scale down the internal bitmap if the source is larger than the screen
            // This massively saves RAM on mobile devices.
            const srcMax = Math.max(width, height);
            let resizeOptions = undefined;

            // If source is larger than our calculated safe render dimension, scale it down.
            if (srcMax > maxRenderDim) {
                const scale = maxRenderDim / srcMax;
                resizeOptions = {
                    resizeWidth: Math.round(width * scale),
                    resizeHeight: Math.round(height * scale),
                    resizeQuality: 'medium'
                };
                console.log(`Downscaling frames: ${width}x${height} -> ${resizeOptions.resizeWidth}x${resizeOptions.resizeHeight}`);
            }

            for (let i = 0; i < rgbaFrames.length; i++) {
                try {
                    const frameData = new Uint8ClampedArray(rgbaFrames[i]);
                    const imageData = new ImageData(frameData, width, height);

                    // Create bitmap (async) with optional resizing
                    const bitmap = await createImageBitmap(imageData, resizeOptions);
                    frames.push(bitmap);

                    // --- MEMORY OPTIMIZATION ---
                    // Clear the raw buffer for this frame immediately to save RAM
                    rgbaFrames[i] = null;

                    // Explicitly dereference the TypedArray wrapper too
                    frameData.buffer = null;

                } catch (memErr) {
                    console.warn("Frame creation failed (likely OOM), stopping load.", memErr);
                    // Stop loading more frames to prevent full crash, but keep what we have
                    break;
                }

                // --- UNLOCK UI ---
                if (isLoading && frames.length > 0) {
                    isLoading = false;
                    const loader = document.getElementById('loader');
                    if (loader) loader.classList.add('hidden');
                    setupInteractions();
                    handleResize();
                }

                // Yield to main thread EVERY frame to prevent UI lockup and allow GC
                // This is crucial for Safari iOS stability
                await new Promise(r => setTimeout(r, 0));
            }

            isProcessing = false;
            // Clear the entire array container
            rgbaFrames = null;
            console.log("All frames processed.");
        }

        // --- Rendering ---

        function renderLoop() {
            requestAnimationFrame(renderLoop);

            // Only draw if we have content
            if (frames.length === 0) return;

            // Direct assignment for snappier dragging
            currentFrameIndex = targetFrameIndex;

            drawFrame(currentFrameIndex);
        }

        function drawFrame(index) {
            if (!frames || frames.length === 0) return;

            const maxFrames = Math.max(1, frames.length); // Use actual loaded length

            // Normalize index to 0...totalFrames-1
            const safeIndex = ((index % maxFrames) + maxFrames) % maxFrames;

            let renderIndex = Math.round(safeIndex);
            if (renderIndex >= frames.length) {
                renderIndex = frames.length - 1;
            }

            const frameBitmap = frames[renderIndex];
            if (!frameBitmap || typeof frameBitmap.width === 'undefined') return;

            // --- ROBUST CLEAR ---
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            try {
                // Determine scale to fit canvas
                // Since we might have downscaled the bitmap, we rely on drawImage scaling
                // to fit it to the canvas.width/height (physical pixels)
                ctx.drawImage(frameBitmap, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                // Suppress rendering errors
            }
        }

        // --- Layout / Resizing (DPI Aware) ---
        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isPortrait = height > width;

            // CAP DPR: High DPR on large canvases causes crash on iOS Safari
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            // Calculate a safe texture limit based on screen size
            // We allow slightly larger than screen for crispness, but cap at 1200px
            const screenMax = Math.max(width, height) * dpr;
            maxRenderDim = Math.min(screenMax, 1200);

            if (isPortrait) {
                canvasSize = width;
            } else {
                canvasSize = height;
            }

            // Set physical pixel resolution
            canvas.width = canvasSize * dpr;
            canvas.height = canvasSize * dpr;

            // Set CSS display size
            canvas.style.width = `${canvasSize}px`;
            canvas.style.height = `${canvasSize}px`;

            // Reset transform because we are drawing full rect now
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        // --- Interaction Logic ---
        function setupInteractions() {
            window.removeEventListener('resize', handleResize);
            window.addEventListener('resize', handleResize);

            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerUp);

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', onDeviceOrientation);
            }
        }

        function onPointerDown(e) {
            if (isLoading) return;
            isDragging = true;
            startX = e.clientX;
            startFrameIndex = targetFrameIndex;
            canvas.style.cursor = 'grabbing';
            requestGyroPermission();
        }

        function onPointerMove(e) {
            if (!isDragging || isLoading) return;
            e.preventDefault();
            const deltaX = e.clientX - startX;

            const framesToUse = frames.length > 0 ? frames.length : 100;
            const normalizedDelta = deltaX * (framesToUse / window.innerWidth) * 2;

            // Update TARGET, don't draw immediately
            targetFrameIndex = startFrameIndex + normalizedDelta;
        }

        function onPointerUp() {
            isDragging = false;
            canvas.style.cursor = 'default';
        }

        // --- Gyroscope ---
        let initialGamma = null;

        function onDeviceOrientation(e) {
            if (isLoading) return;
            const gamma = e.gamma;
            if (gamma === null) return;
            if (initialGamma === null) initialGamma = gamma;

            if (frames.length > 0 && !isDragging) {
                 const tilt = Math.max(-45, Math.min(45, gamma));
                 const percent = (tilt + 45) / 90;

                 const maxFrames = frames.length;

                 // Update TARGET, don't draw immediately
                 targetFrameIndex = percent * maxFrames;
            }
        }

        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(e => {});
            }
        }

        // Start
        init();
    </script>
  </body>
</html>
