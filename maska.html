<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Landmarker WebGL</title>
    <style>
        /* Force the page to take up the full screen and remove default white margins */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f0f0f;
            /* Match your scene background */
        }

        canvas {
            display: block;
        }
    </style>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GKKJ5VX340"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ERECDMYSNT"></script>

        function gtag() { dataLayer.push(arguments); }

        if (window.location.hostname.includes('3die.fr')) {
            gtag('config', 'G-ERECDMYSNT');

        }

        // Dynamic Canonical
        (function () {

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
            }
        }
    </script>
    <!-- iOS and Android PWA & New Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="icon/ios/32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/ios/16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon/ios/180.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>

<body>
    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
        import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
        import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
        import { GUI } from "https://cdn.jsdelivr.net/npm/lil-gui@0.18.2/dist/lil-gui.esm.min.js";

        // Mediapipe
        import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
        const { FaceLandmarker, FilesetResolver } = vision;

        const blendshapesMap = {
            browDownLeft: "browDown_L", browDownRight: "browDown_R", browInnerUp: "browInnerUp",
            browOuterUpLeft: "browOuterUp_L", browOuterUpRight: "browOuterUp_R", cheekPuff: "cheekPuff",
            cheekSquintLeft: "cheekSquint_L", cheekSquintRight: "cheekSquint_R", eyeBlinkLeft: "eyeBlink_L",
            eyeBlinkRight: "eyeBlink_R", eyeLookDownLeft: "eyeLookDown_L", eyeLookDownRight: "eyeLookDown_R",
            eyeLookInLeft: "eyeLookIn_L", eyeLookInRight: "eyeLookIn_R", eyeLookOutLeft: "eyeLookOut_L",
            eyeLookOutRight: "eyeLookOut_R", eyeLookUpLeft: "eyeLookUp_L", eyeLookUpRight: "eyeLookUp_R",
            eyeSquintLeft: "eyeSquint_L", eyeSquintRight: "eyeSquint_R", eyeWideLeft: "eyeWide_L",
            eyeWideRight: "eyeWide_R", jawForward: "jawForward", jawLeft: "jawLeft", jawOpen: "jawOpen",
            jawRight: "jawRight", mouthClose: "mouthClose", mouthDimpleLeft: "mouthDimple_L",
            mouthDimpleRight: "mouthDimple_R", mouthFrownLeft: "mouthFrown_L", mouthFrownRight: "mouthFrown_R",
            mouthFunnel: "mouthFunnel", mouthLeft: "mouthLeft", mouthLowerDownLeft: "mouthLowerDown_L",
            mouthLowerDownRight: "mouthLowerDown_R", mouthPressLeft: "mouthPress_L", mouthPressRight: "mouthPress_R",
            mouthPucker: "mouthPucker", mouthRight: "mouthRight", mouthRollLower: "mouthRollLower",
            mouthRollUpper: "mouthRollUpper", mouthShrugLower: "mouthShrugLower", mouthShrugUpper: "mouthShrugUpper",
            mouthSmileLeft: "mouthSmile_L", mouthSmileRight: "mouthSmile_R", mouthStretchLeft: "mouthStretch_L",
            mouthStretchRight: "mouthStretch_R", mouthUpperUpLeft: "mouthUpperUp_L", mouthUpperUpRight: "mouthUpperUp_R",
            noseSneerLeft: "noseSneer_L", noseSneerRight: "noseSneer_R"
        };

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 100);
        camera.position.z = 5;

        const scene = new THREE.Scene();
        scene.scale.x = -1;

        const environment = new RoomEnvironment();
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.background = new THREE.Color(0x0f0f0f);
        scene.environment = pmremGenerator.fromScene(environment).texture;

        const controls = new OrbitControls(camera, renderer.domElement);

        let face, eyeL, eyeR;
        const eyeRotationLimit = THREE.MathUtils.degToRad(30);

        const ktx2Loader = new KTX2Loader()
            .setTranscoderPath("https://unpkg.com/three@0.162.0/examples/jsm/libs/basis/")
            .detectSupport(renderer);

        // -- VIDEO ELEMENT FIXES --
        const videoElement = document.createElement("video");
        videoElement.src = "/images/autoportrait_v2.mp4";
        videoElement.crossOrigin = "anonymous";
        videoElement.loop = true;
        videoElement.muted = true;
        videoElement.playsInline = true; // Added for better mobile support

        // Catch the unhandled promise rejection to prevent script crashing
        videoElement.play().catch(error => {
            console.error("Failed to decode or play autoportrait.mp4. Check the file format (must be standard H264 .mp4) or file path.", error);
        });

        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        new GLTFLoader()
            .setKTX2Loader(ktx2Loader)
            .setMeshoptDecoder(MeshoptDecoder)
            .load("/assets/facecap.glb", (gltf) => {
                const mesh = gltf.scene.children[0];
                scene.add(mesh);

                const head = mesh.getObjectByName("mesh_2");
                if (head) {
                    const customMaterial = new THREE.MeshBasicMaterial({
                        map: videoTexture,
                        morphTargets: true,
                        side: THREE.DoubleSide,
                        shininess: 1,
                        bumpMap: videoTexture,
                        bump: 1,
                    });

                    videoTexture.wrapS = THREE.ClampToEdgeWrapping;
                    videoTexture.wrapT = THREE.ClampToEdgeWrapping;
                    videoTexture.minFilter = THREE.LinearFilter;
                    videoTexture.magFilter = THREE.LinearFilter;

                    const textureMatrix = new THREE.Matrix3();
                    const updateTextureMatrix = (offset, scale) => {
                        textureMatrix.setUvTransform(offset.x, offset.y, scale.x, scale.y, 0, 0.5, 0.5);
                    };

                    head.material = customMaterial;

                    const textureControls = {
                        offsetX: 0.215,
                        offsetY: 0.103,
                        scaleX: 0.000135,
                        scaleY: 0.000145,
                        updateTexture: function () {
                            videoTexture.offset.set(this.offsetX, this.offsetY);
                            videoTexture.repeat.set(this.scaleX, this.scaleY);
                            videoTexture.needsUpdate = true;
                        },
                    };

                    const gui = new GUI();
                    const textureFolder = gui.addFolder("Texture Controls");
                    textureFolder.add(textureControls, "offsetX", -1, 1, 0.001).onChange(() => textureControls.updateTexture());
                    textureFolder.add(textureControls, "offsetY", -1, 1, 0.001).onChange(() => textureControls.updateTexture());
                    textureFolder.add(textureControls, "scaleX", 0.0001, 0.001, 0.0001).onChange(() => textureControls.updateTexture());
                    textureFolder.add(textureControls, "scaleY", 0.0001, 0.001, 0.0001).onChange(() => textureControls.updateTexture());
                    textureFolder.open();

                    textureControls.updateTexture();

                    if (head.morphTargetDictionary && head.morphTargetInfluences) {
                        const morphFolder = gui.addFolder("Morphs");
                        for (const [key, value] of Object.entries(head.morphTargetDictionary)) {
                            morphFolder.add(head.morphTargetInfluences, value, 0, 1, 0.01).name(key.replace("blendShape1.", "")).listen();
                        }
                        morphFolder.open();
                    }
                }

                face = mesh.getObjectByName("mesh_2");
                eyeL = mesh.getObjectByName("eyeLeft");
                eyeR = mesh.getObjectByName("eyeRight");

                // Safety check: Only apply materials if eye nodes exist in the GLB
                if (eyeL && eyeR) {
                    const customMaterial = new THREE.MeshBasicMaterial({
                        map: videoTexture,
                        morphTargets: true,
                        side: THREE.DoubleSide,
                    });
                    eyeL.material = customMaterial;
                    eyeR.material = customMaterial;
                } else {
                    console.warn("eyeLeft or eyeRight not found in the GLB model.");
                }

                renderer.setAnimationLoop(animate);
            }, undefined, (error) => {
                // Catch GLB loading errors so we know if the model is failing
                console.error("An error happened while loading the GLB model:", error);
            });

        // Webcam Video Setup
        const video = document.createElement("video");
        video.playsInline = true;

        const texture = new THREE.VideoTexture(video);
        texture.colorSpace = THREE.SRGBColorSpace;

        const geometry = new THREE.PlaneGeometry(1, 1);
        const material = new THREE.MeshBasicMaterial({ map: texture, depthWrite: false });
        const videomesh = new THREE.Mesh(geometry, material);
        scene.add(videomesh);

        // MediaPipe
        const filesetResolver = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm",
        );

        const faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                delegate: "GPU",
            },
            outputFaceBlendshapes: true,
            outputFacialTransformationMatrixes: true,
            runningMode: "VIDEO",
            numFaces: 1,
        });

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices
                .getUserMedia({ video: { facingMode: "user" } })
                .then(function (stream) {
                    video.srcObject = stream;
                    video.play();
                })
                .catch(function (error) {
                    console.error("Unable to access the camera/webcam.", error);
                });
        }

        const transform = new THREE.Object3D();

        function animate() {
            if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
                const results = faceLandmarker.detectForVideo(video, Date.now());

                if (results.facialTransformationMatrixes && results.facialTransformationMatrixes.length > 0) {
                    const facialTransformationMatrixes = results.facialTransformationMatrixes[0].data;
                    transform.matrix.fromArray(facialTransformationMatrixes);
                    transform.matrix.decompose(transform.position, transform.quaternion, transform.scale);

                    const object = scene.getObjectByName("grp_transform");
                    if (object) {
                        object.position.x = transform.position.x;
                        object.position.y = transform.position.z + 40;
                        object.position.z = -transform.position.y;

                        object.rotation.x = transform.rotation.x;
                        object.rotation.y = transform.rotation.z;
                        object.rotation.z = -transform.rotation.y;
                    }
                }

                if (results.faceBlendshapes && results.faceBlendshapes.length > 0 && face) {
                    const faceBlendshapes = results.faceBlendshapes[0].categories;
                    const eyeScore = { leftHorizontal: 0, rightHorizontal: 0, leftVertical: 0, rightVertical: 0 };

                    for (const blendshape of faceBlendshapes) {
                        const categoryName = blendshape.categoryName;
                        const score = blendshape.score;

                        if (face.morphTargetDictionary && face.morphTargetInfluences) {
                            const index = face.morphTargetDictionary[blendshapesMap[categoryName]];
                            if (index !== undefined) {
                                face.morphTargetInfluences[index] = score;
                            }
                        }

                        switch (categoryName) {
                            case "eyeLookInLeft": eyeScore.leftHorizontal += score; break;
                            case "eyeLookOutLeft": eyeScore.leftHorizontal -= score; break;
                            case "eyeLookInRight": eyeScore.rightHorizontal -= score; break;
                            case "eyeLookOutRight": eyeScore.rightHorizontal += score; break;
                            case "eyeLookUpLeft": eyeScore.leftVertical -= score; break;
                            case "eyeLookDownLeft": eyeScore.leftVertical += score; break;
                            case "eyeLookUpRight": eyeScore.rightVertical -= score; break;
                            case "eyeLookDownRight": eyeScore.rightVertical += score; break;
                        }
                    }

                    if (eyeL && eyeR) {
                        eyeL.rotation.z = eyeScore.leftHorizontal * eyeRotationLimit;
                        eyeR.rotation.z = eyeScore.rightHorizontal * eyeRotationLimit;
                        eyeL.rotation.x = eyeScore.leftVertical * eyeRotationLimit;
                        eyeR.rotation.x = eyeScore.rightVertical * eyeRotationLimit;
                    }
                }
            }

            videomesh.scale.x = video.videoWidth / 100 || 1;
            videomesh.scale.y = video.videoHeight / 100 || 1;

            if (videoTexture) videoTexture.needsUpdate = true;

            renderer.render(scene, camera);
            controls.update();
        }

        window.addEventListener("resize", function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
