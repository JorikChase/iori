<body class="h-full w-full bg-black overflow-hidden select-none relative">

  <canvas id="viewport"></canvas>

  <!-- Control Overlay / HUD -->
  <div class="absolute bottom-4 left-4 right-4 md:right-auto pointer-events-none flex flex-col gap-2 z-10">
    <div class="bg-black/60 backdrop-blur-md border border-white/10 rounded-xl p-3 text-white text-xs max-w-sm pointer-events-auto shadow-2xl">
      <h1 class="font-bold text-sm text-cyan-400 mb-1 flex items-center justify-between">
        <span>Mirrorbrot</span>
      </h1>
      <p class="text-gray-300 leading-relaxed mb-2">
        Interior points mirror the exterior color domain through the boundary using a signed distance field derivative fold with epsilon boundary offset.
      </p>
      <div class="flex items-center justify-between text-[10px] text-gray-400 font-mono border-t border-white/10 pt-2">
        <span id="stat-pos">X: -0.5000 | Y: 0.0000</span>
        <span id="stat-zoom">Zoom: 1.0x</span>
      </div>
    </div>
  </div>

  <!-- Reset View Floating Button -->
  <button id="reset-btn" class="absolute top-4 right-4 bg-black/60 hover:bg-black/80 backdrop-blur-md border border-white/10 text-white/80 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-lg z-10 flex items-center gap-1.5">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
    Reset View

  <script>
    /**
     * MANDELBROT MIRROR FOLD
     *
     * Rendering equation:
     * C(c) = A( R(c) )
     * where R(c) = c - (2 s(c) - eps) * grad(s(c)) / |grad(s(c))|
     *
     * s(c) is a signed distance estimate:
     * s(c) > 0  outside M
     * s(c) < 0  inside  M
     * s(c) = 0  on boundary
     *
     * The interior mirrors the exterior through the boundary with an epsilon offset.
     */

    const viewport = document.getElementById('viewport');
    const ctx = viewport.getContext('2d', { alpha: false, willReadFrequently: false });
    const statPos = document.getElementById('stat-pos');
    const statZoom = document.getElementById('stat-zoom');
    const resetBtn = document.getElementById('reset-btn');

    const DEFAULT_VIEW = {
      x: -0.5,
      y: 0.0,
      scale: 300.0
    };

    const view = { ...DEFAULT_VIEW };

    const bufferCache = new Map();

    function updateHUD() {
      if (statPos) statPos.textContent = `X: ${view.x.toFixed(5)} | Y: ${view.y.toFixed(5)}`;
      if (statZoom) statZoom.textContent = `Zoom: ${(view.scale / DEFAULT_VIEW.scale).toFixed(1)}x`;
    }

    function resizeViewport() {
      viewport.width = window.innerWidth;
      viewport.height = window.innerHeight;
      render();
    }

    window.addEventListener('resize', resizeViewport);
    window.addEventListener('orientationchange', resizeViewport);

    // --------------------------------------------------------------------
    // Color palette (exterior only)
    // --------------------------------------------------------------------
    function exteriorColor(smoothIter) {
      const norm = Math.abs(Math.sin(smoothIter * 0.15));
      const r = Math.floor(255 * Math.abs(Math.sin(norm * Math.PI)));
      const g = Math.floor(255 * Math.abs(Math.sin((norm + 0.33) * Math.PI)));
      const b = Math.floor(255 * Math.abs(Math.sin((norm + 0.66) * Math.PI)));
      return [r, g, b];
    }

    // --------------------------------------------------------------------
    // Signed distance estimate
    // --------------------------------------------------------------------
    function computeSignedDistance(cx, cy, maxIter,
                                    zxArr, zyArr, dzxArr, dzyArr) {
      let zx = 0, zy = 0;
      let zx2 = 0, zy2 = 0;
      let dzx = 0, dzy = 0;

      zxArr[0] = 0; zyArr[0] = 0;
      dzxArr[0] = 0; dzyArr[0] = 0;

      let iter = 0;
      while (zx2 + zy2 <= 4 && iter < maxIter) {
        // derivative: dz = 2 * z * dz + 1
        const newDzx = 2 * (zx * dzx - zy * dzy) + 1;
        const newDzy = 2 * (zx * dzy + zy * dzx);
        dzx = newDzx; dzy = newDzy;

        // z = z^2 + c
        const newZx = zx2 - zy2 + cx;
        const newZy = 2 * zx * zy + cy;
        zx = newZx; zy = newZy;
        zx2 = zx * zx; zy2 = zy * zy;

        iter++;
        zxArr[iter] = zx;
        zyArr[iter] = zy;
        dzxArr[iter] = dzx;
        dzyArr[iter] = dzy;
      }

      if (iter < maxIter) {
        // exterior distance estimate
        const modZ = Math.sqrt(zx2 + zy2);
        const modDz = Math.sqrt(dzx * dzx + dzy * dzy);
        let s = 1e10;
        if (modDz > 1e-12) {
          s = (modZ * Math.log(modZ)) / (2 * modDz);
        }

        // smooth iteration count for exterior coloring
        const log_zn = Math.log(zx2 + zy2) / 2;
        const nu = Math.log(log_zn / Math.LN2) / Math.LN2;
        const smoothIter = iter + 1 - nu;

        return { s, escaped: true, smoothIter };
      } else {
        // interior: detect period
        const tol = 1e-6;
        const maxPeriod = 80;
        let period = 0;

        for (let p = 1; p <= maxPeriod; p++) {
          const dx = zxArr[maxIter] - zxArr[maxIter - p];
          const dy = zyArr[maxIter] - zyArr[maxIter - p];
          if (dx * dx + dy * dy < tol * tol) {
            period = p;
            break;
          }
        }

        if (period === 0) {
          // fallback: small negative value
          return { s: -0.01, escaped: false };
        }

        // compute multiplier lambda = product of 2*w_i
        let lambdaR = 1, lambdaI = 0;
        let sumR = 0, sumI = 0;

        const startIdx = maxIter - period;
        for (let i = 0; i < period; i++) {
          const wR = zxArr[startIdx + i];
          const wI = zyArr[startIdx + i];
          const wdR = dzxArr[startIdx + i];
          const wdI = dzyArr[startIdx + i];

          // multiply by 2*w
          const factorR = 2 * wR;
          const factorI = 2 * wI;
          const newLambdaR = lambdaR * factorR - lambdaI * factorI;
          const newLambdaI = lambdaR * factorI + lambdaI * factorR;
          lambdaR = newLambdaR;
          lambdaI = newLambdaI;

          // wd / w
          const denom = wR * wR + wI * wI;
          if (denom < 1e-18) {
            return { s: -0.01, escaped: false };
          }
          const divR = (wdR * wR + wdI * wI) / denom;
          const divI = (wdI * wR - wdR * wI) / denom;
          sumR += divR;
          sumI += divI;
        }

        // lambda' = lambda * sum
        const lambdaPrimeR = lambdaR * sumR - lambdaI * sumI;
        const lambdaPrimeI = lambdaR * sumI + lambdaI * sumR;

        const absLambda = Math.sqrt(lambdaR * lambdaR + lambdaI * lambdaI);
        const absLambdaPrime = Math.sqrt(lambdaPrimeR * lambdaPrimeR + lambdaPrimeI * lambdaPrimeI);

        if (absLambdaPrime < 1e-12 || absLambda >= 1.0) {
          return { s: -0.01, escaped: false };
        }

        const s = -(1 - absLambda) / absLambdaPrime;
        return { s, escaped: false };
      }
    }

    // --------------------------------------------------------------------
    // Exterior color for an arbitrary point (used for reflected interior)
    // --------------------------------------------------------------------
    function computeExteriorColor(cx, cy, maxIter) {
      let zx = 0, zy = 0, zx2 = 0, zy2 = 0, iter = 0;
      while (zx2 + zy2 <= 4 && iter < maxIter) {
        zy = 2 * zx * zy + cy;
        zx = zx2 - zy2 + cx;
        zx2 = zx * zx;
        zy2 = zy * zy;
        iter++;
      }
      if (iter === maxIter) {
        // reflected point should be outside; fallback to black if not
        return [0, 0, 0];
      }
      const log_zn = Math.log(zx2 + zy2) / 2;
      const nu = Math.log(log_zn / Math.LN2) / Math.LN2;
      const smoothIter = iter + 1 - nu;
      return exteriorColor(smoothIter);
    }

    // --------------------------------------------------------------------
    // Tile renderer
    // --------------------------------------------------------------------
    function computeMandelbrotTile(imgData, pixelRes, tileX, tileY, tileSizeWorld) {
      const data = imgData.data;
      const minX = tileX * tileSizeWorld;
      const minY = tileY * tileSizeWorld;
      const maxIter = 256;
      const pixelSize = tileSizeWorld / pixelRes;

      // Preallocated arrays for signed distance computation
      const zxArr = new Float64Array(maxIter + 1);
      const zyArr = new Float64Array(maxIter + 1);
      const dzxArr = new Float64Array(maxIter + 1);
      const dzyArr = new Float64Array(maxIter + 1);

      // Signed distance field for the tile (one value per pixel)
      const sField = new Float64Array(pixelRes * pixelRes);

      // First pass: compute signed distance and exterior color
      for (let py = 0; py < pixelRes; py++) {
        const wy = minY + (py + 0.5) * pixelSize;
        for (let px = 0; px < pixelRes; px++) {
          const wx = minX + (px + 0.5) * pixelSize;

          const state = computeSignedDistance(wx, wy, maxIter, zxArr, zyArr, dzxArr, dzyArr);
          const s = state.s;
          sField[py * pixelRes + px] = s;

          const idx = (py * pixelRes + px) * 4;
          if (state.escaped) {
            const rgb = exteriorColor(state.smoothIter);
            data[idx]     = rgb[0];
            data[idx + 1] = rgb[1];
            data[idx + 2] = rgb[2];
            data[idx + 3] = 255;
          } else {
            // Placeholder; will be overwritten in second pass
            data[idx]     = 0;
            data[idx + 1] = 0;
            data[idx + 2] = 0;
            data[idx + 3] = 255;
          }
        }
      }

      // Second pass: reflect interior points and color them with exterior palette
      for (let py = 0; py < pixelRes; py++) {
        const wy = minY + (py + 0.5) * pixelSize;
        for (let px = 0; px < pixelRes; px++) {
          const s = sField[py * pixelRes + px];
          if (s >= 0) continue;  // only interior points

          const wx = minX + (px + 0.5) * pixelSize;

          // Compute gradient via central differences
          let gx, gy;

          if (px > 0 && px < pixelRes - 1) {
            gx = (sField[py * pixelRes + px + 1] - sField[py * pixelRes + px - 1]) / (2 * pixelSize);
          } else if (px === 0) {
            gx = (sField[py * pixelRes + px + 1] - s) / pixelSize;
          } else {
            gx = (s - sField[py * pixelRes + px - 1]) / pixelSize;
          }

          if (py > 0 && py < pixelRes - 1) {
            gy = (sField[(py + 1) * pixelRes + px] - sField[(py - 1) * pixelRes + px]) / (2 * pixelSize);
          } else if (py === 0) {
            gy = (sField[(py + 1) * pixelRes + px] - s) / pixelSize;
          } else {
            gy = (s - sField[(py - 1) * pixelRes + px]) / pixelSize;
          }

          const norm = Math.sqrt(gx * gx + gy * gy);
          const idx = (py * pixelRes + px) * 4;

          if (norm < 1e-12) {
            // Fallback: dark blue
            data[idx]     = 10;
            data[idx + 1] = 20;
            data[idx + 2] = 40;
            data[idx + 3] = 255;
            continue;
          }

          // Reflect with a small outward push
          const eps = 1e-6;
          const factor = (2 * s - eps) / norm;
          const rx = wx - factor * gx;
          const ry = wy - factor * gy;

          const rgb = computeExteriorColor(rx, ry, maxIter);
          if (rgb[0] === 0 && rgb[1] === 0 && rgb[2] === 0) {
            // Reflected point didn't escape – fallback to soft boundary glow
            const t = Math.min(1, Math.abs(s) * 20);
            data[idx]     = Math.floor(20 * t);
            data[idx + 1] = Math.floor(40 * t);
            data[idx + 2] = Math.floor(80 * t);
          } else {
            data[idx]     = rgb[0];
            data[idx + 1] = rgb[1];
            data[idx + 2] = rgb[2];
          }
          data[idx + 3] = 255;
        }
      }
    }

    // --------------------------------------------------------------------
    // Rendering engine with tile cache
    // --------------------------------------------------------------------
    function render() {
      const width = viewport.width;
      const height = viewport.height;
      if (!width || !height) return;

      updateHUD();

      const baseTileSizeWorld = 1.0;
      const tilePixelRes = 256;

      const targetL = Math.max(0, Math.floor(Math.log2((view.scale * baseTileSizeWorld) / tilePixelRes)));
      const L = Math.min(26, targetL);

      const S_L = baseTileSizeWorld / Math.pow(2, L);

      const worldLeft = view.x - (width / 2) / view.scale;
      const worldRight = view.x + (width / 2) / view.scale;
      const worldTop = view.y - (height / 2) / view.scale;
      const worldBottom = view.y + (height / 2) / view.scale;

      const startTileX = Math.floor(worldLeft / S_L);
      const endTileX = Math.floor(worldRight / S_L);
      const startTileY = Math.floor(worldTop / S_L);
      const endTileY = Math.floor(worldBottom / S_L);

      ctx.fillStyle = '#02040a';
      ctx.fillRect(0, 0, width, height);

      for (let tileY = startTileY; tileY <= endTileY; tileY++) {
        for (let tileX = startTileX; tileX <= endTileX; tileX++) {
          const tileKey = `${L}_${tileX}_${tileY}`;

          let offscreen = bufferCache.get(tileKey);

          if (!offscreen) {
            offscreen = document.createElement('canvas');
            offscreen.width = tilePixelRes;
            offscreen.height = tilePixelRes;
            const offCtx = offscreen.getContext('2d');
            const imgData = offCtx.createImageData(tilePixelRes, tilePixelRes);

            computeMandelbrotTile(imgData, tilePixelRes, tileX, tileY, S_L);
            offCtx.putImageData(imgData, 0, 0);

            bufferCache.set(tileKey, offscreen);
          }

          const tileWorldX = tileX * S_L;
          const tileWorldY = tileY * S_L;

          const destX = (tileWorldX - view.x) * view.scale + width / 2;
          const destY = (tileWorldY - view.y) * view.scale + height / 2;
          const destW = S_L * view.scale;
          const destH = S_L * view.scale;

          ctx.drawImage(offscreen, 0, 0, tilePixelRes, tilePixelRes, destX, destY, destW + 0.5, destH + 0.5);
        }
      }
    }

    // Reset button functionality
    resetBtn.addEventListener('click', () => {
      view.x = DEFAULT_VIEW.x;
      view.y = DEFAULT_VIEW.y;
      view.scale = DEFAULT_VIEW.scale;
      render();
    });

    // --------------------------------------------------------------------
    // Touch controls (pan and pinch-zoom)
    // --------------------------------------------------------------------
    const touchState = {
      mode: null,
      lastX: 0,
      lastY: 0,
      lastDist: 0,
      focalX: 0,
      focalY: 0
    };

    viewport.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        touchState.mode = 'pan';
        touchState.lastX = e.touches[0].clientX;
        touchState.lastY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        touchState.mode = 'pinch';
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        touchState.lastDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        touchState.focalX = (t1.clientX + t2.clientX) / 2;
        touchState.focalY = (t1.clientY + t2.clientY) / 2;
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (touchState.mode === 'pan' && e.touches.length === 1) {
        const curX = e.touches[0].clientX;
        const curY = e.touches[0].clientY;
        const dx = curX - touchState.lastX;
        const dy = curY - touchState.lastY;

        view.x -= dx / view.scale;
        view.y -= dy / view.scale;

        touchState.lastX = curX;
        touchState.lastY = curY;
        render();
      } else if (e.touches.length === 2) {
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const curDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        const curFocalX = (t1.clientX + t2.clientX) / 2;
        const curFocalY = (t1.clientY + t2.clientY) / 2;

        if (touchState.lastDist > 0 && curDist > 0) {
          const zoomFactor = curDist / touchState.lastDist;

          const worldFx = view.x + (curFocalX - viewport.width / 2) / view.scale;
          const worldFy = view.y + (curFocalY - viewport.height / 2) / view.scale;

          const panDx = curFocalX - touchState.focalX;
          const panDy = curFocalY - touchState.focalY;
          view.x -= panDx / view.scale;
          view.y -= panDy / view.scale;

          view.scale = Math.max(10, Math.min(1e14, view.scale * zoomFactor));

          view.x = worldFx - (curFocalX - viewport.width / 2) / view.scale;
          view.y = worldFy - (curFocalY - viewport.height / 2) / view.scale;
        }

        touchState.lastDist = curDist;
        touchState.focalX = curFocalX;
        touchState.focalY = curFocalY;
        render();
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (e.touches.length === 0) {
        touchState.mode = null;
      } else if (e.touches.length === 1) {
        touchState.mode = 'pan';
        touchState.lastX = e.touches[0].clientX;
        touchState.lastY = e.touches[0].clientY;
      }
    }, { passive: false });

    viewport.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      touchState.mode = null;
    }, { passive: false });

    // --------------------------------------------------------------------
    // Mouse controls
    // --------------------------------------------------------------------
    let isMouseDown = false;
    let mouseLastX = 0;
    let mouseLastY = 0;

    viewport.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      mouseLastX = e.clientX;
      mouseLastY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - mouseLastX;
      const dy = e.clientY - mouseLastY;

      view.x -= dx / view.scale;
      view.y -= dy / view.scale;

      mouseLastX = e.clientX;
      mouseLastY = e.clientY;
      render();
    });

    window.addEventListener('mouseup', () => isMouseDown = false);

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;

      const cursorX = e.clientX;
      const cursorY = e.clientY;

      const worldCx = view.x + (cursorX - viewport.width / 2) / view.scale;
      const worldCy = view.y + (cursorY - viewport.height / 2) / view.scale;

      view.scale = Math.max(10, Math.min(1e14, view.scale * zoomFactor));

      view.x = worldCx - (cursorX - viewport.width / 2) / view.scale;
      view.y = worldCy - (cursorY - viewport.height / 2) / view.scale;

      render();
    }, { passive: false });

    window.onload = () => {
      resizeViewport();
    };
  </script>
