<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .post { position: absolute; overflow: hidden; cursor: none; }
  .post img, .post video {

  /* the car cursor — one 4x2 sprite atlas, direction is a background-position step */
  #car {
    position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none;
    width: 128px; height: 80px; margin: -40px 0 0 -64px;

    background-size: 512px 160px;      /* 4 cols x 128px, 2 rows x 80px */
    background-repeat: no-repeat;
    background-position: -256px 0px;   /* east */

  }

<body>

<header>
  <div class="logo">MOISES<span>_</span></div>
  <nav>
    <a href="https://3die.fr/">label</a>
    <a href="https://iori.me/portfolio.html">portfolio</a>
    <a href="https://dash.3die.fr/">post</a>
  </nav>
</header>

<div class="sub">photo journal — 3die label</div>

<div id="stage-wrap">
  <canvas id="tracks"></canvas>
  <div id="stage"></div>
</div>
<div id="empty">loading…</div>

<div id="car"></div>

<div id="viewer">
  <button class="vclose" id="vclose">×</button>
  <div id="vmedia"></div>
  <div class="vcap" id="vcap"></div>
</div>

<script>
const API = "https://api.3die.fr";
const CANVAS_W = 1200;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= posts / freeform canvas ================= */

const stage = document.getElementById("stage");
const wrap = document.getElementById("stage-wrap");

function fitStage() {
  const scale = Math.min(1, wrap.clientWidth / CANVAS_W);
  stage.style.transform = `scale(${scale})`;
  wrap.style.height = (stage.offsetHeight * scale) + "px";
}
addEventListener("resize", fitStage);

async function boot() {
  const empty = document.getElementById("empty");
  try {
    const res = await fetch(`${API}/posts?author=moises&limit=200`);
    const { posts } = await res.json();
    if (!posts.length) { empty.textContent = "first photographs are being developed."; return; }
    empty.remove();
    layoutPosts(posts);
  } catch (e) {
    empty.textContent = "journal unavailable right now.";
  }
}

function layoutPosts(posts) {
  let autoX = 40, autoY = 40, maxBottom = 400;
  // posts with a saved layout go exactly where moises put them;
  // new ones cascade in until he places them from the dashboard canvas.
  for (const p of [...posts].reverse()) {
    const el = document.createElement("div");
    el.className = "post";
    const lay = p.layout || {};
    const hasLay = lay.x != null;
    const x = hasLay ? lay.x : autoX;
    const y = hasLay ? lay.y : autoY;
    const w = (hasLay && lay.w) || 300;
    if (!hasLay) { autoX += 340; if (autoX > CANVAS_W - 340) { autoX = 40; autoY += 380; } }
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.width = w + "px";
    el.style.zIndex = (hasLay && lay.z) || 1;

    const date = new Date(p.created_at).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
    const first = p.media[0];
    if (!first) {
      el.classList.add("text-post");
      el.innerHTML = esc(p.caption);
    } else {
      el.innerHTML =
        (/\.(mp4|webm|mov)$/i.test(first)
          ? `<video src="${esc(first)}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>`
          : `<img src="${esc(first)}" loading="lazy" alt="">`) +
        `<div class="cap">${esc(p.caption || "")} <span class="time">${date}</span></div>`;
      el.addEventListener("click", () => openViewer(p));
    }
    stage.appendChild(el);
    maxBottom = Math.max(maxBottom, y + el.offsetHeight + 120);
  }
  stage.style.height = maxBottom + "px";
  requestAnimationFrame(fitStage);
  sizeTracks();
}

/* ================= fullscreen viewer ================= */

function openViewer(p) {
  const v = document.getElementById("viewer");
  const vm = document.getElementById("vmedia");
  const first = p.media[0];
  vm.innerHTML = /\.(mp4|webm|mov)$/i.test(first)
    ? `<video src="${esc(first)}" controls autoplay></video>`
    : `<img src="${esc(first)}" alt="">`;
  document.getElementById("vcap").textContent = p.caption || "";
  v.classList.add("open");
}
document.getElementById("vclose").addEventListener("click", () => {
  document.getElementById("viewer").classList.remove("open");
  document.getElementById("vmedia").innerHTML = "";
});
document.getElementById("viewer").addEventListener("click", (e) => {
  if (e.target.id === "viewer") document.getElementById("vclose").click();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("vclose").click();
});

/* ================= the car cursor =================
   moises_car_atlas.png is a 4x2 grid of 256x160 cells, built from the source
   turnaround by tools/build_car_atlas.py. Row-major order:

       N  NE  E  SE
       S  SW  W  NW

   Picking a direction is a background-position step — no canvas, no per-frame
   image decode. The car follows the pointer almost exactly, and the sprite is
   chosen from the direction it is actually travelling, quantised to the eight
   straight/diagonal headings the art provides.                              */

const carEl = document.getElementById("car");
const tracksCv = document.getElementById("tracks");
const tracksCtx = tracksCv.getContext("2d");

const CELL_W = 128, CELL_H = 80;   // displayed cell size (the atlas is 2x this)
// (stepX, stepY) -> octant, indexed by (sy+1)*3 + (sx+1). The car only ever
// drives one of eight headings, so the sprite is literally its direction.
const OCT_FROM_STEP = [5, 6, 7, 4, -1, 0, 3, 2, 1];
const TAN22 = Math.tan(Math.PI / 8);   // the straight/diagonal boundary
// octant 0 is east, counting clockwise on screen (y grows downward):
//   0 E   1 SE   2 S   3 SW   4 W   5 NW   6 N   7 NE
// mapped onto the atlas cell index for each of those
const ATLAS_FOR_OCT = [2, 3, 4, 5, 6, 7, 0, 1];

function setDir(oct) {
  const i = ATLAS_FOR_OCT[oct];
  carEl.style.backgroundPosition =
    `${-(i % 4) * CELL_W}px ${-Math.floor(i / 4) * CELL_H}px`;
}

let atlasReady = false;
const atlas = new Image();
atlas.src = "moises_car_atlas.png";
atlas.onload = () => { atlasReady = true; };

function sizeTracks() {
  tracksCv.width = wrap.clientWidth;
  tracksCv.height = wrap.clientHeight;
}
addEventListener("resize", sizeTracks);
sizeTracks();

const car = {
  x: innerWidth / 2, y: innerHeight / 2,
  hx: 0, hy: 0,     // smoothed vector to the cursor, quantised into a heading
  ux: 1, uy: 0,     // the unit step actually being driven
  oct: 0,           // current sprite octant
  speed: 0,
  hue: 0,           // tyre-track colour, advanced by distance driven
};
const CHASE = 6.5;        // how hard it pulls toward the cursor
const MAX_SPEED = 2000;   // px/s
const DEADZONE = 9;       // stop fidgeting once it is basically there
const target = { x: car.x, y: car.y };
let pointerSeen = false, shown = false;

addEventListener("pointermove", (e) => {
  target.x = e.clientX;
  target.y = e.clientY;
  pointerSeen = true;
});
const fromTouch = (e) => {
  if (!e.touches.length) return;
  target.x = e.touches[0].clientX;
  target.y = e.touches[0].clientY;
  pointerSeen = true;
};
// touchstart as well as touchmove: on a tablet the first tap should already
// send the car somewhere, without waiting for a drag
addEventListener("touchstart", fromTouch, { passive: true });
addEventListener("touchmove", fromTouch, { passive: true });

let lastT = performance.now();
let fadeClock = 0;

function carTick(now) {
  requestAnimationFrame(carTick);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!pointerSeen || !atlasReady) return;
  if (!shown) { shown = true; carEl.classList.add("ready"); }

  const dx = target.x - car.x, dy = target.y - car.y;
  const dist = Math.hypot(dx, dy);

  // smooth the vector to the cursor before quantising it, otherwise a heading
  // sitting near a 22.5 degree boundary flickers between two sprites
  const sm = 1 - Math.pow(1 - 0.30, dt * 60);
  car.hx += (dx - car.hx) * sm;
  car.hy += (dy - car.hy) * sm;

  // the car drives on a grid: the eight straight and diagonal headings only.
  // Anything within 22.5 degrees of an axis is a straight, the rest a diagonal,
  // so it stair-steps toward the cursor instead of sliding at it.
  const ax = Math.abs(car.hx), ay = Math.abs(car.hy);
  let sx = 0, sy = 0;
  if (dist > DEADZONE) {
    if (ax > ay * TAN22) sx = Math.sign(car.hx);
    if (ay > ax * TAN22) sy = Math.sign(car.hy);
  }

  if (sx || sy) {
    const inv = (sx && sy) ? Math.SQRT1_2 : 1;
    car.ux = sx * inv; car.uy = sy * inv;
    car.speed = Math.min(MAX_SPEED, dist * CHASE);
    const step = car.speed * dt;
    const px = car.x, py = car.y;
    car.x += car.ux * step;
    car.y += car.uy * step;

    const oct = OCT_FROM_STEP[(sy + 1) * 3 + (sx + 1)];
    if (oct >= 0 && oct !== car.oct) { car.oct = oct; setDir(oct); }

    layTracks(px, py, step);
  } else {
    car.speed = 0;
  }

  carEl.style.transform = `translate3d(${car.x}px, ${car.y}px, 0)`;

  fadeClock += dt;
  if (fadeClock > 0.32 && tracksCv.height > 0) {
    fadeClock = 0;
    tracksCtx.globalCompositeOperation = "destination-out";
    tracksCtx.fillStyle = "rgba(0,0,0,0.035)";
    tracksCtx.fillRect(0, 0, tracksCv.width, tracksCv.height);
    tracksCtx.globalCompositeOperation = "source-over";
  }
}

/* Two thin rubber lines from the rear axle, a segment per frame so they follow
   the grid exactly. The hue advances with distance driven, so a long drive lays
   down a spectrum rather than one flat colour. */
function layTracks(px, py, step) {
  if (tracksCv.height <= 0) return;
  const wrapRect = wrap.getBoundingClientRect();
  if (car.y < wrapRect.top || car.y > wrapRect.bottom) return;

  car.hue = (car.hue + step * 0.30) % 360;
  const ox = -car.uy * 10, oy = car.ux * 10;    // half the track width
  const back = 24;
  const x0 = px - wrapRect.left - car.ux * back;
  const y0 = py - wrapRect.top - car.uy * back;
  const x1 = car.x - wrapRect.left - car.ux * back;
  const y1 = car.y - wrapRect.top - car.uy * back;

  tracksCtx.lineWidth = 1.6;
  tracksCtx.lineCap = "round";
  for (const side of [-1, 1]) {
    tracksCtx.strokeStyle = `hsla(${(car.hue + side * 14 + 360) % 360}, 92%, 58%, 0.5)`;
    tracksCtx.beginPath();
    tracksCtx.moveTo(x0 + ox * side, y0 + oy * side);
    tracksCtx.lineTo(x1 + ox * side, y1 + oy * side);
    tracksCtx.stroke();
  }
}
requestAnimationFrame(carTick);

boot();
</script>
</body>
