  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* photo-first masonry */
  #feed { columns: 2; column-gap: 2px; padding: 2px; }
  .post { break-inside: avoid; position: relative; margin-bottom: 2px; overflow: hidden; cursor: pointer; }
  .post img, .post video {
    width: 100%; display: block;
    filter: grayscale(15%) contrast(1.02);
    transition: filter 180ms ease, transform 240ms cubic-bezier(.2,.9,.3,1);
  }
  .post:hover img { filter: none; transform: scale(1.015); }
  .post .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: .7rem .8rem; font-size: .72rem; letter-spacing:.12em;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    color: #ddd; opacity: 0; transition: opacity 160ms ease;
  }
  .post:hover .cap { opacity: 1; }
  .post .time { position:absolute; top:.6rem; right:.7rem; font-size:.65rem; color:rgba(255,255,255,.55); letter-spacing:.15em; opacity:0; transition: opacity 160ms; }
  .post:hover .time { opacity:1; }
  .text-post { border:1px solid #333; padding:1.4rem; color:#ddd; line-height:1.8; font-size:.85rem; }

  #empty { padding: 5rem 1.2rem; color:#555; letter-spacing:.2em; text-align:center; line-height:2; }

  /* fullscreen viewer */
  #viewer {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.96);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    animation: fadein 140ms ease;
  }
  @keyframes fadein { from { opacity: 0; } }
  #viewer.open { display: flex; }
  #viewer img, #viewer video { max-width: 94vw; max-height: 82vh; animation: pop 160ms ease; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } }

<body>

<header>
  <div class="logo">MOISES<span>_</span></div>
  <nav>
    <a href="https://3die.fr/">label</a>
    <a href="https://iori.me/catalog.html">catalog</a>
    <a href="https://dash.3die.fr/">post</a>
  </nav>
</header>

<div class="sub">photo journal — 3die label</div>

<div id="feed"></div>
<div id="empty">loading…</div>

<div id="viewer">
  <button class="vclose" id="vclose">×</button>
  <div id="vmedia"></div>
  <div class="vcap" id="vcap"></div>
</div>

<script>
const API = "https://api.3die.fr";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function boot() {
  const feed = document.getElementById("feed");
  const empty = document.getElementById("empty");
  try {
    const res = await fetch(`${API}/posts?author=moises&limit=200`);
    const { posts } = await res.json();
    if (!posts.length) {
      empty.textContent = "first photographs are being developed.";
      return;
    }
    empty.remove();
    for (const p of posts) renderPost(feed, p);
  } catch (e) {
    empty.textContent = "journal unavailable right now.";
  }
}

function renderPost(feed, p) {
  const el = document.createElement("div");
  el.className = "post";
  const date = new Date(p.created_at).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
  if (!p.media.length) {
    el.classList.add("text-post");
    el.innerHTML = esc(p.caption);
    feed.appendChild(el);
    return;
  }
  const first = p.media[0];
  const isVideo = /\.(mp4|webm|mov)$/i.test(first);
  el.innerHTML =
    (isVideo ? `<video src="${esc(first)}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>`
             : `<img src="${esc(first)}" loading="lazy" alt="">`) +
    `<div class="time">${date}</div>` +
    (p.caption ? `<div class="cap">${esc(p.caption)}</div>` : "");
  el.addEventListener("click", () => openViewer(p));
  feed.appendChild(el);
}

function openViewer(p) {
  const v = document.getElementById("viewer");
  const vm = document.getElementById("vmedia");
  const first = p.media[0];
  vm.innerHTML = /\.(mp4|webm|mov)$/i.test(first)
    ? `<video src="${esc(first)}" controls autoplay></video>`
    : `<img src="${esc(first)}" alt="">`;
  document.getElementById("vcap").textContent = p.caption || "";
  v.classList.add("open");
}
document.getElementById("vclose").addEventListener("click", () => {
  document.getElementById("viewer").classList.remove("open");
  document.getElementById("vmedia").innerHTML = "";
});
document.getElementById("viewer").addEventListener("click", (e) => {
  if (e.target.id === "viewer") document.getElementById("vclose").click();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("vclose").click();
});

boot();
</script>
