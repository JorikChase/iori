<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:#000; color:#fff;
    font-family:"Courier New", ui-monospace, monospace;
    cursor: none; /* the car IS the cursor */
    overflow-x: hidden;
  }
  ::selection { background:#fff; color:#000; }
  a { cursor: none; }

  header {
    position: sticky; top: 0; z-index: 20; background:#000;
    display:flex; align-items:baseline; gap:1.2rem;
    padding:1rem 1.2rem; border-bottom:2px solid #fff;
  }
  .logo { letter-spacing:.3em; font-weight:bold; }
  .logo span { animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  header nav { margin-left:auto; display:flex; gap:1rem; font-size:.8rem; }
  a { color:#555; text-decoration:none; letter-spacing:.15em; text-transform:uppercase; }
  a:hover { color:#fff; }
  .sub { padding: .9rem 1.2rem; color:#555; font-size:.75rem; letter-spacing:.25em; text-transform:uppercase; border-bottom:1px solid #1a1a1a; }

  /* freeform canvas */
  #stage-wrap { position: relative; overflow: hidden; min-height: 62vh; }
  /* above the posts: the tyres drive over the photos and smear them.
     Width/height are explicit because a canvas sized with inset alone takes
     its intrinsic (device-pixel) size, which on a 2x screen drew every mark
     at twice its distance from the corner */
  #tracks { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  #stage { position: relative; width: 1200px; transform-origin: top left; z-index: 2; }
  .post { position: absolute; overflow: hidden; cursor: none; }
  .post img, .post video {
    width: 100%; display: block;
    filter: grayscale(15%) contrast(1.02);
    transition: filter 180ms ease;

  .post:hover img { filter: none; }
  .post .cap {
    margin-top: .35rem; font-size: .72rem; letter-spacing:.12em; color: #888;

  .post .time { font-size: .62rem; color:#444; letter-spacing:.15em; }
  .text-post { border:1px solid #333; padding:1.2rem; color:#ddd; line-height:1.8; font-size:.85rem; white-space: pre-wrap; word-break: break-word; background:#000; }
  .audio-post { border:1px solid #333; padding:.8rem; background:#000; }
  .audio-post .sound { font-size:.78rem; letter-spacing:.12em; color:#ddd; margin-bottom:.5rem; white-space:pre-wrap; }
  .audio-post audio { width:100%; display:block; color-scheme: dark; }
  .audio-post .time { margin-top:.4rem; }
  .post .yt { position:relative; aspect-ratio:16/9; overflow:hidden; background:#111; }
  .post .yt img { height:100%; object-fit:cover; }
  .post .yt .play { position:absolute; inset:0; display:grid; place-items:center; font-size:2.2rem; color:#fff; text-shadow:0 0 14px #000; }
  #viewer .ytframe { width:min(94vw, 146vh); aspect-ratio:16/9; border:0; }
  .post .count { position:absolute; top:.4rem; right:.4rem; background:#000; color:#fff; font-size:.62rem; padding:.1rem .35rem; letter-spacing:.12em; }

  #empty { padding: 5rem 1.2rem; color:#555; letter-spacing:.2em; text-align:center; line-height:2; }

  /* the car cursor — one 4x2 sprite atlas, direction is a background-position step */
  #car {
    position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none;
    width: 128px; height: 80px; margin: -40px 0 0 -64px;
    background-image: url("moises_car_atlas.png");
    background-size: 512px 160px;      /* 4 cols x 128px, 2 rows x 80px */
    background-repeat: no-repeat;
    background-position: -256px 0px;   /* east */
    opacity: 0; transition: opacity 200ms ease;
    will-change: transform;
  }
  #car.ready { opacity: 1; }

  /* fullscreen viewer */
  #viewer {
    position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.96);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    animation: fadein 140ms ease; cursor: none;
  }
  @keyframes fadein { from { opacity: 0; } }
  #viewer.open { display: flex; }
  #viewer img, #viewer video { max-width: 94vw; max-height: 82vh; animation: pop 160ms ease; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } }
  #viewer .vcap { margin-top: 1rem; color:#ccc; font-size:.8rem; letter-spacing:.1em; max-width: 70ch; text-align:center; line-height:1.7; padding: 0 1rem; }
  #viewer .vcount { margin-top:.4rem; color:#555; font-size:.7rem; letter-spacing:.2em; }

  /* Phones: the 1200px freeform stage scaled to a third of its size made every
     photo a thumbnail. Below 700px the posts flow into one column instead, in
     the order moises arranged them on the canvas (top to bottom, then left to
     right). Desktop keeps the freeform composition. */
  #stage.flow {

    display: flex; flex-direction: column; gap: 2.2rem; padding: 1.4rem 16px 4rem;
  }
  #stage.flow .post { position: relative; left: auto !important; top: auto !important; width: auto !important; z-index: auto !important; }
  #stage.flow .post .cap { font-size: .78rem; line-height: 1.5; }
  #stage.flow .text-post { font-size: .95rem; }
  @media (max-width: 700px) {
    header { gap: .8rem; padding: .9rem 16px; flex-wrap: wrap; padding-right: 64px; }
    header nav { gap: .8rem; font-size: .72rem; }
    .sub { padding: .8rem 16px; letter-spacing: .18em; }
    #viewer img, #viewer video { max-width: 100vw; max-height: 74vh; }
    #viewer .vnav { font-size: 2.2rem; padding: .6rem; top: auto; bottom: 1.2rem; transform: none; }
    #viewer .ytframe { width: 100vw; }
  }

  @media (pointer: coarse) {
    /* real controls come back for touch, but the car stays and follows your
       finger -- hiding it removed the only thing on the page that moves */
    body, a, .post, #viewer, #viewer .vclose, #viewer .vnav { cursor: auto; }
    #stage-wrap { touch-action: pan-y; }
    /* on touch the car parks where the finger was: not on top of the photo you opened */
    body.viewing #car { opacity: 0; }

<div class="sub">photo journal — 3die label</div>

<div id="stage-wrap">
  <canvas id="tracks"></canvas>
  <div id="stage"></div>
</div>
<div id="empty">loading…</div>

<div id="car"></div>

<div id="viewer">
  <button class="vclose" id="vclose" aria-label="close">×</button>
  <button class="vnav vprev" id="vprev" aria-label="previous">‹</button>
  <div id="vmedia"></div>
  <button class="vnav vnext" id="vnext" aria-label="next">›</button>
  <div class="vcap" id="vcap"></div>
  <div class="vcount" id="vcount"></div>

<script>
// same override as the dashboard: localStorage.dash_api points a local preview
// at a local API (python3 api/main.py); production never sets it
let API = "https://api.3die.fr";
try { API = localStorage.getItem("dash_api") || API; } catch (e) {}
const CANVAS_W = 1200;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= posts / freeform canvas ================= */

const stage = document.getElementById("stage");
const wrap = document.getElementById("stage-wrap");

const PHONE = matchMedia("(max-width: 700px)");
const isFlow = () => PHONE.matches;

function fitStage() {
  stage.classList.toggle("flow", isFlow());
  if (isFlow()) {
    wrap.style.height = "auto";
    return;
  }
  const scale = Math.min(1, wrap.clientWidth / CANVAS_W);
  stage.style.transform = `scale(${scale})`;
  wrap.style.height = (stage.offsetHeight * scale) + "px";
}
addEventListener("resize", fitStage);
PHONE.addEventListener("change", fitStage);

async function boot() {
  const empty = document.getElementById("empty");
  try {
    const res = await fetch(`${API}/posts?author=moises&limit=200`);
    const { posts } = await res.json();
    if (!posts.length) { empty.textContent = "first photographs are being developed."; return; }
    empty.remove();
    layoutPosts(posts);
  } catch (e) {
    empty.textContent = "journal unavailable right now.";
  }
}

/* Placement is shared with the dashboard's CANVAS tab (dash/app.js): the
   same default width, columns and height estimate. Posts carry their layout
   from the moment they are uploaded; the packing below only places older ones. */
const DEFAULT_W = 300, COLS = [40, 380, 720];
const isVideo = (u) => /\.(mp4|webm|mov|m4v)$/i.test(u);
const isAudio = (u) => /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac)$/i.test(u);
const ytThumb = (id) => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
function postKind(p) {
  const m = p.media[0];
  if (m) return isVideo(m) ? "video" : isAudio(m) ? "audio" : "image";
  return p.embed ? "yt" : "text";
}

function postHeight(p, w) {
  const a = p.layout && p.layout.a;
  const kind = postKind(p);
  if (kind === "audio") return 96 + (p.caption ? 24 : 0);
  if (kind === "yt") return w * 9 / 16 + 28;
  if (kind === "text") {
    const chars = Math.max(1, (p.caption || "").length);
    const perLine = Math.max(8, (w - 40) / 8.2);
    return 40 + Math.ceil(chars / perLine + ((p.caption || "").match(/\n/g) || []).length) * 24;
  }
  return w / (a || 4 / 3) + 28;
}
function freeSlot(rects, w, h) {
  const GAP = 24;
  for (let y = 40; y < 100000; y += 20) {
    for (const x of COLS) {
      const hit = rects.some(r => x < r.x + r.w + GAP && x + w + GAP > r.x && y < r.y + r.h + GAP && y + h + GAP > r.y);
      if (!hit) return { x, y };
    }
  }
  return { x: COLS[0], y: 40 };
}

function layoutPosts(posts) {
  const rects = [];
  for (const p of posts) {
    if (p.layout && p.layout.x != null) {
      const w = p.layout.w || DEFAULT_W;
      rects.push({ x: p.layout.x, y: p.layout.y, w, h: postHeight(p, w) });
    }
  }
  for (const p of [...posts].reverse()) {
    if (p.layout && p.layout.x != null) continue;
    const h = postHeight(p, DEFAULT_W);
    const { x, y } = freeSlot(rects, DEFAULT_W, h);
    p.layout = { x, y, w: DEFAULT_W, z: 1, a: p.layout?.a ?? null };
    rects.push({ x, y, w: DEFAULT_W, h });
  }

  // reading order for the phone column: rows of the canvas top to bottom
  // (posts within 60px of each other count as one row), then left to right
  const reading = [...posts].sort((a, b) =>
    (Math.abs(a.layout.y - b.layout.y) < 60 ? 0 : a.layout.y - b.layout.y) || a.layout.x - b.layout.x);
  const order = new Map(reading.map((p, i) => [p, i]));

  let maxBottom = 400;
  for (const p of [...posts].reverse()) {
    const el = document.createElement("div");
    el.className = "post";
    const lay = p.layout;
    const w = lay.w || DEFAULT_W;
    el.style.left = lay.x + "px";
    el.style.top = lay.y + "px";
    el.style.width = w + "px";
    el.style.zIndex = lay.z || 1;
    el.style.order = order.get(p);

    const date = new Date(p.created_at).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
    const first = p.media[0];
    const kind = postKind(p);
    if (kind === "text") {
      el.classList.add("text-post");
      el.textContent = p.caption;
    } else if (kind === "audio") {
      el.classList.add("audio-post");
      el.innerHTML = `<div class="sound">♪ ${esc(p.caption || "sound")}</div>` +
        `<audio src="${esc(first)}" preload="none" controls></audio>` +
        `<div class="time">${date}</div>`;
    } else {
      el.innerHTML =
        (kind === "video"
          ? `<video src="${esc(first)}#t=0.1" preload="metadata" muted loop playsinline></video>`
          : kind === "yt"
            ? `<div class="yt"><img src="${esc(ytThumb(p.embed))}" loading="lazy" alt="${esc(p.caption || "video by moises")}"><span class="play">▶</span></div>`
            : `<img src="${esc(first)}" loading="lazy" alt="${esc(p.caption || "photograph by moises")}">`) +
        (p.media.length > 1 ? `<span class="count">1/${p.media.length}</span>` : "") +
        `<div class="cap">${esc(p.caption || "")} <span class="time">${date}</span></div>`;
      const v = el.querySelector("video");
      if (v) {
        el.addEventListener("mouseenter", () => v.play().catch(() => {}));
        el.addEventListener("mouseleave", () => v.pause());
      }
      if (kind !== "audio") el.addEventListener("click", () => openViewer(p));
    }
    stage.appendChild(el);
    maxBottom = Math.max(maxBottom, lay.y + Math.max(el.offsetHeight, postHeight(p, w)) + 120);
  }
  stage.style.height = maxBottom + "px";
  requestAnimationFrame(fitStage);
  sizeTracks();
  // images arrive after layout; the stage grows to whatever they turn out to be
  stage.querySelectorAll("img").forEach(img => img.addEventListener("load", growStage, { once: true }));
}

function growStage() {
  if (isFlow()) return;   // the column grows by itself; the ResizeObserver resizes the tracks
  let bottom = 400;
  for (const el of stage.children) bottom = Math.max(bottom, el.offsetTop + el.offsetHeight + 120);
  if (bottom > stage.offsetHeight) { stage.style.height = bottom + "px"; fitStage(); sizeTracks(); }
}

/* ================= fullscreen viewer ================= */

let vPost = null, vIdx = 0;
// everything a post can show in the viewer, in order: its files, then its YouTube video
const viewItems = (p) => [...p.media.filter(m => !isAudio(m)), ...(p.embed ? ["yt:" + p.embed] : [])];
function openViewer(p, i = 0) {
  const items = viewItems(p);
  if (!items.length) return;
  vPost = p; vIdx = i;
  const v = document.getElementById("viewer");
  const vm = document.getElementById("vmedia");
  const m = items[i];
  // youtube-nocookie: no tracking cookies until the visitor presses play
  vm.innerHTML = m.startsWith("yt:")
    ? `<iframe class="ytframe" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(m.slice(3))}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(p.caption || "video")}"></iframe>`
    : isVideo(m)
      ? `<video src="${esc(m)}" controls autoplay playsinline></video>`
      : `<img src="${esc(m)}" alt="${esc(p.caption || "photograph by moises")}">`;
  document.getElementById("vcap").textContent = p.caption || "";
  const many = items.length > 1;
  document.getElementById("vcount").textContent = many ? `${i + 1} / ${items.length}` : "";
  document.getElementById("vprev").hidden = document.getElementById("vnext").hidden = !many;
  v.classList.add("open");
  document.body.classList.add("viewing");
}
function stepViewer(d) {
  const n = vPost ? viewItems(vPost).length : 0;
  if (n < 2) return;
  openViewer(vPost, (vIdx + d + n) % n);
}
function closeViewer() {
  document.getElementById("viewer").classList.remove("open");
  document.body.classList.remove("viewing");
  document.getElementById("vmedia").innerHTML = "";
  vPost = null;
}
document.getElementById("vclose").addEventListener("click", closeViewer);
document.getElementById("vprev").addEventListener("click", (e) => { e.stopPropagation(); stepViewer(-1); });
document.getElementById("vnext").addEventListener("click", (e) => { e.stopPropagation(); stepViewer(1); });
document.getElementById("viewer").addEventListener("click", (e) => {
  if (e.target.id === "viewer") closeViewer();
});
document.addEventListener("keydown", (e) => {
  if (!vPost) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowRight") stepViewer(1);
  if (e.key === "ArrowLeft") stepViewer(-1);
});
let swipeX = null;
document.getElementById("viewer").addEventListener("touchstart", (e) => { swipeX = e.touches[0].clientX; }, { passive: true });
document.getElementById("viewer").addEventListener("touchend", (e) => {
  if (swipeX == null) return;
  const dx = e.changedTouches[0].clientX - swipeX;
  swipeX = null;
  if (Math.abs(dx) > 50) stepViewer(dx < 0 ? 1 : -1);
});

/* ================= the car cursor =================
   moises_car_atlas.png is a 4x2 grid of 256x160 cells, built from the source
   turnaround by tools/build_car_atlas.py. Row-major order:

       N  NE  E  SE
       S  SW  W  NW

   Picking a direction is a background-position step — no canvas, no per-frame
   image decode. The car follows the pointer almost exactly, and the sprite is
   chosen from the direction it is actually travelling, quantised to the eight
   straight/diagonal headings the art provides.                              */

const carEl = document.getElementById("car");
const tracksCv = document.getElementById("tracks");
const tracksCtx = tracksCv.getContext("2d");

const CELL_W = 128, CELL_H = 80;   // displayed cell size (the atlas is 2x this)
/* The car drives a 16-point compass — every 22.5 degrees — while the sprite
   still comes from the eight the artwork provides. A finer travel grid keeps
   the stair-stepping legible without locking the motion to the same eight
   bearings the art is drawn at. */
const STEPS = 16;
const STEP_ANG = (Math.PI * 2) / STEPS;
const HEADINGS = Array.from({ length: STEPS }, (_, k) => {
  const a = k * STEP_ANG;
  return [Math.cos(a), Math.sin(a)];
});
// octant 0 is east, counting clockwise on screen (y grows downward):
//   0 E   1 SE   2 S   3 SW   4 W   5 NW   6 N   7 NE
// mapped onto the atlas cell index for each of those
const ATLAS_FOR_OCT = [2, 3, 4, 5, 6, 7, 0, 1];

function setDir(oct) {
  const i = ATLAS_FOR_OCT[oct];
  carEl.style.backgroundPosition =
    `${-(i % 4) * CELL_W}px ${-Math.floor(i / 4) * CELL_H}px`;
}

let atlasReady = false;
const atlas = new Image();
atlas.src = "moises_car_atlas.png";
atlas.onload = () => { atlasReady = true; };

let DPR = 1;
// Resizing a canvas clears it; the stage grows as lazy photos load, so the
// marks already laid are copied across instead of vanishing mid-drive.
function sizeTracks() {
  // iOS Safari refuses canvases over ~16.7M pixels (it draws nothing), and the
  // phone column can run very long: drop density before hitting that
  const area = Math.max(1, wrap.clientWidth * wrap.clientHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1, Math.sqrt(16e6 / area));
  const w = Math.round(wrap.clientWidth * DPR), h = Math.round(wrap.clientHeight * DPR);
  if (w === tracksCv.width && h === tracksCv.height) return;
  let keep = null;
  if (tracksCv.width && tracksCv.height) {
    keep = document.createElement("canvas");
    keep.width = tracksCv.width; keep.height = tracksCv.height;
    keep.getContext("2d").drawImage(tracksCv, 0, 0);
  }
  tracksCv.width = w;
  tracksCv.height = h;
  tracksCv.style.width = wrap.clientWidth + "px";
  tracksCv.style.height = wrap.clientHeight + "px";
  if (keep) tracksCtx.drawImage(keep, 0, 0);
  tracksCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", sizeTracks);
if (window.ResizeObserver) new ResizeObserver(() => sizeTracks()).observe(wrap);
sizeTracks();

const car = {
  x: innerWidth / 2, y: innerHeight / 2,
  hx: 0, hy: 0,     // smoothed vector to the cursor, quantised into a heading
  ux: 1, uy: 0,     // the unit step actually being driven
  step: 0,          // current heading on the 16-point compass
  oct: -1,          // sprite octant derived from it
  sux: 1, suy: 0,   // heading the tyre tracks lag behind, so turns curve
  dwell: 0,         // time held in the current heading
  moving: false,
  speed: 0,
  trackL: null, trackR: null,   // last rear-wheel points, so rubber connects
  wheels: [{ acc: 0, flip: 0 }, { acc: 0, flip: 0 }],   // tread phase per rear tyre
};
const CHASE = 6.5;        // how hard it pulls toward the cursor
const MAX_SPEED = 2000;   // px/s
const GO = 26;            // start driving once the cursor is this far away
const STOP = 7;           // and settle once it is this close
const MIN_DWELL = 0.11;   // seconds a heading must be held before it can change
const target = { x: car.x, y: car.y };
let pointerSeen = false, shown = false;

addEventListener("pointermove", (e) => {
  target.x = e.clientX;
  target.y = e.clientY;
  pointerSeen = true;
});
const fromTouch = (e) => {
  if (!e.touches.length) return;
  target.x = e.touches[0].clientX;
  target.y = e.touches[0].clientY;
  pointerSeen = true;
};
// touchstart as well as touchmove: on a tablet the first tap should already
// send the car somewhere, without waiting for a drag
addEventListener("touchstart", fromTouch, { passive: true });
addEventListener("touchmove", fromTouch, { passive: true });

let lastT = performance.now();
let fadeClock = 0;

function carTick(now) {
  requestAnimationFrame(carTick);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!pointerSeen || !atlasReady) return;
  if (!shown) { shown = true; carEl.classList.add("ready"); }

  const dx = target.x - car.x, dy = target.y - car.y;
  const dist = Math.hypot(dx, dy);

  // smooth the vector to the cursor before reading a heading off it
  const sm = 1 - Math.pow(1 - 0.22, dt * 60);
  car.hx += (dx - car.hx) * sm;
  car.hy += (dy - car.hy) * sm;

  // separate start and stop thresholds, so parking the cursor just off the car
  // does not leave it twitching on and off the deadzone edge
  if (car.moving) { if (dist < STOP) car.moving = false; }
  else if (dist > GO) car.moving = true;

  if (car.moving) {
    const ang = Math.atan2(car.hy, car.hx);
    car.dwell += dt;
    // angular hysteresis plus a minimum dwell: a cursor sitting near a heading
    // boundary used to flip every frame, which is what the jitter was
    let off = ang - car.step * STEP_ANG;
    while (off > Math.PI) off -= Math.PI * 2;
    while (off < -Math.PI) off += Math.PI * 2;
    if (Math.abs(off) > STEP_ANG * 0.80 && car.dwell > MIN_DWELL) {
      car.step = ((Math.round(ang / STEP_ANG) % STEPS) + STEPS) % STEPS;
      car.dwell = 0;
    }
    // the sprite is the nearest of the eight the art gives us, so it only
    // changes every other step of the compass
    const oct = Math.round(car.step / 2) % 8;
    if (oct !== car.oct) { car.oct = oct; setDir(oct); }

    const v = HEADINGS[car.step];
    car.ux = v[0]; car.uy = v[1];
    car.speed = Math.min(MAX_SPEED, dist * CHASE);
    const step = Math.min(car.speed * dt, dist);   // never overshoot the cursor
    car.x += car.ux * step;
    car.y += car.uy * step;

    // The wheels used to be offset from the instantaneous heading, so the whole
    // track snapped sideways the moment the car changed bearing — rigid, and
    // nothing like rubber. Lagging the offset direction makes the pair sweep
    // round through the turn instead.
    const ts = 1 - Math.pow(1 - 0.11, dt * 60);
    car.sux += (car.ux - car.sux) * ts;
    car.suy += (car.uy - car.suy) * ts;
    layTracks(step);
  } else {
    car.speed = 0;
    car.sux = car.ux; car.suy = car.uy;
    car.trackL = car.trackR = null;   // lift the pen while parked
  }

  carEl.style.transform = `translate3d(${car.x}px, ${car.y}px, 0) scale(${carScale()})`;

  // Fade in coarse steps: an 8-bit canvas cannot remove less than one level
  // per pass, so a gentle per-frame fade strands every mark as a permanent
  // faint ghost. 9% once a second clears fully and still reads as a slow fade.
  fadeClock += dt;
  if (fadeClock > 1 && tracksCv.height > 0) {
    fadeClock = 0;
    tracksCtx.save();
    tracksCtx.setTransform(1, 0, 0, 1, 0, 0);
    tracksCtx.globalCompositeOperation = "destination-out";
    tracksCtx.fillStyle = "rgba(0,0,0,0.09)";
    tracksCtx.fillRect(0, 0, tracksCv.width, tracksCv.height);
    tracksCtx.restore();
  }
}

/* Tyre marks from the two rear wheels, in one colour (TRACK_RGB).
   Each tyre is TYRE_W wide and printed as staggered tread blocks every TREAD px
   of travel, with a little grain in the pressure; when the car corners, the
   lagged heading (sux, suy) and the driven one diverge, and that slip lays a
   solid smear under the tread — a skid mark. Each segment starts exactly where
   the previous one ended, including through a corner, so the rubber never
   breaks at a turn. */
const TRACK_RGB = "232, 226, 214";   // the one track colour — change it here
const TYRE_W = 6;          // printed tyre width, px
const AXLE_HALF = 11;      // half the distance between the rear tyres (at full car size)
const REAR = 24;           // rear axle behind the car's centre (at full car size)
const carScale = () => (isFlow() ? 0.62 : 1);   // a smaller car on phones
const TREAD = 3.2;         // px of travel per tread block
const SMEAR = 14;          // px across each dab of photo a tread step drags along
const DRAG = 5;            // how far behind the tyre the dragged pixels come from
const SMEAR_ALPHA = 0.5;

/* What the tyres can smear: every photo / video frame / thumbnail on the
   stage, with its rect in tracks-canvas space, topmost first. Rebuilt once per
   frame while driving, so it follows scroll, resize and lazy loading. */
let surfaces = [];
function collectSurfaces(wrapRect) {
  surfaces = [];
  for (const post of stage.children) {
    const m = post.querySelector("img, video");
    if (!m) continue;
    const nw = m.naturalWidth || m.videoWidth, nh = m.naturalHeight || m.videoHeight;
    if (!nw || !nh || (m.tagName === "VIDEO" && m.readyState < 2)) continue;
    const r = m.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) continue;
    surfaces.push({ m, nw, nh, z: +post.style.zIndex || 1,
      x: r.left - wrapRect.left, y: r.top - wrapRect.top, w: r.width, h: r.height });
  }
  surfaces.sort((a, b) => b.z - a.z);
}
const surfaceAt = (x, y) => surfaces.find(s => x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h);

/* Copy a small dab of the photo from DRAG px behind the tyre to under it,
   clipped to the photo: the picture is pushed along the track like wet paint.
   Each dab is feathered round (a radial mask on a scratch canvas), so a line
   of them reads as one smudge instead of stepped squares. The coarse fade
   lets the photo relax back to the original over half a minute. */
const dab = document.createElement("canvas");
const dabCtx = dab.getContext("2d");
const dabMask = document.createElement("canvas");
function sizeDab() {
  const px = Math.ceil(SMEAR * DPR);
  if (dab.width === px) return;
  dab.width = dab.height = dabMask.width = dabMask.height = px;
  const m = dabMask.getContext("2d");
  const g = m.createRadialGradient(px / 2, px / 2, 0, px / 2, px / 2, px / 2);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(0.55, "rgba(0,0,0,0.85)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  m.fillStyle = g;
  m.fillRect(0, 0, px, px);
}
function smearAt(sf, px, py, ax, ay, wobble) {
  sizeDab();
  const kx = sf.nw / sf.w, ky = sf.nh / sf.h;          // screen px -> source px
  const bx = px - ax * DRAG - ay * wobble, by = py - ay * DRAG + ax * wobble;
  const n = dab.width;
  dabCtx.globalCompositeOperation = "copy";
  try {
    dabCtx.drawImage(sf.m, (bx - SMEAR / 2 - sf.x) * kx, (by - SMEAR / 2 - sf.y) * ky, SMEAR * kx, SMEAR * ky, 0, 0, n, n);
  } catch (e) { return; }  /* a frame not decoded yet */
  dabCtx.globalCompositeOperation = "destination-in";
  dabCtx.drawImage(dabMask, 0, 0);
  const c = tracksCtx;
  c.save();
  c.setTransform(DPR, 0, 0, DPR, 0, 0);   // the tread loop leaves a rotated frame behind
  c.beginPath();
  c.rect(sf.x, sf.y, sf.w, sf.h);
  c.clip();
  c.globalAlpha = SMEAR_ALPHA;
  c.drawImage(dab, px - SMEAR / 2, py - SMEAR / 2, SMEAR, SMEAR);
  c.restore();
}

function layTracks(step) {
  if (tracksCv.height <= 0) return;
  const wrapRect = wrap.getBoundingClientRect();
  if (car.y < wrapRect.top || car.y > wrapRect.bottom) {
    car.trackL = car.trackR = null;
    return;
  }
  const sl = Math.hypot(car.sux, car.suy) || 1;
  const tux = car.sux / sl, tuy = car.suy / sl;   // the lagged heading
  const k = carScale();
  const ox = -tuy * AXLE_HALF * k, oy = tux * AXLE_HALF * k;
  const bx = car.x - wrapRect.left - tux * REAR * k;
  const by = car.y - wrapRect.top - tuy * REAR * k;
  const L = { x: bx + ox, y: by + oy };
  const R = { x: bx - ox, y: by - oy };

  if (car.trackL && car.trackR) {
    collectSurfaces(wrapRect);
    // reject only genuine teleports (a resize, a tab returning from the
    // background) -- a fixed pixel cap would also cut the trail on any machine
    // running below about 25fps, where one frame legitimately covers a lot
    const maxSeg = step * 1.7 + 28;
    const slip = Math.min(1, Math.abs(car.ux * tuy - car.uy * tux) * 1.6);
    const pressure = 0.30 - 0.10 * (car.speed / MAX_SPEED);
    tyreMark(car.trackL, L, slip, pressure, car.wheels[0], maxSeg);
    tyreMark(car.trackR, R, slip, pressure, car.wheels[1], maxSeg);
  }
  car.trackL = L; car.trackR = R;
}

function tyreMark(a, b, slip, pressure, wheel, maxSeg) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if (!len || len > maxSeg) return;
  const c = tracksCtx;

  if (slip > 0.05) {
    c.strokeStyle = `rgba(${TRACK_RGB}, ${(slip * 0.32).toFixed(3)})`;
    c.lineWidth = TYRE_W + slip * 2;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(a.x, a.y);
    c.lineTo(b.x, b.y);
    c.stroke();
  }

  // tread: blocks across the tyre, alternating halves offset along the mark
  const ax = dx / len, ay = dy / len;
  const half = TYRE_W / 2;
  let d = TREAD - wheel.acc;
  while (d <= len) {
    const px = a.x + ax * d, py = a.y + ay * d;
    wheel.flip ^= 1;
    const sf = surfaceAt(px, py);
    if (sf) smearAt(sf, px, py, ax, ay, (Math.random() - 0.5) * 2.4);
    // on a photo the print is fainter: the smear carries most of the mark
    const k = pressure * (0.75 + Math.random() * 0.5) * (sf ? 0.55 : 1);
    c.fillStyle = `rgba(${TRACK_RGB}, ${k.toFixed(3)})`;
    // local frame: x along the mark, y across the tyre
    c.setTransform(DPR * ax, DPR * ay, -DPR * ay, DPR * ax, DPR * px, DPR * py);
    const off = wheel.flip ? 0.8 : -0.8;
    c.fillRect(off - 0.8, -half, 1.6, half - 0.5);
    c.fillRect(-off - 0.8, 0.5, 1.6, half - 0.5);
    d += TREAD;
  }
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  wheel.acc = (wheel.acc + len) % TREAD;
}
requestAnimationFrame(carTick);

boot();
</script>
