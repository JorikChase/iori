  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <h1>NASAL WAVE ENGINE</h1>
      <p id="hint">hold &amp; drag up to breathe in &middot; move to paint sound</p>
    </div>
    <script>
      (function() {
            const canvas = document.getElementById('c');
            const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
            if (!gl) { console.error('WebGL2 not supported'); return; }

            // ====== 1. CONFIG ======
            const CONFIG = {
                VOL: 64, TILE: 8, ATLAS: 512,
                WAVE_C2: 0.25,         // c^2 (c=0.5 < 1/sqrt(3) -> CFL stable)
                PRESSURE_DAMP: 0.997,
                MUCUS_K: 0.4, MUCUS_D: 0.06, MUCUS_BETA: 0.02, MUCUS_ALPHA: 0.3,
                MUCUS_CLAMP: 2.0,
                MEMBRANE_THICK: 1.5,
                SPLAT_RADIUS: 4.5, SPLAT_FORCE: 1.2,
                BREATH_FORCE: 0.35,
                BREATH_EASE: 0.07, BREATH_DRAG_SCALE: 150,
                CUTAWAY_DELAY: 3.0, CUTAWAY_EASE: 0.035,
                RAY_MAX: 220,
                SPLINE: [[17,32,5],[18,32,24],[26,32,38],[32,32,50]],
                EXTERIOR: [34, 26, 104]
            };

            gl.getExtension('EXT_color_buffer_float');
            gl.getExtension('OES_texture_float_linear');

            // ====== 2. SHADERS ======
            const baseVs = `#version 300 es
            void main() {
                vec2 p = vec2(float(gl_VertexID % 2) * 4.0 - 1.0, float(gl_VertexID / 2) * 4.0 - 1.0);
                gl_Position = vec4(p, 0.0, 1.0);
            }`;

            // 3D-atlas <-> 2D-UV helpers (flattened 64^3 into 8x8 tiles of 64x64)
            const commonFs = `#version 300 es
            precision highp float;
            precision highp sampler2D;
            out vec4 outColor;
            const float N = 64.0;
            const float TILE = 8.0;
            const float TS = 64.0;
            const float ATLAS = 512.0;
            vec2 uvFromI3(vec3 i){
                i = clamp(floor(i + 0.5), vec3(0.0), vec3(N - 1.0));
                float tx = mod(i.z, TILE);
                float ty = floor(i.z / TILE);
                return (vec2(tx * TS, ty * TS) + i.xy + 0.5) / ATLAS;
            }
            vec3 i3FromPix(vec2 pix){
                pix = floor(pix);
                float tx = floor(pix.x / TS);
                float ty = floor(pix.y / TS);
                float x = mod(pix.x, TS);
                float y = mod(pix.y, TS);
                float z = ty * TILE + tx;
                return vec3(x, y, z);
            }
            vec4 sample3(sampler2D tex, vec3 i){
                return texture(tex, uvFromI3(i));
            }`;

            // --- Mucus pass: damped membrane oscillator (the voice). Clamped + saturating.
            const mucusFs = `${commonFs}
            uniform sampler2D uM;
            uniform sampler2D uP;
            uniform sampler2D uGeom;
            uniform float uK, uD, uBeta, uThick, uClamp;
            void main() {
                vec3 i = i3FromPix(gl_FragCoord.xy);
                float sdf = sample3(uGeom, i).r;
                if (sdf <= 0.0 || sdf > uThick) { outColor = vec4(0.0); return; }
                vec2 mc = sample3(uM, i).rg;
                float disp = mc.r, vel = mc.g;
                float p = sample3(uP, i).r;
                float acc = -uK * disp - uD * vel + uBeta * p;
                vel = clamp(vel + acc, -uClamp, uClamp);
                disp = clamp(disp + vel, -uClamp, uClamp);
                outColor = vec4(disp, vel, 0.0, 1.0);
            }`;

            // --- Wave pass: 3D leapfrog FDTD, Neumann walls, soft-saturating mucus source.
            const waveFs = `${commonFs}
            uniform sampler2D uP;
            uniform sampler2D uM;
            uniform sampler2D uGeom;
            uniform float uC2, uDamp, uMucusK, uMucusD, uMucusAlpha, uThick;
            float nbs(sampler2D g, sampler2D p, vec3 i, vec3 off, float c){
                return (sample3(g, i + off).r > 0.0) ? sample3(p, i + off).r : c;
            }
            void main() {
                vec3 i = i3FromPix(gl_FragCoord.xy);
                float sdf = sample3(uGeom, i).r;
                if (sdf <= 0.0) { outColor = vec4(0.0); return; }
                vec4 pc = sample3(uP, i);
                float pn = pc.r, pnm1 = pc.g;
                float pL = nbs(uGeom, uP, i, vec3(-1.0,0.0,0.0), pn);
                float pR = nbs(uGeom, uP, i, vec3( 1.0,0.0,0.0), pn);
                float pD = nbs(uGeom, uP, i, vec3(0.0,-1.0,0.0), pn);
                float pU = nbs(uGeom, uP, i, vec3(0.0, 1.0,0.0), pn);
                float pB = nbs(uGeom, uP, i, vec3(0.0,0.0,-1.0), pn);
                float pF = nbs(uGeom, uP, i, vec3(0.0,0.0, 1.0), pn);
                float lap = pL + pR + pD + pU + pB + pF - 6.0 * pn;
                float source = 0.0;
                if (sdf < uThick) {
                    vec2 mc = sample3(uM, i).rg;
                    float s = uMucusK * mc.r + uMucusD * mc.g;
                    source = uMucusAlpha * s / (1.0 + abs(s));
                }
                float pnp1 = (2.0 * pn - pnm1 + uC2 * lap + source) * uDamp;
                outColor = vec4(pnp1, pn, 0.0, 1.0);
            }`;

            // --- 3D splat: Gaussian impulse into mucus velocity channel.
            const splat3DFs = `${commonFs}
            uniform sampler2D uTarget;
            uniform vec3 uCenter;
            uniform float uRadius;
            uniform float uAmount;
            void main() {
                vec3 i = i3FromPix(gl_FragCoord.xy);
                vec4 base = sample3(uTarget, i);
                float d = length(i - uCenter);
                float g = exp(-d * d / (uRadius * uRadius));
                base.g += g * uAmount;
                outColor = base;
            }`;

            // --- Probe: sample pressure at a cell into 1x1 target.
            const probeFs = `${commonFs}
            uniform sampler2D uP;
            uniform vec3 uProbe;
            void main() {
                float p = sample3(uP, uProbe).r;
                outColor = vec4(p, abs(p), p * p, 1.0);
            }`;

            // --- Display: surface-shell raymarch of the SDF (membrane + void + pressure haze).
            const displayFs = `${commonFs}
            uniform sampler2D uP;
            uniform sampler2D uM;
            uniform sampler2D uGeom;
            uniform vec2 uResolution;
            uniform vec3 uCamPos, uCamFwd, uCamRight, uCamUp;
            uniform vec3 uBrushPos;
            uniform float uTime, uBreath, uCutaway, uMembThick, uBrushRadius, uBrushActive;

            vec3 palette(float t){
                return 0.5 + 0.5 * cos(6.28318 * (t * vec3(1.0) + vec3(0.0, 0.33, 0.67)));
            }
            float sdfL(vec3 p){
                vec3 i = floor(p), f = fract(p);
                float a = sample3(uGeom, i + vec3(0.0,0.0,0.0)).r;
                float b = sample3(uGeom, i + vec3(1.0,0.0,0.0)).r;
                float c = sample3(uGeom, i + vec3(0.0,1.0,0.0)).r;
                float d = sample3(uGeom, i + vec3(1.0,1.0,0.0)).r;
                float e = sample3(uGeom, i + vec3(0.0,0.0,1.0)).r;
                float g = sample3(uGeom, i + vec3(1.0,0.0,1.0)).r;
                float h = sample3(uGeom, i + vec3(0.0,1.0,1.0)).r;
                float k = sample3(uGeom, i + vec3(1.0,1.0,1.0)).r;
                float x00 = mix(a, b, f.x);
                float x10 = mix(c, d, f.x);
                float x01 = mix(e, g, f.x);
                float x11 = mix(h, k, f.x);
                return mix(mix(x00, x10, f.y), mix(x01, x11, f.y), f.z);
            }
            void main() {
                vec2 uv = (gl_FragCoord.xy / uResolution) * 2.0 - 1.0;
                uv.x *= uResolution.x / uResolution.y;
                vec3 ro = uCamPos + uCamFwd * uBreath * 1.5;
                vec3 rd = normalize(uCamFwd * (1.7 + 0.2 * uBreath) + uCamRight * uv.x + uCamUp * uv.y);
                vec3 inv = 1.0 / rd;
                vec3 t1 = -ro * inv;
                vec3 t2 = (vec3(64.0) - ro) * inv;
                vec3 tmin = min(t1, t2), tmax = max(t1, t2);
                float tn = max(max(tmin.x, tmin.y), tmin.z);
                float tf = min(min(tmax.x, tmax.y), tmax.z);
                vec3 bg = vec3(0.045, 0.025, 0.035);
                if (tn > tf || tf < 0.0) { outColor = vec4(bg, 1.0); return; }
                tn = max(tn, 0.0);
                float membOp = mix(2.4, 0.5, uCutaway);
                float tissAmb = mix(0.0, 0.11, uCutaway);
                vec3 col = bg;
                float trans = 1.0;
                float t = tn;
                for (int s = 0; s < 220; s++) {
                    if (t > tf || trans < 0.01) break;
                    vec3 p = ro + rd * t;
                    if (any(lessThan(p, vec3(0.0))) || any(greaterThan(p, vec3(63.5)))) { t += 1.0; continue; }
                    float sdf = sample3(uGeom, p).r;
                    float prs = sample3(uP, p).r;
                    vec3 emit = vec3(0.0);
                    float dens = 0.0;
                    float stp;
                    float membrane = smoothstep(uMembThick, 0.0, abs(sdf));
                    if (membrane > 0.01) {
                        vec3 n = vec3(0.0, 0.0, 1.0);
                        if (membrane > 0.25) {
                            float e = 1.0;
                            float gx = sdfL(p + vec3(e,0.0,0.0)) - sdfL(p - vec3(e,0.0,0.0));
                            float gy = sdfL(p + vec3(0.0,e,0.0)) - sdfL(p - vec3(0.0,e,0.0));
                            float gz = sdfL(p + vec3(0.0,0.0,e)) - sdfL(p - vec3(0.0,0.0,e));
                            float mdx = sample3(uM, p + vec3(e,0.0,0.0)).r - sample3(uM, p - vec3(e,0.0,0.0)).r;
                            float mdy = sample3(uM, p + vec3(0.0,e,0.0)).r - sample3(uM, p - vec3(0.0,e,0.0)).r;
                            float mdz = sample3(uM, p + vec3(0.0,0.0,e)).r - sample3(uM, p - vec3(0.0,0.0,e)).r;
                            n = normalize(vec3(gx, gy, gz) + vec3(mdx, mdy, mdz) * 1.6 + 0.0001);
                        }
                        vec2 mc = sample3(uM, p).rg;
                        float fres = pow(1.0 - max(0.0, dot(-rd, n)), 3.0);
                        vec3 irid = palette(0.6 + 0.3 * fres + 0.18 * n.z + 0.08 * uTime);
                        vec3 flesh = vec3(0.40, 0.13, 0.17);
                        vec3 mcol = mix(flesh, irid, 0.4 + 0.55 * fres);
                        float pg = abs(prs);
                        mcol += palette(0.55 + 0.15 * prs) * pg * 1.7;
                        mcol += palette(0.72 + 0.12 * mc.r) * abs(mc.r) * 2.3;
                        float turb = sample3(uGeom, p).g;
                        mcol *= (0.7 + 0.6 * turb);
                        emit = mcol;
                        dens = membrane * membOp + pg * 0.3;
                        stp = 0.45;
                    } else if (sdf > uMembThick) {
                        float pg = abs(prs);
                        emit = palette(0.6 + 0.1 * prs) * pg * 0.55;
                        dens = pg * 0.22;
                        stp = clamp(sdf * 0.7, 0.5, 3.0);
                    } else {
                        emit = vec3(0.07, 0.025, 0.04);
                        dens = tissAmb;
                        stp = 2.0;
                    }
                    float bd = length(p - uBrushPos);
                    float orb = smoothstep(uBrushRadius, 0.0, bd);
                    emit += vec3(0.5, 0.7, 1.0) * orb * 1.7 * uBrushActive;
                    dens += orb * 0.6 * uBrushActive;
                    col += emit * dens * trans * stp;
                    trans *= exp(-dens * stp);
                    t += stp;
                }
                col = mix(col, bg, 0.1);
                col = col / (1.0 + col);
                col = pow(col, vec3(0.85));
                outColor = vec4(col, 1.0);
            }`;

            // ====== 3. WEBGL BOILERPLATE ======
            function createProgram(fs) {
                const program = gl.createProgram();
                const v = gl.createShader(gl.VERTEX_SHADER);
                const f = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(v, baseVs); gl.compileShader(v);
                gl.shaderSource(f, fs);    gl.compileShader(f);
                if (!gl.getShaderParameter(f, gl.COMPILE_STATUS)) console.error('FS:', gl.getShaderInfoLog(f));
                if (!gl.getShaderParameter(v, gl.COMPILE_STATUS)) console.error('VS:', gl.getShaderInfoLog(v));
                gl.attachShader(program, v); gl.attachShader(program, f);
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.error('Link:', gl.getProgramInfoLog(program));
                return { id: program, uni: name => gl.getUniformLocation(program, name) };
            }

            function createFBO(w, h, filter) {
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                const fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
                gl.viewport(0, 0, w, h);
                gl.clear(gl.COLOR_BUFFER_BIT);
                return {
                    fbo, tex, w, h,
                    attach: (id) => { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, tex); return id; }
                };
            }
            function createDoubleFBO(w, h, filter) {
                let a = createFBO(w, h, filter), b = createFBO(w, h, filter);
                return { get read(){ return a; }, get write(){ return b; }, swap(){ let t = a; a = b; b = t; } };
            }

            function run(prog, target, inputs) {
                gl.useProgram(prog.id);
                if (target) {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
                    gl.viewport(0, 0, target.w, target.h);
                } else {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                    gl.viewport(0, 0, canvas.width, canvas.height);
                }
                for (let k in inputs) {
                    const v = inputs[k];
                    if (v && typeof v.attach === 'function') {
                        gl.uniform1i(prog.uni(k), v.attach(inputs[k + '_id']));
                    } else if (v && v.tex) {
                        gl.activeTexture(gl.TEXTURE0 + inputs[k + '_id']);
                        gl.bindTexture(gl.TEXTURE_2D, v.tex);
                        gl.uniform1i(prog.uni(k), inputs[k + '_id']);
                    } else if (typeof v === 'number') {
                        gl.uniform1f(prog.uni(k), v);
                    } else if (v && v.length === 2) {
                        gl.uniform2fv(prog.uni(k), v);
                    } else if (v && v.length === 3) {
                        gl.uniform3fv(prog.uni(k), v);
                    }
                }
                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }

            // ====== 4. PROGRAMS & STATE ======
            const P = {
                mucus:   createProgram(mucusFs),
                wave:    createProgram(waveFs),
                splat:   createProgram(splat3DFs),
                probe:   createProgram(probeFs),
                display: createProgram(displayFs)
            };
            const A = CONFIG.ATLAS;
            let pField, mField, probeFBO, geomTex, geomBind, airGrid;

            function initFBOs() {
                pField  = createDoubleFBO(A, A, gl.NEAREST);
                mField  = createDoubleFBO(A, A, gl.NEAREST);
                probeFBO = createFBO(1, 1, gl.NEAREST);
            }

            // ====== 5. PROCEDURAL ANATOMY + SDF BAKE ======
            function isAirCell(x, y, z) {
                if (x <= 0 || x >= 63 || y <= 0 || y >= 63 || z <= 0 || z >= 63) return false;
                const nx = (x - 31.5) / 31.5, ny = (y - 31.5) / 31.5, nz = (z - 31.5) / 31.5;
                const inLeft  = ((nx + 0.45) ** 2 + ny * ny) < 0.30 * 0.30 && nz > -1.05 && nz < 0.55;
                const inRight = ((nx - 0.45) ** 2 + ny * ny) < 0.30 * 0.30 && nz > -1.05 && nz < 0.55;
                const inNaso = Math.abs(nx) < 0.42 && Math.abs(ny) < 0.42 && nz > 0.40 && nz < 1.1;
                let air = inLeft || inRight || inNaso;
                if (!air) return false;
                if (Math.abs(nx) < 0.07 && nz < 0.45) return false;          // septum
                const turbZ = [-0.45, -0.05, 0.35];
                for (const zt of turbZ) {
                    if (nx > -0.72 && nx < -0.50 && Math.abs(ny) < 0.23 && Math.abs(nz - zt) < 0.07) return false;
                    if (nx >  0.50 && nx <  0.72 && Math.abs(ny) < 0.23 && Math.abs(nz - zt) < 0.07) return false;
                }
                return true;
            }
            function isTurbinateRegion(x, y, z) {
                const nx = (x - 31.5) / 31.5, ny = (y - 31.5) / 31.5, nz = (z - 31.5) / 31.5;
                const turbZ = [-0.45, -0.05, 0.35];
                for (const zt of turbZ) {
                    if (Math.abs(nz - zt) < 0.10 && Math.abs(ny) < 0.25 &&
                        ((nx > -0.74 && nx < -0.48) || (nx > 0.48 && nx < 0.74))) return true;
                }
                return false;
            }

            // 3D chamfer distance transform: returns distance to nearest seed (seed cells = 0).
            function chamferDT(seed) {
                const N = 64, INF = 1e6;
                const d = new Float32Array(N * N * N);
                const idx = (x, y, z) => z * N * N + y * N + x;
                for (let i = 0; i < d.length; i++) d[i] = seed[i] ? 0 : INF;
                const W = [0, 1, 1.41421356, 1.73205081];
                const back = [], fwd = [];
                for (let dz = -1; dz <= 1; dz++)
                    for (let dy = -1; dy <= 1; dy++)
                        for (let dx = -1; dx <= 1; dx++) {
                            if (dz === 0 && dy === 0 && dx === 0) continue;
                            const nz = (dz ? 1 : 0) + (dy ? 1 : 0) + (dx ? 1 : 0);
                            const isBack = (dz < 0) || (dz === 0 && dy < 0) || (dz === 0 && dy === 0 && dx < 0);
                            (isBack ? back : fwd).push([dx, dy, dz, W[nz]]);
                        }
                for (let z = 0; z < N; z++)
                    for (let y = 0; y < N; y++)
                        for (let x = 0; x < N; x++) {
                            let best = d[idx(x, y, z)];
                            for (const [dx, dy, dz, w] of back) {
                                const xi = x + dx, yi = y + dy, zi = z + dz;
                                if (xi < 0 || yi < 0 || zi < 0) continue;
                                const v = d[idx(xi, yi, zi)] + w;
                                if (v < best) best = v;
                            }
                            d[idx(x, y, z)] = best;
                        }
                for (let z = N - 1; z >= 0; z--)
                    for (let y = N - 1; y >= 0; y--)
                        for (let x = N - 1; x >= 0; x--) {
                            let best = d[idx(x, y, z)];
                            for (const [dx, dy, dz, w] of fwd) {
                                const xi = x + dx, yi = y + dy, zi = z + dz;
                                if (xi >= N || yi >= N || zi >= N) continue;
                                const v = d[idx(xi, yi, zi)] + w;
                                if (v < best) best = v;
                            }
                            d[idx(x, y, z)] = best;
                        }
                return d;
            }

            function bakeGeom() {
                const N = 64, A2 = 512;
                const air = new Uint8Array(N * N * N);
                const idx = (x, y, z) => z * N * N + y * N + x;
                for (let z = 0; z < N; z++)
                    for (let y = 0; y < N; y++)
                        for (let x = 0; x < N; x++)
                            air[idx(x, y, z)] = isAirCell(x, y, z) ? 1 : 0;
                airGrid = air;
                const tissue = new Uint8Array(N * N * N);
                for (let i = 0; i < air.length; i++) tissue[i] = air[i] ? 0 : 1;
                const dTissue = chamferDT(tissue);   // air cells -> depth in air; tissue = 0
                const dAir    = chamferDT(air);      // tissue cells -> depth in tissue; air = 0
                const sdf = new Float32Array(N * N * N);
                for (let i = 0; i < air.length; i++) sdf[i] = air[i] ? dTissue[i] : -dAir[i];

                const data = new Float32Array(A2 * A2 * 4);
                for (let py = 0; py < A2; py++)
                    for (let px = 0; px < A2; px++) {
                        const tx = Math.floor(px / 64), ty = Math.floor(py / 64);
                        const x = px % 64, y = py % 64, z = ty * 8 + tx;
                        const i = idx(x, y, z);
                        const o = (py * A2 + px) * 4;
                        data[o]     = sdf[i];
                        data[o + 1] = (sdf[i] > 0 && sdf[i] < CONFIG.MEMBRANE_THICK * 1.6 && isTurbinateRegion(x, y, z)) ? 1.0 : 0.0;
                        data[o + 2] = 0.0;
                        data[o + 3] = 1.0;
                    }
                geomTex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, geomTex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, A2, A2, 0, gl.RGBA, gl.FLOAT, data);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                geomBind = { attach: (id) => { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, geomTex); return id; } };
            }

            // ====== 6. AUDIO: formant resonance (breathy noise -> 3 bandpass -> reverb) ======
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            let audioCtx, masterGain, compressor, noiseSrc, breathGain, lpBreath;
            let bp1, bp2, bp3, g1, g2, g3, sumGain, membraneGain, delay, feedback;
            let useProbe = true;
            const probeBuf = new Float32Array(4);

            function initAudio() {
                if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
                audioCtx = new AudioCtx();
                masterGain = audioCtx.createGain(); masterGain.gain.value = 0.0;
                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.value = -10; compressor.knee.value = 40; compressor.ratio.value = 12;
                compressor.attack.value = 0; compressor.release.value = 0.25;

                // breathy noise source
                const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                noiseSrc = audioCtx.createBufferSource();
                noiseSrc.buffer = buf; noiseSrc.loop = true; noiseSrc.start();

                breathGain = audioCtx.createGain(); breathGain.gain.value = 0.0;
                lpBreath = audioCtx.createBiquadFilter(); lpBreath.type = 'lowpass'; lpBreath.frequency.value = 600;

                bp1 = audioCtx.createBiquadFilter(); bp1.type = 'bandpass'; bp1.Q.value = 8;
                bp2 = audioCtx.createBiquadFilter(); bp2.type = 'bandpass'; bp2.Q.value = 8;
                bp3 = audioCtx.createBiquadFilter(); bp3.type = 'bandpass'; bp3.Q.value = 8;
                g1 = audioCtx.createGain(); g2 = audioCtx.createGain(); g3 = audioCtx.createGain();
                g1.gain.value = g2.gain.value = g3.gain.value = 0.5;

                sumGain = audioCtx.createGain(); sumGain.gain.value = 1.0;
                membraneGain = audioCtx.createGain(); membraneGain.gain.value = 0.0;

                // feedback delay (cavity ring)
                delay = audioCtx.createDelay(0.2); delay.delayTime.value = 0.09;
                feedback = audioCtx.createGain(); feedback.gain.value = 0.45;

                noiseSrc.connect(breathGain);
                breathGain.connect(lpBreath);
                lpBreath.connect(bp1); bp1.connect(g1); g1.connect(sumGain);
                lpBreath.connect(bp2); bp2.connect(g2); g2.connect(sumGain);
                lpBreath.connect(bp3); bp3.connect(g3); g3.connect(sumGain);
                sumGain.connect(membraneGain);
                membraneGain.connect(masterGain);          // dry
                membraneGain.connect(delay); delay.connect(feedback); feedback.connect(delay); delay.connect(masterGain); // wet
                masterGain.connect(compressor); compressor.connect(audioCtx.destination);
            }

            function readProbe() {
                if (!useProbe) return 0;
                try {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, probeFBO.fbo);
                    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, probeBuf);
                    return Math.min(2, Math.abs(probeBuf[0]));
                } catch (e) { useProbe = false; return 0; }
            }

            function updateAudio(probeAbs, breath, phase, brushTr) {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                // formants: tight nostril (phase 0) -> high; open nasopharynx (phase 1) -> low
                let f1 = 800 - 500 * phase;
                f1 *= 1.0 - 0.15 * breath;          // inhale drops pitch
                const f2 = f1 * 2.0, f3 = f1 * 3.0;
                bp1.frequency.linearRampToValueAtTime(f1, now + 0.06);
                bp2.frequency.linearRampToValueAtTime(f2, now + 0.06);
                bp3.frequency.linearRampToValueAtTime(f3, now + 0.06);
                lpBreath.frequency.linearRampToValueAtTime(400 + Math.abs(breath) * 1400, now + 0.06);
                breathGain.gain.linearRampToValueAtTime(Math.min(0.3, Math.abs(breath) * 0.28), now + 0.06);
                const mg = Math.min(0.5, probeAbs * 0.5 + brushTr * 0.25 + Math.abs(breath) * 0.08);
                membraneGain.gain.linearRampToValueAtTime(mg, now + 0.06);
                feedback.gain.linearRampToValueAtTime(0.3 + 0.25 * (1 - phase), now + 0.1); // more ring in tight zones
                masterGain.gain.linearRampToValueAtTime(0.6, now + 0.2);
            }

            // ====== 7. CAMERA SPLINE + BREATH + AUTO PULLBACK ======
            function splinePos(t) {
                const p = CONFIG.SPLINE;
                const s = Math.max(0, Math.min(1, t));
                const p0 = p[0], p1 = p[1], p2 = p[2], p3 = p[3];
                const c = (a,b,c2,dd) => 0.5 * ((2*b) + (-a+c2)*s + (2*a-5*b+4*c2-dd)*s*s + (-a+3*b-3*c2+dd)*s*s*s);
                return [c(p0[0],p1[0],p2[0],p3[0]), c(p0[1],p1[1],p2[1],p3[1]), c(p0[2],p1[2],p2[2],p3[2])];
            }
            function splineTangent(t) {
                const a = splinePos(t), b = splinePos(Math.min(1, t + 0.02));
                return [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
            }

            let breath = 0, breathTarget = 0;
            let cutaway = 1, cutawayTarget = 1;
            let lastBreathTime = -999;
            let time = 0;
            function breathPhase() { return 0.5 + 0.4 * breath; }

            function camBasis() {
                const phase = breathPhase();
                const insidePos = splinePos(phase);
                const tan = splineTangent(phase);
                const insideFwd = Math.hypot(tan[0], tan[1], tan[2]);
                const ifwd = [tan[0]/(insideFwd||1), tan[1]/(insideFwd||1), tan[2]/(insideFwd||1)];
                const ex = CONFIG.EXTERIOR;
                const extFwd = [32-ex[0], 32-ex[1], 32-ex[2]];
                const efl = Math.hypot(extFwd[0], extFwd[1], extFwd[2]);
                const efwd = [extFwd[0]/efl, extFwd[1]/efl, extFwd[2]/efl];
                const cp = [
                    insidePos[0]*(1-cutaway) + ex[0]*cutaway,
                    insidePos[1]*(1-cutaway) + ex[1]*cutaway,
                    insidePos[2]*(1-cutaway) + ex[2]*cutaway
                ];
                const fwd = [
                    ifwd[0]*(1-cutaway) + efwd[0]*cutaway,
                    ifwd[1]*(1-cutaway) + efwd[1]*cutaway,
                    ifwd[2]*(1-cutaway) + efwd[2]*cutaway
                ];
                let fl = Math.hypot(fwd[0], fwd[1], fwd[2]);
                fwd[0]/=fl; fwd[1]/=fl; fwd[2]/=fl;
                let rx = fwd[1]*0 - fwd[2]*1, ry = fwd[2]*0 - fwd[0]*0, rz = fwd[0]*1 - fwd[1]*0;
                let rl = Math.hypot(rx, ry, rz); rx/=rl; ry/=rl; rz/=rl;
                let ux = ry*fwd[2] - rz*fwd[1], uy = rz*fwd[0] - rx*fwd[2], uz = rx*fwd[1] - ry*fwd[0];
                return { cp, fwd, right:[rx,ry,rz], up:[ux,uy,uz], insidePos };
            }

            // ====== 8. INPUT: brush (hover) + breath (hold-drag) ======
            let pointers = [];
            let dragging = false, startY = 0;
            let brushCell = [32,32,32], brushActive = 0, brushTransient = 0, brushSpeed = 0;

            function pointerWorld(px, py) {
                const b = camBasis();
                const uvx = (px / canvas.width) * 2 - 1;
                const uvy = 1 - (py / canvas.height) * 2;
                const ro = [b.cp[0] + b.fwd[0]*breath*1.5, b.cp[1] + b.fwd[1]*breath*1.5, b.cp[2] + b.fwd[2]*breath*1.5];
                let dx = b.fwd[0]*(1.7+0.2*breath) + b.right[0]*uvx + b.up[0]*uvy;
                let dy = b.fwd[1]*(1.7+0.2*breath) + b.right[1]*uvx + b.up[1]*uvy;
                let dz = b.fwd[2]*(1.7+0.2*breath) + b.right[2]*uvx + b.up[2]*uvy;
                let dl = Math.hypot(dx,dy,dz); dx/=dl; dy/=dl; dz/=dl;
                let tmin = -Infinity;
                for (let i = 0; i < 3; i++) {
                    const o = ro[i], rd = [dx,dy,dz][i];
                    const a = (0 - o)/rd, bb = (64 - o)/rd;
                    tmin = Math.max(tmin, Math.min(a, bb));
                }
                tmin = Math.max(tmin, 0);
                for (let t = tmin; t < tmin + 120; t += 1.0) {
                    const x = Math.floor(ro[0]+dx*t), y = Math.floor(ro[1]+dy*t), z = Math.floor(ro[2]+dz*t);
                    if (x<0||x>63||y<0||y>63||z<0||z>63) continue;
                    if (airGrid[z*4096 + y*64 + x]) return [x, y, z];
                }
                return [32, 32, 32];
            }

            canvas.addEventListener('mousedown', e => {
                initAudio();
                dragging = true; startY = e.clientY;
            });
            window.addEventListener('mouseup', () => { dragging = false; breathTarget = 0; });
            window.addEventListener('mousemove', e => {
                const r = canvas.getBoundingClientRect();
                const x = e.clientX - r.left, y = e.clientY - r.top;
                if (dragging) {
                    breathTarget = Math.max(-1, Math.min(1, (startY - e.clientY) / CONFIG.BREATH_DRAG_SCALE));
                }
                pointers = [{ x, y, dx: e.movementX || 0, dy: e.movementY || 0 }];
            });
            canvas.addEventListener('touchstart', e => {
                e.preventDefault(); initAudio();
                const t = e.touches[0]; const r = canvas.getBoundingClientRect();
                dragging = true; startY = t.clientY;
                pointers = [{ x: t.clientX - r.left, y: t.clientY - r.top, dx: 0, dy: 0 }];
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = e.touches[0]; const r = canvas.getBoundingClientRect();
                if (dragging) breathTarget = Math.max(-1, Math.min(1, (startY - t.clientY) / CONFIG.BREATH_DRAG_SCALE));
                const last = pointers[0];
                pointers = [{ x: t.clientX - r.left, y: t.clientY - r.top, dx: last ? (t.clientX - r.left) - last.x : 0, dy: last ? (t.clientY - r.top) - last.y : 0 }];
            }, { passive: false });
            canvas.addEventListener('touchend', e => { e.preventDefault(); dragging = false; breathTarget = 0; }, { passive: false });

            // ====== 9. RESIZE ======
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);

            // ====== 10. MAIN LOOP ======
            let lastT = performance.now();
            const hintEl = document.getElementById('hint');
            let hinted = false;

            function step() {
                const now = performance.now();
                let dt = Math.min((now - lastT) / 1000, 0.016);
                lastT = now;
                time += dt;

                // breath + cutaway state
                breath += (breathTarget - breath) * CONFIG.BREATH_EASE;
                if (Math.abs(breath) > 0.08) {
                    lastBreathTime = time;
                    if (!hinted && breath > 0.2) { hinted = true; hintEl.textContent = 'move to paint sound \u00b7 release to settle'; }
                }
                cutawayTarget = ((time - lastBreathTime) > CONFIG.CUTAWAY_DELAY) ? 1 : 0;
                cutaway += (cutawayTarget - cutaway) * CONFIG.CUTAWAY_EASE;
                if (hinted && cutawayTarget === 0 && time - lastBreathTime < 0.5) hintEl.style.opacity = '0';

                const phase = breathPhase();

                // --- breath excites the cavity (airflow at the nostril) ---
                if (Math.abs(breath) > 0.05) {
                    run(P.splat, mField.write, {
                        uTarget: mField.read, uTarget_id: 0,
                        uCenter: CONFIG.SPLINE[0], uRadius: 5.0,
                        uAmount: CONFIG.BREATH_FORCE * breath
                    });
                    mField.swap();
                }

                // --- pointer brush (hover; also paints while breathing) ---
                brushActive = 0; brushTransient *= 0.85; brushSpeed *= 0.9;
                if (pointers.length > 0) {
                    const p = pointers[0];
                    brushCell = pointerWorld(p.x, p.y);
                    const spd = Math.hypot(p.dx, p.dy);
                    brushSpeed = Math.max(brushSpeed, spd);
                    const intensity = CONFIG.SPLAT_FORCE * (0.25 + Math.min(1, spd / 30));
                    run(P.splat, mField.write, {
                        uTarget: mField.read, uTarget_id: 0,
                        uCenter: brushCell, uRadius: CONFIG.SPLAT_RADIUS,
                        uAmount: intensity
                    });
                    mField.swap();
                    brushActive = 1;
                    brushTransient = Math.min(1, brushTransient + intensity * 0.3);
                }

                // --- 1. mucus integration ---
                run(P.mucus, mField.write, {
                    uM: mField.read, uM_id: 0,
                    uP: pField.read, uP_id: 1,
                    uGeom: geomBind, uGeom_id: 2,
                    uK: CONFIG.MUCUS_K, uD: CONFIG.MUCUS_D, uBeta: CONFIG.MUCUS_BETA,
                    uThick: CONFIG.MEMBRANE_THICK, uClamp: CONFIG.MUCUS_CLAMP
                });
                mField.swap();

                // --- 2. wave FDTD ---
                run(P.wave, pField.write, {
                    uP: pField.read, uP_id: 0,
                    uM: mField.read, uM_id: 1,
                    uGeom: geomBind, uGeom_id: 2,
                    uC2: CONFIG.WAVE_C2, uDamp: CONFIG.PRESSURE_DAMP,
                    uMucusK: CONFIG.MUCUS_K, uMucusD: CONFIG.MUCUS_D, uMucusAlpha: CONFIG.MUCUS_ALPHA,
                    uThick: CONFIG.MEMBRANE_THICK
                });
                pField.swap();

                // --- 3. probe + audio ---
                const b = camBasis();
                const probeCell = b.insidePos.map(v => Math.max(0, Math.min(63, Math.floor(v))));
                run(P.probe, probeFBO, {
                    uP: pField.read, uP_id: 0,
                    uProbe: probeCell
                });
                const probeAbs = readProbe();
                updateAudio(probeAbs, breath, phase, brushTransient);

                // --- 4. display ---
                run(P.display, null, {
                    uP: pField.read, uP_id: 0,
                    uM: mField.read, uM_id: 1,
                    uGeom: geomBind, uGeom_id: 2,
                    uResolution: [canvas.width, canvas.height],
                    uCamPos: b.cp, uCamFwd: b.fwd, uCamRight: b.right, uCamUp: b.up,
                    uBrushPos: brushCell, uBrushRadius: CONFIG.SPLAT_RADIUS,
                    uBrushActive: brushActive, uBreath: breath, uCutaway: cutaway,
                    uMembThick: CONFIG.MEMBRANE_THICK, uTime: time
                });

                pointers = [];
                requestAnimationFrame(step);
            }

            // ====== 11. BOOT ======
            resize();
            initFBOs();
            bakeGeom();
            step();
        })();
    </script>
  </body>
</html>
