<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hydrogen Orbitals - Liquid Edition</title>
    <style>
      body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            cursor: none; /* Immersive */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-family: sans-serif;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            mix-blend-mode: overlay;
        }
    </style>
  </head>
  <body>
    <div id="instruction">Drag horizontally to morph • Drag vertically to rotate</div>
    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="x-shader/x-vertex" id="vertexShader">
      varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentShader">
      uniform float uTime;
        uniform vec2 uResolution;
        uniform vec2 uMouse;
        uniform float uTilt;

        varying vec2 vUv;

        // Constants
        #define MAX_STEPS 70
        #define MAX_DIST 14.0
        #define SURF_DIST 0.01

        // --- Math Helpers ---

        mat2 rot(float a) {
            float s = sin(a);
            float c = cos(a);
            return mat2(c, -s, s, c);
        }

        // Smooth min for blending shapes
        float smin(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
        }

        // --- Procedural Palette ---
        vec3 palette( float t ) {
            vec3 a = vec3(0.5, 0.5, 0.5);
            vec3 b = vec3(0.5, 0.5, 0.5);
            vec3 c = vec3(1.0, 1.0, 1.0);
            vec3 d = vec3(0.263, 0.416, 0.557);
            return a + b*cos( 6.28318*(c*t+d) );
        }

        // --- SDF Functions ---

        float sdSphere(vec3 p, float s) {
            return length(p) - s;
        }

        float sdDumbbell(vec3 p, float s) {
            float d1 = length(p - vec3(0.0, 0.8, 0.0)) - s;
            float d2 = length(p + vec3(0.0, 0.8, 0.0)) - s;
            // Increased smoothing (0.8) for liquid merge effect
            return smin(d1, d2, 0.8);
        }

        float sdClover(vec3 p) {
            float s = 0.55;
            float k = 0.5; // Liquid blend factor
            float offset = 0.85;

            float d = length(p - vec3(offset, offset, 0.0)) - s;
            d = smin(d, length(p - vec3(-offset, -offset, 0.0)) - s, k);
            d = smin(d, length(p - vec3(-offset, offset, 0.0)) - s, k);
            d = smin(d, length(p - vec3(offset, -offset, 0.0)) - s, k);
            return d;
        }

        // --- Scene Mapping ---

        float getDist(vec3 p, float morph) {
            // Dynamic Rotation
            p.xz *= rot(uTime * 0.2 + uTilt * 2.0);
            p.xy *= rot(uTime * 0.15);

            float sphere = sdSphere(p, 0.9);
            float dumbbell = sdDumbbell(p, 0.6);
            float clover = sdClover(p);

            float d = 0.0;

            // Morphing logic
            if (morph < 1.0) {
                d = mix(sphere, dumbbell, smoothstep(0.0, 1.0, morph));
            } else {
                d = mix(dumbbell, clover, smoothstep(1.0, 2.0, morph));
            }

            // LIQUID DISTORTION
            // We use lower frequency noise (3.0 instead of 8.0)
            // This creates large "blobs" rather than fine grain, looking like fluid
            float flow = uTime * 1.2;

            // Warping the coordinate slightly to create "swirl"
            vec3 q = p;
            q.x += sin(p.y * 2.0 + flow) * 0.1;

            float noise = sin(q.x*3.0 + flow) * sin(q.y*2.5 - flow*0.5) * sin(q.z*3.0 + flow*0.8);

            // Stronger displacement amplitude (0.07) for gloopy feel
            d += noise * 0.07;

            return d;
        }

        // Determine phase for color variation
        float getPhase(vec3 p, float morph) {
            vec3 q = p;
            q.xz *= rot(uTime * 0.2 + uTilt * 2.0);
            q.xy *= rot(uTime * 0.15);

            float phaseS = 1.0;
            float phaseP = q.y;
            float phaseD = q.x * q.y;

            float ph = 0.0;
            if (morph < 1.0) {
                ph = mix(phaseS, phaseP, smoothstep(0.0, 1.0, morph));
            } else {
                ph = mix(phaseP, phaseD, smoothstep(1.0, 2.0, morph));
            }
            return ph;
        }

        float getDensity(vec3 p, float morph) {
            float d = getDist(p, morph);
            // Adjusted for cleaner edges
            return exp(-2.0 * max(d, 0.0)) * smoothstep(1.2, 0.0, d);
        }

        // --- Raymarch ---

        vec4 raymarch(vec3 ro, vec3 rd, float morph) {
            float totalDist = 0.0;
            vec3 col = vec3(0.0);
            float accumulation = 0.0;

            // NO DITHER: Removed to fix "grey dots/noise" complaint.
            // Rendering is now perfectly clean.

            for(int i = 0; i < MAX_STEPS; i++) {
                vec3 p = ro + rd * totalDist;

                float dens = getDensity(p, morph);

                if(dens > 0.001) {
                    float phase = getPhase(p, morph);

                    float t = length(p)*0.2 - uTime*0.2;
                    vec3 baseCol = palette(t + phase*0.2);

                    if (phase < 0.0) {
                        baseCol = baseCol.brg * 1.2;
                    }

                    float val = dens * 0.12;
                    accumulation += val;

                    col += baseCol * val * (1.0 - accumulation * 0.9);
                }

                if(accumulation >= 1.0 || totalDist > MAX_DIST) break;

                float stepSize = 0.05 + max(0.0, (1.0 - dens) * 0.05);
                totalDist += stepSize;
            }

            return vec4(col, accumulation);
        }

        // --- Background (Clean) ---
        vec3 getBackground(vec3 rd) {
            // Clean gradient only. No stars.
            return mix(vec3(0.0), vec3(0.01, 0.0, 0.05), rd.y*0.5 + 0.5);
        }

        void main() {
            vec2 uv = (vUv - 0.5) * 2.0;
            uv.x *= uResolution.x / uResolution.y;

            vec3 ro = vec3(0.0, 0.0, 6.5);

            float morphState = clamp(uMouse.x * 2.5, 0.0, 2.0);

            float spread = 0.015 * (1.0 + length(uv)*0.8);

            vec3 rdR = normalize(vec3(uv.x + spread, uv.y, -2.0));
            vec3 rdG = normalize(vec3(uv.x,          uv.y, -2.0));
            vec3 rdB = normalize(vec3(uv.x - spread, uv.y, -2.0));

            float camRot = uMouse.y * 2.0;
            mat2 rotMat = rot(camRot);
            ro.yz *= rotMat;
            rdR.yz *= rotMat; rdG.yz *= rotMat; rdB.yz *= rotMat;

            vec4 resR = raymarch(ro, rdR, morphState);
            vec4 resG = raymarch(ro, rdG, morphState);
            vec4 resB = raymarch(ro, rdB, morphState);

            vec3 orbitalColor = vec3(resR.r, resG.g, resB.b);
            float alphaAvg = (resR.a + resG.a + resB.a) / 3.0;

            vec3 bg = getBackground(rdG);

            vec3 finalColor = orbitalColor + bg * max(0.0, (1.0 - alphaAvg));

            finalColor = pow(finalColor, vec3(1.1));
            finalColor += orbitalColor * 0.3;
            finalColor *= 1.2 - dot(uv, uv) * 0.45;

            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>
    <script>
      const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });

        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const uniforms = {
            uTime: { value: 0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uMouse: { value: new THREE.Vector2(0.5, 0.5) },
            uTilt: { value: 0.0 }
        };

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: uniforms
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        let targetMouseX = 0.5;
        let targetMouseY = 0.5;
        let targetTilt = 0.0;

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));
            uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX / window.innerWidth;
            targetMouseY = e.clientY / window.innerHeight;
        });

        window.addEventListener('deviceorientation', (e) => {
            if(e.gamma && e.beta) {
                targetMouseX = (Math.max(-45, Math.min(45, e.gamma)) + 45) / 90;
                targetMouseY = (Math.max(-45, Math.min(45, e.beta)) + 45) / 90;
                targetTilt = e.gamma * 0.01;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                targetMouseX = e.touches[0].clientX / window.innerWidth;
                targetMouseY = e.touches[0].clientY / window.innerHeight;
            }
        }, {passive: false});

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            uniforms.uMouse.value.x += (targetMouseX - uniforms.uMouse.value.x) * 0.03;
            uniforms.uMouse.value.y += (targetMouseY - uniforms.uMouse.value.y) * 0.03;
            uniforms.uTilt.value += (targetTilt - uniforms.uTilt.value) * 0.03;

            uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }

        animate();
    </script>
  </body>
</html>
