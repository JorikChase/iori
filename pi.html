<body>

    <script>
        const PI_STRING = "1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";

        let state = {
            status: 'start',
            index: 0,
            lives: 3,
            combo: 1.0,
            score: 0,
            best: localStorage.getItem('piMinimalBest') || 0,
            lastTime: 0,
            isHintMode: false
        };

        const DOM = {
            body: document.body,
            tapeLeft: document.getElementById('tape-left'),
            tapeContentUser: document.getElementById('tape-content-user'),
            refTapeLeft: document.getElementById('ref-tape-left'),
            refTapeContent: document.getElementById('ref-tape-content'),
            refTapeRight: document.getElementById('ref-tape-right'),
            refCurrentDigit: document.getElementById('ref-current-digit'),
            referenceRow: document.getElementById('reference-row'),
            cursor: document.getElementById('cursor'),
            digitIndex: document.getElementById('digit-index'),
            uiScore: document.getElementById('ui-score'),
            uiLives: document.getElementById('ui-lives'),
            uiBest: document.getElementById('ui-best'),
            comboDisplay: document.getElementById('combo-display'),
            startScreen: document.getElementById('start-screen'),
            gameOverScreen: document.getElementById('game-over-screen'),
            finalStats: document.getElementById('final-stats'),
            themeToggles: document.querySelectorAll('.theme-toggle'),
            keypad: document.getElementById('keypad'),
            hintBtn: document.getElementById('hint-btn')
        };

        // --- SYNTHESIZER ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, masterGain, compressor;

        // A minor pentatonic scale (A, C, D, E, G) across 2 octaves
        const DIGIT_FREQUENCIES = {
            '0': 220.00, // A3
            '1': 261.63, // C4
            '2': 293.66, // D4
            '3': 329.63, // E4
            '4': 392.00, // G4
            '5': 440.00, // A4
            '6': 523.25, // C5
            '7': 587.33, // D5
            '8': 659.25, // E5
            '9': 783.99  // G5
        };

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();

                // Master compression to prevent clipping when typing fast
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.6;

                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.value = -10;
                compressor.knee.value = 40;
                compressor.ratio.value = 12;
                compressor.attack.value = 0;
                compressor.release.value = 0.25;

                masterGain.connect(compressor);
                compressor.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type, digit) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'correct' && digit !== undefined) {
                const freq = DIGIT_FREQUENCIES[digit];

                // Pluck Synthesizer: Sine (Body) + Triangle (Pluck transient)
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                osc1.type = 'sine';
                osc2.type = 'triangle';
                osc1.frequency.value = freq;
                osc2.frequency.value = freq;

                // Pluck Envelope
                const env = audioCtx.createGain();
                env.gain.setValueAtTime(0, now);
                env.gain.linearRampToValueAtTime(1, now + 0.015); // Sharp attack
                env.gain.exponentialRampToValueAtTime(0.001, now + 1.2); // Smooth decay

                // Lowpass Filter (gives the muted, string-like Kalimba tone)
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(freq * 3, now); // Starts bright
                filter.frequency.exponentialRampToValueAtTime(freq, now + 0.3); // Decays to dull quickly

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(env);
                env.connect(masterGain);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 1.5);
                osc2.stop(now + 1.5);

            } else if (type === 'wrong') {
                // Harsh error buzz
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        DOM.tapeLeft.addEventListener('scroll', () => {
            if (state.status === 'playing' && state.isHintMode) {
                DOM.refTapeLeft.scrollLeft = DOM.tapeLeft.scrollLeft;
            }
        });

        function startGame() {
            initAudio();
            state.status = 'playing';
            state.index = 0;
            state.lives = 3;
            state.combo = 1.0;
            state.score = 0;
            state.isHintMode = false;
            state.lastTime = Date.now();

            DOM.tapeContentUser.innerHTML = '<span class="muted"><span class="c3">3</span>.</span>';
            DOM.refTapeContent.innerHTML = '<span class="muted"><span class="c3">3</span>.</span>';

            DOM.startScreen.classList.remove('visible');
            DOM.gameOverScreen.classList.remove('visible');
            DOM.referenceRow.classList.remove('visible');
            DOM.hintBtn.classList.remove('hint-active');

            updateReferenceTape();
            updateUI();
        }

        function gameOver() {
            state.status = 'gameover';
            if (state.score > state.best) {
                state.best = state.score;
                localStorage.setItem('piMinimalBest', state.best);
            }

            DOM.finalStats.innerHTML = `DIGITS: ${state.index}<br>SCORE: ${state.score}`;
            DOM.gameOverScreen.classList.add('visible');
            updateUI();
        }

        function triggerErrorVisuals() {
            DOM.body.classList.add('shake', 'flash-error');
            setTimeout(() => DOM.body.classList.remove('shake', 'flash-error'), 300);
        }

        function toggleHint() {
            if (state.status !== 'playing') return;

            state.isHintMode = !state.isHintMode;

            if (state.isHintMode) {
                state.score = Math.max(0, state.score - 50);
                state.combo = 1.0;
                DOM.referenceRow.classList.add('visible');
                DOM.hintBtn.classList.add('hint-active');
                DOM.refTapeLeft.scrollLeft = DOM.tapeLeft.scrollLeft;
            } else {
                DOM.referenceRow.classList.remove('visible');
                DOM.hintBtn.classList.remove('hint-active');
            }

            updateUI();
        }

        function updateReferenceTape() {
            if (state.status !== 'playing') return;

            const currentStrChar = PI_STRING[state.index];
            DOM.refCurrentDigit.textContent = currentStrChar;
            DOM.refCurrentDigit.className = `digit ref-active-digit c${currentStrChar}`;

            DOM.refTapeRight.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                let targetIdx = state.index + i;
                if (targetIdx >= PI_STRING.length) break;

                if (targetIdx > 0 && targetIdx % 4 === 0) {
                    const spacer = document.createElement('span');
                    spacer.className = 'spacer';
                    DOM.refTapeRight.appendChild(spacer);
                }

                const d = document.createElement('span');
                const targetChar = PI_STRING[targetIdx];
                d.className = `digit c${targetChar}`;
                d.textContent = targetChar;
                DOM.refTapeRight.appendChild(d);
            }
        }

        function processInput(char) {
            initAudio();
            if (char === '') return;

            // Start or Restart from any numeric input
            if (state.status === 'start' || state.status === 'gameover') {
                if (/[0-9]/.test(char)) startGame();
                return;
            }

            if (char === 'HINT' || char === ' ') {
                toggleHint();
                return;
            }

            if (!/[0-9]/.test(char)) return;

            const now = Date.now();
            const correctChar = PI_STRING[state.index];

            if (char === correctChar) {
                // Play specific synesthesia tone
                playSound('correct', char);

                if (!state.isHintMode) {
                    const diff = now - state.lastTime;
                    if (diff < 600) state.combo = Math.min(state.combo + 0.2, 5.0);
                    else if (diff < 1200) state.combo = Math.min(state.combo + 0.1, 5.0);
                    else state.combo = 1.0;
                    state.score += Math.floor(10 * state.combo);

                    DOM.comboDisplay.classList.add('active');
                    setTimeout(() => DOM.comboDisplay.classList.remove('active'), 150);
                }

                if (state.index > 0 && state.index % 4 === 0) {
                    const sp1 = document.createElement('span');
                    sp1.className = 'spacer';
                    DOM.tapeContentUser.appendChild(sp1);

                    const sp2 = document.createElement('span');
                    sp2.className = 'spacer';
                    DOM.refTapeContent.appendChild(sp2);
                }

                const d1 = document.createElement('span');
                d1.className = `digit c${char}`;
                d1.textContent = char;
                DOM.tapeContentUser.appendChild(d1);

                const d2 = document.createElement('span');
                d2.className = `digit c${char}`;
                d2.textContent = char;
                DOM.refTapeContent.appendChild(d2);

                state.index++;
                state.lastTime = now;

                updateReferenceTape();

                DOM.tapeLeft.scrollLeft = DOM.tapeLeft.scrollWidth;
                DOM.refTapeLeft.scrollLeft = DOM.refTapeLeft.scrollWidth;

                if (state.index >= PI_STRING.length) gameOver();

            } else {
                playSound('wrong');
                triggerErrorVisuals();
                state.lives--;
                state.combo = 1.0;
                if (state.lives <= 0) gameOver();
            }
            updateUI();
        }

        function updateUI() {
            DOM.uiScore.textContent = state.score;
            DOM.uiBest.textContent = state.best;

            let livesStr = '';
            for (let i = 0; i < state.lives; i++) livesStr += '/';
            DOM.uiLives.textContent = livesStr || '-';

            if (state.isHintMode) {
                DOM.comboDisplay.textContent = 'LEARNING MODE';
                DOM.comboDisplay.classList.add('hint-mode');
            } else {
                DOM.comboDisplay.textContent = `x${state.combo.toFixed(1)}`;
                DOM.comboDisplay.classList.remove('hint-mode');
                DOM.comboDisplay.style.opacity = state.combo > 1.0 ? 1 : 0.3;
            }

            DOM.digitIndex.textContent = `#${state.index + 1}`;
        }

        DOM.keypad.addEventListener('pointerdown', (e) => {
            const keyBtn = e.target.closest('.key');
            if (!keyBtn) return;
            keyBtn.classList.add('simulated-active');
            processInput(keyBtn.getAttribute('data-val'));
        });

        DOM.keypad.addEventListener('pointerup', (e) => {
            const keyBtn = e.target.closest('.key');
            if (keyBtn) keyBtn.classList.remove('simulated-active');
        });

        DOM.keypad.addEventListener('pointerout', (e) => {
            const keyBtn = e.target.closest('.key');
            if (keyBtn) keyBtn.classList.remove('simulated-active');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') e.preventDefault();
            const keyBtn = document.querySelector(`.key[data-val="${e.key}"]`);
            if (keyBtn) {
                keyBtn.classList.add('simulated-active');
                setTimeout(() => keyBtn.classList.remove('simulated-active'), 100);
            } else if (e.key === ' ') {
                const hintBtn = document.getElementById('hint-btn');
                hintBtn.classList.add('simulated-active');
                setTimeout(() => hintBtn.classList.remove('simulated-active'), 100);
            }
            processInput(e.key);
        });

        DOM.themeToggles.forEach(btn => {
            btn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                document.documentElement.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
            });
        });

        updateUI();

    </script>
</body>

</html>
