<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gyro Labyrinth: Optimized</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        /* UI */
        #score-display {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-size: 32px;
            color: #555;
            font-weight: 400;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 1s;
        }

        #qr-container {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: white;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.6s, opacity 0.6s;
            z-index: 20;
        }

        #mobile-ui {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #btn-spawn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #111;
            border: 1px solid #333;
            color: #444;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #btn-spawn:active {
            transform: scale(0.95);
            background: #222;
            color: #fff;
            border-color: #fff;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            right: 30px;
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #444;
            box-shadow: 0 0 10px #444;
        }
    </style>

    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>

<body>

    <div id="score-display">0.00</div>
    <div id="qr-container">
        <div id="qrcode"></div>
    </div>

    <div id="mobile-ui">
        <div class="status-dot" id="conn-dot"></div>
        <button id="btn-spawn">+</button>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import * as CANNON from 'cannon-es';

        const ASSET_URL = './assets/landscape.glb';
        const BROKER_URL = 'wss://public:public@public.cloud.shiftr.io:443/mqtt';

        let scene, camera, renderer, world;
        let groundContainer, groundBody; // Container for visuals
        let balls = [];
        let client;
        let isGameActive = false;
        let audioCtx;

        const state = {
            targetRot: { x: 0, z: 0 },
            currentRot: { x: 0, z: 0 },
            score: 0
        };

        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('id') || 'game-' + Math.random().toString(36).substr(2, 9);

        if (urlParams.get('role') === 'controller') initController();
        else initHost();

        // ==========================================
        // HOST
        // ==========================================
        function initHost() {
            initThree();
            initPhysics();
            loadLevel();

            // QR
            const link = `${window.location.origin}${window.location.pathname}?role=controller&id=${channelId}`;
            new QRCode(document.getElementById("qrcode"), { text: link, width: 150, height: 150 });

            // Network
            client = mqtt.connect(BROKER_URL, { clientId: 'host-' + Math.random().toString(16) });

            client.on('connect', () => {
                client.subscribe(`game/${channelId}/#`);
            });

            client.on('message', (topic, msg) => {
                const sub = topic.split('/').pop();
                if (sub === 'gyro') {
                    const data = JSON.parse(msg.toString());
                    if (!isGameActive) startGameTransition();

                    const limit = 25;
                    state.targetRot.x = THREE.MathUtils.degToRad(Math.max(-limit, Math.min(limit, data.b)));
                    state.targetRot.z = THREE.MathUtils.degToRad(Math.max(-limit, Math.min(limit, -data.g)));
                }
                else if (sub === 'spawn') {
                    if (!audioCtx) initAudio();
                    spawnBall();
                }
            });

            animate();
        }

        function startGameTransition() {
            if (isGameActive) return;
            isGameActive = true;
            initAudio();

            document.getElementById('qr-container').style.transform = 'scale(0.8) translateY(100px)';
            document.getElementById('qr-container').style.opacity = '0';
            document.getElementById('score-display').style.opacity = '1';

            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(0, 15, 20);
            const startRot = camera.quaternion.clone();

            const dummy = new THREE.PerspectiveCamera();
            dummy.position.copy(endPos);
            dummy.lookAt(0, 0, 0);
            const endRot = dummy.quaternion;

            let t = 0;
            const swoop = () => {
                t += 0.02;
                if (t >= 1) {
                    camera.position.copy(endPos);
                    camera.quaternion.copy(endRot);
                    return;
                }
                const ease = 1 - Math.pow(1 - t, 3);
                camera.position.lerpVectors(startPos, endPos, ease);
                camera.quaternion.slerpQuaternions(startRot, endRot, ease);
                requestAnimationFrame(swoop);
            };
            swoop();

            playSound('start');
        }

        function loadLevel() {
            const loader = new GLTFLoader();
            loader.load(ASSET_URL, (gltf) => {
                groundContainer = gltf.scene;

                // 1. Calculate Center of the entire scene (Ground + Trees)
                const box = new THREE.Box3().setFromObject(groundContainer);
                const center = box.getCenter(new THREE.Vector3());

                // 2. Center visual offset
                // We move the scene object itself, we DO NOT modify child geometry
                // This keeps tree positions valid relative to the ground.
                groundContainer.position.sub(center);

                scene.add(groundContainer);

                // 3. Generate Physics from visual children
                // We need to apply the SAME offset (-center) to the physics shapes
                groundContainer.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        // Heuristic: Is this the terrain or a prop?
                        // If it's huge, it's terrain -> Trimesh
                        // If it's small, it's a tree -> Box

                        // Get dimensions
                        child.geometry.computeBoundingBox();
                        const b = child.geometry.boundingBox;
                        const size = new THREE.Vector3();
                        b.getSize(size);

                        // Calculate world position relative to our centered container
                        // Since child is in container, its local position is correct relative to the container center
                        // BUT, we need to account for any nested transforms.
                        // For a flat GLB, child.position is enough.

                        // The offset for the physics shape is the child's position
                        const offset = new CANNON.Vec3(child.position.x, child.position.y, child.position.z);

                        // Logic: If area > 100, likely ground.
                        if (size.x * size.z > 100) {
                            // GROUND: High Quality Trimesh
                            createTrimeshShape(child, offset);
                            // Visual tweak
                            if (child.material) {
                                child.material.roughness = 0.8;
                                child.material.metalness = 0.2;
                            }
                        } else {
                            // TREE/PROP: Low Quality Box (Optimization)
                            createBoxShape(child, size, offset);
                        }
                    }
                });
            });
        }

        // ==========================================
        // PHYSICS
        // ==========================================
        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -20, 0);
            world.solver.iterations = 10;

            const groundMat = new CANNON.Material();
            const ballMat = new CANNON.Material();

            const contactMat = new CANNON.ContactMaterial(groundMat, ballMat, {
                friction: 0.1,
                restitution: 0.7,   // Nice bounce
            });
            world.addContactMaterial(contactMat);

            // The Kinematic Body that holds all shapes
            groundBody = new CANNON.Body({
                mass: 0,
                type: CANNON.Body.KINEMATIC,
                material: groundMat,
                position: new CANNON.Vec3(0, 0, 0)
            });
            world.addBody(groundBody);
        }

        // High Quality Collider (Ground)
        function createTrimeshShape(mesh, offset) {
            const geometry = mesh.geometry;
            const vertices = [];
            const indices = [];

            const pos = geometry.attributes.position.array;
            for (let i = 0; i < pos.length; i += 3) {
                // Apply Scale if exists
                vertices.push(pos[i] * mesh.scale.x, pos[i + 1] * mesh.scale.y, pos[i + 2] * mesh.scale.z);
            }

            if (geometry.index) {
                for (let i = 0; i < geometry.index.array.length; i++) indices.push(geometry.index.array[i]);
            } else {
                for (let i = 0; i < vertices.length / 3; i++) indices.push(i);
            }

            const shape = new CANNON.Trimesh(vertices, indices);
            groundBody.addShape(shape, offset);
        }

        // Low Quality Collider (Trees)
        function createBoxShape(mesh, size, offset) {
            // Cannon Box takes half-extents
            const halfExtents = new CANNON.Vec3(
                (size.x * mesh.scale.x) / 2,
                (size.y * mesh.scale.y) / 2,
                (size.z * mesh.scale.z) / 2
            );
            const shape = new CANNON.Box(halfExtents);

            // Adjust offset: GLTFs usually pivot at bottom, Box pivots at center
            // We need to move the box UP by half height
            const adjustedOffset = new CANNON.Vec3(
                offset.x,
                offset.y + halfExtents.y,
                offset.z
            );

            groundBody.addShape(shape, adjustedOffset);
        }

        function spawnBall() {
            if (!world) return;
            const radius = 0.5;

            // Visual
            const geo = new THREE.SphereGeometry(radius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff, roughness: 0.1, metalness: 0.2
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            scene.add(mesh);

            // Physical
            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({
                mass: 5,
                shape: shape,
                position: new CANNON.Vec3(0, 15, 0),
                linearDamping: 0.1,
                angularDamping: 0.1
            });
            world.addBody(body);

            playSound('spawn');
            balls.push({ mesh, body, active: true, startTime: Date.now() });
        }

        // ==========================================
        // RENDER & AUDIO
        // ==========================================
        function initAudio() {
            if (audioCtx) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            } catch (e) { }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const t = audioCtx.currentTime;
            if (type === 'spawn') {
                osc.frequency.setValueAtTime(600, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else {
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.linearRampToValueAtTime(400, t + 0.5);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
            }
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 20, 80);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 50, 0.1);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 30, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            scene.add(dirLight);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            state.currentRot.x += (state.targetRot.x - state.currentRot.x) * 0.1;
            state.currentRot.z += (state.targetRot.z - state.currentRot.z) * 0.1;

            if (groundBody) {
                groundBody.quaternion.setFromEuler(state.currentRot.x, 0, state.currentRot.z, 'XYZ');
            }
            if (groundContainer) {
                groundContainer.quaternion.copy(groundBody.quaternion);
                // Position is handled by the container offset, no need to sync pos
            }

            if (world) {
                world.step(1 / 60);

                let maxTime = 0;
                const now = Date.now();

                balls.forEach(b => {
                    if (!b.active) return;

                    b.mesh.position.copy(b.body.position);
                    b.mesh.quaternion.copy(b.body.quaternion);

                    if (b.body.position.y < -30) {
                        b.active = false;
                        scene.remove(b.mesh);
                        world.removeBody(b.body);
                    } else {
                        const time = (now - b.startTime) / 1000;
                        if (time > maxTime) maxTime = time;
                    }
                });

                if (isGameActive && maxTime > 0) {
                    document.getElementById('score-display').innerText = maxTime.toFixed(2);
                }
            }
            renderer.render(scene, camera);
        }

        // ==========================================
        // CONTROLLER
        // ==========================================
        function initController() {
            document.getElementById('mobile-ui').style.display = 'flex';
            const btn = document.getElementById('btn-spawn');
            const dot = document.getElementById('conn-dot');

            client = mqtt.connect(BROKER_URL, { clientId: 'ctrl-' + Math.random().toString(16) });

            client.on('connect', () => {
                dot.classList.add('connected');
                let lastTime = 0;
                window.addEventListener('deviceorientation', (e) => {
                    if (Date.now() - lastTime > 30) {
                        if (e.beta === null) return;
                        client.publish(`game/${channelId}/gyro`, JSON.stringify({
                            b: Math.round(e.beta),
                            g: Math.round(e.gamma)
                        }));
                        lastTime = Date.now();
                    }
                });
            });

            btn.addEventListener('click', () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission();
                }
                if (client.connected) {
                    client.publish(`game/${channelId}/spawn`, '1');
                    if (window.navigator.vibrate) window.navigator.vibrate(20);
                }
            });
        }
    </script>
</body>

</html>
