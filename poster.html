<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gyro Labyrinth: Pure</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        /* --- DESKTOP UI --- */
        #score-display {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-size: 40px;
            color: #666;
            /* Subtle Grey */
            font-weight: 300;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 1s;
        }

        #qr-container {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.6s, opacity 0.6s;
            z-index: 20;
        }

        /* --- MOBILE UI --- */
        #mobile-ui {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #btn-spawn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #111;
            border: 1px solid #333;
            color: #444;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #btn-spawn:active {
            transform: scale(0.95);
            background: #222;
            color: #fff;
            border-color: #fff;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            right: 30px;
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #444;
            box-shadow: 0 0 10px #444;
        }
    </style>

    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>

<body>

    <div id="score-display">0.00</div>
    <div id="qr-container">
        <div id="qrcode"></div>
    </div>

    <div id="mobile-ui">
        <div class="status-dot" id="conn-dot"></div>
        <button id="btn-spawn">+</button>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import * as CANNON from 'cannon-es';

        // --- CONFIG ---
        const ASSET_URL = './assets/landscape.glb';
        const BROKER_URL = 'wss://public:public@public.cloud.shiftr.io:443/mqtt';

        // --- GLOBALS ---
        let scene, camera, renderer, world;
        let groundMesh, groundBody;
        let balls = [];
        let client;
        let isGameActive = false;
        let audioCtx;

        // State
        const state = {
            targetRot: { x: 0, z: 0 },
            currentRot: { x: 0, z: 0 },
            score: 0
        };

        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');
        const channelId = urlParams.get('id') || 'game-' + Math.random().toString(36).substr(2, 9);

        if (role === 'controller') initController();
        else initHost();

        // =================================================================
        // HOST LOGIC
        // =================================================================
        function initHost() {
            initThree();
            initPhysics();
            loadLevel();

            // QR
            const link = `${window.location.origin}${window.location.pathname}?role=controller&id=${channelId}`;
            new QRCode(document.getElementById("qrcode"), { text: link, width: 150, height: 150 });

            // Network
            client = mqtt.connect(BROKER_URL, { clientId: 'host-' + Math.random().toString(16) });

            client.on('connect', () => {
                console.log("Host Online");
                client.subscribe(`game/${channelId}/#`);
            });

            client.on('message', (topic, msg) => {
                const sub = topic.split('/').pop();
                if (sub === 'gyro') {
                    const data = JSON.parse(msg.toString());
                    if (!isGameActive) startGameTransition();

                    const limit = 25;
                    state.targetRot.x = THREE.MathUtils.degToRad(Math.max(-limit, Math.min(limit, data.b)));
                    state.targetRot.z = THREE.MathUtils.degToRad(Math.max(-limit, Math.min(limit, -data.g)));
                }
                else if (sub === 'spawn') {
                    if (!audioCtx) initAudio();
                    spawnBall();
                }
            });

            animate();
        }

        function startGameTransition() {
            if (isGameActive) return;
            isGameActive = true;
            initAudio();

            document.getElementById('qr-container').style.transform = 'scale(0.8) translateY(100px)';
            document.getElementById('qr-container').style.opacity = '0';
            document.getElementById('score-display').style.opacity = '1';

            // Camera Move
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(0, 15, 20);
            const startRot = camera.quaternion.clone();

            const dummy = new THREE.PerspectiveCamera();
            dummy.position.copy(endPos);
            dummy.lookAt(0, 0, 0);
            const endRot = dummy.quaternion;

            let t = 0;
            const swoop = () => {
                t += 0.02;
                if (t >= 1) {
                    camera.position.copy(endPos);
                    camera.quaternion.copy(endRot);
                    return;
                }
                const ease = 1 - Math.pow(1 - t, 3);
                camera.position.lerpVectors(startPos, endPos, ease);
                camera.quaternion.slerpQuaternions(startRot, endRot, ease);
                requestAnimationFrame(swoop);
            };
            swoop();

            playSound('start');
        }

        function loadLevel() {
            const loader = new GLTFLoader();
            loader.load(ASSET_URL, (gltf) => {
                groundMesh = gltf.scene;

                // --- FIX FOR FLOATING PHYSICS ---
                // 1. Calculate the center of the mesh
                const box = new THREE.Box3().setFromObject(groundMesh);
                const center = box.getCenter(new THREE.Vector3());

                // 2. INSTEAD of moving the mesh position, we move the GEOMETRY itself.
                // This ensures that (0,0,0) world space matches the geometry vertices exactly.
                groundMesh.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        // Apply center offset to geometry directly
                        child.geometry.translate(-center.x, -center.y, -center.z);

                        // Apply Scale to geometry directly (baking it in)
                        // This prevents Physics/Visual mismatch if scale was used
                        child.geometry.scale(child.scale.x, child.scale.y, child.scale.z);
                        child.scale.set(1, 1, 1); // Reset object scale

                        // Visuals
                        if (child.material) {
                            child.material.roughness = 0.5;
                            child.material.metalness = 0.5;
                        }

                        // Now create physics from this "baked" geometry
                        createTrimeshBody(child);
                    }
                });

                // Reset mesh position to 0 since we moved geometry
                groundMesh.position.set(0, 0, 0);
                scene.add(groundMesh);
            });
        }

        // =================================================================
        // PHYSICS
        // =================================================================
        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -20, 0);

            // Tweak solver for better contacts
            world.solver.iterations = 20;
            world.solver.tolerance = 0.001;

            const groundMat = new CANNON.Material();
            const ballMat = new CANNON.Material();

            const contactMat = new CANNON.ContactMaterial(groundMat, ballMat, {
                friction: 0.0,      // Zero friction prevents "sticking" on slopes
                restitution: 0.8,   // 0.8 = Nice clean bounce
                contactEquationStiffness: 1e8,
                contactEquationRelaxation: 3
            });
            world.addContactMaterial(contactMat);

            groundBody = new CANNON.Body({
                mass: 0,
                type: CANNON.Body.KINEMATIC,
                material: groundMat,
                position: new CANNON.Vec3(0, 0, 0)
            });
            world.addBody(groundBody);
        }

        function createTrimeshBody(mesh) {
            const geometry = mesh.geometry;
            if (!geometry.attributes.position) return;

            const vertices = [];
            const indices = [];

            const pos = geometry.attributes.position.array;
            for (let i = 0; i < pos.length; i += 3) {
                vertices.push(pos[i], pos[i + 1], pos[i + 2]);
            }

            if (geometry.index) {
                for (let i = 0; i < geometry.index.array.length; i++) indices.push(geometry.index.array[i]);
            } else {
                for (let i = 0; i < vertices.length / 3; i++) indices.push(i);
            }

            const shape = new CANNON.Trimesh(vertices, indices);
            // No offset needed because we baked position into geometry
            groundBody.addShape(shape);
        }

        function spawnBall() {
            if (!world) return;

            const radius = 0.5;

            // Visual
            const geo = new THREE.SphereGeometry(radius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff, roughness: 0.1, metalness: 0.2
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            scene.add(mesh);

            // Physical
            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({
                mass: 5, // Heavy enough to fall well
                shape: shape,
                position: new CANNON.Vec3(0, 15, 0),
                linearDamping: 0.1,
                angularDamping: 0.1
            });
            world.addBody(body);

            playSound('spawn');
            balls.push({ mesh, body, active: true, startTime: Date.now() });
        }

        // =================================================================
        // AUDIO & RENDER
        // =================================================================
        function initAudio() {
            if (audioCtx) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            } catch (e) { }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'spawn') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'start') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(440, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 20, 80);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 50, 0.1);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 30, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            scene.add(dirLight);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate Physics World
            state.currentRot.x += (state.targetRot.x - state.currentRot.x) * 0.1;
            state.currentRot.z += (state.targetRot.z - state.currentRot.z) * 0.1;

            if (groundBody) {
                groundBody.quaternion.setFromEuler(state.currentRot.x, 0, state.currentRot.z, 'XYZ');
            }
            // No need to sync mesh position because it's at (0,0,0) with baked geometry
            // Just sync rotation
            if (groundMesh) {
                groundMesh.quaternion.copy(groundBody.quaternion);
            }

            if (world) {
                world.step(1 / 60);

                let maxTime = 0;
                const now = Date.now();

                balls.forEach(b => {
                    if (!b.active) return;

                    b.mesh.position.copy(b.body.position);
                    b.mesh.quaternion.copy(b.body.quaternion);

                    if (b.body.position.y < -30) {
                        b.active = false;
                        scene.remove(b.mesh);
                        world.removeBody(b.body);
                    } else {
                        const time = (now - b.startTime) / 1000;
                        if (time > maxTime) maxTime = time;
                    }
                });

                if (isGameActive && maxTime > 0) {
                    document.getElementById('score-display').innerText = maxTime.toFixed(2);
                }
            }

            renderer.render(scene, camera);
        }

        // =================================================================
        // CONTROLLER
        // =================================================================
        function initController() {
            document.getElementById('mobile-ui').style.display = 'flex';
            const btn = document.getElementById('btn-spawn');
            const dot = document.getElementById('conn-dot');

            client = mqtt.connect(BROKER_URL, { clientId: 'ctrl-' + Math.random().toString(16) });

            client.on('connect', () => {
                dot.classList.add('connected');

                let lastTime = 0;
                window.addEventListener('deviceorientation', (e) => {
                    if (Date.now() - lastTime > 30) {
                        if (e.beta === null) return;
                        client.publish(`game/${channelId}/gyro`, JSON.stringify({
                            b: Math.round(e.beta),
                            g: Math.round(e.gamma)
                        }));
                        lastTime = Date.now();
                    }
                });
            });

            btn.addEventListener('click', () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission();
                }

                if (client.connected) {
                    client.publish(`game/${channelId}/spawn`, '1');
                    if (window.navigator.vibrate) window.navigator.vibrate(20);
                }
            });
        }
    </script>
</body>

</html>
