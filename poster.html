<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Landscape Balancer (MQTT)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: sans-serif;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: none;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.9);
        }

        #qrcode {
            margin: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        h1,
        p {
            margin: 10px;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: monospace;
            opacity: 0.6;
            color: #aaa;
        }
    </style>

    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="host-ui" class="overlay interactive" style="display: none;">
        <h1>Desktop Viewer</h1>
        <div id="qrcode"></div>
        <p>Scan to Connect</p>
        <div id="status">Connecting to Cloud...</div>
    </div>

    <div id="controller-ui" class="overlay interactive" style="display: none;">
        <h1>Mobile Controller</h1>
        <p>Tap to Start</p>
        <button id="btn-connect">Connect Gyro</button>
        <div id="status-mobile" style="margin-top:20px; font-family:monospace; color:#888;"></div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuration ---
        const ASSET_URL = './assets/landscape.glb';
        // We use a public, free WebSocket MQTT broker (HiveMQ)
        const BROKER_URL = 'wss://broker.hivemq.com:8000/mqtt';

        // --- State ---
        let scene, camera, renderer, model, client;
        let targetRotation = { x: 0, z: 0 };
        let currentRotation = { x: 0, z: 0 };

        // --- App Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');

        // Generate a random channel ID if one doesn't exist
        let channelId = urlParams.get('id');
        if (!channelId && role !== 'controller') {
            channelId = 'land-' + Math.random().toString(36).substr(2, 9);
        }

        if (role === 'controller') {
            initController();
        } else {
            initHost();
        }

        // ==========================================
        // HOST LOGIC (Desktop)
        // ==========================================
        function initHost() {
            document.getElementById('host-ui').style.display = 'flex';
            document.getElementById('canvas-container').style.display = 'block';

            initThree();

            // 1. Connect to MQTT Broker
            console.log("Connecting to MQTT...");
            client = mqtt.connect(BROKER_URL);

            client.on('connect', () => {
                console.log("MQTT Connected");
                const topic = `gyro-sync/${channelId}`;

                // Subscribe to the specific channel
                client.subscribe(topic);

                // Generate QR
                const link = `${window.location.origin}${window.location.pathname}?role=controller&id=${channelId}`;
                new QRCode(document.getElementById("qrcode"), { text: link, width: 200, height: 200 });
                document.getElementById('status').innerText = "Cloud Ready. Waiting for data...";
            });

            client.on('message', (topic, message) => {
                // We received data!
                document.getElementById('host-ui').style.display = 'none'; // Hide UI

                try {
                    const data = JSON.parse(message.toString());

                    // Limit angles
                    const limit = 45;
                    const rx = Math.max(-limit, Math.min(limit, data.b)); // Beta
                    const rz = Math.max(-limit, Math.min(limit, data.g)); // Gamma

                    targetRotation.x = THREE.MathUtils.degToRad(rx);
                    targetRotation.z = THREE.MathUtils.degToRad(rz);
                } catch (e) { console.error(e); }
            });
        }

        // ==========================================
        // CONTROLLER LOGIC (Mobile)
        // ==========================================
        function initController() {
            const ui = document.getElementById('controller-ui');
            const btn = document.getElementById('btn-connect');
            const status = document.getElementById('status-mobile');
            ui.style.display = 'flex';

            btn.addEventListener('click', async () => {

                // 1. iOS Permissions
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const response = await DeviceOrientationEvent.requestPermission();
                        if (response !== 'granted') return alert('Permission denied');
                    } catch (e) { console.error(e); }
                }

                btn.innerText = "Connecting...";

                // 2. Connect to MQTT
                client = mqtt.connect(BROKER_URL);

                client.on('connect', () => {
                    btn.style.display = 'none';
                    status.innerText = "Connected! Tilt phone.";
                    ui.style.background = "#222";
                    const topic = `gyro-sync/${channelId}`;

                    // 3. Stream Data
                    let lastTime = 0;
                    window.addEventListener('deviceorientation', (event) => {
                        const now = Date.now();
                        // Throttle to ~30ms (30fps) to save bandwidth
                        if (now - lastTime > 30) {
                            if (event.beta === null) return;

                            // Send JSON payload
                            const payload = JSON.stringify({
                                b: Math.round(event.beta),  // Round to integer to save bytes
                                g: Math.round(event.gamma)
                            });

                            client.publish(topic, payload);
                            lastTime = now;
                        }
                    });
                });

                client.on('error', (err) => status.innerText = "Error: " + err);
            });
        }

        // ==========================================
        // THREE.JS SCENE
        // ==========================================
        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const loader = new GLTFLoader();
            loader.load(ASSET_URL, (gltf) => {
                model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);
                scene.add(model);
            }, undefined, (err) => {
                console.error(err);
                // Fallback Cube
                const geo = new THREE.BoxGeometry(4, 0.2, 4);
                const mat = new THREE.MeshStandardMaterial({ color: 0x44aa88 });
                model = new THREE.Mesh(geo, mat);
                scene.add(model);
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                // Smooth interpolation
                currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
                currentRotation.z += (targetRotation.z - currentRotation.z) * 0.1;
                model.rotation.x = currentRotation.x;
                model.rotation.z = currentRotation.z;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
