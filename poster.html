<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gyro Remote Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: sans-serif;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: none;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
        }

        #qrcode {
            margin: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        h1,
        p {
            margin: 10px;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: monospace;
            opacity: 0.6;
        }
    </style>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="host-ui" class="overlay interactive" style="display: none;">
        <h1>Desktop Viewer</h1>
        <div id="qrcode"></div>
        <p>Scan to connect Mobile Controller</p>
        <div id="status">Waiting for peer...</div>
    </div>

    <div id="controller-ui" class="overlay interactive" style="display: none;">
        <h1>Mobile Controller</h1>
        <p>Tap below to enable Gyroscope</p>
        <button id="btn-connect">Start Connection</button>
        <div id="status-mobile" style="margin-top:20px; opacity: 0.7;"></div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuration ---
        const ASSET_URL = './assets/landscape.glb';

        // --- State ---
        let scene, camera, renderer, model;
        let targetRotation = { x: 0, z: 0 }; // Target rotation from gyro

        // --- App Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');
        const remoteId = urlParams.get('id');

        if (role === 'controller') {
            initController();
        } else {
            initHost();
        }

        // ==========================================
        // HOST LOGIC (Desktop / Viewer)
        // ==========================================
        function initHost() {
            document.getElementById('host-ui').style.display = 'flex';
            document.getElementById('canvas-container').style.display = 'block';

            // 1. Setup Three.js
            initThree();

            // 2. Setup PeerJS
            const peer = new Peer(); // Auto-generate ID

            peer.on('open', (id) => {
                const link = `${window.location.origin}${window.location.pathname}?role=controller&id=${id}`;
                console.log('Session ID:', id);

                // Generate QR
                new QRCode(document.getElementById("qrcode"), {
                    text: link,
                    width: 200,
                    height: 200
                });

                document.getElementById('status').innerText = "Session Ready. Waiting for mobile...";
            });

            peer.on('connection', (conn) => {
                document.getElementById('host-ui').style.display = 'none'; // Hide QR on connect
                console.log("Mobile connected!");

                conn.on('data', (data) => {
                    // Data format: { beta: x-tilt, gamma: z-tilt }
                    // Map gyro data to rotation (simple smoothing handled in render loop)
                    // Beta (front/back tilt) maps to X axis
                    // Gamma (left/right tilt) maps to Z axis (or Y depending on desire)

                    // Clamping and scaling for nicer feel
                    const limit = 45; // Max tilt in degrees
                    const rx = Math.max(-limit, Math.min(limit, data.beta));
                    const rz = Math.max(-limit, Math.min(limit, data.gamma));

                    targetRotation.x = THREE.MathUtils.degToRad(rx);
                    targetRotation.z = THREE.MathUtils.degToRad(rz);
                });
            });
        }

        // ==========================================
        // CONTROLLER LOGIC (Mobile)
        // ==========================================
        function initController() {
            const ui = document.getElementById('controller-ui');
            const btn = document.getElementById('btn-connect');
            const status = document.getElementById('status-mobile');
            ui.style.display = 'flex';

            btn.addEventListener('click', async () => {

                // 1. iOS 13+ Permission Request
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const response = await DeviceOrientationEvent.requestPermission();
                        if (response !== 'granted') {
                            alert('Permission denied. Cannot rotate.');
                            return;
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }

                btn.innerText = "Connecting...";

                // 2. Connect via PeerJS
                const peer = new Peer();

                peer.on('open', () => {
                    const conn = peer.connect(remoteId);

                    conn.on('open', () => {
                        btn.style.display = 'none';
                        status.innerText = "Connected! Tilt your phone.";
                        ui.style.background = "#222"; // Visual feedback

                        // 3. Start Streaming Gyro Data
                        window.addEventListener('deviceorientation', (event) => {
                            // Send only necessary data
                            conn.send({
                                beta: event.beta,  // Front/Back tilt [-180, 180]
                                gamma: event.gamma // Left/Right tilt [-90, 90]
                            });
                        });
                    });

                    conn.on('error', (err) => alert("Connection Error: " + err));
                });
            });
        }

        // ==========================================
        // THREE.JS SCENE (Host Only)
        // ==========================================
        function initThree() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            // Camera (Static)
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10); // Elevated view
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Load Model
            const loader = new GLTFLoader();
            loader.load(ASSET_URL, (gltf) => {
                model = gltf.scene;

                // Center the model roughly
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center); // Center at 0,0,0

                scene.add(model);
            }, undefined, (error) => {
                console.error('Error loading GLB:', error);
                // Fallback cube if model fails (for testing)
                const geo = new THREE.BoxGeometry(3, 0.2, 3);
                const mat = new THREE.MeshStandardMaterial({ color: 0x44aa88 });
                model = new THREE.Mesh(geo, mat);
                scene.add(model);
            });

            // Resize Handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (model) {
                // Smooth interpolation (Lerp) for buttery smooth movement
                // 0.1 is the speed factor. Lower = smoother/slower, Higher = snappier
                model.rotation.x += (targetRotation.x - model.rotation.x) * 0.1;
                model.rotation.z += (targetRotation.z - model.rotation.z) * 0.1;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
