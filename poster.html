<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Landscape Viewer (Corrected)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: none;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(5px);
        }

        #qrcode {
            margin: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            margin: 5px;
            text-align: center;
            color: #ccc;
            max-width: 300px;
            line-height: 1.5;
        }

        button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #00C4FF, #0074E4);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 20px rgba(0, 116, 228, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.96);
            box-shadow: 0 2px 10px rgba(0, 116, 228, 0.3);
        }

        .status-pill {
            margin-top: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .dot.green {
            background: #00FF88;
            box-shadow: 0 0 8px #00FF88;
        }

        .dot.red {
            background: #FF4444;
        }

        .dot.yellow {
            background: #FFAA00;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }
    </style>

    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="host-ui" class="overlay interactive" style="display: none;">
        <h1>Desktop Viewer</h1>
        <div id="qrcode"></div>
        <p>Scan with your phone to connect</p>
        <div class="status-pill">
            <div id="host-dot" class="dot yellow"></div>
            <span id="host-status">Connecting to Cloud (443)...</span>
        </div>
    </div>

    <div id="controller-ui" class="overlay interactive" style="display: none;">
        <h1>Mobile Controller</h1>
        <p>Ensure your screen orientation is unlocked</p>
        <button id="btn-connect">Start Connection</button>
        <div class="status-pill">
            <div id="ctrl-dot" class="dot"></div>
            <span id="ctrl-status">Ready to connect</span>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const ASSET_URL = './assets/landscape.glb';

        // --- NETWORK STRATEGY: SHIFTR.IO (Port 443) ---
        const BROKER_HOST = 'public.cloud.shiftr.io';
        const BROKER_URL = `wss://public:public@public.cloud.shiftr.io:443/mqtt`;

        // --- State ---
        let scene, camera, renderer, model, controls, client;
        let targetRotation = { x: 0, z: 0 };
        let currentRotation = { x: 0, z: 0 };

        // --- App Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');

        // Unique Channel ID
        let channelId = urlParams.get('id');
        if (!channelId && role !== 'controller') {
            channelId = 'view-' + Math.random().toString(36).substr(2, 9);
        }

        if (role === 'controller') {
            initController();
        } else {
            initHost();
        }

        // ==========================================
        // HOST LOGIC (Desktop)
        // ==========================================
        function initHost() {
            document.getElementById('host-ui').style.display = 'flex';
            document.getElementById('canvas-container').style.display = 'block';

            const statusText = document.getElementById('host-status');
            const statusDot = document.getElementById('host-dot');

            initThree();

            // Connect to Shiftr
            console.log("Connecting to:", BROKER_HOST);

            const clientId = 'host-' + Math.random().toString(16).substr(2, 8);

            client = mqtt.connect(BROKER_URL, {
                clientId: clientId,
                clean: true,
                keepalive: 60
            });

            client.on('connect', () => {
                console.log("Secure Connection Established");
                statusText.innerText = "Online. Waiting for mobile...";
                statusDot.className = "dot green";

                const topic = `gyro-room/${channelId}`;
                client.subscribe(topic);

                // Generate QR Code
                const link = `${window.location.origin}${window.location.pathname}?role=controller&id=${channelId}`;
                document.getElementById("qrcode").innerHTML = "";
                new QRCode(document.getElementById("qrcode"), { text: link, width: 220, height: 220 });
            });

            client.on('message', (topic, message) => {
                // Fade out UI
                const ui = document.getElementById('host-ui');
                if (ui.style.display !== 'none') {
                    ui.style.opacity = '0';
                    setTimeout(() => ui.style.display = 'none', 500);
                }

                try {
                    const data = JSON.parse(message.toString());
                    const limit = 45;

                    // --- MAPPING LOGIC ---
                    // Beta (Front/Back) -> X Axis
                    // Gamma (Left/Right) -> Z Axis (INVERTED HERE with -data.g)
                    const rx = Math.max(-limit, Math.min(limit, data.b));
                    const rz = Math.max(-limit, Math.min(limit, -data.g)); // <--- FIXED HERE

                    targetRotation.x = THREE.MathUtils.degToRad(rx);
                    targetRotation.z = THREE.MathUtils.degToRad(rz);
                } catch (e) { }
            });

            client.on('error', (err) => {
                console.error(err);
                statusText.innerText = "Firewall Error: " + err.message;
                statusDot.className = "dot red";
            });

            client.on('offline', () => {
                statusText.innerText = "Connection lost. Reconnecting...";
                statusDot.className = "dot yellow";
            });
        }

        // ==========================================
        // CONTROLLER LOGIC (Mobile)
        // ==========================================
        function initController() {
            const ui = document.getElementById('controller-ui');
            const btn = document.getElementById('btn-connect');
            const statusText = document.getElementById('ctrl-status');
            const statusDot = document.getElementById('ctrl-dot');
            ui.style.display = 'flex';

            btn.addEventListener('click', async () => {

                // 1. iOS Permission
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const response = await DeviceOrientationEvent.requestPermission();
                        if (response !== 'granted') return alert('Gyroscope permission needed!');
                    } catch (e) { console.error(e); }
                }

                btn.innerText = "Connecting...";
                btn.disabled = true;
                statusDot.className = "dot yellow";

                // 2. Connect
                const clientId = 'ctrl-' + Math.random().toString(16).substr(2, 8);

                client = mqtt.connect(BROKER_URL, {
                    clientId: clientId,
                    clean: true,
                    keepalive: 60
                });

                client.on('connect', () => {
                    btn.style.display = 'none';
                    statusText.innerText = "Connected & Streaming";
                    statusDot.className = "dot green";
                    ui.style.background = "rgba(0,0,0,0.95)";

                    const topic = `gyro-room/${channelId}`;
                    let lastTime = 0;

                    // 3. Stream Data
                    window.addEventListener('deviceorientation', (event) => {
                        const now = Date.now();
                        if (now - lastTime > 40) {
                            if (event.beta === null) return;

                            const payload = JSON.stringify({
                                b: Math.round(event.beta),
                                g: Math.round(event.gamma)
                            });
                            client.publish(topic, payload);
                            lastTime = now;
                        }
                    });
                });

                client.on('error', (err) => {
                    statusText.innerText = "Error: " + err.message;
                    statusDot.className = "dot red";
                    btn.disabled = false;
                    btn.innerText = "Retry";
                });
            });
        }

        // ==========================================
        // THREE.JS (Standard)
        // ==========================================
        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 10, 50);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 16);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            if (!role) {
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.enablePan = false;
                controls.maxPolarAngle = Math.PI / 2 - 0.1;
            }

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(5, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const loader = new GLTFLoader();
            loader.load(ASSET_URL, (gltf) => {
                model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);

                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                scene.add(model);
            }, undefined, (e) => {
                console.error(e);
                const geo = new THREE.BoxGeometry(5, 0.2, 5);
                const mat = new THREE.MeshStandardMaterial({ color: 0x0074E4, roughness: 0.2 });
                model = new THREE.Mesh(geo, mat);
                scene.add(model);
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();

            if (model) {
                // Smooth Lerp
                currentRotation.x += (targetRotation.x - currentRotation.x) * 0.08;
                currentRotation.z += (targetRotation.z - currentRotation.z) * 0.08;

                model.rotation.x = currentRotation.x;
                model.rotation.z = currentRotation.z;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
