<body>
    <div id="loading">INITIALIZING ORGANISM...</div>

    <script type="module">
        import * as THREE from 'three';
        import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
        import GUI from 'lil-gui';

        // --- Simulation Parameters ---
        const params = {
            sensorAngle: 0.45,
            sensorDist: 15.0,
            rotationAngle: 0.55,
            stepSize: 1.5,
            decay: 0.95,
            caWeight: 0.35, // Added Game of Life influence

            // Glossy Metaball Settings
            threshold: 0.15,
            edgeSoftness: 0.05,
            bumpiness: 30.0,
            glossiness: 64.0,
            lightX: 0.5,
            lightY: 0.5,
            lightZ: 0.8,

            colorDark: '#4d0d80',
            colorMid: '#00ccff',
            colorHigh: '#ffffff',
            reset: () => initAgents()
        };

        // --- Configuration ---
        // 512x512 = 262,144 agents. Keep this stable for performance.
        const DATA_WIDTH = 512;
        const AGENT_COUNT = DATA_WIDTH * DATA_WIDTH;

        // Internal resolution for the trail texture. 
        // Fixed internal resolution ensures consistent behavior regardless of window size.
        const SIM_WIDTH = 1920;
        const SIM_HEIGHT = 1080;

        // --- Core Setup ---
        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.autoClear = false;

        const orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const fullscreenQuad = new THREE.PlaneGeometry(2, 2);

        // --- Render Targets (Ping-Pong for Trails) ---
        const rtOptions = {
            minFilter: THREE.LinearFilter,
            magFilter: THREE.LinearFilter,
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
            depthBuffer: false
        };
        let trailRT1 = new THREE.WebGLRenderTarget(SIM_WIDTH, SIM_HEIGHT, rtOptions);
        let trailRT2 = new THREE.WebGLRenderTarget(SIM_WIDTH, SIM_HEIGHT, rtOptions);

        // --- 1. GPGPU Setup (Agent Movement) ---
        const gpuCompute = new GPUComputationRenderer(DATA_WIDTH, DATA_WIDTH, renderer);
        const dtPosition = gpuCompute.createTexture();

        let positionVariable; // Declare here to avoid Temporal Dead Zone ReferenceError

        function initAgents() {
            const data = dtPosition.image.data;
            for (let i = 0; i < data.length; i += 4) {
                // Initialize in a dense central circle
                const radius = Math.random() * (SIM_HEIGHT * 0.25);
                const theta = Math.random() * Math.PI * 2;
                data[i] = (SIM_WIDTH / 2) + Math.cos(theta) * radius; // x
                data[i + 1] = (SIM_HEIGHT / 2) + Math.sin(theta) * radius; // y
                data[i + 2] = Math.random() * Math.PI * 2; // Random outward angle
                data[i + 3] = 1.0;
            }
            if (positionVariable) {
                gpuCompute.renderTexture(dtPosition, positionVariable.renderTargets[0]);
                gpuCompute.renderTexture(dtPosition, positionVariable.renderTargets[1]);
            }
        }
        initAgents();

        const agentShader = `
            uniform sampler2D trailMap;
            uniform vec2 uResolution;
            uniform float time;

            // Interactive Uniforms
            uniform float uSensorAngle;
            uniform float uSensorDist;
            uniform float uRotationAngle;
            uniform float uStepSize;

            // Pseudo-random hash
            float hash(vec2 p) {
                vec3 p3  = fract(vec3(p.xyx) * .1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            // Read the trail texture at a specific offset/angle
            float sense(vec2 pos, float angle) {
                vec2 dir = vec2(cos(angle), sin(angle));
                vec2 samplePos = pos + dir * uSensorDist;
                // Wrap around screen bounds smoothly
                samplePos = mod(samplePos, uResolution);
                return texture2D(trailMap, samplePos / uResolution).r;
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / vec2(${DATA_WIDTH.toFixed(1)});
                vec4 data = texture2D(texturePosition, uv);
                vec2 pos = data.xy;
                float angle = data.z;

                float weightForward = sense(pos, angle);
                float weightLeft    = sense(pos, angle + uSensorAngle);
                float weightRight   = sense(pos, angle - uSensorAngle);

                float randomSteer = hash(pos + time);

                // Physarum sensory logic
                if (weightForward > weightLeft && weightForward > weightRight) {
                    // Stay the course
                } else if (weightForward < weightLeft && weightForward < weightRight) {
                    angle += (randomSteer > 0.5 ? uRotationAngle : -uRotationAngle);
                } else if (weightLeft > weightRight) {
                    angle += uRotationAngle;
                } else if (weightRight > weightLeft) {
                    angle -= uRotationAngle;
                }

                // Move forward
                pos += vec2(cos(angle), sin(angle)) * uStepSize;
                
                // Wrap around screen edges
                pos = mod(pos, uResolution);

                gl_FragColor = vec4(pos, angle, 1.0);
            }
        `;

        positionVariable = gpuCompute.addVariable('texturePosition', agentShader, dtPosition);
        gpuCompute.setVariableDependencies(positionVariable, [positionVariable]);

        positionVariable.material.uniforms['trailMap'] = { value: null };
        positionVariable.material.uniforms['uResolution'] = { value: new THREE.Vector2(SIM_WIDTH, SIM_HEIGHT) };
        positionVariable.material.uniforms['time'] = { value: 0.0 };
        positionVariable.material.uniforms['uSensorAngle'] = { value: params.sensorAngle };
        positionVariable.material.uniforms['uSensorDist'] = { value: params.sensorDist };
        positionVariable.material.uniforms['uRotationAngle'] = { value: params.rotationAngle };
        positionVariable.material.uniforms['uStepSize'] = { value: params.stepSize };

        const error = gpuCompute.init();
        if (error !== null) console.error(error);

        // --- 2. Trail Diffusion & Decay Pass ---
        const diffuseScene = new THREE.Scene();
        const diffuseMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tDiffuse: { value: null },
                res: { value: new THREE.Vector2(SIM_WIDTH, SIM_HEIGHT) },
                uDecay: { value: params.decay },
                uCaWeight: { value: params.caWeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform vec2 res;
                uniform float uDecay;
                uniform float uCaWeight;
                varying vec2 vUv;

                void main() {
                    vec2 texel = 1.0 / res;
                    float center = texture2D(tDiffuse, vUv).r;
                    float sum = 0.0;
                    
                    // Moore Neighborhood (8 surrounding cells)
                    sum += texture2D(tDiffuse, vUv + vec2(-1.0, -1.0) * texel).r;
                    sum += texture2D(tDiffuse, vUv + vec2( 0.0, -1.0) * texel).r;
                    sum += texture2D(tDiffuse, vUv + vec2( 1.0, -1.0) * texel).r;
                    sum += texture2D(tDiffuse, vUv + vec2(-1.0,  0.0) * texel).r;
                    sum += texture2D(tDiffuse, vUv + vec2( 1.0,  0.0) * texel).r;
                    sum += texture2D(tDiffuse, vUv + vec2(-1.0,  1.0) * texel).r;
                    sum += texture2D(tDiffuse, vUv + vec2( 0.0,  1.0) * texel).r;
                    sum += texture2D(tDiffuse, vUv + vec2( 1.0,  1.0) * texel).r;

                    // Standard Physarum Blur
                    float blurred = (sum + center) / 9.0;
                    
                    // --- CONTINUOUS GAME OF LIFE (4-State Organic CA) ---
                    // Optimal birth if sum is near 3.0 (Gaussian peak)
                    float birth = exp(-pow(sum - 3.0, 2.0) / 0.8); 
                    
                    // Optimal survival if sum is near 2.5 (Spans roughly 2.0 to 3.0)
                    float survive = exp(-pow(sum - 2.5, 2.0) / 1.5);
                    
                    // State transitions: Dead -> Birthing -> Stable -> Overpop/Decay
                    float caState = center + (birth * 0.6) - ((1.0 - survive) * 0.15);
                    caState = clamp(caState, 0.0, 1.0);

                    // Blend classic Physarum decay with Game of Life sustainability
                    float finalState = mix(blurred * uDecay, caState, uCaWeight);
                    
                    gl_FragColor = vec4(vec3(finalState), 1.0);
                }
            `
        });
        const diffuseMesh = new THREE.Mesh(fullscreenQuad, diffuseMaterial);
        diffuseScene.add(diffuseMesh);

        // --- 3. Agent Deposition Pass ---
        const agentScene = new THREE.Scene();
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(AGENT_COUNT * 3);
        const dataUVs = new Float32Array(AGENT_COUNT * 2);

        for (let i = 0; i < AGENT_COUNT; i++) {
            dataUVs[i * 2] = (i % DATA_WIDTH) / DATA_WIDTH;
            dataUVs[i * 2 + 1] = Math.floor(i / DATA_WIDTH) / DATA_WIDTH;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('dataUV', new THREE.BufferAttribute(dataUVs, 2));

        const agentMat = new THREE.ShaderMaterial({
            uniforms: {
                tPosition: { value: null },
                res: { value: new THREE.Vector2(SIM_WIDTH, SIM_HEIGHT) }
            },
            vertexShader: `
                uniform sampler2D tPosition;
                uniform vec2 res;
                attribute vec2 dataUV;

                void main() {
                    vec4 data = texture2D(tPosition, dataUV);
                    vec2 pos = data.xy;
                    
                    // Map from simulation coords to NDC (-1 to 1)
                    vec2 ndc = (pos / res) * 2.0 - 1.0;
                    gl_Position = vec4(ndc, 0.0, 1.0);
                    gl_PointSize = 1.0;
                }
            `,
            fragmentShader: `
                void main() {
                    // Agent deposits pheromone
                    gl_FragColor = vec4(0.15, 0.15, 0.15, 1.0); 
                }
            `,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            depthWrite: false,
            transparent: true
        });

        const agentPoints = new THREE.Points(geometry, agentMat);
        agentScene.add(agentPoints);

        // --- 4. Final Display Pass (Glossy Metaball Rendering) ---
        const displayScene = new THREE.Scene();
        const displayMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tMap: { value: null },
                res: { value: new THREE.Vector2(SIM_WIDTH, SIM_HEIGHT) },
                uColorDark: { value: new THREE.Color(params.colorDark) },
                uColorMid: { value: new THREE.Color(params.colorMid) },
                uColorHigh: { value: new THREE.Color(params.colorHigh) },
                uThreshold: { value: params.threshold },
                uEdgeSoftness: { value: params.edgeSoftness },
                uBumpiness: { value: params.bumpiness },
                uGlossiness: { value: params.glossiness },
                uLightDir: { value: new THREE.Vector3(params.lightX, params.lightY, params.lightZ).normalize() }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
            `,
            fragmentShader: `
                uniform sampler2D tMap;
                uniform vec2 res;
                uniform vec3 uColorDark;
                uniform vec3 uColorMid;
                uniform vec3 uColorHigh;
                
                uniform float uThreshold;
                uniform float uEdgeSoftness;
                uniform float uBumpiness;
                uniform float uGlossiness;
                uniform vec3 uLightDir;

                varying vec2 vUv;

                void main() {
                    vec2 texel = 1.0 / res;

                    // Sample center height and surrounding heights for normals
                    float h = texture2D(tMap, vUv).r;
                    
                    // Metaball Mask: Cuts off low densities to create sharp blob boundaries
                    float mask = smoothstep(uThreshold - uEdgeSoftness, uThreshold + uEdgeSoftness, h);
                    
                    // Quick exit for empty background to save performance
                    if (mask <= 0.001) {
                        gl_FragColor = vec4(vec3(0.02, 0.02, 0.04), 1.0); // Background color
                        return;
                    }

                    float hL = texture2D(tMap, vUv + vec2(-texel.x, 0.0)).r;
                    float hR = texture2D(tMap, vUv + vec2(texel.x, 0.0)).r;
                    float hD = texture2D(tMap, vUv + vec2(0.0, -texel.y)).r;
                    float hU = texture2D(tMap, vUv + vec2(0.0, texel.y)).r;

                    // Calculate 3D Normal from height gradients
                    vec3 normal = normalize(vec3(
                        (hL - hR) * uBumpiness,
                        (hD - hU) * uBumpiness,
                        1.0
                    ));

                    // --- Lighting (Blinn-Phong) ---
                    vec3 viewDir = vec3(0.0, 0.0, 1.0);
                    vec3 halfVector = normalize(uLightDir + viewDir);

                    // Diffuse lighting (shadows and depth)
                    float diffuse = max(dot(normal, uLightDir), 0.0);
                    
                    // Specular highlight (the wet/glossy sheen)
                    float specular = pow(max(dot(normal, halfVector), 0.0), uGlossiness);

                    // Base color mapping based on height "thickness"
                    float mappedH = clamp((h - uThreshold) / (1.0 - uThreshold), 0.0, 1.0);
                    vec3 baseColor = mix(uColorDark, uColorMid, smoothstep(0.0, 0.4, mappedH));
                    baseColor = mix(baseColor, uColorHigh, smoothstep(0.4, 1.0, mappedH));

                    // Combine Lighting and Color
                    // Ambient (0.2) + Diffuse (0.8) + Specular
                    vec3 finalColor = baseColor * (0.2 + diffuse * 0.8) + vec3(1.0) * specular;
                    
                    // Blend edges over the background
                    vec3 colBackground = vec3(0.02, 0.02, 0.04);
                    finalColor = mix(colBackground, finalColor, mask);

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });
        const displayMesh = new THREE.Mesh(fullscreenQuad, displayMaterial);
        displayScene.add(displayMesh);

        // --- GUI Setup ---
        const gui = new GUI({ title: 'Physarum DNA' });

        const simFolder = gui.addFolder('Simulation Rules');
        simFolder.add(params, 'sensorAngle', 0.1, 1.0).name('Sensor Angle').onChange(v => positionVariable.material.uniforms.uSensorAngle.value = v);
        simFolder.add(params, 'sensorDist', 1.0, 50.0).name('Sensor Distance').onChange(v => positionVariable.material.uniforms.uSensorDist.value = v);
        simFolder.add(params, 'rotationAngle', 0.1, 2.0).name('Rotation Angle').onChange(v => positionVariable.material.uniforms.uRotationAngle.value = v);
        simFolder.add(params, 'stepSize', 0.1, 5.0).name('Agent Speed').onChange(v => positionVariable.material.uniforms.uStepSize.value = v);
        simFolder.add(params, 'decay', 0.8, 0.999).name('Trail Decay').onChange(v => diffuseMaterial.uniforms.uDecay.value = v);
        simFolder.add(params, 'caWeight', 0.0, 1.0).name('Game of Life Influence').onChange(v => diffuseMaterial.uniforms.uCaWeight.value = v);

        const renderFolder = gui.addFolder('Glossy Metaballs');
        renderFolder.add(params, 'threshold', 0.01, 0.5).name('Blob Thickness').onChange(v => displayMaterial.uniforms.uThreshold.value = v);
        renderFolder.add(params, 'edgeSoftness', 0.001, 0.2).name('Edge Smoothness').onChange(v => displayMaterial.uniforms.uEdgeSoftness.value = v);
        renderFolder.add(params, 'bumpiness', 1.0, 100.0).name('Normal Depth').onChange(v => displayMaterial.uniforms.uBumpiness.value = v);
        renderFolder.add(params, 'glossiness', 10.0, 200.0).name('Wetness (Spec)').onChange(v => displayMaterial.uniforms.uGlossiness.value = v);

        const updateLight = () => {
            displayMaterial.uniforms.uLightDir.value.set(params.lightX, params.lightY, params.lightZ).normalize();
        };
        renderFolder.add(params, 'lightX', -1.0, 1.0).name('Light X').onChange(updateLight);
        renderFolder.add(params, 'lightY', -1.0, 1.0).name('Light Y').onChange(updateLight);

        const colorFolder = gui.addFolder('Aesthetics');
        colorFolder.addColor(params, 'colorDark').name('Edge Color').onChange(v => displayMaterial.uniforms.uColorDark.value.set(v));
        colorFolder.addColor(params, 'colorMid').name('Mid Density').onChange(v => displayMaterial.uniforms.uColorMid.value.set(v));
        colorFolder.addColor(params, 'colorHigh').name('High Density').onChange(v => displayMaterial.uniforms.uColorHigh.value.set(v));

        gui.add(params, 'reset').name('Respawn Cluster');

        // Hide loading text
        setTimeout(() => document.getElementById('loading').style.opacity = '0', 500);

        // --- Render Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 1. Calculate next agent positions via Compute Shader
            positionVariable.material.uniforms.trailMap.value = trailRT1.texture;
            positionVariable.material.uniforms.time.value = time;
            gpuCompute.compute();

            const currentPositionMap = gpuCompute.getCurrentRenderTarget(positionVariable).texture;

            // 2. Diffuse and Decay the Trail (Read RT1 -> Write RT2)
            diffuseMaterial.uniforms.tDiffuse.value = trailRT1.texture;
            renderer.setRenderTarget(trailRT2);
            renderer.clear();
            renderer.render(diffuseScene, orthoCamera);

            // 3. Draw Agents to the Trail (Draw to RT2, Additive)
            agentMat.uniforms.tPosition.value = currentPositionMap;
            renderer.render(agentScene, orthoCamera);

            // 4. Colorize and Draw to Canvas (Read RT2 -> Write Screen)
            displayMaterial.uniforms.tMap.value = trailRT2.texture;
            renderer.setRenderTarget(null);
            renderer.clear();
            renderer.render(displayScene, orthoCamera);

            // 5. Swap the Ping-Pong Render Targets
            let temp = trailRT1;
            trailRT1 = trailRT2;
            trailRT2 = temp;
        }

        animate();

        // Handle window resizes
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            // Note: We leave SIM_WIDTH / SIM_HEIGHT untouched to keep the simulation grid stable.
            // The display shader automatically stretches the internal texture to fit the canvas.
        });

    </script>
