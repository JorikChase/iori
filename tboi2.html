    <script>
      /**
 * TBOI: REPENTANCE+ PROTOTYPE
 */

// --- CONFIG & CONSTANTS ---
const CFG = {
    roomW: 26, roomD: 16, pixelScale: 4.5, gravity: 50.0,
    shakeDecay: 0.9
};

const LEVELS = [
    { name: "BASEMENT", wall: 0x3e2723, floor: 0x2c1e1a, enemyHp: 1.0 },
    { name: "CAVES", wall: 0x37474f, floor: 0x263238, enemyHp: 1.5 },
    { name: "DEPTHS", wall: 0x212121, floor: 0x181818, enemyHp: 2.0 },
    { name: "WOMB", wall: 0x880e4f, floor: 0x560027, enemyHp: 2.5 },
    { name: "SHEOL", wall: 0x000000, floor: 0x1a1a1a, enemyHp: 3.5 },
    { name: "THE CHEST", wall: 0xbf9e67, floor: 0xd4af37, enemyHp: 5.0 }
];

const ICONS = {
    speed: `<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2L2 22h20L12 2zm0 4l5 14H7l5-14z"/></svg>`,
    range: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg>`,
    tears: `<svg viewBox="0 0 24 24"><path fill="#0ff" d="M12 22c4.97 0 9-4.03 9-9 0-4.97-9-13-9-13S3 8.03 3 13c0 4.97 4.03 9 9 9z"/></svg>`,
    shot_speed: `<svg viewBox="0 0 24 24"><path fill="#fff" d="M2 12l10-10 10 10-6 0 0 10-8 0 0-10z"/></svg>`,
    damage: `<svg viewBox="0 0 24 24"><path fill="#f00" d="M19.57 3.5L12 11.43 4.43 3.5 2 6l8 7.5L2 21h19l-8-7.5 8-7.5z"/></svg>`,
    luck: `<svg viewBox="0 0 24 24"><path fill="#0f0" d="M12 2L9 9H2l6 5-3 8 7-5 7 5-3-8 6-5h-7z"/></svg>`
};

// --- ASSET GENERATOR ---
const AssetGen = {
    cache: {},
    get(key) {
        if (this.cache[key]) return this.cache[key];
        const cvs = document.createElement('canvas'); cvs.width = 64; cvs.height = 64;
        const ctx = cvs.getContext('2d'); ctx.imageSmoothingEnabled = false;

        const fill = c => { ctx.fillStyle=c; ctx.fillRect(0,0,64,64); };
        const rect = (x,y,w,h,c) => { ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };
        const circle = (x,y,r,c) => { ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=c; ctx.fill(); };
        const text = (t,c) => { ctx.fillStyle=c; ctx.font='bold 10px monospace'; ctx.fillText(t,8,36); };

        switch(key) {
            // Entities
            case 'ghost_body':
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                // Draw arch
                ctx.moveTo(12, 64);
                ctx.bezierCurveTo(12, 0, 52, 0, 52, 64);
                // Draw wavy bottom
                for(let i=52; i>=12; i-=5) {
                    ctx.lineTo(i-2.5, 58);
                    ctx.lineTo(i-5, 64);
                }
                ctx.fill();
                break;
            case 'ghost_face':
                circle(22, 32, 4, '#000'); circle(42, 32, 4, '#000');
                ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(32, 44, 3, 0, Math.PI*2); ctx.fill();
                break;
            case 'enemy_gaper': circle(32,32,24,'#d32f2f'); rect(20,20,6,6,'#000'); rect(38,20,6,6,'#000'); rect(24,38,16,12,'#000'); break;
            case 'enemy_boss': circle(32,32,28,'#4a148c'); circle(22,24,6,'#f00'); circle(42,24,6,'#f00'); rect(24,44,16,4,'#000'); break;
            case 'enemy_horf': circle(32,32,24,'#5d4037'); circle(32,32,14,'#222'); break;
            case 'floor': fill('#888'); for(let i=0;i<30;i++) rect(Math.random()*60, Math.random()*60, 2, 2, 'rgba(0,0,0,0.1)'); break; // Grayscale for tinting
            case 'rock': rect(4,4,56,56,'#5d4037'); rect(8,8,48,48,'#6d4c41'); rect(12,12,32,16,'#795548'); break;
            case 'rock_tinted': rect(4,4,56,56,'#3e2723'); rect(8,8,48,48,'#4e342e'); rect(36,36,12,12,'#5d4037'); break;
            case 'poop': circle(32,40,22,'#4e342e'); circle(32,28,16,'#5d4037'); circle(32,16,10,'#6d4c41'); break;
            case 'bomb': circle(32,36,22,'#333'); rect(28,6,8,10,'#ccc'); ctx.strokeStyle='#f57f17'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(32,6); ctx.lineTo(44,0); ctx.stroke(); break;
            case 'trapdoor': fill('#111'); rect(4,4,56,56,'#222'); for(let i=8;i<56;i+=10) rect(16,i,32,4,'#444'); break;

            // Items
            case 'pedestal': rect(16,32,32,32,'#757575'); rect(12,32,40,6,'#bdbdbd'); break;
            case 'item_fire_mind': circle(32,32,22,'#ff6f00'); circle(32,32,16,'#ffca28'); rect(28,16,8,8,'#d50000'); break;
            case 'item_scorpio': circle(32,32,22,'#388e3c'); rect(44,12,10,10,'#81c784'); break; // Tail
            case 'item_liquid': rect(20,20,24,30,'#fff'); rect(24,40,16,10,'#4caf50'); break; // Flask
            case 'item_generic': rect(16,16,32,32,'#fff'); text('?', '#000'); break;

            // Tears
            case 'tear_normal': circle(32,32,24,'#00bfff'); circle(22,22,8,'#fff'); break;
            case 'tear_blood': circle(32,32,24,'#d32f2f'); circle(22,22,8,'#ff8a80'); break;
            case 'tear_fire': circle(32,32,26,'#ff6f00'); circle(32,32,18,'#ffeb3b'); break;
            case 'tear_poison': circle(32,32,24,'#2e7d32'); circle(20,20,6,'#a5d6a7'); circle(40,24,4,'#a5d6a7'); break;
            case 'tear_spectral': circle(32,32,24,'rgba(200,220,255,0.6)'); circle(22,22,6,'rgba(255,255,255,0.8)'); break;

            // Particles
            case 'part_debris': rect(0,0,64,64,'#5d4037'); break;
            case 'part_smoke': circle(32,32,28,'rgba(100,100,100,0.5)'); break;
            case 'part_spark': rect(16,16,32,32,'#ffeb3b'); break;
            case 'creep': circle(32,32,30,'#2e7d32'); circle(16,20,10,'#1b5e20'); circle(44,36,8,'#1b5e20'); break;

            case 'shadow': { const g=ctx.createRadialGradient(32,32,10,32,32,32); g.addColorStop(0,'rgba(0,0,0,0.6)'); g.addColorStop(1,'rgba(0,0,0,0)'); fill(g); } break;
        }
        const tex = new THREE.CanvasTexture(cvs); tex.magFilter = THREE.NearestFilter; this.cache[key] = tex; return tex;
    }
};

// --- MATH & HELPERS ---
const Rand = {
    float: (min,max) => Math.random()*(max-min)+min,
    int: (min,max) => Math.floor(Math.random()*(max-min+1)+min),
    chance: (p) => Math.random() < p,
    spread: (val, pct) => val * (1 + (Math.random()-0.5)*pct)
};

// --- ENGINE CLASSES ---
class GameSystem {
    constructor() {
        this.scene = new THREE.Scene(); this.scene.background = new THREE.Color(0x111111);
        this.camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 1, 1000);
        this.camera.position.set(0, 28, 24); this.camera.lookAt(0,0,2);

        this.renderer = new THREE.WebGLRenderer({ antialias: false });
        this.renderer.setPixelRatio(window.devicePixelRatio);
        this.renderer.setSize(window.innerWidth/CFG.pixelScale, window.innerHeight/CFG.pixelScale, false);
        this.renderer.domElement.style.width="100%"; this.renderer.domElement.style.height="100%";
        document.body.appendChild(this.renderer.domElement);

        const amb = new THREE.AmbientLight(0xffffff, 0.8);
        const dir = new THREE.DirectionalLight(0xffffff, 0.4); dir.position.set(10,20,5);
        this.scene.add(amb, dir);

        this.clock = new THREE.Clock();
        this.entities = []; this.particles = []; this.creeps = [];
        this.keys = {}; this.shake = 0;
        this.currentLevelIdx = 0;

        window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
    }

    start() {
        this.player = new Player(0, 0);
        this.dungeon = new DungeonGen();
        this.loadLevel(0);
        UI.init();
        document.getElementById('loading-screen').style.display = 'none';
        this.loop();
    }

    loadLevel(idx) {
        this.currentLevelIdx = idx;
        const lvl = LEVELS[idx % LEVELS.length];

        // Show Level Title
        const txt = document.getElementById('level-text');
        txt.innerText = lvl.name;
        txt.style.opacity = 1;
        setTimeout(() => txt.style.opacity = 0, 3000);

        this.dungeon.generate();
        this.loadRoom(0,0);
    }

    nextLevel() {
        if(this.currentLevelIdx >= LEVELS.length - 1) {
            document.getElementById('win-screen').style.display = 'flex';
            return;
        }
        this.loadLevel(this.currentLevelIdx + 1);
    }

    restart() {
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'none';
        this.player = new Player(0,0);
        this.loadLevel(0);
        UI.init();
        this.inputLocked = false;
    }

    loadRoom(x, y, entryDir) {
        // Cleanup
        for(let i = this.scene.children.length - 1; i >= 0; i--) {
            const obj = this.scene.children[i];
            if(obj.userData.isDynamic && obj !== this.player.mesh) this.scene.remove(obj);
        }
        document.getElementById('boss-bar-container').style.display = 'none'; // Hide boss bar by default

        this.entities = [this.player]; this.creeps = []; this.particles = [];

        this.dungeon.enterRoom(x, y, this.scene);
        if(!this.player.mesh.parent) this.scene.add(this.player.mesh);

        if(entryDir === 'N') this.player.pos.set(0, 0, CFG.roomD/2 - 3);
        if(entryDir === 'S') this.player.pos.set(0, 0, -CFG.roomD/2 + 3);
        if(entryDir === 'E') this.player.pos.set(-CFG.roomW/2 + 3, 0, 0);
        if(entryDir === 'W') this.player.pos.set(CFG.roomW/2 - 3, 0, 0);

        UI.updateMinimap(this.dungeon.grid, this.dungeon.currentX, this.dungeon.currentY);
    }

    spawnParticles(type, pos, count, color, speed=1) {
        for(let i=0; i<count; i++) {
            const p = new Particle(type, pos, color, speed);
            this.particles.push(p); this.scene.add(p.mesh);
        }
    }

    addCreep(pos, type) {
        const c = new Creep(pos, type);
        this.creeps.push(c); this.scene.add(c.mesh);
    }

    spawnTrapdoor(pos) {
        const t = new Trapdoor(pos.x, pos.z);
        this.entities.push(t); this.scene.add(t.mesh);
        Game.screenShake(1.5);
        this.spawnParticles('debris', pos, 10, '#333');
    }

    screenShake(amt) { this.shake = Math.min(this.shake + amt, 2.0); }

    loop() {
        requestAnimationFrame(() => this.loop());
        let dt = Math.min(this.clock.getDelta(), 0.1);
        if(this.inputLocked) return;

        // Camera Shake
        if(this.shake > 0) {
            this.shake *= CFG.shakeDecay;
            this.camera.position.x = (Math.random()-0.5) * this.shake;
            this.camera.position.z = 24 + (Math.random()-0.5) * this.shake;
            if(this.shake < 0.05) { this.shake = 0; this.camera.position.x = 0; }
        }

        // Entity Updates
        for(let i=this.entities.length-1; i>=0; i--) {
            const e = this.entities[i];
            if(!e.update(dt)) {
                this.scene.remove(e.mesh);
                this.entities.splice(i, 1);
            }
        }
        this.dungeon.roomEntities.forEach(e => e.update(dt));
        for(let i=this.particles.length-1; i>=0; i--) if(!this.particles[i].update(dt)) { this.scene.remove(this.particles[i].mesh); this.particles.splice(i,1); }
        for(let i=this.creeps.length-1; i>=0; i--) if(!this.creeps[i].update(dt)) { this.scene.remove(this.creeps[i].mesh); this.creeps.splice(i,1); }

        // Camera Follow
        if(this.player) {
            const tx = this.player.pos.x * 0.2;
            const tz = this.player.pos.z * 0.2 + 24;
            this.camera.position.x += (tx - this.camera.position.x) * 5 * dt;
            this.camera.position.z += (tz - this.camera.position.z) * 5 * dt;
        }
        this.renderer.render(this.scene, this.camera);
    }
}

class Entity {
    constructor(x, z, tex) {
        this.pos = new THREE.Vector3(x, 0, z);
        this.vel = new THREE.Vector3();
        this.radius = 0.8;
        this.mesh = new THREE.Group();
        this.mesh.userData.isDynamic = true;
        this.sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: AssetGen.get(tex), transparent: true }));
        this.sprite.center.set(0.5, 0); this.sprite.scale.set(3,3,1);
        this.mesh.add(this.sprite);
        const sMat = new THREE.MeshBasicMaterial({ map: AssetGen.get('shadow'), transparent: true, depthWrite: false });
        this.shadow = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), sMat);
        this.shadow.rotation.x = -Math.PI/2; this.shadow.position.y = 0.05;
        this.mesh.add(this.shadow);
    }
    update(dt) { this.mesh.position.copy(this.pos); this.mesh.renderOrder = this.pos.z; return true; }

class Player extends Entity {
    constructor(x, z) {
        super(x, z, 'ghost_body');
        this.sprite.scale.set(3, 6, 1);
        const hMat = new THREE.SpriteMaterial({ map: AssetGen.get('ghost_face'), transparent: true });
        this.head = new THREE.Sprite(hMat); this.head.scale.set(2, 2, 1); this.head.position.set(0, 4.2, 0.01);
        this.mesh.add(this.head);
        this.hp = 6; this.maxHp = 6; this.coins = 0; this.bombs = 1; this.keys = 0;
        this.stats = { speed: 1.0, range: 6.5, tears: 2.73, shotSpeed: 1.0, damage: 3.5 };
        this.items = []; this.traits = { fire: false, poison: false, creep: false, spectral: false };
        this.shootCooldown = 0; this.invincible = 0;
    }
    recalc() {
        this.stats = { speed: 1.0, range: 6.5, tears: 2.73, shotSpeed: 1.0, damage: 3.5 };
        this.traits = { fire: false, poison: false, creep: false, spectral: false };
        this.items.forEach(k => {
            const i = ITEMS[k];
            if(i.stats) Object.keys(i.stats).forEach(s => this.stats[s] += i.stats[s]);
            if(i.traits) i.traits.forEach(t => this.traits[t] = true);
        });
        this.stats.tears = Math.max(0.1, this.stats.tears);
        UI.updateStats();
    }
    update(dt) {
        let dx = 0, dz = 0;
        if(Game.keys['w']) dz -= 1; if(Game.keys['s']) dz += 1;
        if(Game.keys['a']) dx -= 1; if(Game.keys['d']) dx += 1;
        if(dx || dz) {
            const move = new THREE.Vector3(dx, 0, dz).normalize().multiplyScalar(this.stats.speed * 12 * dt);
            const next = this.pos.clone().add(move);
            if(!this.collide(next)) this.pos.copy(next);
            this.head.position.y = 4.2 + Math.sin(Date.now()/150)*0.15;
            this.checkDoors();
        }
        this.shootCooldown -= dt;
        let sx=0, sz=0;
        if(Game.keys['arrowup']) sz=-1; else if(Game.keys['arrowdown']) sz=1; else if(Game.keys['arrowleft']) sx=-1; else if(Game.keys['arrowright']) sx=1;
        if((sx || sz) && this.shootCooldown <= 0) { this.shoot(sx, sz); this.head.position.x = sx * 0.3; } else if(!sx && !sz) this.head.position.x = 0;
        if(Game.keys['e'] && this.bombs > 0 && !this.bombLocked) {
            this.bombs--; Game.entities.push(new Bomb(this.pos.x, this.pos.z));
            UI.updateRes(); this.bombLocked=true; setTimeout(()=>this.bombLocked=false, 500);
        }
        if(this.invincible > 0) { this.invincible -= dt; this.sprite.material.opacity = (Math.floor(Date.now()/50)%2)*0.5 + 0.5; } else this.sprite.material.opacity = 1;
        super.update(dt); return true;
    }
    shoot(dx, dz) {
        this.shootCooldown = 1.0 / this.stats.tears;
        const moveX = (Game.keys['d']?1:(Game.keys['a']?-1:0)) * 2;
        const moveZ = (Game.keys['s']?1:(Game.keys['w']?-1:0)) * 2;
        const dir = new THREE.Vector3(dx, 0, dz).normalize().multiplyScalar(12 * this.stats.shotSpeed);
        dir.x += moveX; dir.z += moveZ; dir.x = Rand.spread(dir.x, 0.05); dir.z = Rand.spread(dir.z, 0.05);
        const t = new Tear(this.pos.clone(), dir, this.stats.damage, this.stats.range, {...this.traits});
        Game.entities.push(t); Game.scene.add(t.mesh);
    }
    collide(pos) {
        if(Math.abs(pos.x) > CFG.roomW/2 - 1.5) return true;
        if(Math.abs(pos.z) > CFG.roomD/2 - 1.5) return true;
        for(let obs of Game.dungeon.roomEntities) { if(obs.collision && pos.distanceTo(obs.pos) < (this.radius + obs.radius)) return true; }
        return false;
    }
    hit(dmg) {
        if(this.invincible > 0) return;
        Game.screenShake(0.5);
        this.hp -= dmg; this.invincible = 1.0; UI.updateHearts();
        Game.spawnParticles('debris', this.pos, 5, '#d32f2f');
        if(this.hp <= 0) { document.getElementById('game-over-screen').style.display = 'flex'; Game.inputLocked = true; }
    }
    checkDoors() {
        Game.dungeon.doors.forEach(d => {
            if(d.isOpen && this.pos.distanceTo(d.pos) < 2) {
                let tx=Game.dungeon.currentX, ty=Game.dungeon.currentY;
                if(d.dir==='N') ty--; if(d.dir==='S') ty++; if(d.dir==='E') tx++; if(d.dir==='W') tx--;
                Game.loadRoom(tx, ty, d.dir);
            }
        });
    }
    addItem(key) {
        this.items.push(key); this.recalc();
        const i = ITEMS[key];
        const el = document.getElementById('item-popup');
        el.querySelector('h2').innerText = i.name; el.querySelector('p').innerText = i.desc;
        el.classList.add('active'); setTimeout(()=>el.classList.remove('active'), 2500);
    }
}

class Tear {
    constructor(pos, vel, damage, range, traits) {
        this.pos = pos.clone(); this.height = 3.5; this.vel = vel; this.velY = 2.0 + (range/10);
        this.damage = damage; this.range = range; this.traits = traits; this.life = range / 10.0;
        this.mesh = new THREE.Group(); this.mesh.userData.isDynamic = true;
        let tex = 'tear_normal';
        if(traits.fire) tex = 'tear_fire'; if(traits.poison) tex = 'tear_poison'; if(traits.spectral) tex = 'tear_spectral'; if(traits.hostile) tex = 'tear_blood';
        this.sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: AssetGen.get(tex), transparent: true }));
        this.sprite.scale.set(2.5, 2.5, 1); this.mesh.add(this.sprite);
        const sMat = new THREE.MeshBasicMaterial({ map: AssetGen.get('shadow'), transparent: true, opacity: 0.5 });
        this.shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), sMat);
        this.shadow.rotation.x = -Math.PI/2; this.mesh.add(this.shadow);
        this.mesh.position.copy(this.pos);
    }
    update(dt) {
        this.pos.add(this.vel.clone().multiplyScalar(dt));
        this.velY -= CFG.gravity * dt; this.height += this.velY * dt;
        if(this.height <= 0.5) {
            this.height = 0.5;
            if(Math.abs(this.velY) > 5) {
                this.velY = -this.velY * 0.4; this.vel.multiplyScalar(0.8); Game.spawnParticles('debris', this.pos, 2, '#00bfff', 0.5);
                if(this.traits.creep) Game.addCreep(this.pos, 'poison');
            } else { this.die(); return false; }
        }
        const stretch = 1 + Math.abs(this.velY)*0.05;
        this.sprite.scale.set(2.5 / stretch, 2.5 * stretch, 1); this.sprite.position.y = this.height;
        this.shadow.scale.setScalar(1.0 - (this.height/15)); this.shadow.material.opacity = Math.max(0, 0.6 - (this.height/20));
        this.mesh.position.copy(this.pos);
        if(this.traits.fire && Math.random() < 0.3) Game.spawnParticles('smoke', this.pos, 1, '#666');
        if(this.traits.poison && Math.random() < 0.2) Game.spawnParticles('debris', this.pos, 1, '#4caf50');
        if(this.checkCollisions()) return false;
        this.life -= dt; return this.life > 0;
    }
    checkCollisions() {
        const targets = this.traits.hostile ? [Game.player] : Game.entities.filter(e => e instanceof Enemy);
        for(let t of targets) {
            if(t.pos.distanceTo(this.pos) < (t.radius + 0.8)) {
                if(this.height < 6) {
                    if(t.hit) {
                        if(this.traits.poison) t.applyStatus('poison');
                        if(this.traits.fire) t.applyStatus('burn');
                        t.hit(this.damage);
                    }
                    if(!this.traits.spectral) { this.die(); return true; }
                }
            }
        }
        if(!this.traits.spectral) {
            if(Math.abs(this.pos.x) > CFG.roomW/2 - 1 || Math.abs(this.pos.z) > CFG.roomD/2 - 1) { this.die(); return true; }
            for(let o of Game.dungeon.roomEntities) {
                if(o.collision && o.pos.distanceTo(this.pos) < (o.radius + 0.5) && this.height < 4) {
                    if(o.hit) o.hit(this.damage);
                    this.die(); return true;
                }
            }
        }
        return false;
    }
    die() {
        const col = this.traits.fire ? '#ff6f00' : (this.traits.poison ? '#4caf50' : '#00bfff');
        Game.spawnParticles('debris', this.pos, 4, col);
        if(this.traits.fire && Math.random() < 0.2) {
             Game.screenShake(0.8); Game.spawnParticles('spark', this.pos, 8, '#ffeb3b', 2.0);
             Game.entities.filter(e => e instanceof Enemy && e.pos.distanceTo(this.pos) < 5).forEach(e => e.hit(this.damage * 2));
        }
        if(this.traits.creep) Game.addCreep(this.pos, 'poison');
    }
}

class Particle {
    constructor(type, pos, color, speedMod) {
        this.type = type; this.pos = pos.clone(); this.pos.y += Rand.float(0, 2);
        const tex = type === 'smoke' ? 'part_smoke' : (type === 'spark' ? 'part_spark' : 'part_debris');
        this.mesh = new THREE.Sprite(new THREE.SpriteMaterial({ map: AssetGen.get(tex), color: color, transparent: true }));
        this.mesh.userData.isDynamic = true;
        const size = Rand.float(0.5, 1.2); this.mesh.scale.set(size, size, 1);
        this.vel = new THREE.Vector3(Rand.float(-3,3), Rand.float(2,6), Rand.float(-3,3)).multiplyScalar(speedMod);
        this.life = 1.0;
        if(type === 'smoke') { this.vel.y = 2; this.drag = 0.95; }
        if(type === 'debris') { this.gravity = CFG.gravity; this.floorY = 0; }
    }
    update(dt) {
        this.life -= dt; this.mesh.material.opacity = this.life;
        if(this.type === 'debris') {
            this.vel.y -= this.gravity * dt; this.pos.add(this.vel.clone().multiplyScalar(dt));
            if(this.pos.y <= 0) { this.pos.y = 0; this.vel.y *= -0.5; this.vel.x *= 0.8; this.vel.z *= 0.8; }
        } else { this.pos.add(this.vel.clone().multiplyScalar(dt)); this.vel.multiplyScalar(this.drag || 1.0); }
        this.mesh.position.copy(this.pos); return this.life > 0;
    }
}

class Creep {

class Enemy extends Entity {
    constructor(x, z, type) {
        super(x, z, type==='boss'?'enemy_boss':(type==='gaper'?'enemy_gaper':'enemy_horf'));
        this.ai = type;

        // Scale hp based on level
        const mult = LEVELS[Game.currentLevelIdx].enemyHp;
        this.hp = (type === 'boss' ? 80 : 12) * mult;
        this.maxHp = this.hp;

        this.timer = 0; this.status = { poison: 0, burn: 0 };
        if(type === 'boss') this.sprite.scale.set(5, 5, 1);
    }
    update(dt) {
        // Status Logic
        if(this.status.poison > 0) {
            this.status.poison -= dt; if(Math.floor(this.status.poison*5) !== Math.floor((this.status.poison+dt)*5)) this.hit(1, true);
            this.sprite.material.color.setHex(0x88ff88);
        } else if(this.status.burn > 0) {
            this.status.burn -= dt; if(Math.floor(this.status.burn*5) !== Math.floor((this.status.burn+dt)*5)) this.hit(1, true);
            this.sprite.material.color.setHex(0xffaa00);
        } else this.sprite.material.color.setHex(0xffffff);

        if(this.ai === 'boss') {
            // Simple Boss AI: Chase slowly, shoot periodically
            const dir = Game.player.pos.clone().sub(this.pos).normalize();
            this.pos.add(dir.multiplyScalar(2.0 * dt));

            this.timer -= dt;
            if(this.timer <= 0) {
                // Radial burst
                for(let i=0; i<8; i++) {
                    const angle = (i/8)*Math.PI*2;
                    const v = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).multiplyScalar(7);
                    Game.entities.push(new Tear(this.pos, v, 1, 12, {hostile:true}));
                }
                this.timer = 2.0;
            }
            if(this.pos.distanceTo(Game.player.pos) < 2.5) Game.player.hit(1);

        } else if(this.ai === 'gaper') {
            const dir = Game.player.pos.clone().sub(this.pos).normalize();
            const next = this.pos.clone().add(dir.multiplyScalar(3.5 * dt));
            let blocked = false;
            for(let o of Game.dungeon.roomEntities) if(o.collision && next.distanceTo(o.pos) < 1.5) blocked=true;
            if(!blocked) this.pos.copy(next);
            if(this.pos.distanceTo(Game.player.pos) < 1.2) Game.player.hit(1);
        } else {
            // Horf AI
            this.timer -= dt;
            if(this.timer <= 0 && this.pos.distanceTo(Game.player.pos) < 15) {
                const dir = Game.player.pos.clone().sub(this.pos).normalize().multiplyScalar(8);
                const t = new Tear(this.pos, dir, 1, 10, {hostile:true});
                Game.entities.push(t); Game.scene.add(t.mesh);
                this.timer = 2.0;
                this.sprite.scale.set(3.5, 2.5, 1); setTimeout(()=>this.sprite.scale.set(3,3,1), 100);
            }
        }
        return super.update(dt);
    }
    hit(d, silent) {
        this.hp -= d;

        // BOSS BAR UI UPDATE
        if(this.ai === 'boss') {
            const bar = document.getElementById('boss-bar-fill');
            const pct = Math.max(0, (this.hp / this.maxHp) * 100);
            bar.style.width = pct + '%';
        }

        if(!silent) {
            this.sprite.material.color.setHex(0xff0000);
            setTimeout(()=>this.sprite.material.color.setHex(0xffffff), 100);
            Game.spawnParticles('debris', this.pos, 3, '#d32f2f');
        }
        if(this.hp <= 0) {
            Game.spawnParticles('debris', this.pos, 10, '#d32f2f', 1.5);

            Game.scene.remove(this.mesh);
            const idx = Game.entities.indexOf(this);
            if(idx > -1) Game.entities.splice(idx, 1);

            if(this.ai === 'boss') {
                Game.spawnTrapdoor(this.pos);
                document.getElementById('boss-bar-container').style.display='none';
            }

            Game.dungeon.checkClear();
            return false; // Remove
        }
    }
    applyStatus(type) {
        if(type === 'poison') this.status.poison = 5.0;
        if(type === 'burn') this.status.burn = 3.0;
    }
}

class Bomb extends Entity {
    constructor(x,z) { super(x,z,'bomb'); this.timer=2.0; }
    update(dt) {
        this.timer-=dt; const s=3+Math.sin(Date.now()/50)*0.5; this.sprite.scale.set(s,s,1);
        this.sprite.material.color.setHex(this.timer<0.5?0xffaaaa:0xffffff);
        if(this.timer<=0) {
            Game.screenShake(1.0);
            Game.spawnParticles('spark', this.pos, 20, '#ffeb3b', 3.0);
            const radius = 6.0;
            [...Game.entities].forEach(e => {
                if(e === this) return;
                if(e.pos.distanceTo(this.pos) < radius) {
                    if(e instanceof Enemy) e.hit(50);
                    else if(e instanceof Pickup || e instanceof ItemPedestal) {
                        Game.spawnParticles('debris', e.pos, 5, '#fff');
                        Game.scene.remove(e.mesh);
                        const idx = Game.entities.indexOf(e);
                        if(idx > -1) Game.entities.splice(idx, 1);
                    } else if(e instanceof Bomb) e.timer = 0.1;
                }
            });
            Game.dungeon.roomEntities.forEach(o => { if((o.type.includes('rock') || o.type === 'poop') && o.pos.distanceTo(this.pos) < radius) o.break(); });
            return false;
        }
        return super.update(dt);
    }
}

// --- DUNGEON ---
class DungeonGen {
    constructor() { this.grid={}; }
    generate() {
        this.grid={};
        const q=[{x:0,y:0}]; this.grid['0,0']={type:'start',cleared:true}; let count=1;
        while(q.length>0 && count<10) {
            const c=q.shift(); const dirs=[[0,1],[0,-1],[1,0],[-1,0]]; dirs.sort(()=>Math.random()-0.5);
            for(let d of dirs) {
                const nx=c.x+d[0], ny=c.y+d[1], k=`${nx},${ny}`;
                if(!this.grid[k] && Math.random()>0.5) { this.grid[k]={type:'normal',cleared:false}; q.push({x:nx,y:ny}); count++; }
            }
        }
        const keys=Object.keys(this.grid).filter(k=>k!=='0,0');
        let maxDist = -1; let bossKey = null;
        keys.forEach(k => { const [rx, ry] = k.split(',').map(Number); const dist = Math.abs(rx) + Math.abs(ry); if(dist > maxDist) { maxDist = dist; bossKey = k; } });
        if(bossKey) {
            this.grid[bossKey].type = 'boss';
            const remaining = keys.filter(k => k !== bossKey);
            if(remaining.length > 0) this.grid[remaining[Math.floor(Math.random() * remaining.length)]].type = 'treasure';
        }
    }
    enterRoom(x,y,scene) {
        this.currentX=x; this.currentY=y; const r=this.grid[`${x},${y}`];
        if(this.floor) scene.remove(this.floor);
        if(this.doors) this.doors.forEach(d => scene.remove(d.mesh)); this.doors=[];
        if(this.roomEntities) this.roomEntities.forEach(e => scene.remove(e.mesh)); this.roomEntities=[];

        // Dynamic Palette
        const lvl = LEVELS[Game.currentLevelIdx];
        const g=new THREE.PlaneGeometry(CFG.roomW,CFG.roomD);
        const m=new THREE.MeshStandardMaterial({map:AssetGen.get('floor'), color: lvl.floor});
        this.floor=new THREE.Mesh(g,m); this.floor.rotation.x=-Math.PI/2; scene.add(this.floor);
        const w=new THREE.Mesh(new THREE.PlaneGeometry(CFG.roomW+4,12), new THREE.MeshBasicMaterial({color: lvl.wall}));
        w.position.set(0,6,-CFG.roomD/2-0.1); scene.add(w); this.floor.add(w);

        [{x:0,y:-1,d:'N'},{x:0,y:1,d:'S'},{x:1,y:0,d:'E'},{x:-1,y:0,d:'W'}].forEach(n=>{
            if(this.grid[`${x+n.x},${y+n.y}`]) {
                const d = new Door(n.d, r.cleared || r.type==='treasure'); this.doors.push(d); scene.add(d.mesh);
            }
        });

        if(r.type==='start') return;
        if(!r.cleared) {
            if(r.type==='treasure') { this.roomEntities.push(new ItemPedestal(0,0)); r.cleared=true; }
            else if(r.type==='boss') {
                const boss = new Enemy(0,0,'boss');
                Game.entities.push(boss); scene.add(boss.mesh);
                document.getElementById('boss-bar-container').style.display='block';
                document.getElementById('boss-bar-fill').style.width='100%';
            } else {
                for(let i=0; i<Rand.int(2,4); i++) {
                    const e = new Enemy(Rand.float(-10,10), Rand.float(-6,6), Rand.chance(0.5)?'gaper':'horf');
                    Game.entities.push(e); scene.add(e.mesh);
                }
            }
        }
        if(!r.cleared || r.layout) {
             if(!r.layout) {
                 r.layout=[];
                 for(let i=0; i<10; i++) {
                     if(Rand.chance(0.3)) r.layout.push({x:Rand.int(-5,5)*2, z:Rand.int(-3,3)*2, t:Rand.chance(0.1)?'rock_tinted':'rock'});
                 }
             }
             r.layout.forEach(o => { const obs = new Obstacle(o.x, o.z, o.t); this.roomEntities.push(obs); scene.add(obs.mesh); });
        }
    }
    checkClear() {
        if(Game.entities.filter(e=>e instanceof Enemy).length === 0) {
            const r=this.grid[`${this.currentX},${this.currentY}`];
            if(!r.cleared) {
                r.cleared=true; this.doors.forEach(d=>d.open());
                if(r.type !== 'boss' && Rand.chance(0.5)) Game.entities.push(new Pickup(0,0,'coin'));
            }
        }
    }
}

class Door {
    constructor(dir, open) {
        this.dir=dir; this.isOpen=open; this.mesh=new THREE.Group();
        const f=new THREE.Mesh(new THREE.PlaneGeometry(4,5), new THREE.MeshBasicMaterial({color:'#222'}));
        this.void=new THREE.Mesh(new THREE.PlaneGeometry(3,4), new THREE.MeshBasicMaterial({color:open?'#000':'#3e2723'}));
        this.void.position.z=0.1; this.void.position.y=-0.5; this.mesh.add(f,this.void);
        const d=CFG.roomD/2, w=CFG.roomW/2;
        if(dir==='N') this.mesh.position.set(0,2.5,-d);
        if(dir==='S') this.mesh.position.set(0,2.5,d);
        if(dir==='E') {this.mesh.position.set(w,2.5,0); this.mesh.rotation.y=-Math.PI/2;}
        if(dir==='W') {this.mesh.position.set(-w,2.5,0); this.mesh.rotation.y=Math.PI/2;}
        this.pos=this.mesh.position.clone(); this.pos.y = 0;
    }
    open() { this.isOpen=true; this.void.material.color.setHex(0x000000); }
}

const ITEMS = {
    'fire_mind': { name: 'Fire Mind', desc: 'Flaming tears + Explode', icon: 'item_fire_mind', traits: ['fire'], stats: { damage: 1.0 } },
    'scorpio': { name: 'Scorpio', desc: 'Poison tears', icon: 'item_scorpio', traits: ['poison'], stats: { speed: 0.1 } },
    'mysterious_liquid': { name: 'Mysterious Liquid', desc: 'Toxic splash', icon: 'item_liquid', traits: ['creep'], stats: { damage: 1.5, range: -1.0 } },
    'ouija': { name: 'Ouija Board', desc: 'Spectral tears', icon: 'item_generic', traits: ['spectral'], stats: {} },
    'hormones': { name: 'Growth Hormones', desc: 'Speed + Dmg', icon: 'item_generic', stats: { damage: 1.0, speed: 0.4 } },
    'screw': { name: 'The Screw', desc: 'Tears up', icon: 'item_generic', stats: { tears: 0.5, shotSpeed: 0.2 } },
};

const UI = {
    init() { this.updateHearts(); this.updateRes(); this.updateStats(); },
    updateHearts() {
        const c = document.getElementById('hearts-container'); c.innerHTML = '';
        for(let i=0; i<Math.ceil(Game.player.hp/2); i++) {
            const d = document.createElement('div'); d.className='heart-icon';
            d.innerHTML='<svg viewBox="0 0 32 32"><path fill="#d00" stroke="#500" stroke-width="2" d="M16 28 C16 28 3 20 3 11 A7 7 0 0 1 16 7 A7 7 0 0 1 29 11 C29 20 16 28 16 28 Z"/><path fill="#f88" d="M8 10a2 2 0 0 1 2 2"/></svg>';
            c.appendChild(d);
        }
    },
    updateRes() {
        document.getElementById('coin-text').innerText = String(Game.player.coins).padStart(2,'0');
        document.getElementById('bomb-text').innerText = String(Game.player.bombs).padStart(2,'0');
        document.getElementById('key-text').innerText = String(Game.player.keys).padStart(2,'0');
    },
    updateStats() {
        const p = Game.player.stats;
        const list = [
            {i: ICONS.speed, v: p.speed.toFixed(2)},
            {i: ICONS.range, v: p.range.toFixed(2)},
            {i: ICONS.tears, v: p.tears.toFixed(2)},
            {i: ICONS.shot_speed, v: p.shotSpeed.toFixed(2)},
            {i: ICONS.damage, v: p.damage.toFixed(2)},
        ];
        const c = document.getElementById('found-hud'); c.innerHTML = '';
        list.forEach(item => {
            const r = document.createElement('div'); r.className='stat-row';
            r.innerHTML = `<div class="stat-icon">${item.i}</div><div class="stat-val">${item.v}</div>`;
            c.appendChild(r);
        });
    },
    updateMinimap(grid, cx, cy) {
        const cvs = document.getElementById('minimap'); const ctx = cvs.getContext('2d');
        const w=cvs.width, h=cvs.height; ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
        const size = 14, offX = w/2 - cx*size, offY = h/2 - cy*size;
        for(let key in grid) {
            const r = grid[key], [rx, ry] = key.split(',').map(Number);
            const dx = offX + rx*size, dy = offY + ry*size;
            ctx.fillStyle = (rx===cx && ry===cy) ? '#fff' : (r.type==='boss'?'#900':(r.type==='treasure'?'#fd0':(r.cleared?'#bbb':'#444')));
            ctx.fillRect(dx+1, dy+1, size-2, size-2);
        }
    }
};

const Game = new GameSystem();
Game.start();
