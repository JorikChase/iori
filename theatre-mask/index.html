{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<svg id="ms" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- the emotion surface
// Every emotion is a site on a ring around the mask; neutral is the centre. The crosshair is the current
// expression: its muscle mix is the inverse-distance blend of the sites' mixes, so it is exactly an emotion
// on its site and a seamless mixture everywhere else.
// The upper half is loud (open mouths), the lower half quiet (closed lips); each quiet state sits under its
// loud kin, so comedy folds down into serenity and tragedy into sorrow.
const SITES = [                       // angle in degrees, counter-clockwise from the right
  { name: 'comedy', a: 15 }, { name: 'surprise', a: 55 }, { name: 'fear', a: 90 }, { name: 'disgust', a: 125 },
  { name: 'tragedy', a: 165 }, { name: 'sorrow', a: 195 }, { name: 'anger', a: 235 }, { name: 'resolve', a: 270 },
  { name: 'contempt', a: 305 }, { name: 'serenity', a: 345 },
];
const IDW_P = 2.5;

const meta = await (await fetch('emotions.json')).json();
const KEYS = meta.keys.filter((k) => !k.endsWith('_w'));
const mixOf = (name) => KEYS.map((k) => meta.emotions[name]?.[k] ?? 0);
const NEUTRAL = mixOf('neutral');
SITES.forEach((s) => { s.mix = mixOf(s.name); });

// muscles settle at different speeds: the brows lead, the eyes follow, the mouth and jaw arrive last
const OMEGA = { brow_inner_up: 15, brow_outer_up: 15, brow_down: 13, lid_raise: 13, lid_tighten: 12, cheek_raise: 9,
  nose_wrinkle: 10, smile: 8, frown: 8, upper_lip_raise: 8, lip_stretch: 7.5, lip_round: 7.5, lip_press: 8,
  chin_raise: 7, jaw_drop: 6, dimpler_L: 8, lips_close: 7 };
const ZETA = 0.72;                    // a little overshoot, then it settles
const [W0, W1] = meta.wrinkle_onset;
const onset = (w) => { const t = Math.min(1, Math.max(0, (Math.abs(w) - W0) / (W1 - W0))); return t * t * (3 - 2 * t); };

// ---------------------------------------------------------------- renderer, light, material
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x26272a);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.16;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(20, 1, 0.05, 10);
camera.position.set(0, 0.02, 1.0);

const key = new THREE.DirectionalLight(0xffe6c8, 3.4);       // high and to one side: every crease casts
key.position.set(-0.55, 0.85, 0.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -0.16, right: 0.16, top: 0.16, bottom: -0.16, near: 0.2, far: 2.5 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.0015;
key.shadow.radius = 3;
const rim = new THREE.DirectionalLight(0xa8bfff, 1.1);
rim.position.set(0.6, 0.3, -0.5);
scene.add(key, rim, new THREE.HemisphereLight(0xe8eaf0, 0x1a1a1c, 0.1));

const ivory = new THREE.MeshPhysicalMaterial({
  color: 0xe8dfcb, roughness: 0.36, metalness: 0, clearcoat: 0.25, clearcoatRoughness: 0.22,
  sheen: 0.3, sheenRoughness: 0.6, sheenColor: 0xfff3e0,
});

const rig = new THREE.Group();
scene.add(rig);
let mesh = null, keyIndex = {};
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('mask.glb', (g) => {
  g.scene.traverse((o) => { if (o.isMesh && o.morphTargetDictionary) mesh = o; });
  mesh.material = ivory;
  mesh.castShadow = mesh.receiveShadow = true;
  keyIndex = mesh.morphTargetDictionary;
  const box = new THREE.Box3().setFromObject(mesh), c = box.getCenter(new THREE.Vector3());
  mesh.position.sub(c);
  rig.add(mesh);
});

// ---------------------------------------------------------------- the surface overlay (hairlines, no text)
const svg = document.getElementById('ms');
let W = 0, H = 0, R = 0, CX = 0, CY = 0;
const cross = { x: 0, y: 0 }, aim = { x: 0, y: 0 };       // in ring units: |p| = 1 on the ring
let dragging = false;

function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  // the mask sits in the middle; the ring passes just outside it
  R = Math.min(W, H) * (W < 700 ? 0.42 : 0.40);
  CX = W / 2; CY = H / 2;
  SITES.forEach((s) => { s.x = Math.cos(s.a * Math.PI / 180); s.y = Math.sin(s.a * Math.PI / 180); });
  // frame the 23.5 cm mask at 1.4 R tall, so it fills the ring without touching the sites
  const visible = 0.235 * H / (1.4 * R);
  camera.fov = 2 * Math.atan(visible / (2 * camera.position.z)) * 180 / Math.PI;
  camera.updateProjectionMatrix();
  buildSurface();
}
const toPx = (p) => [CX + p.x * R, CY - p.y * R];

function weights(p) {
  // inverse-distance blend over the sites and the neutral centre; exact at every site
  const all = [{ x: 0, y: 0, mix: NEUTRAL }, ...SITES];
  let sum = 0;
  const w = all.map((s) => {
    const d = Math.hypot(p.x - s.x, p.y - s.y);
    const v = d < 1e-4 ? 1e8 : 1 / Math.pow(d, IDW_P);
    sum += v; return v;
  });
  return { all, w: w.map((v) => v / sum) };
}

// Built once per layout: rebuilding the SVG every frame re-creates the <image> elements, and a browser that
// revalidates them never gets to paint the thumbnails. Per frame only the spokes, highlights and cross move.
let ui = null;
function buildSurface() {
  const th = Math.min(30, R * 0.13);
  const s = [`<circle class="ring" cx="${CX}" cy="${CY}" r="${R}"/>`];
  SITES.forEach(() => s.push('<path class="spoke"/>'));
  SITES.forEach((t, i) => {
    const [sx, sy] = toPx(t);
    s.push(`<clipPath id="c${i}"><circle cx="${sx}" cy="${sy}" r="${th}"/></clipPath>`);
    s.push(`<image href="thumbs/${t.name}.jpg" x="${sx - th}" y="${sy - th}" width="${2 * th}" height="${2 * th}" clip-path="url(#c${i})"/>`);
    s.push(`<circle class="site" cx="${sx}" cy="${sy}" r="${th}"/>`);
  });
  s.push(`<circle class="home" cx="${CX}" cy="${CY}" r="3"/>`);
  s.push('<g class="cross"><path d="M-14 0H-4M4 0H14M0 -14V-4M0 4V14"/><circle r="1.5"/></g>');
  svg.innerHTML = s.join('');
  ui = { spokes: [...svg.querySelectorAll('.spoke')], images: [...svg.querySelectorAll('image')],
    sites: [...svg.querySelectorAll('.site')], cross: svg.querySelector('.cross') };
}

function drawSurface(wt) {
  if (!ui) return;
  const [x, y] = toPx(cross);
  SITES.forEach((t, i) => {
    const [sx, sy] = toPx(t);
    const sp = ui.spokes[i];
    sp.setAttribute('d', `M${x.toFixed(1)} ${y.toFixed(1)}L${sx.toFixed(1)} ${sy.toFixed(1)}`);
    sp.style.opacity = (0.06 + 0.9 * wt.w[i + 1]).toFixed(3);
    const on = wt.w[i + 1] > 0.5;
    ui.images[i].classList.toggle('on', on);
    ui.sites[i].classList.toggle('on', on);
  });
  ui.cross.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
}

function pointer(e) {
  const p = { x: (e.clientX - CX) / R, y: -(e.clientY - CY) / R };
  const m = Math.hypot(p.x, p.y);
  if (m > 1.08) { p.x *= 1.08 / m; p.y *= 1.08 / m; }
  return p;
}
svg.addEventListener('pointerdown', (e) => {
  dragging = true; svg.setPointerCapture(e.pointerId);
  // pressing a site sends the crosshair there; pressing anywhere else grabs it there
  const p = pointer(e);
  const hit = SITES.find((s) => Math.hypot(s.x - p.x, s.y - p.y) < 0.16);
  Object.assign(aim, hit ? { x: hit.x, y: hit.y } : p);
});
svg.addEventListener('pointermove', (e) => { if (dragging) Object.assign(aim, pointer(e)); });
const up = () => { dragging = false; };
svg.addEventListener('pointerup', up);
svg.addEventListener('pointercancel', up);
svg.addEventListener('dblclick', () => Object.assign(aim, { x: 0, y: 0 }));

// ---------------------------------------------------------------- the morph: springs per muscle
const pos = new Float32Array(KEYS.length), vel = new Float32Array(KEYS.length);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // the crosshair glides to where it is aimed (a press on a site travels; a drag follows closely)
  const k = 1 - Math.exp(-dt * (dragging ? 30 : 7));
  cross.x += (aim.x - cross.x) * k; cross.y += (aim.y - cross.y) * k;
  const wt = weights(cross);
  for (let j = 0; j < KEYS.length; j++) {
    let target = 0;
    for (let i = 0; i < wt.all.length; i++) target += wt.w[i] * wt.all[i].mix[j];
    const om = OMEGA[KEYS[j]] ?? 9;
    const acc = om * om * (target - pos[j]) - 2 * ZETA * om * vel[j];
    vel[j] += acc * dt; pos[j] += vel[j] * dt;
  }
  if (mesh) {
    const inf = mesh.morphTargetInfluences;
    KEYS.forEach((name, j) => {
      inf[keyIndex[name]] = pos[j];
      const wi = keyIndex[name + '_w'];
      if (wi !== undefined) inf[wi] = onset(pos[j]) * Math.sign(pos[j] || 1);
    });
  }
  // the mask turns a little towards the expression, and breathes
  const t = now / 1000;
  rig.rotation.y = 0.10 * cross.x + 0.015 * Math.sin(t * 0.31);
  rig.rotation.x = -0.07 * cross.y + 0.012 * Math.sin(t * 0.23 + 1);
  drawSurface(wt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// for the test rig (?test): read the state, or send the crosshair somewhere
if (new URLSearchParams(location.search).has('test')) window.__mask = { aim, cross, pos, KEYS, SITES, renderer, scene, camera, go: (name) => { const s = SITES.find((t) => t.name === name); Object.assign(aim, s ? { x: s.x, y: s.y } : { x: 0, y: 0 }); } };
addEventListener('resize', layout);
layout();
requestAnimationFrame(frame);
</script>
</body>
