<!doctype html><meta charset="utf-8"><title>rig: mkkellogg 0.4.7</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#v{width:100%;height:100%}#hud{position:fixed;left:8px;top:8px;color:#0f0;font:12px monospace;white-space:pre;background:#0008;padding:4px}</style>
<div id="v"></div><div id="hud">loading…</div>
<script src="./shot.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","@mkkellogg/gaussian-splats-3d":"https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"}}</script>
<script type="module">
import * as GS from '@mkkellogg/gaussian-splats-3d';
import * as THREE from 'three';
import { q, scene, pos, look, up, fov, hud, fpsLoop, sync } from './common.js';
const root = document.getElementById('v');
const renderer = new THREE.WebGLRenderer({ antialias:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(root.clientWidth, root.clientHeight); root.appendChild(renderer.domElement);
const viewer = new GS.Viewer({ renderer, rootElement: root, selfDrivenMode: false,
  initialCameraPosition: pos, initialCameraLookAt: look, cameraUp: up,
  showLoadingUI: false, sphericalHarmonicsDegree: 0, gpuAcceleratedSort: false,
  sharedMemoryForWorkers: true, logLevel: GS.LogLevel.None });
viewer.camera.fov = fov; viewer.camera.updateProjectionMatrix();
const file = q.get('file') || `./ksplat/${scene}.ksplat`;
const t0 = performance.now(); let tLoad = 0;
await viewer.addSplatScene(file, { progressiveLoad: false, splatAlphaRemovalThreshold: Number(q.get('alpha') || 1) });
tLoad = (performance.now() - t0) / 1000;
window.__rig = { viewer, ready: true };
window.__render = () => { viewer.update(); viewer.render(); };
fpsLoop(`mkkellogg 0.4.7 [webgl2]  ${file.split('/').pop()}`, () => `load ${tLoad.toFixed(1)}s  splats ${viewer.getSplatMesh().getSplatCount().toLocaleString()}`, () => { viewer.update(); viewer.render(); if (sync) renderer.getContext().finish(); });
</script>
