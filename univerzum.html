  "6": {
    "title": "Soukromá ZŠ UNIVERZUM s.r.o., se sídlem Českolipská 373, Praha 9",
    "content": "<div><div class=\"rada\">\n<h1 style=\"border:1px outset;background-color:#f5f5f5;color:Darkgreen;font-face:Garamond,Times,serif\">ŠKOLSKÁ RADA</h1>\n<p>Podle §167 z.č. 561/2004Sb. (nový školský zákon) se při základních školách zřizuje školská rada.</p>\n<p>Školská rada je orgán školy umožňující zákonným zástupcům nezletilých žáků, pedagogickým pracovníkům, zřizovateli a dalším osobám podílet se na správě školy.</p>\n<p>Funkční období členů školské rady je tři roky.</p>\n<p>Školská rada zasedá nejméně dvakrát ročně, zasedání svolává její předseda. Ředitel školy nebo jím pověřený zástupce je povinen se zúčastnit zasedání školské rady na vyzvání jejího předsedy. Školská rada na svém prvním zasedání stanoví svůj jednací řád a zvolí svého předsedu. K přijetí jednacího řádu se vyžaduje schválení nadpoloviční většinou všech členů školské rady.</p>\n<div>Podle §168 školská rada</div>\n<ol style='list-style-type:lower-alpha'>\n<li>vyjadřuje se k návrhům školních vzdělávacích programů a k jejich následnému uskutečňování</li>\n<li>schvaluje výroční zprávu o činnosti školy</li>\n<li>schvaluje školní řád a navrhuje jeho změny</li>\n<li>schvaluje pravidla pro hodnocení výsledků vzdělávání žáků</li>\n<li>podílí se na zpracování koncepčních záměrů rozvoje školy</li>\n<li>projednává návrh rozpočtu právnické osoby na další rok, vyjadřuje se k rozboru hospodaření a navrhuje opatření ke zlepšení hospodaření</li>\n<li>projednává inspekční zprávy České školní inspekce, podává podněty a oznámení řediteli školy, zřizovateli, orgánům vykonávajícím státní správu ve školství a dalším orgánům státní správy.</li>\n</ol>\n<p>Ředitel školy je povinen umožnit školské radě přístup k informacím o škole, zejména k dokumentaci školy. Informace chráněné podle zvláštních právních předpisů poskytne ředitel školy školské radě pouze za podmínek stanovených těmito zvláštními právními předpisy. Poskytování informací podle zákona o svobodném přístupu k informacím tímto není dotčeno.</p>\n<p>O schválení dokumentů uvedených pod písmeny b) až d) rozhodne školská rada do 1 měsíce od jejich předložení ředitelem školy. Pokud školská rada tento dokument neschválí, ředitel školy předloží dokument k novému projednání do 1 měsíce. Opakovaného projednání se účastní zřizovatel. Není-li dokument schválen ani po opakovaném projednání nebo pokud školská rada neprojedná dokumenty pod písmeny b) až d) do 1 měsíce od jejich předložení ředitelem školy, rozhodne o dalším postupu bez zbytečného odkladu zřizovatel. V soukromých školách plní úkoly zřizovatele ředitel školy.</p>\n<p>Ustavující zasedání školské rady při Soukromé ZŠ UNIVERZUM se uskutečnilo 10. 10. 2005</p>\n</div></div>\n\t\t\t\t\t</div>\n\t\t\t\t\t<div class=\"uni_advertising_inside\"><a href=\"\" target=\"_self\"><img src=\"banner/\" alt=\"\"></a>",

    // Theme Management
    const THEMES = ['playful', 'corporate', 'premium'];
    let currentThemeIdx = THEMES.indexOf(localStorage.getItem('uni-theme') || 'playful');
    if(currentThemeIdx === -1) currentThemeIdx = 0; // Default to Playful
    document.documentElement.setAttribute('data-theme', THEMES[currentThemeIdx]);

    document.getElementById('theme-cycler').addEventListener('click', () => {
        currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
        const newTheme = THEMES[currentThemeIdx];
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('uni-theme', newTheme);
        
        // Soft transition
        const containerDiv = document.getElementById('content-container');
        containerDiv.animate([
            { opacity: 0, transform: 'translateY(10px)', filter: 'blur(4px)' },
            { opacity: 1, transform: 'translateY(0)', filter: 'blur(0)' }
        ], { duration: 400, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
        
        // Re-attach magnetic
        setTimeout(attachMagnetic, 50);
    });

    // Router Logic
    const render = () => {
        const hash = window.location.hash.replace('#', '') || '1';
        let [pg, sm] = hash.split('-');
        if (!pg && !sm) pg = 'index';

        const page = SITE_DATA[pg] || SITE_DATA['index'] || SITE_DATA['1'];
        if(!page) return;
        
        const topMenu = page.menu || SITE_DATA['1'].menu || [];
        document.getElementById('main-nav').innerHTML = topMenu.map(m => 
            `<a href="#${m.id}" class="nav-item magnetic ${m.id === pg ? 'active' : ''}">${m.text}</a>`
        ).join('');

        const subNav = page.submenu || [];
        const subNavDiv = document.getElementById('sub-nav');
        if(subNav.length > 0) {
            subNavDiv.innerHTML = subNav.map(s => 
                `<a href="#${s.pg}-${s.sm}" class="subnav-item magnetic ${s.sm === sm ? 'active' : ''}">${s.text}</a>`
            ).join('');
            subNavDiv.style.display = 'flex';
        } else {
            subNavDiv.innerHTML = '';
            subNavDiv.style.display = 'none';
        }

        let content = page.content;
        let title = page.title;
        if (sm && page.subpages && page.subpages[sm]) {
            content = page.subpages[sm].content || content;
            if(page.subpages[sm].title) title = page.subpages[sm].title;
        }
        
        // Inject Hero Grid explicitly on Landing Page
        if (pg === '1' && !sm) {
            content = `<div class="hero-contact-grid">${content}</div>`;
        }
        
        const contentDiv = document.getElementById('content-area');
        contentDiv.innerHTML = content || '<p>Obsah se připravuje...</p>';
        
        // Specific legacy sweeping
        if (pg === '9') {
            const divNodes = contentDiv.querySelectorAll('div[style]');
            divNodes.forEach(d => {
                const bg = d.style.backgroundColor.replace(/\s/g, '').toLowerCase();
                if (bg === 'rgb(255,0,0)' || bg === '#ff0000' || bg === 'red') {
                    d.removeAttribute('style');
                    d.className = 'login-warning-box';
                }
                if (bg === 'rgb(128,255,0)' || bg === '#80ff00' || bg === 'rgb(128, 255, 0)') {
                    d.removeAttribute('style');
                    d.className = 'login-success-box';
                }
            });
        }
        
        const containerDiv = document.getElementById('content-container');
        containerDiv.animate([
            { opacity: 0, transform: 'translateY(15px)' },
            { opacity: 1, transform: 'translateY(0)' }
        ], { duration: 300, easing: 'ease-out' });
        
        document.title = title ? `ZŠ Univerzum | ${title}` : 'ZŠ Univerzum';

        setTimeout(attachMagnetic, 50);
    };

    // Bulletproof Magnetic Code (No Cloning)
    function attachMagnetic() {
        const attractors = document.querySelectorAll('.magnetic');
        
        attractors.forEach(element => {
            // Ensure we don't double attach
            if(element.getAttribute('data-magnetic-bound') === 'true') return;
            element.setAttribute('data-magnetic-bound', 'true');
            
            element.addEventListener('mousemove', e => {
                if(window.innerWidth < 768) return;
                
                const rect = element.getBoundingClientRect();
                const h = rect.width / 2;
                const w = rect.height / 2;
                const x = e.clientX - rect.left - h;
                const y = e.clientY - rect.top - w;
                
                element.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
            });
            
            element.addEventListener('mouseleave', () => {
                element.style.transform = 'translate(0px, 0px)';
            });
        });
    }

    window.addEventListener('hashchange', render);
    
    document.addEventListener("DOMContentLoaded", () => {
        render();
    });
    
  </script>
