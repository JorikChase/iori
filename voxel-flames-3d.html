<body>
    <div id="error-msg"></div>
    <canvas id="c"></canvas>
    <script>
        (function () {
            // =================================================================
            // VOXEL FLAMES 3D
            //
            // One automaton, three dimensions. The scheme is the same stable-
            // fluids loop as flame-simulation.html — splat, buoyancy, curl,
            // spin memory, vorticity confinement, divergence, Jacobi pressure,
            // gradient subtract, advect — with every operator extended from 2D
            // to 3D: velocity is a vec3, curl is the full vorticity vector,
            // the Laplacian has six neighbours instead of four.
            //
            // STORAGE. WebGL2 cannot render into a 3D texture in one pass, so
            // the volume is flattened into a 2D atlas: RES.z slices tiled
            // TILES.x by TILES.y. Every simulation pass is then a single
            // fullscreen quad over the whole atlas, exactly as in 2D. Sampling
            // is bilinear in XY (hardware, clamped inside each tile so slices
            // never bleed across a seam) and lerped manually across Z.
            //
            // DISPLAY. The grid is drawn by a DDA voxel raycaster rather than a
            // million instanced cubes: one fragment per pixel walks the grid
            // cell by cell, so cost scales with the screen, not the volume, and
            // the hard cell boundaries give true cube faces. Voxels are solid
            // for their whole life and only turn to glass as they die, so the
            // last of the smoke fades out and reveals what lies behind it.
            //
            // ADAPTIVE DOMAIN. The grid is not fixed. Every tenth step a probe
            // measures the density sitting against each wall, and any wall the
            // flame has reached moves out by ten cells, with the existing state
            // transplanted into the larger grid. Because cell size never
            // changes, no operator above needs a metric term — the physics is
            // identical, there is simply more room. The floor is the exception:
            // the fuel rests on it, so it stays put.
            //
            // The only fuel source is a constant injection just above the
            // floor, which sits at world origin (0,0,0) and stays there no
            // matter how the grid grows around it. Mouse orbits, wheel zooms.
            // =================================================================

            function showError(msg) {
                const errDiv = document.getElementById('error-msg');
                errDiv.style.display = 'block';
                errDiv.innerText = msg;
            }
            window.addEventListener('error', e => showError('Error: ' + e.message));

            const canvas = document.getElementById('c');
            const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
            if (!gl) { showError('WebGL 2.0 is not supported on your device.'); return; }
            if (!gl.getExtension('EXT_color_buffer_float')) {
                showError('Floating point render targets are not supported on this device.');
                return;
            }
            gl.getExtension('OES_texture_float_linear');

            // --- VOLUME LAYOUT -----------------------------------------------
            // RES.z slices tiled into one atlas. TILES.x * TILES.y must equal
            // RES.z, and the atlas must fit MAX_TEXTURE_SIZE.
            // Starting size. The domain grows from here as the flame reaches
            // its walls, so these are a floor, not a limit.
            let RES = [96, 128, 96];
            let TILES = [12, 8];                       // 12 * 8 = 96 slices
            let ATLAS = [RES[0] * TILES[0], RES[1] * TILES[1]];  // 1152 x 1024

            const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
            if (ATLAS[0] > maxTex || ATLAS[1] > maxTex) {
                showError('Volume atlas ' + ATLAS[0] + 'x' + ATLAS[1] + ' exceeds this device\'s limit of ' + maxTex + '. Lower RES.');
                return;
            }

            // Velocities are cells/second, so every force constant has to be
            // rescaled by how many cells now span the distance it acts over.
            // What matters for a flame is the climb, and the 2D grid was 144
            // cells tall — so the reference is this volume's HEIGHT, not its
            // width. (Scaling by width instead starves the buoyancy and the
            // plume never leaves the floor.)
            const SCALE = RES[1] / 144.0;

            const CONFIG = {
                DENSITY_DISSIPATION: 0.9995,
                VELOCITY_DISSIPATION: 0.992,
                SPIN_DISSIPATION: 0.995,
                // A 3D Jacobi solve converges slower than the 2D one, and an
                // under-solved pressure field leaves residual divergence that
                // eats density — the plume thins out instead of rising whole.
                // Lower this first if the volume runs heavy.
                PRESSURE_ITERATIONS: 20,
                // Confinement is an acceleration per unit vorticity, so it
                // scales with the grid like the rest.
                CURL: 30.0 * SCALE,
                SPLAT_RADIUS: 0.008,
                SPLAT_FORCE: 200.0 * SCALE,
                BUOYANCY: 180.0 * SCALE,
                SIM_SPEED: 1.6,
                // Gentle drift rather than the 2D version's gusting. In a
                // volume the wind pushes the plume through depth as well as
                // across, so the same strength reads as much harsher here.
                WIND_STRENGTH: 80.0 * SCALE
            };

            // --- SHADER BUILDING BLOCKS --------------------------------------

            const baseVs = `#version 300 es
            in vec2 aPosition; out vec2 vUv;
            void main() { vUv = aPosition * 0.5 + 0.5; gl_Position = vec4(aPosition, 0.0, 1.0); }`;

            // Atlas addressing, shared by every pass.
            const atlasLib = `#version 300 es
            precision highp float; precision highp sampler2D;
            in vec2 vUv; out vec4 outColor;
            uniform vec3 uRes; uniform vec2 uTiles; uniform vec2 uAtlas; uniform float uDt;
            // Where world (0,0,0) sits in the cell grid, and a fixed reference
            // width. Both let brush size, noise scale and the rendered frame
            // stay put while the domain grows around them.
            uniform vec3 uOrigin; uniform float uRef;

            // This fragment's atlas texel as a voxel coordinate (cell centers).
            vec3 cellCoord() {
                vec2 f = gl_FragCoord.xy;
                vec2 tile = floor(f / uRes.xy);
                float z = tile.y * uTiles.x + tile.x;
                return vec3(f - tile * uRes.xy, z + 0.5);
            }

            // One slice. XY is hardware-bilinear but clamped half a texel inside
            // the tile, so a neighbouring slice can never bleed across the seam.
            vec4 sampleSlice(sampler2D tex, vec2 xy, float z) {
                // Callers pass cell centers (k + 0.5) as well as plain indices,
                // so snap to the slice first — a fractional index would land the
                // lookup halfway between two tiles.
                z = floor(clamp(z, 0.0, uRes.z - 1.0));
                vec2 tile = vec2(mod(z, uTiles.x), floor(z / uTiles.x));
                vec2 uv = (tile * uRes.xy + clamp(xy, vec2(0.5), uRes.xy - 0.5)) / uAtlas;
                return texture(tex, uv);
            }

            // Full trilinear: bilinear within each slice, lerped across two.
            vec4 sampleVol(sampler2D tex, vec3 p) {
                float z0 = floor(p.z - 0.5);
                float fz = p.z - 0.5 - z0;
                return mix(sampleSlice(tex, p.xy, z0), sampleSlice(tex, p.xy, z0 + 1.0), fz);
            }

            float inBounds(vec3 p) {
                vec3 lo = step(vec3(0.0), p);
                vec3 hi = step(p, uRes);
                return lo.x * lo.y * lo.z * hi.x * hi.y * hi.z;
            }`;

            // The original's value noise, unchanged — it was already 3D.
            const noiseLib = `
            float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
            float noise(vec3 x) {
                vec3 i = floor(x); vec3 f = fract(x); vec3 u = f*f*(3.0-2.0*f);
                return mix(mix(mix( hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)),u.x),
                               mix( hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)),u.x),u.y),
                           mix(mix( hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)),u.x),
                               mix( hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)),u.x),u.y),u.z);
            }
            float fbm3(vec3 p) {
                float v = 0.0; float a = 0.5; vec3 shift = vec3(100.0);
                for (int i = 0; i < 3; ++i) {
                    v += a * (noise(p) * 2.0 - 1.0); p = p * 2.0 + shift; a *= 0.5;
                }
                return v;
            }
            float fbm4(vec3 p) {
                float v = 0.0; float a = 0.5; vec3 shift = vec3(100.0);
                for (int i = 0; i < 4; ++i) {
                    v += a * (noise(p) * 2.0 - 1.0); p = p * 2.0 + shift; a *= 0.5;
                }
                return v;
            }`;

            // The palettes, verbatim from flame-simulation.html.
            const paletteLib = `
            vec3 rainbowPalette(float t) {
                vec3 a = vec3(0.5, 0.5, 0.5); vec3 b = vec3(0.5, 0.5, 0.5); vec3 c = vec3(1.0, 1.0, 1.0); vec3 d = vec3(0.00, 0.33, 0.67);
                return a + b * cos(6.28318 * (c * t + d));
            }
            vec3 firePalette(float x) {
                x = clamp(x, 0.0, 1.0);
                vec3 c1 = vec3(0.02, 0.0, 0.0); vec3 c2 = vec3(0.8, 0.05, 0.0); vec3 c3 = vec3(1.0, 0.4, 0.0); vec3 c4 = vec3(1.0, 0.9, 0.1); vec3 c5 = vec3(1.0, 1.0, 1.0);
                if (x < 0.1) return mix(c1, c2, x * 10.0);
                if (x < 0.35) return mix(c2, c3, (x - 0.1) * 4.0);
                if (x < 0.7) return mix(c3, c4, (x - 0.35) * 2.85);
                return mix(c4, c5, (x - 0.7) * 3.33);
            }`;

            // --- SIMULATION PASSES (the 2D scheme, extended to 3D) -----------

            const buoyancyFs = `${atlasLib}
            uniform sampler2D uVelocity; uniform sampler2D uDensity; uniform float uBuoyancy; uniform vec2 uWind;
            void main() {
                vec3 c = cellCoord();
                vec3 vel = sampleSlice(uVelocity, c.xy, c.z).xyz;
                float T = sampleSlice(uDensity, c.xy, c.z).r;

                // Hot fire rises quickly. Cooler smoke loses lift and drifts.
                float buoyantForce = mix(uBuoyancy * 0.05, uBuoyancy, smoothstep(0.05, 0.4, T));
                vel.y += T * buoyantForce * uDt;

                // Wind affects smoke more visibly as it hangs in the air.
                // In 3D it is a horizontal vector, not a single axis.
                float drag = mix(1.5, 1.0, smoothstep(0.05, 0.4, T));
                vel.x += T * uWind.x * uDt * drag;
                vel.z += T * uWind.y * uDt * drag;

                outColor = vec4(vel, 1.0);
            }`;

            // Curl in 3D is the full vorticity vector, not a scalar.
            const curlFs = `${atlasLib}
            uniform sampler2D uVelocity;
            void main() {
                vec3 c = cellCoord();
                vec3 R = sampleSlice(uVelocity, c.xy + vec2(1.0, 0.0), c.z).xyz;
                vec3 L = sampleSlice(uVelocity, c.xy - vec2(1.0, 0.0), c.z).xyz;
                vec3 U = sampleSlice(uVelocity, c.xy + vec2(0.0, 1.0), c.z).xyz;
                vec3 D = sampleSlice(uVelocity, c.xy - vec2(0.0, 1.0), c.z).xyz;
                vec3 F = sampleSlice(uVelocity, c.xy, c.z + 1.0).xyz;
                vec3 B = sampleSlice(uVelocity, c.xy, c.z - 1.0).xyz;
                vec3 w = 0.5 * vec3(
                    (U.z - D.z) - (F.y - B.y),
                    (F.x - B.x) - (R.z - L.z),
                    (R.y - L.y) - (U.x - D.x));
                outColor = vec4(w, 1.0);
            }`;

            const spinAccumFs = `${atlasLib}
            uniform sampler2D uVelocity; uniform sampler2D uSource; uniform sampler2D uCurl; uniform float uDissipation;
            void main() {
                vec3 c = cellCoord();
                vec3 vel = sampleSlice(uVelocity, c.xy, c.z).xyz;
                vec3 past = c - uDt * vel;
                float pastSpin = sampleVol(uSource, past).x;
                // A 3D vorticity vector's magnitude runs above the 2D scalar
                // curl, so the gate feeding spin memory sits a little higher
                // than the original's (20, 60) — but only a little, or the
                // iridescent overlay never lights at all.
                float mag = length(sampleSlice(uCurl, c.xy, c.z).xyz);
                float curlPower = smoothstep(18.0, 55.0, mag) * 1.2;
                float newSpin = (pastSpin * uDissipation * inBounds(past)) + curlPower;
                outColor = vec4(newSpin, 0.0, 0.0, 1.0);
            }`;

            // Vorticity confinement: push along cross(N, w), where N points up
            // the vorticity-magnitude gradient. Same shape as the 2D version —
            // a unit direction, roughened by fbm, scaled by the curl magnitude.
            const vorticityFs = `${atlasLib}
            ${noiseLib}
            uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float uCurlScale; uniform float uTime;
            void main() {
                vec3 c = cellCoord();
                float R = length(sampleSlice(uCurl, c.xy + vec2(1.0, 0.0), c.z).xyz);
                float L = length(sampleSlice(uCurl, c.xy - vec2(1.0, 0.0), c.z).xyz);
                float U = length(sampleSlice(uCurl, c.xy + vec2(0.0, 1.0), c.z).xyz);
                float D = length(sampleSlice(uCurl, c.xy - vec2(0.0, 1.0), c.z).xyz);
                float F = length(sampleSlice(uCurl, c.xy, c.z + 1.0).xyz);
                float B = length(sampleSlice(uCurl, c.xy, c.z - 1.0).xyz);

                vec3 grad = 0.5 * vec3(R - L, U - D, F - B);
                vec3 N = grad / (length(grad) + 0.0001);

                vec3 w = sampleSlice(uCurl, c.xy, c.z).xyz;
                float mag = length(w);
                vec3 dir = cross(N, w) / (mag + 0.0001);

                // The 2D version roughened this direction with two noise
                // components; in 3D there are three, and an isotropic push
                // cancels the climb instead of curling around it. Kept as
                // detail on the confinement direction, not a force of its own.
                vec3 nc = ((c - uOrigin) / uRef) * 15.0 + vec3(0.0, 0.0, uTime * 0.4);
                vec3 micro = vec3(
                    fbm3(nc),
                    fbm3(nc + vec3(100.0, -100.0, 50.0)),
                    fbm3(nc + vec3(-50.0, 200.0, 120.0)));
                dir += micro * 0.6;

                vec3 force = dir * uCurlScale * mag;
                outColor = vec4(sampleSlice(uVelocity, c.xy, c.z).xyz + force * uDt, 1.0);
            }`;

            const advectFs = `${atlasLib}
            uniform sampler2D uVelocity; uniform sampler2D uSource; uniform float uDissipation;
            void main() {
                vec3 c = cellCoord();
                vec3 vel = sampleSlice(uVelocity, c.xy, c.z).xyz;
                vec3 past = c - uDt * vel;
                outColor = sampleVol(uSource, past) * uDissipation * inBounds(past);
            }`;

            const divergenceFs = `${atlasLib}
            uniform sampler2D uVelocity;
            void main() {
                vec3 c = cellCoord();
                float R = sampleSlice(uVelocity, c.xy + vec2(1.0, 0.0), c.z).x;
                float L = sampleSlice(uVelocity, c.xy - vec2(1.0, 0.0), c.z).x;
                float U = sampleSlice(uVelocity, c.xy + vec2(0.0, 1.0), c.z).y;
                float D = sampleSlice(uVelocity, c.xy - vec2(0.0, 1.0), c.z).y;
                float F = sampleSlice(uVelocity, c.xy, c.z + 1.0).z;
                float B = sampleSlice(uVelocity, c.xy, c.z - 1.0).z;
                outColor = vec4(0.5 * ((R - L) + (U - D) + (F - B)), 0.0, 0.0, 1.0);
            }`;

            // Jacobi, six neighbours.
            const pressureFs = `${atlasLib}
            uniform sampler2D uPressure; uniform sampler2D uDivergence;
            void main() {
                vec3 c = cellCoord();
                float R = sampleSlice(uPressure, c.xy + vec2(1.0, 0.0), c.z).x;
                float L = sampleSlice(uPressure, c.xy - vec2(1.0, 0.0), c.z).x;
                float U = sampleSlice(uPressure, c.xy + vec2(0.0, 1.0), c.z).x;
                float D = sampleSlice(uPressure, c.xy - vec2(0.0, 1.0), c.z).x;
                float F = sampleSlice(uPressure, c.xy, c.z + 1.0).x;
                float B = sampleSlice(uPressure, c.xy, c.z - 1.0).x;
                float div = sampleSlice(uDivergence, c.xy, c.z).x;
                outColor = vec4((L + R + U + D + F + B - div) / 6.0, 0.0, 0.0, 1.0);
            }`;

            const gradientFs = `${atlasLib}
            uniform sampler2D uPressure; uniform sampler2D uVelocity;
            void main() {
                vec3 c = cellCoord();
                float R = sampleSlice(uPressure, c.xy + vec2(1.0, 0.0), c.z).x;
                float L = sampleSlice(uPressure, c.xy - vec2(1.0, 0.0), c.z).x;
                float U = sampleSlice(uPressure, c.xy + vec2(0.0, 1.0), c.z).x;
                float D = sampleSlice(uPressure, c.xy - vec2(0.0, 1.0), c.z).x;
                float F = sampleSlice(uPressure, c.xy, c.z + 1.0).x;
                float B = sampleSlice(uPressure, c.xy, c.z - 1.0).x;
                vec3 vel = sampleSlice(uVelocity, c.xy, c.z).xyz;
                vel -= 0.5 * vec3(R - L, U - D, F - B);
                outColor = vec4(vel, 1.0);
            }`;

            // The brush, now a 3D blob: same fbm warp, same fragmenting mask,
            // same sharpening that keeps the injection hot instead of smoky.
            const splatFs = `${atlasLib}
            ${noiseLib}
            uniform sampler2D uTarget; uniform vec3 uPoint; uniform vec3 uColor; uniform float uRadius; uniform float uTime; uniform float uIsVelocity;
            void main() {
                vec3 c = cellCoord();
                // uPoint is a cell position and uRef a fixed reference width, so
                // the brush keeps its size and shape as the domain grows.
                vec3 p = (c - uPoint) / uRef;

                vec3 noiseCoord = p * 8.0 + uTime * 0.8;
                vec3 warp = vec3(
                    fbm4(noiseCoord),
                    fbm4(noiseCoord + vec3(100.0, -100.0, 50.0)),
                    fbm4(noiseCoord + vec3(-70.0, 30.0, 120.0)));
                vec3 warpedP = p + warp * 0.035;

                float shape = exp(-dot(warpedP, warpedP) / uRadius);
                float nTexture = fbm4(noiseCoord * 2.0 + uTime * 0.5);
                shape *= smoothstep(-0.2, 0.5, nTexture);
                shape = smoothstep(0.15, 0.4, shape);

                vec3 base = sampleSlice(uTarget, c.xy, c.z).xyz;
                vec3 splat = shape * uColor;
                outColor = vec4(mix(max(base, splat), base + splat, uIsVelocity), 1.0);
            }`;

            // --- DISPLAY: DDA VOXEL RAYCASTER --------------------------------

            const raycastFs = `${atlasLib}
            ${noiseLib}
            ${paletteLib}
            uniform sampler2D uTexture; uniform sampler2D uSpin; uniform float uTime;
            uniform vec3 uCamPos; uniform vec3 uCamRight; uniform vec3 uCamUp; uniform vec3 uCamFwd;
            uniform vec2 uScreen;

            // The original display shader, evaluated for a single voxel.
            // Palette, smoke, edge brightening and the spin overlay are the same
            // code; only the coordinates are 3D.
            vec4 shadeVoxel(ivec3 v, float temperature) {
                vec2 xy = vec2(v.xy) + 0.5;
                float z = float(v.z);
                vec3 nrm = (vec3(v) + 0.5 - uOrigin) / uRef;

                // Phase 2: Lingering Organic Smoke
                vec3 noiseCoord = nrm * 12.0 + vec3(0.0, 0.0, uTime * 0.2);
                float smokeNoise = fbm3(noiseCoord) * 0.5 + 0.5;
                vec3 smokeColor = mix(vec3(0.1, 0.12, 0.15), vec3(0.35, 0.35, 0.4), smokeNoise);

                // Phase 1: Bright Fire Gradient
                float fireFactor = smoothstep(0.1, 1.0, temperature);
                vec3 fireColorBase = firePalette(fireFactor);

                // Brighten Edges — in 3D the forward neighbours are +x, +y, +z.
                float R = sampleSlice(uTexture, xy + vec2(1.0, 0.0), z).r;
                float U = sampleSlice(uTexture, xy + vec2(0.0, 1.0), z).r;
                float F = sampleSlice(uTexture, xy, z + 1.0).r;
                fireColorBase += max(0.0, temperature - (R + U + F) / 3.0) * 0.5 * vec3(1.0, 0.8, 0.4);

                // Composite Smoke and Fire
                vec3 finalColor = mix(smokeColor, fireColorBase, smoothstep(0.1, 0.35, temperature));
                finalColor *= smoothstep(0.0, 0.01, temperature);

                // Phase 3: Magic Iridescent Overlay
                float spin = sampleSlice(uSpin, xy, z).r;
                float magicIntensity = smoothstep(4.0, 12.0, spin);
                if (magicIntensity > 0.0 && temperature > 0.01) {
                    float palT = uTime * 0.5 + nrm.x * 3.0 + nrm.y * 3.0 - spin * 0.1;
                    vec3 magicColor = rainbowPalette(palT);
                    float tempMask = smoothstep(0.01, 0.2, temperature) * (1.0 - smoothstep(0.4, 0.9, temperature));
                    finalColor += magicColor * magicIntensity * 1.2 * tempMask;
                }

                // Solid while it burns, glass as it dies. The ramp is longer
                // than the 2D version's fade because a ray crosses many cells:
                // opacity compounds with depth, so making every live cell fully
                // solid builds a grey shell that buries the fire inside it.
                // Fire is opaque; smoke thins out across the back half of its
                // life. Shorten the upper bound toward 0.08 for a denser,
                // more solid volume; lengthen it for wispier smoke.
                float alpha = smoothstep(0.005, 0.30, temperature);
                return vec4(finalColor, alpha);
            }

            void main() {
                vec2 ndc = vUv * 2.0 - 1.0;
                vec3 rd = normalize(uCamFwd + uCamRight * ndc.x * uScreen.x + uCamUp * ndc.y * uScreen.y);
                // Keep every component non-zero so the DDA's divisions stay finite.
                if (abs(rd.x) < 1e-6) rd.x = 1e-6;
                if (abs(rd.y) < 1e-6) rd.y = 1e-6;
                if (abs(rd.z) < 1e-6) rd.z = 1e-6;

                vec3 bg = vec3(0.0196, 0.0, 0.0);
                vec3 boxMin = -uOrigin;
                vec3 boxMax = boxMin + uRes;

                vec3 t1 = (boxMin - uCamPos) / rd;
                vec3 t2 = (boxMax - uCamPos) / rd;
                vec3 lo = min(t1, t2), hi = max(t1, t2);
                float tNear = max(max(lo.x, lo.y), lo.z);
                float tFar = min(min(hi.x, hi.y), hi.z);
                if (tNear > tFar || tFar < 0.0) { outColor = vec4(bg, 1.0); return; }

                // Enter the grid and set up Amanatides & Woo traversal.
                vec3 p = uCamPos + rd * (max(tNear, 0.0) + 0.0001) - boxMin;
                ivec3 v = clamp(ivec3(floor(p)), ivec3(0), ivec3(uRes) - 1);
                ivec3 s = ivec3(sign(rd));
                vec3 tDelta = abs(1.0 / rd);
                vec3 boundary = vec3(v) + max(vec3(s), 0.0);
                vec3 tMax = (boundary - p) / rd;

                vec4 acc = vec4(0.0);
                for (int i = 0; i < 320; i++) {
                    // Cheap rejection first: empty cells cost one fetch.
                    float temperature = sampleSlice(uTexture, vec2(v.xy) + 0.5, float(v.z)).r;
                    if (temperature > 0.005) {
                        vec4 c = shadeVoxel(v, temperature);
                        float a = (1.0 - acc.a) * c.a;
                        acc.rgb += a * c.rgb;
                        acc.a += a;
                        if (acc.a > 0.99) break;
                    }

                    // Step to the next cell along whichever axis is nearest.
                    if (tMax.x < tMax.y && tMax.x < tMax.z) { v.x += s.x; tMax.x += tDelta.x; }
                    else if (tMax.y < tMax.z) { v.y += s.y; tMax.y += tDelta.y; }
                    else { v.z += s.z; tMax.z += tDelta.z; }

                    if (v.x < 0 || v.y < 0 || v.z < 0 ||
                        v.x >= int(uRes.x) || v.y >= int(uRes.y) || v.z >= int(uRes.z)) break;
                }

                outColor = vec4(acc.rgb + bg * (1.0 - acc.a), 1.0);
            }`;

            // --- ADAPTIVE DOMAIN ---------------------------------------------

            // Measures how much density is sitting in the shell just inside each
            // of the six faces, and writes one texel per face. Sampling a sparse
            // lattice rather than every cell keeps this negligible; it only has
            // to answer "is the flame reaching this wall yet".
            const probeFs = `${atlasLib}
            uniform sampler2D uTexture;
            void main() {
                int f = int(gl_FragCoord.x);
                float m = 0.0;
                const int N = 20;
                float depth = 2.5;
                for (int i = 0; i < N; i++) {
                    for (int j = 0; j < N; j++) {
                        vec2 t = (vec2(float(i), float(j)) + 0.5) / float(N);
                        vec3 c;
                        if (f == 0)      c = vec3(depth,             t.x * uRes.y, t.y * uRes.z);
                        else if (f == 1) c = vec3(uRes.x - depth,    t.x * uRes.y, t.y * uRes.z);
                        else if (f == 2) c = vec3(t.x * uRes.x, depth,             t.y * uRes.z);
                        else if (f == 3) c = vec3(t.x * uRes.x, uRes.y - depth,    t.y * uRes.z);
                        else if (f == 4) c = vec3(t.x * uRes.x, t.y * uRes.y, depth);
                        else             c = vec3(t.x * uRes.x, t.y * uRes.y, uRes.z - depth);
                        m = max(m, sampleSlice(uTexture, c.xy, c.z).r);
                    }
                }
                // Scaled so an 8-bit readback still resolves the small
                // densities that matter at a boundary.
                outColor = vec4(min(1.0, m * 20.0), 0.0, 0.0, 1.0);
            }`;

            // Transplants a field into a larger grid. Offsets are whole cells,
            // so this is an exact texel-for-texel move — no resampling, and the
            // simulation continues without a seam.
            const copyFs = `${atlasLib}
            uniform sampler2D uSource; uniform vec3 uOldRes; uniform vec2 uOldTiles; uniform vec2 uOldAtlas; uniform vec3 uOffset;
            vec4 sampleOld(sampler2D tex, vec2 xy, float z) {
                z = floor(clamp(z, 0.0, uOldRes.z - 1.0));
                vec2 tile = vec2(mod(z, uOldTiles.x), floor(z / uOldTiles.x));
                vec2 uv = (tile * uOldRes.xy + clamp(xy, vec2(0.5), uOldRes.xy - 0.5)) / uOldAtlas;
                return texture(tex, uv);
            }
            void main() {
                vec3 c = cellCoord() - uOffset;
                if (c.x < 0.0 || c.y < 0.0 || c.z < 0.0 ||
                    c.x > uOldRes.x || c.y > uOldRes.y || c.z > uOldRes.z) {
                    outColor = vec4(0.0); return;
                }
                outColor = sampleOld(uSource, c.xy, c.z);
            }`;

            // --- PLUMBING ----------------------------------------------------

            const UNIFORMS = ['uRes', 'uTiles', 'uAtlas', 'uDt', 'uOrigin', 'uRef',
                'uOldRes', 'uOldTiles', 'uOldAtlas', 'uOffset', 'uVelocity', 'uSource', 'uPressure',
                'uDivergence', 'uCurl', 'uCurlScale', 'uDissipation', 'uTarget', 'uPoint', 'uColor',
                'uRadius', 'uTexture', 'uDensity', 'uBuoyancy', 'uTime', 'uWind', 'uIsVelocity',
                'uSpin', 'uCamPos', 'uCamRight', 'uCamUp', 'uCamFwd', 'uScreen'];

            function createProgram(vs, fs) {
                const program = gl.createProgram();
                const vsS = gl.createShader(gl.VERTEX_SHADER), fsS = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(vsS, vs); gl.shaderSource(fsS, fs);
                gl.compileShader(vsS); gl.compileShader(fsS);
                if (!gl.getShaderParameter(vsS, gl.COMPILE_STATUS)) showError('VS: ' + gl.getShaderInfoLog(vsS));
                if (!gl.getShaderParameter(fsS, gl.COMPILE_STATUS)) showError('FS: ' + gl.getShaderInfoLog(fsS));
                gl.attachShader(program, vsS); gl.attachShader(program, fsS); gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) showError('Link: ' + gl.getProgramInfoLog(program));
                return { id: program, uni: Object.fromEntries(UNIFORMS.map(n => [n, gl.getUniformLocation(program, n)])) };
            }

            function createFBO(w, h) {
                gl.activeTexture(gl.TEXTURE0);
                const texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
                const fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                gl.viewport(0, 0, w, h); gl.clear(gl.COLOR_BUFFER_BIT);
                return { fbo, texture, width: w, height: h, attach: (id) => { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id; } };
            }
            function createDoubleFBO(w, h) {
                let a = createFBO(w, h), b = createFBO(w, h);
                return { read: () => a, write: () => b, swap: () => { const t = a; a = b; b = t; } };
            }

            const programs = {
                buoyancy: createProgram(baseVs, buoyancyFs), curl: createProgram(baseVs, curlFs),
                vorticity: createProgram(baseVs, vorticityFs), advect: createProgram(baseVs, advectFs),
                spinAccum: createProgram(baseVs, spinAccumFs), divergence: createProgram(baseVs, divergenceFs),
                pressure: createProgram(baseVs, pressureFs), gradient: createProgram(baseVs, gradientFs),
                splat: createProgram(baseVs, splatFs), raycast: createProgram(baseVs, raycastFs),
                probe: createProgram(baseVs, probeFs), copy: createProgram(baseVs, copyFs)
            };

            const quadVAO = gl.createVertexArray();
            gl.bindVertexArray(quadVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(0);

            // The four fields that carry state between frames must survive a
            // regrow; divergence and curl are rebuilt every frame, so they are
            // simply reallocated.
            let velocity = createDoubleFBO(ATLAS[0], ATLAS[1]);
            let density = createDoubleFBO(ATLAS[0], ATLAS[1]);
            let pressure = createDoubleFBO(ATLAS[0], ATLAS[1]);
            let spinMemory = createDoubleFBO(ATLAS[0], ATLAS[1]);
            let divergence = createFBO(ATLAS[0], ATLAS[1]);
            let curl = createFBO(ATLAS[0], ATLAS[1]);

            // Where world (0,0,0) — the fuel source — sits in the cell grid, and
            // the fixed reference width that keeps brush size and noise scale
            // constant no matter how far the domain has grown.
            const ROOT_FRAC = 0.05;
            const REF = RES[0];
            let origin = [RES[0] * 0.5, RES[1] * ROOT_FRAC, RES[2] * 0.5];

            // Probe target: one texel per face, read back on the CPU.
            const probeTarget = (() => {
                gl.activeTexture(gl.TEXTURE0);
                const texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 6, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                const fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                return { fbo, texture, width: 6, height: 1 };
            })();
            const probePixels = new Uint8Array(6 * 4);

            function blit(dest) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, dest ? dest.fbo : null);
                gl.viewport(0, 0, dest ? dest.width : canvas.width, dest ? dest.height : canvas.height);
                gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
            }

            function runProgram(p, uniforms, out) {
                gl.useProgram(p.id);
                gl.uniform3fv(p.uni.uRes, RES);
                gl.uniform2fv(p.uni.uTiles, TILES);
                gl.uniform2fv(p.uni.uAtlas, ATLAS);
                if (p.uni.uOrigin) gl.uniform3fv(p.uni.uOrigin, origin);
                if (p.uni.uRef) gl.uniform1f(p.uni.uRef, REF);
                for (let k in uniforms) {
                    const loc = p.uni[k]; if (!loc) continue;
                    const val = uniforms[k];
                    if (val.attach) gl.uniform1i(loc, val.attach(val.unit));
                    else if (val.length === 2) gl.uniform2fv(loc, val);
                    else if (val.length === 3) gl.uniform3fv(loc, val);
                    else gl.uniform1f(loc, val);
                }
                blit(out);
            }

            function applySplat(point, color, intensity, rMult, t) {
                runProgram(programs.splat, {
                    uTarget: { ...velocity.read(), unit: 0 }, uPoint: point,
                    uColor: [color[0] * CONFIG.SPLAT_FORCE, color[1] * CONFIG.SPLAT_FORCE, color[2] * CONFIG.SPLAT_FORCE],
                    uRadius: CONFIG.SPLAT_RADIUS * rMult, uTime: t, uIsVelocity: 1.0
                }, velocity.write()); velocity.swap();

                runProgram(programs.splat, {
                    uTarget: { ...density.read(), unit: 0 }, uPoint: point,
                    uColor: [intensity, 0.0, 0.0],
                    uRadius: CONFIG.SPLAT_RADIUS * rMult, uTime: t, uIsVelocity: 0.0
                }, density.write()); density.swap();
            }

            // --- GROWTH ------------------------------------------------------
            // Every PROBE_EVERY steps, ask how close the flame has come to each
            // wall. Any wall it is reaching moves out by GROW cells, and the
            // existing state is transplanted into the larger grid. Cell size
            // never changes, so every operator above keeps working untouched —
            // the domain simply stops being in the way.
            //
            // The floor is excluded: the fuel sits on it by definition, so it
            // would trigger on every probe and the ground would run away.

            const GROW = 10;              // cells added per triggered face
            const PROBE_EVERY = 10;       // simulation steps between checks
            const PROBE_TRIGGER = 0.18;   // encoded density (~0.009 raw)
            // Ceiling on total cells. Growth is not free — this is the budget
            // that keeps a long-running flame from crawling to a halt.
            const MAX_CELLS = 2.6e6;

            function pickTiles(res) {
                // Squarest tiling of res.z slices that keeps the atlas legal.
                let best = null;
                for (let tx = 1; tx <= res[2]; tx++) {
                    const ty = Math.ceil(res[2] / tx);
                    const w = res[0] * tx, h = res[1] * ty;
                    if (w > maxTex || h > maxTex) continue;
                    const score = Math.abs(w - h);
                    if (!best || score < best.score) best = { tiles: [tx, ty], atlas: [w, h], score };
                }
                return best;
            }

            function copyField(field, oldRes, oldTiles, oldAtlas, offset, newAtlas) {
                const dst = createDoubleFBO(newAtlas[0], newAtlas[1]);
                runProgram(programs.copy, {
                    uSource: { ...field.read(), unit: 0 },
                    uOldRes: oldRes, uOldTiles: oldTiles, uOldAtlas: oldAtlas, uOffset: offset
                }, dst.write());
                dst.swap();
                return dst;
            }
            function destroyDouble(d) {
                for (const f of [d.read(), d.write()]) { gl.deleteFramebuffer(f.fbo); gl.deleteTexture(f.texture); }
            }

            function growDomain(add) {  // add = [-x, +x, +y, -z, +z] flags
                const newRes = [
                    RES[0] + (add.nx ? GROW : 0) + (add.px ? GROW : 0),
                    RES[1] + (add.py ? GROW : 0),
                    RES[2] + (add.nz ? GROW : 0) + (add.pz ? GROW : 0)
                ];
                if (newRes[0] * newRes[1] * newRes[2] > MAX_CELLS) return false;
                const layout = pickTiles(newRes);
                if (!layout) return false;

                const offset = [add.nx ? GROW : 0, 0, add.nz ? GROW : 0];
                const oldRes = RES.slice(), oldTiles = TILES.slice(), oldAtlas = ATLAS.slice();

                // cellCoord() decodes the NEW layout, so switch before copying.
                RES = newRes; TILES = layout.tiles; ATLAS = layout.atlas;

                const nv = copyField(velocity, oldRes, oldTiles, oldAtlas, offset, ATLAS);
                const nd = copyField(density, oldRes, oldTiles, oldAtlas, offset, ATLAS);
                const np = copyField(pressure, oldRes, oldTiles, oldAtlas, offset, ATLAS);
                const ns = copyField(spinMemory, oldRes, oldTiles, oldAtlas, offset, ATLAS);

                destroyDouble(velocity); destroyDouble(density);
                destroyDouble(pressure); destroyDouble(spinMemory);
                for (const f of [divergence, curl]) { gl.deleteFramebuffer(f.fbo); gl.deleteTexture(f.texture); }

                velocity = nv; density = nd; pressure = np; spinMemory = ns;
                divergence = createFBO(ATLAS[0], ATLAS[1]);
                curl = createFBO(ATLAS[0], ATLAS[1]);

                // The source keeps its world position; only its cell index moves.
                origin = [origin[0] + offset[0], origin[1], origin[2] + offset[2]];
                return true;
            }

            function checkGrowth() {
                runProgram(programs.probe, { uTexture: { ...density.read(), unit: 0 } }, probeTarget);
                gl.bindFramebuffer(gl.FRAMEBUFFER, probeTarget.fbo);
                gl.readPixels(0, 0, 6, 1, gl.RGBA, gl.UNSIGNED_BYTE, probePixels);
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);

                const v = i => probePixels[i * 4] / 255;
                const add = {
                    nx: v(0) > PROBE_TRIGGER, px: v(1) > PROBE_TRIGGER,
                    py: v(3) > PROBE_TRIGGER,           // face 2 is the floor: never grown
                    nz: v(4) > PROBE_TRIGGER, pz: v(5) > PROBE_TRIGGER
                };
                if (add.nx || add.px || add.py || add.nz || add.pz) growDomain(add);
            }

            // --- ORBIT CAMERA ------------------------------------------------

            // Framing is fixed at the starting size and anchored on the source,
            // so the view does not drift or zoom as the domain grows.
            const TARGET = [0, RES[1] * 0.33, 0];
            const MIN_PHI = 1.0, MAX_PHI = 1.9;
            const MIN_RADIUS = RES[0] * 0.6, MAX_RADIUS = RES[1] * 3.3;
            const START_RADIUS = RES[1] * 2.3;
            let theta = 0.7, phi = 1.35, radius = START_RADIUS;
            let tTheta = 0.7, tPhi = 1.35, tRadius = START_RADIUS;

            let dragging = false, lastX = 0, lastY = 0;
            canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.style.cursor = 'grabbing'; });
            window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'grab'; });
            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                tTheta -= (e.clientX - lastX) * 0.005;
                tPhi = Math.max(MIN_PHI, Math.min(MAX_PHI, tPhi + (e.clientY - lastY) * 0.005));
                lastX = e.clientX; lastY = e.clientY;
            });
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                tRadius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, tRadius * Math.exp(e.deltaY * 0.001)));
            }, { passive: false });

            let pinch = 0;
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
                else if (e.touches.length === 2) { dragging = false; pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (e.touches.length === 1 && dragging) {
                    tTheta -= (e.touches[0].clientX - lastX) * 0.005;
                    tPhi = Math.max(MIN_PHI, Math.min(MAX_PHI, tPhi + (e.touches[0].clientY - lastY) * 0.005));
                    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    if (pinch > 0) tRadius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, tRadius * pinch / d));
                    pinch = d;
                }
            }, { passive: false });
            window.addEventListener('touchend', e => { if (e.touches.length === 0) dragging = false; });

            function windOsc(a) {
                return (Math.cos(a) * 0.5 + Math.cos(a * 2.7) * 0.3 + Math.cos(a * 5.1) * 0.2) * CONFIG.WIND_STRENGTH;
            }

            // --- MAIN LOOP ---------------------------------------------------

            const startTime = Date.now();
            let lastTime = Date.now();
            let frame = 0;
            const FOV = Math.PI / 4;

            function update() {
                const baseDt = Math.min((Date.now() - lastTime) / 1000, 0.016);
                lastTime = Date.now();
                const dt = baseDt * CONFIG.SIM_SPEED;
                const time = ((Date.now() - startTime) / 1000.0) * CONFIG.SIM_SPEED;

                const windAnim = time * 0.4;
                const wind = [windOsc(windAnim), windOsc(windAnim + 1.7)];

                gl.bindVertexArray(quadVAO);
                gl.disable(gl.BLEND);

                // Constant fuel injection at the volume's bottom-center — world
                // origin (0,0,0). A steady core plus a slowly orbiting swirl,
                // the 3D counterpart of the original's sub-swirl detail.
                // Fuel spreads through a volume here rather than across a plane,
                // so a source sized like the 2D brush thins below the fire range
                // almost immediately. A wider, richer column keeps the flame lit
                // for the same height the 2D version reached.
                // The source is a ball, so centering it on the floor plane buries
                // its lower half outside the grid and shears the root flat. Lift
                // it clear of the boundary — the flame still starts at the
                // origin, it just isn't cut in half by it.
                // The source is a cell position now, so it stays put in world
                // space when the grid grows underneath it.
                const vy = 0.0075;
                applySplat(origin, [0.0, vy, 0.0], 2.2, 1.0, time);

                const swirl = time * 45.0;
                applySplat(
                    [origin[0] + Math.cos(swirl) * 0.02 * REF, origin[1], origin[2] + Math.sin(swirl) * 0.02 * REF],
                    [Math.cos(swirl) * 0.075, vy, Math.sin(swirl) * 0.075],
                    1.2, 0.4, time);

                runProgram(programs.buoyancy, { uVelocity: { ...velocity.read(), unit: 0 }, uDensity: { ...density.read(), unit: 1 }, uBuoyancy: CONFIG.BUOYANCY, uWind: wind, uDt: dt }, velocity.write()); velocity.swap();
                runProgram(programs.curl, { uVelocity: { ...velocity.read(), unit: 0 } }, curl);
                runProgram(programs.spinAccum, { uVelocity: { ...velocity.read(), unit: 0 }, uSource: { ...spinMemory.read(), unit: 1 }, uCurl: { ...curl, unit: 2 }, uDt: dt, uDissipation: CONFIG.SPIN_DISSIPATION }, spinMemory.write()); spinMemory.swap();
                runProgram(programs.vorticity, { uVelocity: { ...velocity.read(), unit: 0 }, uCurl: { ...curl, unit: 1 }, uCurlScale: CONFIG.CURL, uDt: dt, uTime: time }, velocity.write()); velocity.swap();
                runProgram(programs.divergence, { uVelocity: { ...velocity.read(), unit: 0 } }, divergence);
                for (let i = 0; i < CONFIG.PRESSURE_ITERATIONS; i++) {
                    runProgram(programs.pressure, { uPressure: { ...pressure.read(), unit: 0 }, uDivergence: { ...divergence, unit: 1 } }, pressure.write()); pressure.swap();
                }
                runProgram(programs.gradient, { uPressure: { ...pressure.read(), unit: 0 }, uVelocity: { ...velocity.read(), unit: 1 } }, velocity.write()); velocity.swap();
                runProgram(programs.advect, { uVelocity: { ...velocity.read(), unit: 0 }, uSource: { ...velocity.read(), unit: 0 }, uDt: dt, uDissipation: CONFIG.VELOCITY_DISSIPATION }, velocity.write()); velocity.swap();
                runProgram(programs.advect, { uVelocity: { ...velocity.read(), unit: 0 }, uSource: { ...density.read(), unit: 1 }, uDt: dt, uDissipation: CONFIG.DENSITY_DISSIPATION }, density.write()); density.swap();

                // Every tenth step, see whether the flame has reached a wall and
                // move that wall out if so. The readback stalls the pipeline
                // briefly, which is why it is not done every frame.
                if (++frame % PROBE_EVERY === 0) checkGrowth();

                // Damped orbit, then one fullscreen raycast through the volume.
                theta += (tTheta - theta) * 0.12;
                phi += (tPhi - phi) * 0.12;
                radius += (tRadius - radius) * 0.12;

                const eye = [
                    TARGET[0] + radius * Math.sin(phi) * Math.sin(theta),
                    TARGET[1] + radius * Math.cos(phi),
                    TARGET[2] + radius * Math.sin(phi) * Math.cos(theta)
                ];
                let fx = TARGET[0] - eye[0], fy = TARGET[1] - eye[1], fz = TARGET[2] - eye[2];
                const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;

                // right = normalize(cross(fwd, worldUp)), worldUp = +Y
                let rx = -fz, ry = 0, rz = fx;
                const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;

                // up = cross(right, fwd)
                const ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;

                const tanHalf = Math.tan(FOV / 2);
                runProgram(programs.raycast, {
                    uTexture: { ...density.read(), unit: 0 },
                    uSpin: { ...spinMemory.read(), unit: 1 },
                    uTime: time,
                    uCamPos: eye, uCamRight: [rx, ry, rz], uCamUp: [ux, uy, uz], uCamFwd: [fx, fy, fz],
                    uScreen: [tanHalf * (canvas.width / canvas.height), tanHalf]
                }, null);

                requestAnimationFrame(update);
            }

            function resize() {
                // The raycast is one fragment per pixel, so DPR is the main
                // cost lever if the volume ever feels heavy.
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
            }
            window.addEventListener('resize', resize); resize();

            update();
        })();
    </script>
