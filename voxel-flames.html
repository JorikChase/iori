<body>
    <div id="error-msg"></div>
    <canvas id="c"></canvas>
    <script>
        (function () {
            // =================================================================
            // VOXEL FLAMES
            // The 2D fire automaton from flame-simulation.html translated to a
            // RES_X x RES_Y x 1 voxel grid. Every simulation shader and the
            // WebGL plumbing are identical to the original; only the display
            // changed: instanced cubes instead of a fullscreen quad, plus an
            // orbit camera. The only fuel source is a constant injection at
            // the grid's bottom-center, which sits at world origin (0,0,0).
            // No brush. Mouse orbits, wheel zooms.
            //
            // TWO SLICES, ONE WORLD
            // The automaton is a function (stepSlice) applied to a slice's own
            // state, so a second instance costs no change to the algorithm.
            // Slice A lies in the XY plane at z=0; slice B is rotated 90° about
            // the height axis onto the ZY plane at x=0. They share the origin,
            // the fuel source and one world wind vector — each plane feels that
            // wind's in-plane component. Slice B's noise is phase-offset, so it
            // burns independently rather than mirroring A.
            // =================================================================

            function showError(msg) {
                const errDiv = document.getElementById('error-msg');
                errDiv.style.display = 'block';
                errDiv.innerText = msg;
            }
            window.addEventListener('error', e => showError('Error: ' + e.message));

            const canvas = document.getElementById('c');
            const gl = canvas.getContext('webgl2', { alpha: false, antialias: true });
            if (!gl) { showError('WebGL 2.0 is not supported on your device.'); return; }

            const CONFIG = {
                DENSITY_DISSIPATION: 0.9995,
                VELOCITY_DISSIPATION: 0.992,
                SPIN_DISSIPATION: 0.995,
                PRESSURE_ITERATIONS: 20, CURL: 30.0, SPLAT_RADIUS: 0.008, SPLAT_FORCE: 200.0,
                BUOYANCY: 180.0,
                SIM_SPEED: 1.6,
                WIND_STRENGTH: 250.0
            };

            // Fixed automaton resolution (the voxel grid). The original's
            // dual-resolution scheme is preserved: velocity/pressure/curl/spin
            // on the sim grid, dye (temperature) on the higher-res dye grid.
            const RES_X = 256, RES_Y = 144;
            const DYE_X = 1024, DYE_Y = 576;

            gl.getExtension('EXT_color_buffer_float');
            gl.getExtension('OES_texture_float_linear');

            // --- SIMULATION SHADERS (verbatim from flame-simulation.html) ----

            const baseVs = `#version 300 es
            in vec2 aPosition; out vec2 vUv;
            void main() { vUv = aPosition * 0.5 + 0.5; gl_Position = vec4(aPosition, 0.0, 1.0); }`;

            const commonFs = `#version 300 es
            precision highp float; precision highp sampler2D; in vec2 vUv; out vec4 outColor; uniform vec2 uTexelSize; uniform float uDt;`;

            const buoyancyFs = `${commonFs}
            uniform sampler2D uVelocity; uniform sampler2D uDensity; uniform float uBuoyancy; uniform vec2 uWind;
            void main() {
                vec2 vel = texture(uVelocity, vUv).xy;
                float T = texture(uDensity, vUv).r;

                // Hot fire rises quickly. Cooler smoke loses lift and drifts.
                float buoyantForce = mix(uBuoyancy * 0.05, uBuoyancy, smoothstep(0.05, 0.4, T));
                vel.y += T * buoyantForce * uDt;

                // Wind affects smoke more visibly as it hangs in the air
                vel.x += T * uWind.x * uDt * mix(1.5, 1.0, smoothstep(0.05, 0.4, T));

                outColor = vec4(vel, 0.0, 1.0);
            }`;

            const curlFs = `${commonFs}
            uniform sampler2D uVelocity;
            void main() {
                float L = texture(uVelocity, vUv - vec2(uTexelSize.x, 0.0)).y; float R = texture(uVelocity, vUv + vec2(uTexelSize.x, 0.0)).y;
                float T = texture(uVelocity, vUv + vec2(0.0, uTexelSize.y)).x; float B = texture(uVelocity, vUv - vec2(0.0, uTexelSize.y)).x;
                outColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0); }`;

            const vorticityFs = `${commonFs}
            uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float uCurlScale; uniform float uTime;

            float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
            float noise(vec3 x) {
                vec3 i = floor(x); vec3 f = fract(x); vec3 u = f*f*(3.0-2.0*f);
                return mix(mix(mix( hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)),u.x),
                               mix( hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)),u.x),u.y),
                           mix(mix( hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)),u.x),
                               mix( hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)),u.x),u.y),u.z);
            }
            float fbm(vec3 p) {
                float v = 0.0; float a = 0.5; vec3 shift = vec3(100.0);
                for (int i = 0; i < 3; ++i) {
                    v += a * (noise(p) * 2.0 - 1.0);
                    p = p * 2.0 + shift;
                    a *= 0.5;
                }
                return v;
            }

            void main() {
                float L = texture(uCurl, vUv - vec2(uTexelSize.x, 0.0)).x; float R = texture(uCurl, vUv + vec2(uTexelSize.x, 0.0)).x;
                float T = texture(uCurl, vUv + vec2(0.0, uTexelSize.y)).x; float B = texture(uCurl, vUv - vec2(0.0, uTexelSize.y)).x; float C = texture(uCurl, vUv).x;
                vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
                force /= length(force) + 0.0001;
                vec3 noiseCoord = vec3(vUv * 15.0, uTime * 0.4);
                vec2 microForce = vec2(fbm(noiseCoord), fbm(noiseCoord + vec3(100.0, -100.0, 50.0)));
                force += microForce * 2.0;
                force *= uCurlScale * C;
                force.y *= -1.0;
                outColor = vec4(texture(uVelocity, vUv).xy + force * uDt, 0.0, 1.0); }`;

            const advectFs = `${commonFs}
            uniform sampler2D uVelocity; uniform sampler2D uSource; uniform float uDissipation;
            void main() {
                vec2 coord = vUv - uDt * texture(uVelocity, vUv).xy * uTexelSize;
                vec4 result = texture(uSource, coord);
                float mask = step(0.0, coord.x) * step(coord.x, 1.0) * step(0.0, coord.y) * step(coord.y, 1.0);
                outColor = result * uDissipation * mask;
            }`;

            const spinAccumFs = `${commonFs}
            uniform sampler2D uVelocity; uniform sampler2D uSource; uniform sampler2D uCurl; uniform float uDissipation;
            void main() {
                vec2 coord = vUv - uDt * texture(uVelocity, vUv).xy * uTexelSize;
                float pastSpin = texture(uSource, coord).x;
                float currentCurl = texture(uCurl, vUv).x;
                float mask = step(0.0, coord.x) * step(coord.x, 1.0) * step(0.0, coord.y) * step(coord.y, 1.0);
                float curlPower = smoothstep(20.0, 60.0, abs(currentCurl)) * 1.2;
                float newSpin = (pastSpin * uDissipation * mask) + curlPower;
                outColor = vec4(newSpin, 0.0, 0.0, 1.0);
            }`;

            const divergenceFs = `${commonFs}
            uniform sampler2D uVelocity;
            void main() {
                float L = texture(uVelocity, vUv - vec2(uTexelSize.x, 0.0)).x; float R = texture(uVelocity, vUv + vec2(uTexelSize.x, 0.0)).x;
                float T = texture(uVelocity, vUv + vec2(0.0, uTexelSize.y)).y; float B = texture(uVelocity, vUv - vec2(0.0, uTexelSize.y)).y;
                outColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0); }`;

            const pressureFs = `${commonFs}
            uniform sampler2D uPressure; uniform sampler2D uDivergence;
            void main() {
                float L = texture(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x; float R = texture(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
                float T = texture(uPressure, vUv + vec2(0.0, uTexelSize.y)).x; float B = texture(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
                outColor = vec4((L + R + T + B - texture(uDivergence, vUv).x) * 0.25, 0.0, 0.0, 1.0); }`;

            const gradientFs = `${commonFs}
            uniform sampler2D uPressure; uniform sampler2D uVelocity;
            void main() {
                float L = texture(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x; float R = texture(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
                float T = texture(uPressure, vUv + vec2(0.0, uTexelSize.y)).x; float B = texture(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
                vec2 velocity = texture(uVelocity, vUv).xy; velocity.xy -= vec2(R - L, T - B) * 0.5; outColor = vec4(velocity, 0.0, 1.0); }`;

            const splatFs = `${commonFs}
        uniform sampler2D uTarget; uniform float uAspectRatio; uniform vec2 uPoint; uniform vec3 uColor; uniform float uRadius; uniform float uTime; uniform float uIsVelocity; uniform vec2 uPointerVelocity;

        float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
        float noise(vec3 x) {
            vec3 i = floor(x); vec3 f = fract(x); vec3 u = f*f*(3.0-2.0*f);
            return mix(mix(mix( hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)),u.x),
                           mix( hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)),u.x),u.y),
                       mix(mix( hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)),u.x),
                           mix( hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)),u.x),u.y),u.z);
        }
        float fbm(vec3 p) {
            float v = 0.0; float a = 0.5; vec3 shift = vec3(100.0);
            for (int i = 0; i < 4; ++i) {
                v += a * (noise(p) * 2.0 - 1.0);
                p = p * 2.0 + shift; a *= 0.5;
            }
            return v;
        }

        void main() {
            vec2 p = vUv - uPoint.xy; p.x *= uAspectRatio;

            // Transform coordinates to stretch the brush based on velocity
            float speed = length(uPointerVelocity);
            float visualSpeed = min(speed * 5.0, 2.0); // Clamp the maximum stretch to prevent razor-thin streaks
            if (speed > 0.001) {
                vec2 dir = uPointerVelocity / speed;
                float pDotDir = dot(p, dir);
                vec2 proj = pDotDir * dir;
                vec2 perp = p - proj;

                // Stretch along movement path, pinch perpendicular to movement path
                float stretch = 1.0 + visualSpeed * 2.0;
                float pinch = 1.0 + visualSpeed * 0.5;

                p = (proj / stretch) + (perp * pinch);
            }

            vec3 noiseCoord = vec3(p * 8.0, uTime * 0.8);
            float warpX = fbm(noiseCoord); float warpY = fbm(noiseCoord + vec3(100.0, -100.0, 50.0));
            vec2 warpedP = p + vec2(warpX, warpY) * 0.035;
            float shape = exp(-dot(warpedP, warpedP) / uRadius);
            float nTexture = fbm(noiseCoord * 2.0 + vec3(0.0, 0.0, uTime * 0.5));
            shape *= smoothstep(-0.2, 0.5, nTexture); // Heavily fragment mask to make it organic

            // Sharpen the final shape to eliminate faint, low-density wisps from the brush.
            // This ensures we only inject "hot" fluid (fire) and completely prevents
            // the instant grey smoke halo from spawning around the cursor.
            shape = smoothstep(0.15, 0.4, shape);

            vec3 base = texture(uTarget, vUv).xyz; vec3 splat = shape * uColor;
            outColor = vec4(mix(max(base, splat), base + splat, uIsVelocity), 1.0);
        }`;

            // --- VOXEL DISPLAY SHADERS ---------------------------------------
            // The vertex shader evaluates the ORIGINAL display shader's code
            // (fire palette, smoke, edge-brighten, magic overlay — verbatim)
            // once per voxel at the cell center, producing one flat color per
            // cube. Near-black voxels collapse to zero size, so only fire,
            // smoke and rainbow vortices render.

            const voxelVs = `#version 300 es
        precision highp float; precision highp sampler2D;
        layout(location = 0) in vec3 aPosition;
        uniform mat4 uMvp;
        uniform sampler2D uTexture; uniform sampler2D uSpin; uniform float uTime;
        uniform vec2 uTexelSize;
        uniform vec2 uGrid;
        uniform float uAxis; // 0.0 = XY plane (z=0), 1.0 = ZY plane (x=0)
        uniform float uPass; // 0.0 = opaque voxels, 1.0 = dying smoke
        out vec3 vColor;
        out float vAlpha;

        float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
        float noise(vec3 x) {
            vec3 i = floor(x); vec3 f = fract(x); vec3 u = f*f*(3.0-2.0*f);
            return mix(mix(mix( hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)),u.x),
                           mix( hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)),u.x),u.y),
                       mix(mix( hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)),u.x),
                           mix( hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)),u.x),u.y),u.z);
        }
        float fbm(vec3 p) {
            float v = 0.0; float a = 0.5; vec3 shift = vec3(100.0);
            for (int i = 0; i < 3; ++i) {
                v += a * (noise(p) * 2.0 - 1.0); p = p * 2.0 + shift; a *= 0.5;
            }
            return v;
        }

        vec3 rainbowPalette(float t) {
            vec3 a = vec3(0.5, 0.5, 0.5); vec3 b = vec3(0.5, 0.5, 0.5); vec3 c = vec3(1.0, 1.0, 1.0); vec3 d = vec3(0.00, 0.33, 0.67);
            return a + b * cos(6.28318 * (c * t + d));
        }

        vec3 firePalette(float x) {
            x = clamp(x, 0.0, 1.0);
            vec3 c1 = vec3(0.02, 0.0, 0.0); vec3 c2 = vec3(0.8, 0.05, 0.0); vec3 c3 = vec3(1.0, 0.4, 0.0); vec3 c4 = vec3(1.0, 0.9, 0.1); vec3 c5 = vec3(1.0, 1.0, 1.0);
            if (x < 0.1) return mix(c1, c2, x * 10.0);
            if (x < 0.35) return mix(c2, c3, (x - 0.1) * 4.0);
            if (x < 0.7) return mix(c3, c4, (x - 0.35) * 2.85);
            return mix(c4, c5, (x - 0.7) * 3.33);
        }

        void main() {
            float fi = float(gl_InstanceID);
            float gx = mod(fi, uGrid.x);
            float gy = floor(fi / uGrid.x);
            vec2 vUv = (vec2(gx, gy) + 0.5) / uGrid;

            float temperature = texture(uTexture, vUv).r;

            // Phase 2: Lingering Organic Smoke
            vec3 noiseCoord = vec3(vUv * 12.0, uTime * 0.2);
            float smokeNoise = fbm(noiseCoord) * 0.5 + 0.5;
            // A subtle, highly textured dark grey/blue smoke base
            vec3 smokeColor = mix(vec3(0.1, 0.12, 0.15), vec3(0.35, 0.35, 0.4), smokeNoise);

            // Phase 1: Bright Fire Gradient
            float fireFactor = smoothstep(0.1, 1.0, temperature);
            vec3 fireColorBase = firePalette(fireFactor);

            // Brighten Edges
            float R = texture(uTexture, vUv + vec2(uTexelSize.x, 0.0)).r;
            float T_adj = texture(uTexture, vUv + vec2(0.0, uTexelSize.y)).r;
            fireColorBase += max(0.0, temperature - (R + T_adj)*0.5) * 0.5 * vec3(1.0, 0.8, 0.4);

            // Composite Smoke and Fire
            vec3 finalColor = mix(smokeColor, fireColorBase, smoothstep(0.1, 0.35, temperature));

            // Allow smoke to linger extremely long, but slowly fade out near absolute zero density
            finalColor *= smoothstep(0.0, 0.01, temperature);

            // Phase 3: Magic Iridescent Overlay (unaffected by smoke change)
            float spin = texture(uSpin, vUv).r;
            float magicIntensity = smoothstep(4.0, 12.0, spin);

            if (magicIntensity > 0.0 && temperature > 0.01) {
                float palT = uTime * 0.5 + vUv.x * 3.0 + vUv.y * 3.0 - spin * 0.1;
                vec3 magicColor = rainbowPalette(palT);
                float tempMask = smoothstep(0.01, 0.2, temperature) * (1.0 - smoothstep(0.4, 0.9, temperature));
                finalColor += magicColor * magicIntensity * 1.2 * tempMask;
            }

            vColor = finalColor;

            // A voxel is solid matter for its whole life and only turns to glass
            // as it dies: fire and live smoke are fully opaque, and the last of
            // the smoke fades out so the other plane shows through it.
            float alpha = smoothstep(0.005, 0.08, temperature);
            vAlpha = alpha;

            // Voxelization: hide (collapse) cells that are spent.
            float lum = max(finalColor.r, max(finalColor.g, finalColor.b));
            float visible = step(0.004, lum) * step(0.004, alpha);

            // Opaque and dying voxels are drawn in separate passes, so depth
            // stays correct without sorting: each pass keeps only its own.
            bool solid = alpha >= 0.999;
            if ((uPass < 0.5) != solid) visible = 0.0;

            // The two slices coincide on the shared vertical spine. Slice A owns
            // that column; slice B skips it, so the center line never z-fights.
            if (uAxis > 0.5 && gx == floor(uGrid.x * 0.5)) visible = 0.0;

            // Grid bottom-center sits at world origin (0,0,0) — the injection
            // point — for both slices. The in-plane axis becomes X or Z.
            float u = gx + 0.5 - uGrid.x * 0.5;
            vec3 cellOrigin = (uAxis < 0.5)
                ? vec3(u, gy + 0.5, 0.0)
                : vec3(0.0, gy + 0.5, u);
            vec3 worldPos = cellOrigin + aPosition * 0.5 * visible;
            gl_Position = uMvp * vec4(worldPos, 1.0);
        }`;

            const voxelFs = `#version 300 es
        precision highp float;
        in vec3 vColor;
        in float vAlpha;
        out vec4 outColor;
        void main() { outColor = vec4(vColor, vAlpha); }`;

            // --- PLUMBING (verbatim helpers from flame-simulation.html, plus VAOs) ---

            function createProgram(vs, fs) {
                const program = gl.createProgram();
                const vsShader = gl.createShader(gl.VERTEX_SHADER); const fsShader = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(vsShader, vs); gl.shaderSource(fsShader, fs);
                gl.compileShader(vsShader); gl.compileShader(fsShader);
                if (!gl.getShaderParameter(vsShader, gl.COMPILE_STATUS)) showError('VS: ' + gl.getShaderInfoLog(vsShader));
                if (!gl.getShaderParameter(fsShader, gl.COMPILE_STATUS)) showError('FS: ' + gl.getShaderInfoLog(fsShader));
                gl.attachShader(program, vsShader); gl.attachShader(program, fsShader); gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) showError('Link: ' + gl.getProgramInfoLog(program));
                return { id: program, uni: Object.fromEntries(['uTexelSize', 'uDt', 'uVelocity', 'uSource', 'uPressure', 'uDivergence', 'uCurl', 'uCurlScale', 'uDissipation', 'uTarget', 'uAspectRatio', 'uPoint', 'uColor', 'uRadius', 'uTexture', 'uDensity', 'uBuoyancy', 'uTime', 'uWind', 'uIsVelocity', 'uSpin', 'uPointerVelocity', 'uMvp', 'uGrid', 'uAxis', 'uPass'].map(n => [n, gl.getUniformLocation(program, n)])) };
            }

            function createFBO(w, h, type = gl.HALF_FLOAT) {
                gl.activeTexture(gl.TEXTURE0); const texture = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texture);

                // idle-brush values exactly.

                const vx = 0.0, vy = 0.005;
                const dynamicRadius = 0.4;

                let baseDt = Math.min((Date.now() - lastTime) / 1000, 0.016);
                lastTime = Date.now();

                // crosses the whole space, and each plane feels its in-plane
                // component (X for slice A, Z for slice B).

                phi += (tPhi - phi) * 0.12;

                    TARGET[1] + radius * Math.cos(phi),
                    TARGET[2] + radius * Math.sin(phi) * Math.cos(theta)

                drawSlice(sliceB, 1.0, time, mvp, 0.0);

                // against the solid voxels but not written to depth, so the
                // dying fringe reveals whatever lies behind it.
                gl.depthMask(false);
                gl.enable(gl.BLEND);
