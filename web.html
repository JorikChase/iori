<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Prevent user scaling to stop accidental zooming while tapping -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iori.me || 3die.fr - Node Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Minimalist/Ultralight UI styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Dark mode background, similar to Obsidian */
            background-color: #1e1e1e;
            font-family: 'Inter', sans-serif;
            color: #ccc;
            /* Prevent text selection which can interfere with drag */
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* CRITICAL FOR MOBILE: Prevents browser scrolling/zooming on touch */
            touch-action: none;
            cursor: grab;
            -webkit-tap-highlight-color: transparent; /* Remove blue tap highlight on mobile */
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
  </head>
  <body>
    <!-- The canvas is the only UI element -->
    <canvas id="node-canvas"></canvas>
    <!-- Import D3.js library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
      // --- 1. Setup with High-DPI Support ---
        const canvas = document.getElementById('node-canvas');
        const context = canvas.getContext('2d');

        // Device Pixel Ratio for sharp text on mobile
        let dpr = window.devicePixelRatio || 1;
        let width = window.innerWidth;
        let height = window.innerHeight;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;

            // Set actual buffer size to device pixels
            canvas.width = width * dpr;
            canvas.height = height * dpr;

            // Set CSS size to logical pixels
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            // Normalize coordinate system to use logical pixels
            context.scale(dpr, dpr);
        }

        // Initial sizing
        resizeCanvas();

        // --- Store current zoom transform ---
        let transform = d3.zoomIdentity;

        // --- 2. Define Data (The "links_list") ---
        const allNodeIds = [
            "webgl.html", "star.html", "shop.html", "portfolio.html",
            "maska.html", "info.html", "indent.html", "index.html",
            "game.html", "fractals.html", "darkwood.html",
            "three-body.html", "two-body.html", "sudoku.html", "class-action.html"
        ];

        const linksList = [];

        // Connect "portfolio.html" and "index.html" to all other nodes
        allNodeIds.forEach(id => {
            if (id !== "portfolio.html" && id !== "class-action.html" && id !== "two-body.html" && id !== "three-body.html") {
                linksList.push({ source: "portfolio.html", target: id });
            }
        });

        // Manually connect "index.html" to only info, shop, and portfolio
        linksList.push({ source: "index.html", target: "info.html" });
        linksList.push({ source: "index.html", target: "shop.html" });
        linksList.push({ source: "shop.html", target: "info.html" });
        linksList.push({ source: "index.html", target: "portfolio.html" });
        linksList.push({ source: "index.html", target: "indent.html" });

        // Add specific connections
        linksList.push({ source: "webgl.html", target: "star.html" });
        linksList.push({ source: "star.html", target: "maska.html" });
        linksList.push({ source: "game.html", target: "darkwood.html" });
        linksList.push({ source: "fractals.html", target: "webgl.html" });
        linksList.push({ source: "orbitals.html", target: "webgl.html" });
        linksList.push({ source: "orbitals.html", target: "fractals.html" });
        linksList.push({ source: "fractals.html", target: "lambda_cognition.html" });
        linksList.push({ source: "index.html", target: "lambda_cognition.html" });
        linksList.push({ source: "three-body.html", target: "lambda_cognition.html" });
        linksList.push({ source: "liquid-automata.html", target: "fractals.html" });
        linksList.push({ source: "liquid-automata.html", target: "orbitals.html" });
        linksList.push({ source: "three-body.html", target: "fractals.html" });
        linksList.push({ source: "three-body.html", target: "orbitals.html" });
        linksList.push({ source: "two-body.html", target: "fractals.html" });
        linksList.push({ source: "two-body.html", target: "three-body.html" });
        linksList.push({ source: "sudoku.html", target: "game.html" });
        linksList.push({ source: "class-action.html", target: "index.html" });

        // --- 3. Calculate Node Degrees & Procedurally Create Nodes ---
        const nodeDegrees = new Map();
        linksList.forEach(link => {
            nodeDegrees.set(link.source, (nodeDegrees.get(link.source) || 0) + 1);
            nodeDegrees.set(link.target, (nodeDegrees.get(link.target) || 0) + 1);
        });

        const nodeIds = new Set();
        linksList.forEach(link => {
            nodeIds.add(link.source);
            nodeIds.add(link.target);
        });

        const degrees = Array.from(nodeDegrees.values());
        const minDegree = Math.min(...degrees);
        const maxDegree = Math.max(...degrees);
        const degreeRange = maxDegree - minDegree;
        const colorInterpolator = d3.interpolateViridis;

        const nodes = Array.from(nodeIds).map(id => {
            const degree = nodeDegrees.get(id) || 0;
            let normalizedDegree = 0.5;
            if (degreeRange > 0) {
                normalizedDegree = (degree - minDegree) / degreeRange;
            }
            const baseColor = d3.color(colorInterpolator(normalizedDegree));
            baseColor.opacity = 0.9;

            return {
                id: id,
                radius: (id === 'portfolio.html' || id === 'index.html') ? 10 : 5,
                degree: degree,
                color: baseColor.toString()
            };
        });

        const links = linksList;

        // --- 4. Custom Forces ---
        function floatForce(alpha) {
            const floatStrength = 0.005;
            for (const node of nodes) {
                node.vx += (Math.random() - 0.5) * floatStrength;
                node.vy += (Math.random() - 0.5) * floatStrength;
            }
        }

        // --- 5. Create the D3 Force Simulation ---
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links)
                .id(d => d.id)
                .distance(d => (
                    d.source.id === 'portfolio.html' || d.target.id === 'portfolio.html' ||
                    d.source.id === 'index.html' || d.target.id === 'index.html'
                ) ? 150 : 70)
                .strength(0.4)
            )
            .force("charge", d3.forceManyBody()
                .strength(-120)
                .distanceMin(10)
                .distanceMax(250)
            )
            .force("float", floatForce)
            .force("center", d3.forceCenter(width / 2, height / 2));

        simulation.on("tick", ticked);

        // --- 6. Drawing Function ---
        function ticked() {
            context.save();
            context.clearRect(0, 0, width, height);

            context.translate(transform.x, transform.y);
            context.scale(transform.k, transform.k);

            // Draw Links
            context.strokeStyle = "rgba(200, 200, 200, 0.15)";
            context.lineWidth = 1;
            context.beginPath();
            links.forEach(link => {
                context.moveTo(link.source.x, link.source.y);
                context.lineTo(link.target.x, link.target.y);
            });
            context.stroke();

            // Draw Nodes
            nodes.forEach(node => {
                context.beginPath();
                context.moveTo(node.x + node.radius, node.y);
                context.arc(node.x, node.y, node.radius, 0, 2 * Math.PI);
                context.fillStyle = node.color;
                context.fill();
            });

            // Draw Labels
            context.font = "10px Inter";
            context.fillStyle = "rgba(200, 200, 200, 0.6)";
            nodes.forEach(node => {
                if (node.id === 'portfolio.html' || node.id === 'index.html') {
                    context.font = "bold 11px Inter";
                    context.fillStyle = "rgba(255, 255, 255, 0.9)";
                }

                const label = node.id.replace('.html', '');
                context.fillText(label, node.x + node.radius + 4, node.y + 3);

                if (node.id === 'portfolio.html' || node.id === 'index.html') {
                    context.font = "10px Inter";
                    context.fillStyle = "rgba(200, 200, 200, 0.6)";
                }
            });

            context.restore();
        }

        // --- 7. Interactivity (Drag, Click, and Zoom) ---

        // Helper: Find node under cursor/finger
        function findNode(event) {
            const [screenX, screenY] = d3.pointer(event, canvas);
            const [tx, ty] = transform.invert([screenX, screenY]);
            // Generous hit radius for touch (60px logical)
            const hitRadius = 60 / transform.k;
            return simulation.find(tx, ty, hitRadius);
        }

        // Define Drag Behavior
        // We define this BEFORE zoom in the chain below to ensure it gets priority
        const drag = d3.drag()
            .container(canvas)
            .subject(findNode)
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended);

        // Define Zoom Behavior
        const zoom = d3.zoom()
            .scaleExtent([0.2, 5])
            .on("zoom", zoomed);

        // --- APPLICATION ORDER IS CRITICAL FOR MOBILE ---
        // 1. Call drag first. It registers its 'touchstart' listener first.
        // 2. Call zoom second. It registers its 'touchstart' listener second.
        // 3. In 'dragstarted', we stop propagation immediately.
        //    This prevents the zoom listener (registered 2nd) from ever firing
        //    if drag decides to start.
        d3.select(canvas)
            .call(drag)
            .call(zoom)
            .on("dblclick.zoom", null);

        // Handlers
        function zoomed(event) {
            transform = event.transform;
            ticked();
        }

        let dragStartTime = 0;
        let isDragging = false;

        function dragstarted(event) {
            if (!event.subject) return;

            // --- CRITICAL FIX: Stop Zoom from seeing this touch event ---
            // Because we registered Drag first, this listener runs first.
            // Stopping immediate propagation ensures Zoom (registered 2nd) is skipped.
            if (event.sourceEvent) {
                event.sourceEvent.stopImmediatePropagation();
            }

            // Capture start time and position for click detection
            dragStartTime = Date.now();
            isDragging = false;

            const [screenX, screenY] = d3.pointer(event, canvas);
            event.subject.dragStartPos = { x: screenX, y: screenY };

            if (!event.active) simulation.alphaTarget(0.3).restart();

            event.subject.fx = event.x;
            event.subject.fy = event.y;

            d3.select(canvas).style("cursor", "grabbing");
        }

        function dragged(event) {
            if (!event.subject) return;

            // Check for actual movement to differentiate tap from drag
            const [screenX, screenY] = d3.pointer(event, canvas);
            const startPos = event.subject.dragStartPos;
            const dist = Math.hypot(screenX - startPos.x, screenY - startPos.y);

            // 7px tolerance for jitter
            if (dist > 7) {
                isDragging = true;
            }

            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            d3.select(canvas).style("cursor", "grab");

            if (!event.subject) return;

            if (!event.active) simulation.alphaTarget(0);

            const duration = Date.now() - dragStartTime;

            // Navigation Logic (Tap detection)
            // If we didn't drag far, and it was a short press, treat as click.
            if (!isDragging && duration < 600) {
                console.log("Navigating to:", event.subject.id);
                window.location.href = event.subject.id;
            }

            event.subject.fx = null;
            event.subject.fy = null;
            delete event.subject.dragStartPos;
        }

        // --- 8. Handle Window Resize ---
        window.addEventListener('resize', () => {
            resizeCanvas();
            simulation.force("center", d3.forceCenter(width / 2, height / 2));
            simulation.alpha(0.3).restart();
            ticked();
        });
    </script>
  </body>
</html>
