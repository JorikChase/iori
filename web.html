    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iori.me || 3die.fr - Node Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: 'Inter', sans-serif;
            color: #ccc;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Disables browser handling of gestures so we can handle them */
            touch-action: none;
            cursor: grab;
            -webkit-tap-highlight-color: transparent;
        }

        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>

<body>
    <canvas id="node-canvas"></canvas>
    <!-- Import D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        // --- 1. CONFIGURATION & STATE ---
        const config = {
            tapDistanceThreshold: 15, // Max pixels moved to count as a tap
            tapTimeThreshold: 500,    // Max ms duration to count as a tap
            mobileHitRadius: 45,      // Generous radius for touch targets (logical px)
            desktopHitRadius: 20      // Precise radius for mouse
        };

        const canvas = document.getElementById('node-canvas');
        const context = canvas.getContext('2d');

        // Hub nodes configuration
        const hubNodes = ['portfolio.html', 'index.html', 'umprum.html'];

        // Navigation State
        let transform = d3.zoomIdentity;
        let pointerStart = { x: 0, y: 0, time: 0 };
        let isTouch = false;

        // --- 2. HIGH-DPI CANVAS SETUP ---
        let width, height, dpr;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
            context.scale(dpr, dpr);
        }
        resizeCanvas();

        // --- 3. DATA & SIMULATION ---
        const allNodeIds = [
            "webgl.html", "star.html", "shop.html", "portfolio.html",
            "maska.html", "info.html", "indent.html", "index.html",
            "game.html", "fractals.html", "darkwood.html",
            "three-body.html", "two-body.html", "sudoku.html", "class-action.html",
            "umprum.html"
        ];

        const linksList = [];
        allNodeIds.forEach(id => {
            // Avoid auto-linking hub nodes or specific satellites to portfolio
            if (![...hubNodes, "class-action.html", "two-body.html", "three-body.html"].includes(id)) {
                linksList.push({ source: "portfolio.html", target: id });
            }
        });

        // Manual connections
        const connections = [
            ["index.html", "info.html"], ["index.html", "shop.html"],
            ["shop.html", "info.html"], ["index.html", "portfolio.html"],
            ["index.html", "indent.html"], ["websites.html", "metyou.html"], ["websites.html", "zsprodeti.html"], ["metyou.html", "univerzum.html"], ["websites.html", "univerzum.html"],
            ["game.html", "darkwood.html"], ["tboi2.html", "darkwood.html"], ["game.html", "tboi2.html"],
            ["fractals.html", "webgl.html"], ["orbitals.html", "webgl.html"], ["iris.html", "meta-iris.html"], ["meta-iris.html", "fractals.html"],
            ["orbitals.html", "fractals.html"], ["fractals.html", "lambda_cognition.html"],
            ["three-body.html", "lambda_cognition.html"], ["game.html", "aquarium.html"],
            ["liquid-automata.html", "cracks.html"], ["cracks.html", "cracks-aberration.html"], ["dandelion-cycle.html", "dither-types.html"], ["aquarium.html", "dandelion-cycle.html"], ["fractals.html", "fractal-dimension.html"], ["diffusion-fluid.html", "lighter-flame.html"],
            ["liquid-automata.html", "fractals.html"], ["liquid-automata.html", "crystalize.html"], ["liquid-automata.html", "mycelium.html"], ["mycelium.html", "fungal-growth.html"], ["fungal-growth.html", "slime-mold.html"],
            ["three-body.html", "fractals.html"], ["three-body.html", "orbitals.html"], ["indent.html", "disphere.html"], ["disphere.html", "disphere-inverse.html"], ["disphere-ray.html", "disphere-inverse.html"], ["disphere-ray.html", "disphere-symmetry.html"],
            ["two-body.html", "three-body.html"], ["bismuth-fluid.html", "fluid.html"], ["bismuth-fluid.html", "watercolor.html"], ["lighter-flame.html", "procedural-flame.html"], ["flame.html", "procedural-flame.html"], ["flame.html", "bismuth-fluid.html"], ["flame-simulation.html", "flame.html"],
            ["diffusion-fluid.html", "fluid.html"], ["diffusion-fluid.html", "disphere-symmetry.html"], ["disphere-ray.html", "liquid-automata.html"], ["liquid-automata.html", "ember-engine.html"],
            ["sudoku.html", "game.html"], ["class-action.html", "index.html"], ["orbitals.html", "crystalize.html"], ["fractals.html", "crystalize.html"], ["sigmoid-helix.html", "death.html"], ["sigmoid-helix.html", "universe.html"],
            ["umprum.html", "portfolio.html"], ["umprum.html", "death.html"], ["umprum.html", "universe.html"]
        ];
        connections.forEach(p => linksList.push({ source: p[0], target: p[1] }));

        // Process Graph
        const nodeDegrees = new Map();
        linksList.forEach(l => {
            const sId = typeof l.source === 'string' ? l.source : l.source.id;
            const tId = typeof l.target === 'string' ? l.target : l.target.id;
            nodeDegrees.set(sId, (nodeDegrees.get(sId) || 0) + 1);
            nodeDegrees.set(tId, (nodeDegrees.get(tId) || 0) + 1);
        });

        const nodes = Array.from(new Set([...linksList.map(d => typeof d.source === 'string' ? d.source : d.source.id), ...linksList.map(d => typeof d.target === 'string' ? d.target : d.target.id)])).map(id => {
            const degree = nodeDegrees.get(id) || 0;
            const t = Math.min(1, Math.max(0, (degree - 1) / 5));
            const color = d3.interpolateViridis(t);
            return {
                id: id,
                radius: hubNodes.includes(id) ? 10 : 5,
                color: d3.color(color).copy({ opacity: 0.9 }).toString(),
                x: width / 2 + (Math.random() - 0.5) * 100,
                y: height / 2 + (Math.random() - 0.5) * 100
            };
        });

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(linksList).id(d => d.id).distance(d => hubNodes.includes(d.source.id) && hubNodes.includes(d.target.id) ? 120 : 70).strength(0.4))
            .force("charge", d3.forceManyBody().strength(-150).distanceMax(300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(d => d.radius + 15));

        simulation.on("tick", draw);

        // --- 4. DRAWING ---
        function draw() {
            context.save();
            context.clearRect(0, 0, width, height);
            context.translate(transform.x, transform.y);
            context.scale(transform.k, transform.k);

            // Links
            context.strokeStyle = "rgba(200, 200, 200, 0.15)";
            context.lineWidth = 1;
            context.beginPath();
            linksList.forEach(l => {
                context.moveTo(l.source.x, l.source.y);
                context.lineTo(l.target.x, l.target.y);
            });
            context.stroke();

            // Nodes
            nodes.forEach(n => {
                context.beginPath();
                context.arc(n.x, n.y, n.radius, 0, 2 * Math.PI);
                context.fillStyle = n.color;
                context.fill();

                // Text styling based on Hub status
                const isHub = hubNodes.includes(n.id);
                context.fillStyle = isHub ? "white" : "rgba(200,200,200,0.6)";
                context.font = isHub ? "bold 11px Inter" : "10px Inter";
                context.fillText(n.id.replace('.html', ''), n.x + n.radius + 4, n.y + 3);
            });
            context.restore();
        }

        // --- 5. ROBUST HIT TESTING ---
        function findNodeAt(screenX, screenY) {
            const [x, y] = transform.invert([screenX, screenY]);
            const radius = (isTouch ? config.mobileHitRadius : config.desktopHitRadius) / transform.k;
            return simulation.find(x, y, radius);
        }

        // --- 6. INTERACTION LOGIC ---

        canvas.addEventListener('pointerdown', (e) => {
            isTouch = (e.pointerType === 'touch');
            pointerStart.x = e.clientX;
            pointerStart.y = e.clientY;
            pointerStart.time = Date.now();
        }, { passive: false });

        canvas.addEventListener('pointerup', (e) => {
            const dist = Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y);
            const duration = Date.now() - pointerStart.time;

            if (dist < config.tapDistanceThreshold && duration < config.tapTimeThreshold) {
                const node = findNodeAt(e.clientX, e.clientY);
                if (node) {
                    context.save();
                    context.translate(transform.x, transform.y);
                    context.scale(transform.k, transform.k);
                    context.beginPath();
                    context.arc(node.x, node.y, node.radius + 5, 0, 2 * Math.PI);
                    context.fillStyle = "white";
                    context.fill();
                    context.restore();

                    window.location.href = node.id;
                }
            }
        }, { passive: false });

        // D3 Zoom (Background Panning)
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (e) => {
                transform = e.transform;
                draw();
            });

        // D3 Drag (Node Moving)
        const drag = d3.drag()
            .container(canvas)
            .subject((event) => findNodeAt(event.sourceEvent.clientX, event.sourceEvent.clientY))
            .on("start", (event) => {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
                d3.select(canvas).style("cursor", "grabbing");
            })
            .on("drag", (event) => {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            })
            .on("end", (event) => {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
                d3.select(canvas).style("cursor", "grab");
            });

        // --- 7. BINDING D3 ---
        d3.select(canvas)
            .call(drag)
            .call(zoom)
            .on("dblclick.zoom", null);

        // --- 8. RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            resizeCanvas();
            simulation.alpha(0.3).restart();
            draw();
        });
    </script>
</body>

</html>
