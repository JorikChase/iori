<body>
<div id="scene"></div>
<div class="hud" id="title">IORI<span>_</span>3D WEB</div>
<div class="hud" id="hint">drag orbit &bull; scroll zoom &bull; click node = open page</div>

<div class="hud" id="label"></div>
<div class="hud" id="cat-tag"></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.012);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 800);
camera.position.set(0, 14, 46);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('scene').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

/* ---------- data ---------- */

const res = await fetch('/pages.json', { cache: 'no-store' });
const { pages } = await res.json();

// category anchors: fibonacci sphere distribution
const cats = [...new Set(pages.map(p => p.category))];
const anchors = {};
{
  const N = cats.length, R = 26, phi = Math.PI * (3 - Math.sqrt(5));
  cats.forEach((c, i) => {
    const y = 1 - (i / Math.max(N - 1, 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = phi * i;
    anchors[c] = new THREE.Vector3(Math.cos(th) * r * R, y * R * 0.55, Math.sin(th) * r * R);
  });
}

/* ---------- nodes ---------- */

const nodes = [];
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

const hubSlugs = new Set(['web.html', 'catalog.html', 'index.html']);
const sphereGeo = new THREE.SphereGeometry(1, 16, 12);
const hubGeo = new THREE.IcosahedronGeometry(1, 0);

pages.forEach((p, i) => {
  const isHub = hubSlugs.has(p.slug);
  const anchor = anchors[p.category] || new THREE.Vector3();
  const orbitR = 3.5 + Math.random() * 6;
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: isHub });
  const mesh = new THREE.Mesh(isHub ? hubGeo : sphereGeo, mat);
  const s = isHub ? 1.15 : 0.42 + Math.random() * 0.22;
  mesh.scale.setScalar(s);
  const node = {
    page: p, mesh, anchor,
    orbitR,
    angle: Math.random() * Math.PI * 2,
    speed: (0.05 + Math.random() * 0.12) * (Math.random() < 0.5 ? 1 : -1),
    tilt: Math.random() * Math.PI * 2,
    pos: new THREE.Vector3(),
    vel: new THREE.Vector3(),
  };
  mesh.userData.node = node;
  nodes.push(node);
  nodeGroup.add(mesh);
});

/* ---------- links (same category + hubs to categories) ---------- */

const lineVerts = [];
const linkPairs = [];
{
  const byCat = {};
  nodes.forEach(n => { (byCat[n.page.category] ||= []).push(n); });
  for (const list of Object.values(byCat)) {
    for (let i = 0; i < list.length - 1; i++) {
      if (Math.random() < 0.6) linkPairs.push([list[i], list[i + 1]]);
    }
  }
  const hubs = nodes.filter(n => hubSlugs.has(n.page.slug));
  for (const h of hubs) {
    for (const c of cats.slice(0, 8)) {
      const t = (byCat[c] || [])[0];
      if (t) linkPairs.push([h, t]);
    }
  }
}
const linkGeo = new THREE.BufferGeometry();
const linkPos = new Float32Array(linkPairs.length * 6);
linkGeo.setAttribute('position', new THREE.BufferAttribute(linkPos, 3));
const links = new THREE.LineSegments(linkGeo,
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.14 }));
scene.add(links);

// category anchor markers
for (const [cat, a] of Object.entries(anchors)) {
  const g = new THREE.RingGeometry(0.9, 1, 32);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide }));
  m.position.copy(a);
  m.lookAt(0, 0, 0);
  scene.add(m);
}

/* ---------- physics: gravity + orbits + repulsion ---------- */

const tmp = new THREE.Vector3();
const repel = new THREE.Vector3();

function step(dt) {
  // orbital target around anchor (gravity well) + spring toward it
  for (const n of nodes) {
    n.angle += n.speed * dt;
    const wobble = Math.sin(n.angle * 2 + n.tilt) * 1.6;
    tmp.set(
      n.anchor.x + Math.cos(n.angle) * n.orbitR,
      n.anchor.y + wobble,
      n.anchor.z + Math.sin(n.angle) * n.orbitR
    );
    // spring (gravity toward the moving orbit point)
    tmp.sub(n.pos).multiplyScalar(2.2 * dt);
    n.vel.add(tmp);
  }
  // pairwise repulsion (keeps nodes apart)
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      repel.subVectors(a.pos, b.pos);
      const d2 = repel.lengthSq();
      if (d2 < 9 && d2 > 1e-6) {
        const f = 0.9 * dt / (d2 + 0.2);
        repel.multiplyScalar(f);
        a.vel.add(repel);
        b.vel.sub(repel);
      }
    }
  }
  for (const n of nodes) {
    n.vel.multiplyScalar(0.86);           // damping
    n.pos.addScaledVector(n.vel, dt * 8); // integrate
    n.mesh.position.copy(n.pos);
  }
  // links follow
  for (let i = 0; i < linkPairs.length; i++) {
    const [a, b] = linkPairs[i];
    linkPos[i * 6 + 0] = a.pos.x; linkPos[i * 6 + 1] = a.pos.y; linkPos[i * 6 + 2] = a.pos.z;
    linkPos[i * 6 + 3] = b.pos.x; linkPos[i * 6 + 4] = b.pos.y; linkPos[i * 6 + 5] = b.pos.z;
  }
  linkGeo.attributes.position.needsUpdate = true;
}

// scatter initial positions
nodes.forEach(n => n.pos.set(
  (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 60));

/* ---------- picking ---------- */

const raycaster = new THREE.Raycaster();
raycaster.params.Points = { threshold: 1 };
const pointer = new THREE.Vector2(-2, -2);
let hovered = null;
const labelEl = document.getElementById('label');
const catEl = document.getElementById('cat-tag');

function setPointer(x, y) {
  pointer.x = (x / innerWidth) * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;
}
addEventListener('pointermove', (e) => setPointer(e.clientX, e.clientY));

function pick() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(nodeGroup.children);
  const node = hits.length ? hits[0].object.userData.node : null;
  if (node !== hovered) {
    if (hovered) hovered.mesh.material.color.set(0xffffff);
    hovered = node;
    if (hovered) {
      hovered.mesh.material.color.set(0xffff88);
      labelEl.textContent = hovered.page.title;
      labelEl.style.display = 'block';
      catEl.textContent = hovered.page.category + ' — ' + hovered.page.domain;
      document.body.style.cursor = 'pointer';
    } else {
      labelEl.style.display = 'none';
      catEl.textContent = '';
      document.body.style.cursor = '';
    }
  }
}

let downAt = 0;
addEventListener('pointerdown', () => { downAt = performance.now(); });
addEventListener('pointerup', (e) => {
  if (performance.now() - downAt > 220) return; // was a drag
  setPointer(e.clientX, e.clientY);
  pick();
  if (hovered) {
    const url = hovered.page.url;
    document.getElementById('wipe').classList.add('on');
    setTimeout(() => { location.href = url; }, 200);
  }
});

/* ---------- loop ---------- */

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  pick();
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
